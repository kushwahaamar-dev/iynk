      + ctx.slab(-l / 2 + e, -w / 2, l / 2 - e, w / 2, 0, h, M.black, toneI, wd) + ctx.poly([[band, -w / 2], [band + .5, -w / 2], [band + .5, w / 2], [band, w / 2]], h + .01, '#d8d2c0', 0)
      + (p.label ? ctx.text(.4, -.3, h + .02, p.label, .8, '#d8d2c0') : '')); },

    for (const [x, y] of B.rowPins(p)){ const [a, b] = localOf(p, x, y); s += ctx.poly([[a - .5, b - .5], [a + .5, b - .5], [a + .5, b + .5], [a - .5, b + .5]], h + .01, '#151311', 0); }
    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, h), s); },
});
const localOf = (p, x, y) => { const r = -(p.rot || 0) * Math.PI / 180, dx = x - p.at[0], dy = y - p.at[1]; return [dx * Math.cos(r) - dy * Math.sin(r), dx * Math.sin(r) + dy * Math.cos(r)]; };
B.localOf = localOf;
K('pads', { group: 'smd', size: headerSize, h: .05, pins: p => B.rowPins(p),
  draw(ctx){ const p = ctx.p, d = p.d || 1.7; let s = '';
    for (const [x, y] of B.rowPins(p)){ const [a, b] = localOf(p, x, y); s += ctx.disc(a, b, .03, d / 2, M.tin.l, .35) + ctx.disc(a, b, .04, d * .22, M.hole, 0); }
    const [l, w] = p.size; ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, .06), s); },

K('castellated', { group: 'smd', size: headerSize, h: .05, pins: p => B.rowPins(p),
  draw(ctx){ const p = ctx.p; let s = '';
    for (const [x, y] of B.rowPins(p)){ const [a, b] = localOf(p, x, y); s += ctx.poly([[a - .8, b - 1.6], [a + .8, b - 1.6], [a + .8, b + 1.6], [a - .8, b + 1.6]], .03, M.gold.l, .3) + ctx.disc(a, b, .04, .5, M.hole, 0); }
    const [l, w] = p.size; ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, .06), s); },

K('edge', { group: 'smd', size: p => [p.size ? p.size[0] : 40, 8], h: .05,

    for (const [x0, x1] of p.fingers || []){ const a0 = x0 - p.at[0], a1 = x1 - p.at[0]; s += ctx.poly([[a0, -w / 2], [a1, -w / 2], [a1, w / 2], [a0, w / 2]], .03, M.gold.l, .3); }

/* ---------- connectors ---------- */
// the opening faces the part's -x end; plug(ctx) draws the cable coming in from there
const plugCable = (ctx, len, pw, ph, zc, boot, cable) => {
  const p = ctx.p, l = p.size[0], x0 = -l / 2;
  ctx.put(ctx.B(x0 - len, -pw / 2, zc - ph / 2, x0 - 1, pw / 2, zc + ph / 2), ctx.slab(x0 - len, -pw / 2, x0 - 1, pw / 2, zc - ph / 2, zc + ph / 2, boot, toneI, .9));

  const pts = []; for (let i = 0; i <= 8; i++){ const t = i / 8; pts.push([x0 - len - t * 22, 0, zc - (zc + B.G.top - B.G.matH - 1.4) * Math.sin(t * Math.PI / 2)]); }

    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, h), s); },

const smallUsb = (w0, h0, len0) => ({ group: 'smd', size: () => [len0, w0], h: h0,

K('usb-micro', smallUsb(7.5, 2.6, 5.4)); K('usb-mini', smallUsb(7.7, 3.9, 9.2)); K('usb-c', smallUsb(8.9, 3.2, 7.4));
K('usb-a', { group: 'tall', size: () => [17.5, 13.2], h: 15.6, draw(ctx){ const p = ctx.p, [l, w] = p.size, h = p.h;

    if (p.label) String(p.label).split('|').forEach((ln, i, a) => { s += ctx.text(-ant / 2, (a.length / 2 - i - .75) * 2.2, h + .01, ln, 1.6, '#5b6163'); });
    for (let i = 0; i < 12; i++){ const a = -l / 2 + 2 + i * (l - ant - 3) / 11; s += ctx.disc(a, w / 2 - .1, .81, .35, M.gold.l, 0) + ctx.disc(a, -w / 2 + .1, .81, .35, M.gold.l, 0); }
    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, h), ghost(ctx, s)); },

K('antenna', { group: 'smd', size: () => [6, 15], h: .05,
  draw(ctx){ const p = ctx.p, [l, w] = p.size; let s = '';
    if (p.chip) s = ctx.slab(-l / 2, -w / 2, l / 2, w / 2, 0, 1, M.ceramic, toneI, .5);
    else { const zz = []; for (let i = 0; i <= 12; i++) zz.push([-l / 2 + .6 + (i % 2) * (l - 1.2), -w / 2 + .6 + i * (w - 1.2) / 12, .04]); s = `<path d="${pd(zz.map(q => ctx.W(...q)), false)}" fill="none" stroke="#e7c66b" stroke-width=".7"/>`; }

      if (on) glow += ctx.glow(a, b, p.h, 1.8, col, .35);

K('seg7', { group: 'tall', size: p => [(p.digits || 4) * 7.6, 12.6], h: 7,

    let s = ctx.slab(-l / 2, -w / 2, l / 2, w / 2, 0, h, matOf('#3a3632'), toneI, .7);
    const SEG = { a: [[-1.6, 4], [1.6, 4]], b: [[1.9, 3.6], [1.9, .3]], c: [[1.9, -.3], [1.9, -3.6]], d: [[-1.6, -4], [1.6, -4]], e: [[-1.9, -.3], [-1.9, -3.6]], f: [[-1.9, 3.6], [-1.9, .3]], g: [[-1.6, 0], [1.6, 0]] };
    for (let i = 0; i < n; i++){ const cx = (i - (n - 1) / 2) * (l / n), code = String(o.pins[((p.led && p.led.net) || 'SEG') + i] || '');
      for (const [k, [[a0, b0], [a1, b1]]] of Object.entries(SEG)){ const on = code.includes(k);

        if (on) s += ctx.glow(cx + (a0 + a1) / 2 - .3, (b0 + b1) / 2, h, 2.4, col, .25); } }

});
K('pad', { group: 'smd', size: () => [6, 6], h: .05,
  draw(ctx){ const p = ctx.p, [l, w] = p.size, touched = ctx.on;
    const s = p.shape === 'logo' ? ctx.disc(-l * .22, 0, .03, w * .32, touched ? M.gold.l : '#d8b04f', .5) + ctx.disc(l * .22, 0, .03, w * .32, touched ? M.gold.l : '#d8b04f', .5) : ctx.disc(0, 0, .03, Math.min(l, w) / 2, touched ? M.gold.l : '#d8b04f', .5);

K('hole', { group: 'smd', size: p => [p.d ? p.d + 3 : 7, p.d ? p.d + 3 : 7], h: .05,
  draw(ctx){ const p = ctx.p, d = p.d || 4; ctx.put(ctx.B(-d, -d, 0, d, d, .06), ctx.disc(0, 0, .03, d / 2 + 1.4, M.gold.l, .5) + ctx.disc(0, 0, .04, d / 2, M.hole, .3) + (p.label ? ctx.text(0, -d / 2 - 2.6, .05, p.label, 1.8, '#f6f4ea') : '')); },

<script>/* figures/engine/bench-bb.js */
// Board Bench breadboard view: the board on the mat beside a breadboard, the lesson circuit on named holes, jumper
// wires from board pins, and a small solver that finds what each LED really does (current, dark, burnt).
// Breadboard parts (led, resistor, wire, the breadboard itself) live in figures/parts/. Format: FIGURES-BENCH.md §8-9.
(() => {
const B = SL.bench, T = B.T;
const BBS = B.BBS = {
  half: { cols: 30, w: 82.5, h: 54.5, rails: true },
  full: { cols: 63, w: 165.1, h: 54.5, rails: true },
  mini: { cols: 17, w: 46, h: 35.5, rails: false },
};
const ROWS = 'abcdefghij';
// hole positions in breadboard mm (origin bottom-left, row a at the back)
B.bbGeom = kind => {
  const g = BBS[kind] || BBS.half, x0 = (g.w - (g.cols - 1) * 2.54) / 2;
  const off = g.rails ? 0 : -9.06;
  const rowY = { j: 12.5, i: 15.04, h: 17.58, g: 20.12, f: 22.66, e: 30.28, d: 32.82, c: 35.36, b: 37.9, a: 40.44 };
  for (const r of ROWS) rowY[r] += off;
  const rails = g.rails ? { 'T+': 48.56, 'T-': 51.1, 'B-': 5.94, 'B+': 3.4 } : {};
  const railCols = []; if (g.rails) for (let k = 0; k < Math.floor(g.cols * 5 / 6); k++){ const c = 2 + k + Math.floor(k / 5); if (c <= g.cols) railCols.push(c); }
  return { ...g, kind, x0, rowY, rails, railCols, colX: c => x0 + (c - 1) * 2.54 };
};
// 'b10' -> {x, y, node}; 'T+12' -> nearest rail hole
B.hole = (geo, ref) => {
  let m = /^([a-j])(\d{1,2})$/.exec(ref);
  if (m){ const c = +m[2]; if (c < 1 || c > geo.cols) return null; const r = m[1];
    return { x: geo.colX(c), y: geo.rowY[r], node: 'S' + c + ('abcde'.includes(r) ? 'u' : 'l'), ref }; }
  m = /^([TB][+-])(\d{1,2})$/.exec(ref);
  if (m && geo.rails[m[1]] != null){ const want = +m[2]; let best = geo.railCols[0];
    for (const c of geo.railCols) if (Math.abs(c - want) < Math.abs(best - want)) best = c;
    return { x: geo.colX(best), y: geo.rails[m[1]], node: 'R' + m[1], ref }; }
  return null;
};

/* circuit faults: a fault can change what is on the breadboard. `missing:<id>` leaves a circuit part out, with the
   wires that end on its legs; `reversed:<id>` turns it round (its `reversed` param when the part has one, else its
   holes in the other order). Ids the board itself has stay board faults. A listed fault [id, label, edit] does the
   same for its own id: edit = { missing: [ids], reversed: [ids], cut: [[from, to]] (wires left out), wires: [extra
   wires], holes: { id: [holes] } (parts moved) }, each applied where the circuit has it. The solver, the drawing and
   the schematic all read the changed circuit. */
let faulted = { key: null, md: null, c: null };
const circuitNow = () => {
  const md = B.md, st = B.st, c = md.circuits[st.circuit]; if (!c) return null;
  const fs = st.faults || []; if (!fs.length) return c;
  const key = st.circuit + '|' + fs.join(',');
  if (faulted.key === key && faulted.md === md) return faulted.c;
  const missing = new Set(), reversed = new Set(), cut = [], add = [], holes = {};
  const inCircuit = id => (c.parts || []).some(p => p.id === id);
  for (const f of fs){
    const m = /^(missing|reversed):(.+)$/.exec(f);
    if (m && inCircuit(m[2]) && !md.byId[m[2]]) (m[1] === 'missing' ? missing : reversed).add(m[2]);
    const fd = (md.def.faults || []).find(x => Array.isArray(x) && x[0] === f && x[2] && typeof x[2] === 'object');
    if (!fd) continue;
    const e = fd[2];
    for (const id of e.missing || []) if (inCircuit(id)) missing.add(id);
    for (const id of e.reversed || []) if (inCircuit(id)) reversed.add(id);
    for (const w of e.cut || []) if (Array.isArray(w) && w.length === 2) cut.push(w);
    for (const w of e.wires || []) if (w && typeof w.from === 'string' && typeof w.to === 'string') add.push(w);
    for (const [id, hs] of Object.entries(e.holes || {})) if (inCircuit(id) && Array.isArray(hs)) holes[id] = hs;
  }
  let out = c;
  if (missing.size || reversed.size || cut.length || add.length || Object.keys(holes).length){
    const owner = ref => { const m = /^([A-Za-z_][\w-]*)\./.exec(ref); return m ? m[1] : null; };
    const isCut = w => cut.some(([a, b]) => (w.from === a && w.to === b) || (w.from === b && w.to === a));
    const parts = (c.parts || []).filter(p => !missing.has(p.id)).map(p => {
      let q = holes[p.id] ? Object.assign({}, p, { holes: holes[p.id].slice() }) : p;
      if (reversed.has(p.id)){ const def = B.parts[p.part];
        q = def && def.params && def.params.reversed ? Object.assign({}, q, { reversed: true }) : Object.assign({}, q, { holes: (q.holes || []).slice().reverse() }); }
      return q; });
    const wires = (c.wires || []).filter(w => !missing.has(owner(w.from)) && !missing.has(owner(w.to)) && !isCut(w)).concat(add);
    out = Object.assign({}, c, { parts, wires });
  }
  faulted = { key, md, c: out };
  return out;
};
B.circuitNow = circuitNow;

/* placement in board coordinates: the breadboard sits right of the board (or behind it) */
const place = () => {
  const md = B.md, c = circuitNow(); if (!c) return null;
  const geo = B.bbGeom(c.breadboard || 'half');
  const behind = c.board === 'back';
  const ox = md.def.noBoard ? 0 : behind ? (md.pcb.w - geo.w) / 2 : md.pcb.w + 14, oy = md.def.noBoard ? 0 : behind ? md.pcb.h + 12 : (md.pcb.h - geo.h) / 2;
  const zTop = B.G.matH + 8.5 - B.G.top;     // breadboard top, in board z
  return { c, geo, ox, oy, zTop, at: (x, y, z = zTop) => B.BP(ox + x, oy + y, z) };
};

// Board Bench circuit solver (FIGURES-BENCH §9). The lesson circuit becomes a DC network: nodes are breadboard
// strips, power rails, board nets and the legs of parts that sit on the mat. Resistors are conductances, sources are
// Norton equivalents (a rail behind 0.5 Ω, an output pin behind its driver's 25 Ω), and every nonlinear part is
// piecewise linear: an LED or diode junction is off, or its drop plus a small resistance; a transistor is off, active
// (collector current β·IB) or saturated (VCE(sat)). One solve repeats nodal analysis until every junction agrees with
// its own voltages. PWM pins are solved per time slice (an AVR timer starts every period high, so the slices are the
// gaps between the sorted duties) and the results are averaged over the period.
(() => {
const B = SL.bench;
const PIN_R = 25, RAIL_R = .5, GMIN = 1e-9, RBE = 2, RSAT = .01, ROUNDS = 40;
const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const rnd = (v, k = 10) => Math.round(v * k) / k;

// Gaussian elimination with partial pivoting; a row with no pivot (a node nothing reaches) solves to 0 V
function linsolve(A, b){
  const n = b.length;
  for (let c = 0; c < n; c++){
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-18) continue;
    if (p !== c){ const t = A[p]; A[p] = A[c]; A[c] = t; const u = b[p]; b[p] = b[c]; b[c] = u; }
    for (let r = c + 1; r < n; r++){
      const fr = A[r][c] / A[c][c]; if (!fr) continue;
      for (let k = c; k < n; k++) A[r][k] -= fr * A[c][k];
      b[r] -= fr * b[c];
    }
  }
  const x = new Float64Array(n);
  for (let r = n - 1; r >= 0; r--){
    let s = b[r];
    for (let k = r + 1; k < n; k++) s -= A[r][k] * x[k];
    x[r] = Math.abs(A[r][r]) < 1e-18 ? 0 : s / A[r][r];
  }
  return x;
}

/* ---------- netlist: nodes, elements and sources of the circuit on the breadboard ---------- */
function netlist(st, pl){
  const { c, geo } = pl, par = {};
  const add = a => { if (!own(par, a)) par[a] = a; return a; };
  const find = a => { add(a); let r = a; while (par[r] !== r) r = par[r]; while (par[a] !== r){ const n = par[a]; par[a] = r; a = n; } return r; };
  const uni = (a, b) => { if (a == null || b == null) return; const x = find(a), y = find(b); if (x !== y) par[x] = y; };
  const parts = (c.parts || []).map(q => Object.assign({}, q, (st.cparams || {})[q.id] || {}));
  const byId = {}; for (const q of parts) byId[q.id] = q;
  // the node under leg i: its hole's strip, or the leg itself for a part lying on the mat (a wire may end on it)
  const legNode = (q, i) => { const h = q.holes && q.holes[i] ? B.hole(geo, q.holes[i]) : null; return add(h ? h.node : 'L:' + q.id + '.' + i); };
  const end = ref => {
    const h = B.hole(geo, ref); if (h) return add(h.node);
    const m = /^([A-Za-z_][\w-]*)\.([\w+~-]+)$/.exec(ref), q = m && byId[m[1]];
    if (q){ const d = B.parts[q.part], i = d && d.legs ? d.legs.indexOf(m[2]) : -1; return i >= 0 ? legNode(q, i) : null; }
    const pin = B.pinOf(ref); return pin ? add('N:' + pin.net) : null;
  };
  // a node of a part by leg index or name: its legs, then its inside nodes (def.nodes, numbered after the legs)
  const nodeIx = (def, nm) => { if (typeof nm === 'number') return nm; const legs = def.legs || [], i = legs.indexOf(nm);
    if (i >= 0) return i; const j = (def.nodes || []).indexOf(nm); return j >= 0 ? legs.length + j : -1; };
  // a wire on a header whose pins pass through a resistor on the board (part.rs, ohms: the Basys 3's 200 Ω on every
  // Pmod line) meets the pin's net through that resistor; any other wire joins its ends
  const rsWires = [];
  const rsOf = ref => { if (B.hole(geo, ref) || /^([A-Za-z_][\w-]*)\.([\w+~-]+)$/.test(ref) && byId[ref.split('.')[0]]) return 0;
    const pin = B.pinOf(ref), part = pin && B.md.byId[pin.part], rails = (B.md.power && B.md.power.rails) || {};
    // only signal pins: the header's ground and supply pins go straight to their planes
    return part && +part.rs > 0 && pin.net !== 'GND' && !own(rails, pin.net) ? +part.rs : 0; };
  for (const w of c.wires || []){ const a = end(w.from), b = end(w.to), rs = rsOf(w.from) || rsOf(w.to);
    if (rs && a != null && b != null) rsWires.push({ a, b, rs, w }); else uni(a, b); }
  // a plug pushed into another part's socket (`plug: 'DRV1'`): its legs join that part's def.socket nodes, in order
  for (const q of parts){
    if (typeof q.plug !== 'string') continue;
    const d = B.parts[q.part], r = byId[q.plug], rd = r && B.parts[r.part], sock = rd && rd.socket;
    if (!r) continue;                                   // the driver is left out (a fault): the plug hangs free
    if (!d || !Array.isArray(sock)){ B.note(`${q.id}: plug ${q.plug} has no socket`); continue; }
    (d.legs || []).forEach((_, i) => { const j = i < sock.length ? nodeIx(rd, sock[i]) : -1; if (j >= 0) uni(legNode(q, i), legNode(r, j)); });
  }
  const els = [], buttons = [], burnt = st.burnt || {};
  for (const q of parts){
    const def = B.parts[q.part];
    if (!def || typeof def.elec !== 'function') continue;
    let es = null;
    try { es = def.elec(q); } catch (e) { B.note(`${q.id} elec: ${e.message}`); continue; }
    const legs = def.legs || [], N = i => legNode(q, i), named = (nm, i) => N(legs.includes(nm) ? legs.indexOf(nm) : i);
    // an element's own ends (`legs: [a, b]`, indexes or node names), else the part's first two legs
    const ab = e => { const lg = Array.isArray(e.legs) ? e.legs.map(x => nodeIx(def, x)) : [0, 1]; return lg.every(i => i >= 0) ? lg.map(N) : null; };
    for (const e of [].concat(es || [])){
      if (!e || typeof e !== 'object') continue;
      // one of several channels of a part (a driver chip's four Darlingtons): its own key, so it burns alone
      const key = e.ch != null && e.type !== 'led' ? q.id + ':' + e.ch : q.id;
      const base = { id: q.id, key, q, def, e, dead: !!burnt[key] };
      if (Array.isArray(e.legs) && e.type !== 'led' && !ab(e)){ B.note(`${q.id} elec: unknown node in ${e.legs.join(', ')}`); continue; }
      if (e.type === 'wire'){ const [a, b] = ab(e); uni(a, b); }
      else if (e.type === 'res'){ if (!e.open){ const [a, b] = ab(e); els.push({ ...base, k: 'R', a, b, g: 1 / Math.max(+e.ohms || 0, 1e-3) }); } }
      else if (e.type === 'stepper'){
        // a unipolar stepper: one coil from the common lead to each coil lead; energised while its far end is pulled low
        const com = nodeIx(def, e.common), g = 1 / Math.max(+e.ohms || 50, 1);
        for (const w of e.coils || []){ const j = nodeIx(def, w); if (com >= 0 && j >= 0) els.push({ ...base, k: 'R', coil: w, a: N(com), b: N(j), g }); }
      }
      else if (e.type === 'pot'){
        const R = Math.max(+e.ohms || 1e4, 1), x = Math.max(0, Math.min(1, +e.pos || 0));
        els.push({ ...base, k: 'POT', a: N(0), w: N(1), b: N(2), g1: 1 / Math.max(R * x, .5), g2: 1 / Math.max(R * (1 - x), .5), pmax: +e.pmax || .05 });
      }
      else if (e.type === 'button') buttons.push({ ...base, n: legs.map((_, i) => N(i)) });
      else if (e.type === 'led'){
        const lg = e.legs || [0, 1], key = e.ch ? q.id + ':' + e.ch : q.id;
        els.push({ ...base, k: 'D', led: true, key, ch: e.ch || null, dead: !!burnt[key], a: N(lg[0]), b: N(lg[1]), vf: +e.vf || 2, rd: .5, imax: +e.imax || .02 });
      }
      else if (e.type === 'diode'){ const [a, b] = ab(e); els.push({ ...base, k: 'D', a, b, vf: .7, rd: .2, imax: +e.imax || 1, isurge: +e.isurge || 30 }); }
      else if (e.type === 'npn'){
        const pn = e.pins || { B: 0, C: 1, E: 2 }, ix = { B: nodeIx(def, pn.B), C: nodeIx(def, pn.C), E: nodeIx(def, pn.E) };
        if (Object.values(ix).some(i => i < 0)){ B.note(`${q.id} elec: unknown npn pin`); continue; }
        els.push({ ...base, k: 'Q', nb: N(ix.B), nc: N(ix.C), ne: N(ix.E), hfe: +e.hfe || 100, hfr: +e.hfr || 5, vbe: +e.vbe || .7, vcesat: +e.vcesat || .2 });
      }
      else if (e.type === 'motor') els.push({ ...base, k: 'M', a: N(0), b: N(1) });
      else if (e.type === 'servo') els.push({ ...base, k: 'SV', gnd: named('GND', 0), vp: named('V+', 1), sig: named('SIG', 2) });
      else if (e.type === 'sensor' && Array.isArray(e.supply)) els.push({ ...base, k: 'TS', sp: N(e.supply[0]), sn: N(e.supply[1]), out: N(e.out != null ? e.out : 1) });
      else if (e.type === 'buzzer') els.push({ ...base, k: 'BZ', a: N(0), b: N(1), active: e.kind === 'active', vf: .05, rd: (+e.vmin || 3) / (+e.imax || .03) });
    }
  }
  for (const r of rsWires) els.push({ id: r.w.from, key: 'rs:' + r.w.from + '>' + r.w.to, q: { id: r.w.from }, def: {}, e: { type: 'res', ohms: r.rs }, dead: false, k: 'R', a: r.a, b: r.b, g: 1 / r.rs });
  // a push button's pairs are always joined; pressing joins the two pairs. A switched pair already joined (both
  // sides in one strip) shorts the switch
  for (const bt of buttons) for (const pr of bt.e.pairs || []) uni(bt.n[pr[0]], bt.n[pr[1]]);
  for (const bt of buttons){ const pr = bt.e.pairs || []; bt.shorted = pr.length > 1 && find(bt.n[pr[0][0]]) === find(bt.n[pr[1][0]]); }
  for (const bt of buttons){ const pr = bt.e.pairs || []; if (bt.e.pressed && pr.length > 1) uni(bt.n[pr[0][0]], bt.n[pr[1][0]]); }
  // board nets: GND, rails (with their voltage now), output pins (level or PWM duty; a tone is a 50 % square wave), inputs
  const run = st.ev.status === 'running' && !st.up && st.t >= 0, rails = st.ev.rails || {}, pins = (st.o && st.o.pins) || {}, tones = st.tones || {};
  const nets = [];
  for (const key of Object.keys(par)) if (key.startsWith('N:')){
    const net = key.slice(2);
    if (net === 'GND') nets.push({ net, key, kind: 'gnd' });
    else if (own(rails, net)) nets.push({ net, key, kind: 'rail', v: rails[net] || 0 });
    else if (run && tones[net] > 0) nets.push({ net, key, kind: 'pin', level: .5, hz: tones[net] });
    else if (run && pins[net] != null) nets.push({ net, key, kind: 'pin', level: Math.max(0, Math.min(1, +pins[net] || 0)) });
    else nets.push({ net, key, kind: 'input' });
  }
  // resolve every node to its root now that the unions are done
  const R = k => find(k);
  for (const n of nets) n.root = R(n.key);
  for (const el of els) for (const f of ['a', 'b', 'w', 'nb', 'nc', 'ne', 'gnd', 'vp', 'sig', 'sp', 'sn', 'out']) if (el[f] != null) el[f] = R(el[f]);
  const g = nets.find(n => n.kind === 'gnd');
  const gnd = g ? g.root : null, roots = [...new Set(Object.keys(par).map(R))].filter(r => r !== gnd);
  return { parts, byId, els, buttons, nets, gnd, roots };
}

/* ---------- one slice: nodal analysis repeated until every junction state is consistent ---------- */
function solveSlice(nl, high, S, logic){
  const { els, nets, gnd, roots } = nl, n = roots.length, idx = new Map(roots.map((r, i) => [r, i]));
  const ix = r => { const i = idx.get(r); return i == null ? -1 : i; };
  let x = new Float64Array(n);
  const V = r => { const i = ix(r); return i < 0 ? 0 : x[i]; };
  for (let round = 0; round < ROUNDS; round++){
    const A = Array.from({ length: n }, () => new Float64Array(n)), b = new Float64Array(n);
    for (let i = 0; i < n; i++) A[i][i] += GMIN;
    // conductance g between nodes p and q
    const G = (p, q, gg) => { const i = ix(p), j = ix(q); if (i >= 0){ A[i][i] += gg; if (j >= 0) A[i][j] -= gg; } if (j >= 0){ A[j][j] += gg; if (i >= 0) A[j][i] -= gg; } };
    // a branch from p to q carrying gg·(Vp − Vq − v0): a conductance with a built-in drop (junctions, sources)
    const GV = (p, q, gg, v0) => { G(p, q, gg); const i = ix(p), j = ix(q); if (i >= 0) b[i] += gg * v0; if (j >= 0) b[j] -= gg * v0; };
    // a current gm·(Vc − Vx) − off from y to x (a transistor's collector following its base drive)
    const VC = (y, xn, cn, gm, off) => { const iy = ix(y), ixx = ix(xn), ic = ix(cn);
      if (iy >= 0){ if (ic >= 0) A[iy][ic] += gm; if (ixx >= 0) A[iy][ixx] -= gm; b[iy] += off; }
      if (ixx >= 0){ if (ic >= 0) A[ixx][ic] -= gm; A[ixx][ixx] += gm; b[ixx] -= off; } };
    for (const s of nets){
      if (s.kind === 'rail') GV(s.root, gnd, 1 / RAIL_R, s.v);
      else if (s.kind === 'pin') GV(s.root, gnd, 1 / PIN_R, high(s) ? logic : 0);
    }
    for (const el of els){
      const s = S[el.n];
      if (el.k === 'R') G(el.a, el.b, el.g);
      else if (el.k === 'POT'){ if (!el.dead){ G(el.a, el.w, el.g1); G(el.w, el.b, el.g2); } }
      else if (el.k === 'D' || (el.k === 'BZ' && el.active)){ if (!el.dead && s.on) GV(el.a, el.b, 1 / el.rd, el.vf); }
      else if (el.k === 'M'){ if (!el.dead) G(el.a, el.b, el.gm); }
      else if (el.k === 'SV'){ if (!el.dead) G(el.vp, el.gnd, el.gs); }
      else if (el.k === 'TS'){
        if (!el.dead) G(el.sp, el.sn, (+el.e.iq || 5e-5) / 5);
        if (!el.dead && s.on) GV(el.out, el.sn, 1 / 20, el.vout);
      }
      else if (el.k === 'Q'){
        // a burnt Darlington fails short from collector to emitter, a small transistor open
        if (el.dead){ if (el.e.darlington) G(el.nc, el.ne, 10); continue; }
        if (!s.on) continue;
        const y = s.inv ? el.ne : el.nc, xn = s.inv ? el.nc : el.ne, beta = s.inv ? el.hfr : el.hfe;
        GV(el.nb, xn, 1 / RBE, el.vbe);
        if (s.sat) GV(y, xn, 1 / RSAT, el.vcesat);
        else VC(y, xn, el.nb, beta / RBE, beta / RBE * el.vbe);
      }
    }
    x = linsolve(A, b);
    let changed = false;
    for (const el of els){
      const s = S[el.n];
      if (el.dead) continue;
      if (el.k === 'D' || (el.k === 'BZ' && el.active)){
        const vd = V(el.a) - V(el.b);
        if (!s.on && vd > el.vf + 1e-6){ s.on = true; changed = true; }
        else if (s.on && vd < el.vf - 1e-6){ s.on = false; changed = true; }
      } else if (el.k === 'TS'){
        const vs = V(el.sp) - V(el.sn), supplied = vs >= (+el.e.vmin || 2.7) && vs <= (+el.e.vabs || 7);
        if (supplied !== !!s.on){ s.on = supplied; changed = true; }
      } else if (el.k === 'Q'){
        if (!s.on){
          // which end acts as the emitter is read with the junction off: the lower of collector and emitter
          const inv = V(el.ne) > V(el.nc) + 1e-3;
          if (inv !== !!s.inv){ s.inv = inv; changed = true; }
          const xn = s.inv ? el.nc : el.ne;
          if (V(el.nb) - V(xn) > el.vbe + 1e-6){ s.on = true; s.sat = false; changed = true; }
          continue;
        }
        const y = s.inv ? el.ne : el.nc, xn = s.inv ? el.nc : el.ne, beta = s.inv ? el.hfr : el.hfe;
        const ib = (V(el.nb) - V(xn) - el.vbe) / RBE;
        if (ib < -1e-9){ s.on = false; s.sat = false; changed = true; }
        else if (!s.sat){ if (V(y) - V(xn) < el.vcesat - 1e-6){ s.sat = true; changed = true; } }
        else if ((V(y) - V(xn) - el.vcesat) / RSAT > beta * ib + 1e-7){ s.sat = false; changed = true; }
      }
    }
    if (!changed) break;
  }
  // what every element and source carries in this slice
  const out = { V: new Map(roots.map((r, i) => [r, x[i]])), el: [], load: 0 };
  out.V.set(gnd, 0);
  for (const s of nets){
    if (s.kind === 'rail'){ const i = (s.v - V(s.root)) / RAIL_R; if (i > 0) out.load += i; }
    else if (s.kind === 'pin'){ const i = ((high(s) ? logic : 0) - V(s.root)) / PIN_R; if (i > 0) out.load += i; }
  }
  for (const el of els){
    const s = S[el.n], r = {};
    if (el.k === 'D' || el.k === 'BZ'){ r.vd = V(el.a) - V(el.b); r.i = !el.dead && s.on ? (r.vd - el.vf) / el.rd : 0; }
    else if (el.k === 'R' && el.coil) r.i = (V(el.a) - V(el.b)) * el.g;
    else if (el.k === 'M'){ r.v = V(el.a) - V(el.b); r.i = el.dead ? 0 : r.v * el.gm; }
    else if (el.k === 'SV'){ r.vs = V(el.vp) - V(el.gnd); r.sig = V(el.sig) > logic / 2; }
    else if (el.k === 'TS'){ r.vs = V(el.sp) - V(el.sn); r.vo = V(el.out) - V(el.sn); r.on = !!s.on; }
    else if (el.k === 'POT'){ r.vw = V(el.w); r.p = el.dead ? 0 : Math.max(el.g1 * (V(el.a) - V(el.w)) ** 2, el.g2 * (V(el.w) - V(el.b)) ** 2); }
    else if (el.k === 'Q'){
      const y = s.inv ? el.ne : el.nc, xn = s.inv ? el.nc : el.ne, beta = s.inv ? el.hfr : el.hfe;
      r.vce = V(el.nc) - V(el.ne); r.inv = !!s.inv; r.sat = !!(s.on && s.sat);
      if (el.dead){ r.ib = 0; r.ic = el.e.darlington ? Math.abs(r.vce) * 10 : 0; }
      else if (!s.on){ r.ib = 0; r.ic = 0; }
      else { r.ib = Math.max(0, (V(el.nb) - V(xn) - el.vbe) / RBE); r.ic = s.sat ? Math.max(0, (V(y) - V(xn) - el.vcesat) / RSAT) : beta * r.ib; }
    }
    out.el.push(r);
  }
  return out;
}

/* ---------- the whole circuit: slices, motors, averages, then what each part reports ---------- */
const mem = st => st.solverMem || (st.solverMem = {});
const motorI = (el, v) => {
  const md = el.def.model || {}, load = el.q.load || 'prop';
  if (el.e.brushless && el.e.polar && v < 0) return 0;
  if (typeof md.steady === 'function') return Math.abs(md.steady(Math.abs(v), load).i || 0);
  return Math.abs(v) / Math.max(+el.e.ohms || 10, .1);
};
B.solveCircuit = (st, pl, dt = 0) => {
  const md = B.md, logic = md.def.logic || 5, nl = netlist(st, pl), { els, nets } = nl, M = mem(st);
  els.forEach((el, i) => { el.n = i; });
  // PWM slices: the pins at level > the slice's start are high
  const level = s => s.level;
  const duties = [...new Set(nets.filter(s => s.kind === 'pin' && s.level > 0 && s.level < 1).map(level))].sort((a, b) => a - b);
  const slices = []; let from = 0;
  for (const d of [...duties, 1]){ if (d - from > 1e-9){ const f0 = from; slices.push({ w: d - from, high: s => s.level > f0 }); } from = d; }
  // motors: a conductance from the current the motor takes at the voltage it sees while switched on
  for (const el of els) if (el.k === 'M'){
    const m0 = M[el.id] || {};
    el.gm = el.q.load === 'stalled' && el.e.ohms ? 1 / el.e.ohms : m0.gm || motorI(el, 4) / 4 || 1e-3;
  }
  // servos: the current they took last frame (holding, moving or stalled)
  for (const el of els) if (el.k === 'SV') el.gs = ((M[el.id] && M[el.id].i) || +el.e.iidle || .008) / 5;
  for (const el of els) if (el.k === 'TS') el.vout = +el.e.vout || .75;
  let res = null;
  for (let pass = 0; pass < 6; pass++){
    const S = els.map(() => ({ on: false, sat: false, inv: false }));
    res = slices.map(sl => Object.assign(solveSlice(nl, sl.high, S, logic), { w: sl.w }));
    let moved = false;
    for (const el of els) if (el.k === 'M' && !(el.q.load === 'stalled' && el.e.ohms)){
      const von = Math.max(...res.map(r => Math.abs(r.el[el.n].v)));
      const gm = Math.max(1e-3, motorI(el, von) / Math.max(von, .3));
      if (Math.abs(gm - el.gm) > el.gm * .01){ el.gm = gm; moved = true; }
    }
    if (!moved) break;
  }
  for (const el of els) if (el.k === 'M') M[el.id] = Object.assign(M[el.id] || {}, { gm: el.gm });
  const timeAvg = f => res.reduce((a, r) => a + r.w * f(r), 0), peak = f => Math.max(...res.map(f));
  const Vavg = root => timeAvg(r => r.V.get(root) || 0);
  const out = { meas: {}, volts: {}, load: timeAvg(r => r.load) };
  // which roots reach a source through the circuit (skip: an element left out, to tell an open LED)
  const srcRoots = new Set(nets.filter(s => s.kind !== 'input').map(s => s.root));
  const ends = el => ['a', 'b', 'w', 'nb', 'nc', 'ne', 'gnd', 'vp', 'sp', 'sn', 'out'].map(f => el[f]).filter(v => v != null);
  const reaches = (start, skip) => {

  const switched = el => peak(r => Math.abs(r.el[el.n].i)) - Math.min(...res.map(r => Math.abs(r.el[el.n].i))) > 1e-3
    || els.some(q => q.k === 'Q' && (q.nc === el.b || q.nc === el.a));

/* ---------- sound: the loudest part that makes one (def.sound(p, m) → { hz, loud, how }) goes to the host ---------- */
B.solveSound = (st, parts) => {
  let best = null;

})();

<script>/* figures/engine/sheets.js */

  try { const m = el.getScreenCTM(); if (m){ const inv = m.inverse(), btn = document.getElementById('btns'), sts = document.getElementById('stats');
    if (btn && btn.offsetParent){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right + 10, r.top).matrixTransform(inv); if (q.x > x0 && q.x < v.x + v.width * .45) x0 = q.x; }
    if (sts && sts.offsetParent){ const r = sts.getBoundingClientRect(), q = new DOMPoint(r.left - 10, r.top).matrixTransform(inv); if (q.x < x1 && q.x > v.x + v.width * .55) x1 = q.x; } } } catch (e) {}

const ln = (pts, w = 1.1, col = INK, extra = '') => `<path d="M${pts.map(p => p.map(f).join(' ')).join('L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;

  const m = v.width * .04;

};
const accent = 'var(--accent,#f4b829)';

/* ---------- schematic ---------- */
// series chains found by the solver: board pin -> resistors -> LED -> resistors -> GND

  const bh = Math.max(24 * u, used.length * 12 * u + 8 * u), bw = 20 * u;

    const lv = st.o.pins[net], live = (+lv || 0) > .5 || (st.ev.rails[net] || 0) > .5;
    s += txt(x0 + bw - 1.2 * u, pinY[net] + 1.1 * u, net, 2.4 * u, live ? '#b8402f' : INK, 'end', 800)
      + (net !== 'GND' ? txt(x0 + bw + 2 * u, pinY[net] - 1.6 * u, live ? 'HIGH' : 'LOW', 1.8 * u, live ? '#b8402f' : '#857d6e', 'start', 800) : ''); });

    const live = q.up && (((+st.o.pins[q.up.net] || 0) > .5) || (st.ev.rails[q.up.net] || 0) > .5);
    let x = x0 + bw; const seg = w => { const a = x; x += w; return a; };
    const wcol = live ? '#b8402f' : INK;

    for (const r of (q.up ? q.up.rs : [])){ const a = seg(12 * u); s += act('bb', resSym(a, y, 12 * u, st.sel === r.id, live) + txt(a + 6 * u, y - 3.2 * u, r.id + ' ' + B.ohmsText(r.ohms), 2.1 * u), `data-id="${esc(r.id)}" data-label="${esc(T('Resistor') + ' ' + r.id)}"`); s += ln([[x, y], [x + 4 * u, y]], 1.3, wcol); x += 4 * u; }

    const lx = seg(9 * u);
    s += act('bb', ledSym(lx, y, 6 * u, lit, col, st.sel === q.led.id) + txt(lx + 3 * u, y + 7.5 * u, q.led.id + ' ' + T(q.led.color || ''), 2.1 * u)
      + txt(lx + 3 * u, y - 9.5 * u, m.state === 'ok' && m.i_mA > 0 ? T('{n} mA', { n: m.i_mA.toFixed(1) }) : m.state ? T(m.state) : '', 2 * u, m.state === 'burnt' ? '#b8402f' : '#2f6b4f', 'middle', 800), `data-id="${esc(q.led.id)}" data-label="${esc(T('LED') + ' ' + q.led.id)}"`);
    s += ln([[x - 3 * u, y], [x + 4 * u, y]], 1.3); x += 4 * u;
    for (const r of (q.dn ? q.dn.rs : [])){ const a = seg(12 * u); s += act('bb', resSym(a, y, 12 * u, st.sel === r.id, false) + txt(a + 6 * u, y - 3.2 * u, r.id + ' ' + B.ohmsText(r.ohms), 2.1 * u), `data-id="${esc(r.id)}" data-label="${esc(T('Resistor') + ' ' + r.id)}"`); s += ln([[x, y], [x + 4 * u, y]], 1.3); x += 4 * u; }
    if (q.dn && q.dn.net === 'GND'){ s += ln([[x, y], [x, y + 8 * u]], 1.3) + gndSym(x, y + 8 * u, 6 * u) + txt(x + 5 * u, y + 9 * u, 'GND', 2 * u, INK, 'start'); }
    else s += txt(x + 2 * u, y + .8 * u, q.dn ? q.dn.net : T('not connected'), 2.2 * u, '#b8402f', 'start', 800);
  }
  return s;
} });

/* ---------- power tree ---------- */
B.viewDef('power', { flat: true, scene: () => {
  const v = sheetBox(), md = B.md, st = B.st, pw = md.power, u = v.width / 100;
  let s = plate(v, T('Power tree · {name}', { name: T(md.name) }));
  const rails = pw.rails || {}, srcs = pw.sources || {};
  // columns: sources, then rails by depth
  const depth = {}; const dOf = id => { if (depth[id] != null) return depth[id]; depth[id] = 1; const r = rails[id];
    let d = 1; for (const fd of r.from || []) if (fd.rail && rails[fd.rail] && fd.rail !== id) d = Math.max(d, dOf(fd.rail) + 1); return depth[id] = d; };
  Object.keys(rails).forEach(dOf);
  const cols = Math.max(1, ...Object.values(depth)) + 1, cw = (v.width - 16 * u) / cols, pos = {};
  const place = (ids, col) => ids.forEach((id, i) => { pos[id] = [v.x + 8 * u + cw * col + cw * .1, v.y + 16 * u + i * (v.height - 22 * u) / Math.max(1, ids.length) + 2 * u]; });
  place(Object.keys(srcs), 0);
  for (let d = 1; d < cols; d++) place(Object.keys(rails).filter(id => depth[id] === d), d);
  const bw = cw * .58, bh = 9 * u;
  // edges first, then the boxes, then the via-part pills on top
  let pills = '';
  for (const [rid, r] of Object.entries(rails)) for (const fd of r.from || []){
    const a = pos[fd.src || fd.rail], b = pos[rid]; if (!a || !b) continue;
    const live = (st.ev.rails[rid] || 0) > .5 && (fd.src ? st.power === fd.src : (st.ev.rails[fd.rail] || 0) > .5);
    const p0 = [a[0] + bw, a[1] + bh / 2], p1 = [b[0], b[1] + bh / 2], mx = (p0[0] + p1[0]) / 2;
    s += ln([p0, [mx, p0[1]], [mx, p1[1]], p1], live ? 2 : 1.1, live ? '#b8402f' : '#857d6e');
    const via = (fd.via || []).filter(id => !(srcs[fd.src] && srcs[fd.src].part === id));
    // a pill on a straight run between two boxes only has the gap, so it keeps to the part ids
    const horiz = Math.abs(p1[1] - p0[1]) < 1;
    if (via.length){ const lbl = via.join(' + ') + (!horiz && fd.reg != null ? ' · ' + T('{v} V reg.', { v: fd.reg }) : ''), missing = via.filter(id => !B.isSet(id));
      const fs = horiz ? Math.min(1.9 * u, (p1[0] - p0[0] - 2) / (CF_TW(lbl, 1) + 1.2)) : 1.9 * u, pw2 = CF_TW(lbl, fs) + fs * 1.2, my = (p0[1] + p1[1]) / 2;
      pills += act('part', `<rect x="${f(mx - pw2 / 2)}" y="${f(my - fs * .95)}" width="${f(pw2)}" height="${f(fs * 1.9)}" rx="${f(fs * .95)}" fill="${missing.length ? '#f6d1c9' : '#fff4d6'}" stroke="${INK}" stroke-width=".9"/>`
        + txt(mx, my + fs * .36, lbl, fs, INK, 'middle', 800), `data-id="${esc(via[0])}" data-label="${esc(B.md.byId[via[0]] ? B.md.byId[via[0]].name : via[0])}"`); }
  }
  const boxAt = (id, label, sub, live, actId) => { const [x, y] = pos[id];
    return act('part', `<rect x="${f(x)}" y="${f(y)}" width="${f(bw)}" height="${f(bh)}" rx="${f(1.5 * u)}" fill="${live ? accent : '#fbf8ef'}" stroke="${INK}" stroke-width="1.4"/>`
      + txt(x + bw / 2, y + bh * .45, label, Math.min(2.4 * u, bw / Math.max(4, label.length) * 1.3), INK, 'middle', 800) + txt(x + bw / 2, y + bh * .82, sub, Math.min(1.9 * u, bw / Math.max(4, String(sub).length) * 1.3), INK, 'middle', 700), `data-id="${esc(actId || '')}" data-label="${esc(label)}"`); };
  for (const [k, src] of Object.entries(srcs)){ const on = st.power === k, v2 = st.supply[k] != null ? st.supply[k] : src.v;
    s += boxAt(k, T(src.label || k), on ? T('{v} V connected', { v: v2 }) : T('{v} V', { v: src.range ? src.range.join('–') : src.v }), on, src.part); }
  for (const rid of Object.keys(rails)){ const vv = st.ev.rails[rid] || 0; s += boxAt(rid, rid, vv > .05 ? vv.toFixed(2) + ' V' : T('off'), vv > .5, ''); }
  s += pills;
  if (st.ev.why) s += txt(v.x + v.width / 2, v.y + v.height - 7 * u, st.ev.why, 2.2 * u, '#b8402f', 'middle', 800);
  return s;
} });
})();

</script>
<script>/* figures/parts/breadboard.js */
// @cf title Breadboard
// @cf use engine/bench.list
/* Solderless breadboard. Half size (the default): 30 columns of five-hole strips either side of the centre channel
   (rows a-e and f-j, 2.54 mm pitch, 7.62 mm across the channel) and two power rails along each long edge, 82.5 x
   54.5 x 8.5 mm. Full size has 63 columns; mini has 17 and no rails. Holes are named a1..j30 and T+12, T-12, B+12,
   B-12 (the rail hole nearest that column). Every strip of five is one node; every rail is one node. */
(() => {
const B = SL.bench, T = B.T;
const BODY = { l: '#fbf8ef', m: '#e8e3d4', d: '#c8c1ae' };
B.part('breadboard', {
  name: 'Breadboard', fig: 'P1', legs: [],
  draw(ctx){
    const { pl } = ctx, g = pl.geo, zb = B.G.matH - B.G.top, zt = pl.zTop;
    const a = pl.at(0, 0, zb), b = pl.at(g.w, g.h, zt);
    const lo = [Math.min(a[0], b[0]), Math.min(a[1], b[1]), a[2]], hi = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), b[2]];
    let s = box(lo[0], lo[1], lo[2], hi[0], hi[1], hi[2], BODY, toneI, 1.1);
    // centre channel
    const cy = (g.rowY.e + g.rowY.f) / 2;
    s += fill(pd([pl.at(1, cy - 1, zt + .01), pl.at(g.w - 1, cy - 1, zt + .01), pl.at(g.w - 1, cy + 1, zt + .01), pl.at(1, cy + 1, zt + .01)]), '#d9d3c2');
    // holes: one path for all of them
    let d = '';
    const sq = (x, y) => { const q = .42; d += 'M' + [pl.at(x - q, y - q, zt + .02), pl.at(x + q, y - q, zt + .02), pl.at(x + q, y + q, zt + .02), pl.at(x - q, y + q, zt + .02)].map(p => P(...p).map(f).join(' ')).join('L') + 'Z'; };
    for (let c = 1; c <= g.cols; c++) for (const r of 'abcdefghij') sq(g.colX(c), g.rowY[r]);
    for (const [name, y] of Object.entries(g.rails)) for (const c of g.railCols) sq(g.colX(c), y);
    s += `<path d="${d}" fill="#3b3631"/>`;
    // rail stripes and labels
    for (const [name, y] of Object.entries(g.rails)){
      const yy = y + (name[0] === 'T' ? (name[1] === '+' ? -1.4 : 1.4) : (name[1] === '+' ? -1.4 : 1.4));
      s += `<path d="${pd([pl.at(2, yy, zt + .02), pl.at(g.w - 2, yy, zt + .02)], false)}" fill="none" stroke="${name[1] === '+' ? '#e2483d' : '#3e86d9'}" style="stroke-width:.45"/>`;
      s += B.flatText(pl.at(1.2, y - .6, zt + .03), 1, 0, name[1] === '+' ? '+' : '−', 1.8, name[1] === '+' ? '#c63b30' : '#2f6fc0', 800);
    }
    for (const r of 'abcdefghij') s += B.flatText(pl.at(g.x0 - 2.2, g.rowY[r] - .5, zt + .03), 1, 0, r, 1.3, '#8a8373', 700);
    for (let c = 1; c <= g.cols; c += (c === 1 ? 4 : 5)) s += B.flatText(pl.at(g.colX(c), g.rowY.a + 2.1, zt + .03), 1, 0, String(c), 1.2, '#8a8373', 700);
    ctx.put([lo, hi], act('bb', s, `data-id="BB" data-label="${CF_ESC(T('Breadboard'))}"`));
  },
});
})();

</script>
<script>/* figures/parts/led.js */
// @cf title LED
// @cf use engine/bench.list
/* 5 mm through-hole LED on a breadboard. Legs [anode, cathode]: the anode is the longer, bent leg; the cathode side
   of the rim is flat. Forward voltage by colour (red 2.0, yellow 2.1, green 2.2, blue 3.0, white 3.1 V), 20 mA
   continuous. Brightness follows (I / 13.6 mA)^0.55, the curve the Learn Arduino lesson uses. */
(() => {
const B = SL.bench, T = B.T;
const COL = { red: '#e8392e', yellow: '#f2c23a', green: '#3fbf6a', blue: '#3d7be0', white: '#f2efe6' };
const VF = { red: 2.0, yellow: 2.1, green: 2.2, blue: 3.0, white: 3.1 };
B.LED_COLORS = COL;
B.part('led', {
  name: 'LED', fig: 'P2', legs: ['A', 'K'], span: [1, 3],
  params: { color: Object.keys(COL) },
  elec: p => ({ type: 'led', vf: VF[p.color] || 2.0, imax: .02 }),
  tag: (p, m) => m && m.state === 'ok' && m.i_mA > 0 ? T('{id} · {n} mA', { id: p.id, n: m.i_mA.toFixed(1) }) : m && m.state === 'burnt' ? T('{id} · burnt', { id: p.id }) : m && m.state === 'reverse' ? T('{id} · backwards', { id: p.id }) : p.id,
  draw(ctx){
    const { legs, p, lit } = ctx, col = COL[p.color] || COL.red, burnt = ctx.m && ctx.m.state === 'burnt';
    const [A, K] = legs, mid = A.map((v, i) => (v + K[i]) / 2), zl = 7;
    const top = [mid[0], mid[1], mid[2] + zl];
    // legs: the anode has a small knee, so it reads as the longer leg
    let s = rod(A, [A[0], A[1], A[2] + zl * .55], .25, B.M.tin, toneI, .5) + rod([A[0], A[1], A[2] + zl * .55], [A[0] * .7 + mid[0] * .3, A[1] * .7 + mid[1] * .3, top[2]], .25, B.M.tin, toneI, .5)
      + rod(K, [K[0] * .7 + mid[0] * .3, K[1] * .7 + mid[1] * .3, top[2]], .25, B.M.tin, toneI, .5);
    const body = matOf(burnt ? '#5a4330' : mix(col, '#ffffff', lit > .05 ? .25 + .3 * lit : 0));
    s += cyl(top[0], top[1], top[2], top[2] + .9, 2.9, body, toneI, .8) + cyl(top[0], top[1], top[2] + .9, top[2] + 5, 2.5, body, toneI, .9)
      + rod([top[0], top[1], top[2] + 5], [top[0], top[1], top[2] + 7.4], 2.5, body, toneI, .9, .9);
    if (lit > .05 && !burnt){ const [X, Y] = P(top[0], top[1], top[2] + 5.5);
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(5 + 9 * lit)}" fill="${col}" opacity="${f(.25 * lit)}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(2 + 2 * lit)}" fill="#fffbe8" opacity="${f(.8 * lit)}"/>`; }
    if (burnt){ const [X, Y] = P(top[0], top[1], top[2] + 8); s += `<circle cx="${f(X)}" cy="${f(Y - 4)}" r="3" fill="#8a847a" opacity=".45"/>`; }
    const lo = [Math.min(A[0], K[0]) - 3, Math.min(A[1], K[1]) - 3, A[2]], hi = [Math.max(A[0], K[0]) + 3, Math.max(A[1], K[1]) + 3, top[2] + 7.4];
    ctx.put([lo, hi], s);
  },
});
})();

</script>
<script>/* figures/parts/resistor.js */
// @cf title Resistor
// @cf use engine/bench.list
/* Axial through-hole resistor, 1/4 W, 6.3 mm body, four colour bands worked out from the value (two digits, the
   multiplier, gold for 5 %). Legs bend down into two holes, usually four columns apart. */
(() => {
const B = SL.bench, T = B.T;
const BAND = ['#2a2623', '#8a5a34', '#e2483d', '#f08a2b', '#f2c230', '#43b05c', '#3e86d9', '#8c4bd1', '#9a958c', '#f6f3ea'];
const GOLD = '#d4a93c', SILVER = '#c9cfd1';
B.resBands = ohms => {
  const v = Math.max(.1, +ohms || 0), e = Math.floor(Math.log10(v) + 1e-9) - 1, sig = Math.round(v / Math.pow(10, e));
  const d1 = Math.floor(sig / 10) % 10, d2 = sig % 10, mult = e === -1 ? GOLD : e === -2 ? SILVER : BAND[Math.max(0, Math.min(9, e))];
  return [BAND[d1], BAND[d2], mult, GOLD];
};
B.ohmsText = ohms => ohms >= 1e6 ? (+(ohms / 1e6).toFixed(2)) + ' MΩ' : ohms >= 1e3 ? (+(ohms / 1e3).toFixed(2)) + ' kΩ' : (+(+ohms).toFixed(1)) + ' Ω';
B.part('resistor', {
  name: 'Resistor', fig: 'P3', legs: ['1', '2'], span: [3, 8],
  params: { ohms: [1, 1e7] },
  elec: p => ({ type: 'res', ohms: Math.max(0, +p.ohms || 0) }),
  tag: p => p.id + ' · ' + B.ohmsText(p.ohms),
  draw(ctx){
    const [a, b] = ctx.legs, z = 2.6, d = [b[0] - a[0], b[1] - a[1]], len = Math.hypot(...d) || 1, u = d.map(v => v / len);
    const e0 = [a[0] + u[0] * 1, a[1] + u[1] * 1, a[2] + z], e1 = [b[0] - u[0] * 1, b[1] - u[1] * 1, b[2] + z];
    const bl = Math.min(6.3, len - 2.6), c0 = [(a[0] + b[0]) / 2 - u[0] * bl / 2, (a[1] + b[1]) / 2 - u[1] * bl / 2, a[2] + z], c1 = [(a[0] + b[0]) / 2 + u[0] * bl / 2, (a[1] + b[1]) / 2 + u[1] * bl / 2, a[2] + z];
    let s = rod(a, [a[0], a[1], a[2] + z - .3], .22, B.M.tin, toneI, .45) + rod([a[0], a[1], a[2] + z - .3], c0, .22, B.M.tin, toneI, .45)
      + rod(b, [b[0], b[1], b[2] + z - .3], .22, B.M.tin, toneI, .45) + rod([b[0], b[1], b[2] + z - .3], c1, .22, B.M.tin, toneI, .45);
    s += rod(c0, c1, 1.15, { l: '#e9d3a6', m: '#d1b684', d: '#9c8256' }, toneI, .8);
    const bands = B.resBands(ctx.p.ohms), at = [.16, .32, .48, .8];
    bands.forEach((col, i) => { const t0 = at[i] - .05, t1 = at[i] + .05, p0 = c0.map((v, k) => v + (c1[k] - v) * t0), p1 = c0.map((v, k) => v + (c1[k] - v) * t1);
      s += rod(p0, p1, 1.2, matOf(col), toneI, .3); });
    const lo = [Math.min(a[0], b[0]) - 1.3, Math.min(a[1], b[1]) - 1.3, a[2]], hi = [Math.max(a[0], b[0]) + 1.3, Math.max(a[1], b[1]) + 1.3, a[2] + z + 1.3];
    ctx.put([lo, hi], s);
    void e0; void e1;
  },
});
})();

<script>/* figures/parts/wire.js */
// @cf title Jumper wire
// @cf use engine/bench.list
/* Male-to-male jumper wire: a 22 AWG lead in an arc from a board pin (it plugs into the female header from above)
   to a breadboard hole, with a black housing at each end. Cut into short boxed pieces so it sorts at every angle. */
(() => {
const B = SL.bench, T = B.T;
B.part('wire', {
  name: 'Jumper wire', fig: 'P4', legs: ['1', '2'],
  elec: () => ({ type: 'wire' }),

    const { a, b } = ctx, col = B.WIRE[ctx.color] || ctx.color || B.WIRE.green, m = matOf(/^#[0-9a-f]{6}$/i.test(col) ? col : '#43b05c');
    const lift = 7 + Math.hypot(b[0] - a[0], b[1] - a[1]) * .18, top = Math.max(a[2], b[2]) + lift;
    const pts = [];

      pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (a[2] + 4.5) * (1 - t) + (b[2] + 4.5) * t + (top - Math.max(a[2], b[2]) - 4.5) * s]); }

      ctx.put([[Math.min(p[0], q[0]) - r, Math.min(p[1], q[1]) - r, Math.min(p[2], q[2]) - r], [Math.max(p[0], q[0]) + r, Math.max(p[1], q[1]) + r, Math.max(p[2], q[2]) + r]], rod(p, q, r, m, toneI, .6)); }
    for (const e of [a, b]){ const h = [e[0], e[1], e[2] + 4.5];
      ctx.put([[e[0] - 1.3, e[1] - 1.3, e[2]], [e[0] + 1.3, e[1] + 1.3, e[2] + 4.6]], rod([e[0], e[1], e[2] + .2], [e[0], e[1], e[2] + 1.2], .3, B.M.tin, toneI, .4) + box(e[0] - 1.25, e[1] - 1.25, e[2] + 1.2, e[0] + 1.25, e[1] + 1.25, h[2], B.M.black, toneI, .6)); }
  },
});
})();

</script>
<script>/* figures/parts/push-button.js */
// @cf title Push button
// @cf use engine/bench.list
/* 6 x 6 mm through-hole tactile switch (Omron B3F class, the kit part with a 5 mm tall plunger). Legs ['1','2','3',
   '4'] as in Omron's drawing: 1-2 are always joined, 3-4 are always joined, and pressing the plunger joins 1-2 to
   3-4. The joined pairs face each other across the 6.5 mm direction, so on a breadboard that direction straddles the
   trench (legs bent out to 7.62 mm) and the switched pair sits on one side, 4.5 mm apart, bent to 5.08 mm (two
   columns): holes ['e8','f8','e10','f10'] give 1=e8, 2=f8, 3=e10, 4=f10, and pressing joins column 8 to column 10.
   Turned 90 degrees on one side of the trench, the switched pair lands in one strip and the switch reads "pressed"
   for ever: the solver sees that from the holes, nothing here fakes it. Rating 50 mA at 24 V DC, bounce 5 ms max,
   travel 0.25 mm. See-through: the stainless snap dome over the centre contact (3-4) inside the outer ring (1-2). */
(() => {
const B = SL.bench, T = B.T;
const CAP = { black: '#34302c', red: '#e2483d', yellow: '#f2c230', green: '#43b05c', blue: '#3e86d9', white: '#ece6d6' };
const DEF = { pressed: 0, color: 'black', fault: 'none' };
// faults the page can set; in a circuit the solver's verdict (m.state) is used unless one is set here
const FAULTS = { none: null, 'contacts burnt': 'burnt' };
const stateOf = (p, m) => FAULTS[p.fault] || (m && m.state) || null;
const DOME = { l: '#f4f6f6', m: '#c9d0d2', d: '#8e979a' };
const LIVE = '#f4b829';

// a local frame on the legs: a along leg i0 -> leg i1, b toward the front (the viewer when the legs run left to
// right), z up from the breadboard top; every breadboard placement is a multiple of 90 degrees
const frame = (legs, i0, i1) => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[i1][0] - legs[i0][0], dy = legs[i1][1] - legs[i0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W,
    loc: q => { const x = q[0] - o[0], y = q[1] - o[1]; return [x * ux + y * uy, -x * uy + y * ux]; },
    slab: (a0, b0, a1, b1, z0, z1, m, w = .6) => B.slabW(W, a0, b0, a1, b1, z0, z1, m, toneI, w),
    bx: (a0, b0, z0, a1, b1, z1) => B.aabb([W(a0, b0, z0), W(a1, b1, z1), W(a0, b1, z0), W(a1, b0, z1)]) };
};
const xrK = ctx => ctx.k != null ? ctx.k : ease(Math.min(1, Math.max(0, (ctx.st && ctx.st.xr) || 0)));
const ring = (F, a, b, z, r, n = 20) => B.circ(a, b, r, n).map(([u, v]) => F.W(u, v, z));

B.part('push-button', {
  name: 'Push button', fig: 'P5',
  legs: ['1', '2', '3', '4'],
  span: [0, 3],
  params: { pressed: [0, 1], color: Object.keys(CAP), fault: Object.keys(FAULTS) },
  paramNames: { color: 'Plunger colour', fault: 'Break it' },
  defaults: DEF,
  // 1-2 and 3-4 always joined; pressed joins the two pairs
  elec: p => ({ type: 'button', pressed: +p.pressed > 0, pairs: [[0, 1], [2, 3]], imax: .05, vmax: 24, bounce: .005 }),
  press: (p, down) => ({ pressed: down ? 1 : 0 }),
  tag: (p, m) => stateOf(p, m) === 'shorted' ? T('{id} · always closed: turn it 90°', { id: p.id })
    : stateOf(p, m) === 'burnt' ? T('{id} · contacts burnt', { id: p.id })
    : +p.pressed > 0 ? T('{id} · pressed', { id: p.id }) : T('{id} · released', { id: p.id }),
  draw(ctx){
    const p = Object.assign({}, DEF, ctx.p), legs = ctx.legs, k = xrK(ctx), down = +p.pressed > 0, m = ctx.m || {};
    const F = frame(legs, 0, 2), sg = v => v < 0 ? -1 : 1;
    const zl = .9, zb = 3.4, zt = 3.65, plH = down ? 1.1 : 1.35;
    const sf = stateOf(p, m), burnt = sf === 'burnt', flowing = down && !burnt && (m.i_mA || 0) > .05;
    let s = '';
    // legs: out of the two sides that face across the trench, then bent down into the holes
    for (const L of legs){ const [a, b] = F.loc(L), a0 = sg(a) * 2.25, b0 = sg(b) * 3;
      s += rod(F.W(a0, b0, zl), F.W(a, b, zl), .26, B.M.tin, toneI, .4) + rod(F.W(a, b, zl), F.W(a, b, -.3), .26, B.M.tin, toneI, .4); }
    // see-through: outer ring contact (legs 1-2, at a < 0), centre contact (legs 3-4, at a > 0), the snap dome
    if (k > .02){
      const cu = flowing ? matOf(LIVE) : burnt ? matOf('#4a3b30') : B.M.copper;
      let x = F.slab(-2.6, -3, -2.0, 3, .6, .9, cu, .35) + F.slab(2.0, -3, 2.6, 3, .6, .9, cu, .35) + F.slab(.4, -.35, 2.3, .35, .6, .9, cu, .3);
      x += fill(pd(ring(F, 0, 0, .95, 2.45)), flowing ? LIVE : B.M.copper.m) + fill(pd(ring(F, 0, 0, .97, 1.85)), '#2a2623') + fill(pd(ring(F, 0, 0, 1.0, .85)), flowing ? LIVE : B.M.copper.l);
      const domeTop = down ? 1.15 : 1.75;
      x += rod(F.W(0, 0, 1.02), F.W(0, 0, domeTop), 2.35, DOME, toneI, .4, down ? 2.1 : 1.1);
      if (flowing) x += `<path d="${pd([F.W(-2.3, -2.6, .95), F.W(-1.6, -.6, 1.05), F.W(0, 0, 1.05), F.W(1.6, .3, .95), F.W(2.3, 2.6, .95)], false)}" fill="none" stroke="${LIVE}" stroke-width="1.2" stroke-dasharray="1.2 1.6" opacity=".95"/>`;
      s += `<g opacity="${f(Math.min(1, k * 1.4))}">${x}</g>`;
    }
    // body, metal frame with its two clip tabs, plunger
    let body = F.slab(-3, -3, 3, 3, 0, zb, burnt ? matOf('#4a3b30') : B.M.black, .7) + F.slab(-3, -3, 3, 3, zb, zt, B.M.steel, .45)
      + F.slab(-1.1, -3.14, 1.1, -3, 1.3, zt, B.M.steel, .35) + F.slab(-1.1, 3, 1.1, 3.14, 1.3, zt, B.M.steel, .35);
    for (const [a, b] of [[-2.2, -2.2], [2.2, -2.2], [2.2, 2.2], [-2.2, 2.2]]) body += fill(pd(ring(F, a, b, zt + .01, .32, 8)), B.M.steel.d);
    const c0 = F.W(0, 0, zt), capM = matOf(CAP[p.color] || CAP.black);
    if (down) body += `<path d="${pd(ring(F, 0, 0, zt + .02, 2.25))}" fill="none" stroke="${LIVE}" stroke-width="1.1" opacity=".9"/>`;
    body += cyl(c0[0], c0[1], c0[2], c0[2] + plH, 1.75, capM, toneI, .6, 18);
    s += k > .02 ? `<g opacity="${f(1 - .68 * k)}">${body}</g>` : body;
    if ((ctx.solo || (B.md && B.md.def && B.md.def.partPage)) && k > .5){
      ctx.label(F.W(0, 0, 1.6), 'Snap dome', down);
      ctx.label(F.W(-2.3, -3, .8), 'Ring: pins 1–2', flowing);
      ctx.label(F.W(2.3, 3, .8), 'Centre: pins 3–4', flowing);
    }
    ctx.put(F.bx(-4.2, -4.2, -.3, 4.2, 4.2, zt + 1.4), s);
  },
  show: { breadboard: 'mini', holes: ['e8', 'f8', 'e10', 'f10'], params: { pressed: 0, color: 'black' } },
});
})();

</script>
<script>/* figures/parts/potentiometer.js */
// @cf title Potentiometer
// @cf use engine/bench.list
/* B10K rotary potentiometer, the 9 mm kit part (RK09 class): blue 9.8 mm body, metal bushing, black knurled knob,
   three legs in a row on 2.5 mm pitch so they sit in three neighbouring holes. "B" is the linear taper, 10 kOhm
   +-20 % end to end, about 300 degrees of rotation. Legs ['1','W','3']: with the legs toward you and the shaft up,
   pin 1 is the left (anticlockwise) end, W the wiper, pin 3 the right (clockwise) end; turning clockwise moves the
   wiper from pin 1 toward pin 3. pos 0..1 is the wiper position (0 = full anticlockwise, at pin 1), so with pin 1 on
   GND and pin 3 on 5 V, V(W) = 5 V x pos. Rated about 0.05 W (typical for a 9 mm carbon pot): with 5 V on one end and
   GND on the wiper, turning toward that end shorts 5 V through a sliver of track, which gets hot and burns.
   See-through: the horseshoe carbon track (300 degrees, open toward the legs), the end terminals, the wiper on the
   shaft and the collector ring that carries the wiper to the middle leg; the track between pin 1 and the wiper and
   between the wiper and pin 3 is tinted with its share of the resistance. */
(() => {
const B = SL.bench, T = B.T;
const DEF = { pos: .5, ohms: 10000, fault: 'none' };
// faults the page can set; in a circuit the solver's verdict (m.state) is used unless one is set here
const FAULTS = { none: null, 'track shorted': 'hot', 'track burnt': 'burnt' };
const stateOf = (p, m) => FAULTS[p.fault] || (m && m.state) || null;
const SWEEP = 300;
const BLUE = { l: '#5b8fd9', m: '#3f6fb8', d: '#28487a' }, KNOB = { l: '#5a5550', m: '#3a3632', d: '#24211f' };
const TRACK = '#3b302a', SEG1 = '#e2483d', SEG2 = '#3e86d9', LIVE = '#f4b829';

const frame = (legs, i0, i1) => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[i1][0] - legs[i0][0], dy = legs[i1][1] - legs[i0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W,
    loc: q => { const x = q[0] - o[0], y = q[1] - o[1]; return [x * ux + y * uy, -x * uy + y * ux]; },
    slab: (a0, b0, a1, b1, z0, z1, m, w = .6) => B.slabW(W, a0, b0, a1, b1, z0, z1, m, toneI, w),
    bx: (a0, b0, z0, a1, b1, z1) => B.aabb([W(a0, b0, z0), W(a1, b1, z1), W(a0, b1, z0), W(a1, b0, z1)]) };
};
const xrK = ctx => ctx.k != null ? ctx.k : ease(Math.min(1, Math.max(0, (ctx.st && ctx.st.xr) || 0)));
const ring = (F, a, b, z, r, n = 24) => B.circ(a, b, r, n).map(([u, v]) => F.W(u, v, z));
// clockwise angle from 12 o'clock (away from the legs), seen from above: direction in the part's (a, b) plane
const dirOf = deg => { const r = deg * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; };
const arc = (F, cb, z, r, d0, d1, n) => { const o = []; for (let i = 0; i <= n; i++){ const [x, y] = dirOf(d0 + (d1 - d0) * i / n); o.push(F.W(x * r, cb + y * r, z)); } return o; };
const pos01 = p => Math.max(0, Math.min(1, +p.pos || 0));

B.part('potentiometer', {
  name: 'Potentiometer', fig: 'P6',
  legs: ['1', 'W', '3'],
  span: [2, 4],
  params: { pos: [0, 1], ohms: [1000, 1000000], fault: Object.keys(FAULTS) },
  paramNames: { fault: 'Break it' },
  steps: { pos: [0, .25, .5, .75, 1], ohms: [1000, 10000, 100000] },
  defaults: DEF,
  // legs [end 1, wiper, end 3]; R(1-W) = ohms x pos, R(W-3) = ohms x (1 - pos)
  elec: p => ({ type: 'pot', ohms: Math.max(1, +p.ohms || DEF.ohms), pos: pos01(Object.assign({}, DEF, p)), pmax: .05, taper: 'linear', sweep: SWEEP }),
  // each press turns the knob an eighth of its travel clockwise, then back to the start
  press: (p, down) => down ? { pos: pos01(Object.assign({}, DEF, p)) >= .999 ? 0 : Math.min(1, Math.round((pos01(Object.assign({}, DEF, p)) + .125) * 8) / 8) } : null,
  tag: (p, m) => {
    const q = Object.assign({}, DEF, p), pct = Math.round(pos01(q) * 100);
    if (stateOf(q, m) === 'burnt') return T('{id} · track burnt', { id: q.id });
    if (stateOf(q, m) === 'hot') return T('{id} · hot: 5 V shorted through the track', { id: q.id });
    if (m && m.v != null) return T('{id} · {pct} % · {v} V', { id: q.id, pct, v: (+m.v).toFixed(2) });
    return T('{id} · {pct} %', { id: q.id, pct });
  },
  draw(ctx){
    const p = Object.assign({}, DEF, ctx.p), legs = ctx.legs, k = xrK(ctx), m = ctx.m || {}, pos = pos01(p);
    const F = frame(legs, 0, legs.length - 1), cb = -2.6;            // the shaft sits 2.6 mm behind the leg row
    const sf = stateOf(p, m), hot = sf === 'hot', burnt = sf === 'burnt', ang = (pos - .5) * SWEEP;
    const zb = 6.2, zbu = 7.6, zk0 = 7.8, zk1 = 13.6, rk = 4.6;
    let s = '';
    // legs: straight down out of the front of the body
    for (const L of legs){ const [a, b] = F.loc(L);
      s += rod(F.W(a, -.4, 1.4), F.W(a, b, 1.4), .3, B.M.tin, toneI, .4) + rod(F.W(a, b, 1.4), F.W(a, b, -.3), .3, B.M.tin, toneI, .4); }
    // see-through internals, under a ghosted body
    if (k > .02){
      const z = 3.4, r = 3.3, d1 = -SWEEP / 2 + SWEEP * pos;
      let x = fill(pd(ring(F, 0, cb, z - .25, 4.3)), '#c9a874');                          // phenolic wafer
      x += `<path d="${pd(arc(F, cb, z, r, -SWEEP / 2, SWEEP / 2, 30), false)}" fill="none" stroke="${burnt ? '#1f1a17' : TRACK}" stroke-width="2.6" stroke-linecap="butt"/>`;
      x += `<path d="${pd(arc(F, cb, z + .02, r, -SWEEP / 2, d1, 22), false)}" fill="none" stroke="${SEG1}" stroke-width="1" opacity=".85"/>`;
      x += `<path d="${pd(arc(F, cb, z + .02, r, d1, SWEEP / 2, 22), false)}" fill="none" stroke="${SEG2}" stroke-width="1" opacity=".85"/>`;
      x += `<path d="${pd(ring(F, 0, cb, z + .03, 1.5))}" fill="none" stroke="${B.M.steel.m}" stroke-width="1.3"/>`;    // collector ring
      // end terminals and the centre terminal, from the arc ends and the ring down to the legs
      const [e1x, e1y] = dirOf(-SWEEP / 2), [e3x, e3y] = dirOf(SWEEP / 2), la = legs.map(L => F.loc(L));
      x += rod(F.W(e1x * r, cb + e1y * r, z), F.W(la[0][0], -.4, z - .8), .35, B.M.tin, toneI, .3) + rod(F.W(e3x * r, cb + e3y * r, z), F.W(la[2][0], -.4, z - .8), .35, B.M.tin, toneI, .3)
        + rod(F.W(0, cb + 1.5, z), F.W(la[1][0], -.4, z - .8), .35, B.M.tin, toneI, .3);
      // wiper: a sprung blade from the collector ring to the track at the knob angle
      const [wx, wy] = dirOf(ang), wc = hot || burnt ? '#e2483d' : B.M.steel.l;
      x += rod(F.W(wx * 1.2, cb + wy * 1.2, z + .5), F.W(wx * r, cb + wy * r, z + .15), .35, matOf(wc), toneI, .35) + fill(pd(ring(F, wx * r, cb + wy * r, z + .2, .45, 10)), LIVE);
      if (hot && !burnt){ const [X, Y] = P(...F.W(wx * r, cb + wy * r, z)); x += `<circle cx="${f(X)}" cy="${f(Y)}" r="5" fill="#f08a2b" opacity=".45"/>`; }
      s += `<g opacity="${f(Math.min(1, k * 1.4))}">${x}</g>`;
    }
    // body, bushing, knob
    let body = F.slab(-4.9, cb - 4.9, 4.9, cb + 4.9, 0, zb - .35, burnt ? matOf('#3f3a3a') : hot ? matOf('#c0504a') : BLUE, .7);
    body += F.slab(-4.6, cb - 4.6, 4.6, cb + 4.6, zb - .35, zb, B.M.steel, .45);                    // the metal cover that holds the bushing
    const c = F.W(0, cb, zb), kc = F.W(0, cb, zk0);
    body += cyl(c[0], c[1], c[2], zbu - zb + c[2], 3.4, B.M.steel, toneI, .6, 18);
    body += cyl(kc[0], kc[1], kc[2], kc[2] + zk1 - zk0, rk, KNOB, toneI, .9, 22);
    // knurls round the side of the knob, on the half that faces the viewer
    const n0 = F.W(0, cb, 0);
    for (let i = 0; i < 20; i++){ const a = i / 20 * 2 * Math.PI, d = [Math.cos(a), Math.sin(a)];
      const n = F.W(d[0], cb + d[1], 0); if (!vis([n[0] - n0[0], n[1] - n0[1], 0])) continue;
      body += `<path d="${pd([F.W(d[0] * rk, cb + d[1] * rk, zk0 + .6), F.W(d[0] * rk, cb + d[1] * rk, zk1 - .4)], false)}" stroke="${KNOB.d}" stroke-width=".45" fill="none"/>`; }
    // indicator line on the knob top shows the angle
    const [ix, iy] = dirOf(ang);
    body += `<path d="${pd([F.W(ix * .8, cb + iy * .8, zk1 + .02), F.W(ix * (rk - .6), cb + iy * (rk - .6), zk1 + .02)], false)}" stroke="#f6f3ea" stroke-width="1.3" stroke-linecap="round" fill="none"/>`;
    // the 300-degree travel marks on the body top, so the angle reads against a scale
    for (const d of [-SWEEP / 2, 0, SWEEP / 2]){ const [mx, my] = dirOf(d);
      body += `<path d="${pd([F.W(mx * 3.9, cb + my * 3.9, zb + .02), F.W(mx * 4.6, cb + my * 4.6, zb + .02)], false)}" stroke="#3a3632" stroke-width=".8" fill="none"/>`; }
    s += k > .02 ? `<g opacity="${f(1 - .7 * k)}">${body}</g>` : body;
    if (hot || burnt){ const [X, Y] = P(...F.W(0, cb, zk1 + 2)); s += `<circle cx="${f(X)}" cy="${f(Y - 6)}" r="4" fill="#8a847a" opacity=".4"/><circle cx="${f(X + 3)}" cy="${f(Y - 12)}" r="3" fill="#8a847a" opacity=".3"/>`; }
    if ((ctx.solo || (B.md && B.md.def && B.md.def.partPage)) && k > .5){
      const [wx, wy] = dirOf(ang);
      ctx.label(F.W(-3.3, cb, 3.4), 'Carbon track');
      ctx.label(F.W(wx * 3.3, cb + wy * 3.3, 3.6), 'Wiper', true);
      ctx.label(F.W(0, cb + 1.5, 3.4), 'Ring to pin W');
    }
    ctx.put(F.bx(-5.2, cb - 5.2, -.3, 5.2, cb + 5.2, zk1 + .2), s);
  },
  show: { breadboard: 'mini', holes: ['e8', 'e9', 'e10'], params: { pos: .7 } },
});
})();

</script>
<script>/* figures/parts/mpu6050.js */
// @cf title Accelerometer and gyroscope (MPU-6050 on a GY-521)
// @cf use engine/bench.list
/* GY-521 breakout (docs/facts/mpu6050.md): a blue 15.6 x 20.3 mm board with the MPU-6050 (4 x 4 mm QFN), a 662K
   (XC6206) 3.3 V regulator, 4.7 kOhm I2C pull-ups to 3.3 V, a 4.7 kOhm pull-down on AD0 (address 0x68), a power LED
   with 1 kOhm, a 10 uF tantalum and an 8-pin 2.54 mm header. Positions are the fact sheet's, measured from a photo of a
   real board (+-0.3 mm) in its own frame: header along the left edge at x = 1.4, VCC at the top (y = 19.03) down to
   INT (y = 1.25). Legs ['VCC','GND','SCL','SDA','XDA','XCL','AD0','INT'], header order. On a breadboard the straight
   header is soldered pointing down with its plastic spacer under the board, component side up, so with VCC in the
   lower-numbered column the board lies over the rows on the trench side of the pins (rows f-h for pins in row i,
   rows b-d for pins in row a), and jumper wires go into the free holes on the other side of the same strips.
   The power LED lights when the VCC strip is wired to a live rail and the GND strip to GND, through the 662K (so it
   lights from 3.3 V or 5 V). The readings themselves come from the interpreter's mpu6050 device on the I2C bus.
   See-through: the QFN holds two dies, the CMOS signal chip and the MEMS die bonded face down on it (the proof masses
   and comb fingers), with gold bond wires to the lead frame. */
(() => {
const B = SL.bench, T = B.T;
const PCB = { l: '#2f7ee0', m: '#1d63c6', d: '#123f86' }, TAN = { l: '#d8bf93', m: '#bba070', d: '#83703f' };
const RES = { l: '#3c3935', m: '#2c2a27', d: '#1c1b19' }, TANT = { l: '#f3cf4a', m: '#d9ad22', d: '#8c6d0c' };
const CMOS = { l: '#8c95b8', m: '#6b7397', d: '#3f4565' }, MEMS = { l: '#c9d3e6', m: '#a3afc8', d: '#6c7896' };
const W0 = 15.6, H0 = 20.3, HX = 1.4, Y1 = 19.03;
const ZS = 2.5, ZB = ZS, ZT = ZS + 1.6, PIN_TOP = ZT + 1.5;
const LABELS = ['VCC', 'GND', 'SCL', 'SDA', 'XDA', 'XCL', 'AD0', 'INT'];
const pinY = i => Y1 - i * 2.54;

// the board's own frame (x right, y up, z up from the breadboard top) on the breadboard: VCC on the first hole
const frame = ctx => {
  const h = ctx.holes, pl = ctx.pl, x0 = h[0].x, y0 = h[0].y;
  const dx = h[h.length - 1].x - x0, dy = h[h.length - 1].y - y0, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (x, y, z) => { const a = Y1 - y, b = x - HX; return pl.at(x0 + ux * a - uy * b, y0 + uy * a + ux * b, pl.zTop + z); };
  const dir = (x, y, dx2, dy2) => sub(W(x + dx2, y + dy2, 0), W(x, y, 0));
  const slab = (xa, ya, xb, yb, za, zb, m, w = .5) => B.slabW(W, xa, ya, xb, yb, za, zb, m, toneI, w);
  const text = (x, y, z, str, size, col = '#f2f4f6', rot = 0, anchor = 'middle') => {
    const r = rot * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return `<text transform="${txM(P(...W(x, y, z)), Dv(...dir(x, y, c, s)), Dv(...dir(x, y, s, -c)))}" font-size="${f(size)}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="800">${CF_ESC(str)}</text>`;
  };
  const disc = (x, y, z, r, col, w = 0) => { const d = pd(B.circ(x, y, r, 16).map(([u, v]) => W(u, v, z))); return fill(d, col) + (w ? ink(d, w) : ''); };
  return { W, slab, text, disc };
};

// volts on the VCC leg's strip, when its GND leg's strip reaches GND: union the circuit's wires like the solver does
const supply = ctx => {
  const pl = ctx.pl, c = pl && pl.c, st = ctx.st || {}, h = ctx.holes;
  if (!c || !st.ev || !h || h.length < 2) return 0;
  const par = {}, find = a => { while (par[a] !== a) a = par[a] = par[par[a]]; return a; };
  const add = a => { if (!(a in par)) par[a] = a; return a; };
  const node = ref => { const q = B.hole(pl.geo, ref) || B.legHole(c, pl.geo, ref); if (q && q.node) return q.node; const pin = B.pinOf(ref); return pin ? 'N:' + pin.net : null; };
  for (const w of c.wires || []){ const a = node(w.from), b = node(w.to); if (a && b) par[find(add(a))] = find(add(b)); }
  const nets = n => (n in par) ? Object.keys(par).filter(k => k.startsWith('N:') && find(k) === find(n)).map(k => k.slice(2)) : [];
  if (!nets(h[1].node).includes('GND')) return 0;
  return Math.max(0, ...nets(h[0].node).map(n => (st.ev.rails || {})[n] || 0));
};

B.part('mpu6050', {
  name: 'Accelerometer and gyroscope (MPU-6050)', fig: 'P26',
  legs: LABELS,
  span: [7, 7],
  pinZ: PIN_TOP,
  params: { ad0: ['low', 'high'] },
  paramNames: { ad0: 'AD0 pin' },
  example: { ad0: 'low' },
  tag: p => T('{id} · I2C {addr}', { id: p.id, addr: p.ad0 === 'high' ? '0x69' : '0x68' }),
  draw(ctx){
    const F = frame(ctx), W = F.W, st = ctx.st || {}, legs = ctx.legs;
    const k = ctx.k != null ? ctx.k : ease(Math.min(1, Math.max(0, st.xr || 0)));
    const v = supply(ctx), lit = v >= 2.6 ? Math.min(1, (v - 2.2) / 1.1) : 0;
    let s = '';
    // the header: pins from the holes up through the plastic spacer and the board, the spacer under the board edge
    for (const L of legs) s += rod(L, [L[0], L[1], L[2] + ZB], .32, B.M.tin, toneI, .3);
    s += F.slab(HX - 1.27, pinY(7) - 1.27, HX + 1.27, pinY(0) + 1.27, 0, ZS, B.M.black, .6);
    // the board, its mounting holes and the pads round the header pins
    s += F.slab(0, 0, W0, H0, ZB, ZT, PCB, .8);
    for (const [x, y] of [[12.9, 17.9], [12.9, 2.7]]) s += F.disc(x, y, ZT + .01, 2, B.M.tin.l, .3) + F.disc(x, y, ZT + .02, 1.5, '#1d1b19');
    for (let i = 0; i < 8; i++) s += F.disc(HX, pinY(i), ZT + .01, .85, B.M.tin.l, .3);
    // silkscreen: the pin names beside the pads, ITG/MPU along the right edge, the X and Y axis arrows
    LABELS.forEach((t, i) => { s += F.text(2.45, pinY(i) - .42, ZT + .01, t, 1.1, '#f2f4f6', 0, 'start'); });
    s += F.text(14.7, 10.3, ZT + .01, 'ITG/MPU', 1.15, '#f2f4f6', 90);
    const arrow = (x0, y0, x1, y1) => `<path d="${pd([W(x0, y0, ZT + .01), W(x1, y1, ZT + .01)], false)}" stroke="#f2f4f6" stroke-width=".22" fill="none"/>`;

    // passives: 0603 capacitors (tan) and resistors (black, three-digit codes)
    const chip = (x, y, vert, m, h, code) => {
      const [hl, hw] = vert ? [.4, .8] : [.8, .4], e = .3;
      let c = vert ? F.slab(x - hl, y - hw + e, x + hl, y + hw - e, ZT, ZT + h, m, .35) + F.slab(x - hl, y - hw, x + hl, y - hw + e, ZT, ZT + h, B.M.tin, .3) + F.slab(x - hl, y + hw - e, x + hl, y + hw, ZT, ZT + h, B.M.tin, .3)
        : F.slab(x - hl + e, y - hw, x + hl - e, y + hw, ZT, ZT + h, m, .35) + F.slab(x - hl, y - hw, x - hl + e, y + hw, ZT, ZT + h, B.M.tin, .3) + F.slab(x + hl - e, y - hw, x + hl, y + hw, ZT, ZT + h, B.M.tin, .3);
      if (code) c += F.text(x, y - .14, ZT + h + .01, code, .42, '#e9e4d6');
      return c;
    };
    for (const [x, y, vert] of [[10.3, 18.5, true], [6.7, 16.7], [10.1, 15.4], [10.1, 14.0], [6.7, 6.6], [10.1, 6.6]]) s += chip(x, y, vert, TAN, .8);
    for (const [x, y, code] of [[6.7, 15.4, '472'], [6.7, 14.0, '472'], [6.7, 5.1, '472'], [10.1, 5.1, '102']]) s += chip(x, y, false, RES, .45, code);
    // 662K regulator (SOT-23, long axis up the board) and the 10 uF tantalum with its + stripe at the top
    s += F.slab(6.95, 17.5, 8.25, 20.2, ZT, ZT + 1.1, RES, .4) + F.text(7.6, 18.75, ZT + 1.11, '662K', .5, '#d9d4c6', 90);
    for (const y of [17.8, 18.9, 20.0]) s += F.slab(6.55, y - .2, 6.95, y + .2, ZT, ZT + .3, B.M.tin, .25);
    s += F.slab(8.25, 18.7, 8.65, 19.1, ZT, ZT + .3, B.M.tin, .25);
    s += F.slab(11.9, 8.7, 13.5, 11.9, ZT, ZT + 1.6, TANT, .45) + F.slab(11.9, 11.2, 13.5, 11.9, ZT + .01, ZT + 1.61, matOf('#8a5a34'), .3);
    // the power LED: a clear 0603 lens, red when the board has power
    s += chip(6.7, 3.6, false, matOf(lit ? mix('#ff5a4a', '#ffffff', .25) : '#e8e2d2'), .6);
    // the MPU-6050 itself: a 4 x 4 x 0.9 mm QFN, pin 1 dot top left, ghosted in see-through
    let ic = F.slab(6.5, 8.7, 10.5, 12.7, ZT, ZT + .9, B.M.black, .5) + F.disc(6.95, 12.25, ZT + .91, .2, '#55514c');
    for (let i = 0; i < 6; i++){ const t = 9.45 + i * .5;
      ic += F.slab(6.35, t - .12, 6.5, t + .12, ZT, ZT + .2, B.M.tin, .2) + F.slab(10.5, t - .12, 10.65, t + .12, ZT, ZT + .2, B.M.tin, .2)
        + F.slab(t - .7, 8.55, t - .7 + .24, 8.7, ZT, ZT + .2, B.M.tin, .2) + F.slab(t - .7, 12.7, t - .7 + .24, 12.85, ZT, ZT + .2, B.M.tin, .2); }
    ic += F.text(8.5, 10.95, ZT + .91, 'MPU-6050', .5, '#bdb7ab') + F.text(8.5, 10.2, ZT + .91, 'INVENSENSE', .36, '#9d978b');
    s += k > .02 ? `<g opacity="${f(1 - .7 * k)}">${ic}</g>` : ic;
    if (k > .02){
      // two dies: the CMOS chip on the lead frame and the MEMS die on top of it, gold wires out to the pads
      let x = F.slab(7.1, 9.3, 9.9, 12.1, ZT + .25, ZT + .45, CMOS, .35) + F.slab(7.5, 9.7, 9.5, 11.7, ZT + .45, ZT + .62, MEMS, .3);
      for (let i = 0; i < 4; i++) x += `<path d="${pd([W(7.8 + i * .45, 9.85, ZT + .63), W(7.8 + i * .45, 11.55, ZT + .63)], false)}" stroke="#56607e" stroke-width=".18" fill="none"/>`;
      for (let i = 0; i < 6; i++){ const t = 9.45 + i * .5;
        x += `<path d="${pd([W(7.15, t, ZT + .45), W(6.8, t, ZT + .65), W(6.45, t, ZT + .2)], false)}" stroke="#e8c36a" stroke-width=".2" fill="none"/>`
          + `<path d="${pd([W(9.85, t, ZT + .45), W(10.2, t, ZT + .65), W(10.55, t, ZT + .2)], false)}" stroke="#e8c36a" stroke-width=".2" fill="none"/>`; }
      s += `<g opacity="${f(k)}">${x}</g>`;
    }
    // the pin tips above the board in their solder cones, drawn last so they sit on top
    for (let i = 0; i < 8; i++) s += rod(W(HX, pinY(i), ZT), W(HX, pinY(i), ZT + .45), .62, B.M.tin, toneI, .3, .36, 12) + rod(W(HX, pinY(i), ZT + .45), W(HX, pinY(i), PIN_TOP), .32, B.M.tin, toneI, .3);
    if (lit){
      // the glow is sized in millimetres on the board, so it stays the LED's size at any zoom
      const [X, Y] = P(...W(6.7, 3.6, ZT + .6)), [Xe, Ye] = P(...W(8.2, 3.6, ZT + .6)), mm = Math.hypot(Xe - X, Ye - Y) / 1.5;
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(mm * (1 + 1.2 * lit))}" fill="#ff5a4a" opacity="${f(.35 * lit)}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(mm * .55)}" fill="#fff1e6" opacity="${f(.7 * lit)}"/>`;
    }
    if ((ctx.solo || (B.md && B.md.def && B.md.def.partPage)) && k > .5){
      ctx.label(W(8.5, 10.7, ZT + .6), 'MEMS die on the CMOS chip');
      ctx.label(W(7.6, 18.9, ZT + 1.1), '3.3 V regulator (662K)');
      ctx.label(W(6.7, 3.6, ZT + .6), 'Power LED', lit > 0);
    }
    ctx.put(B.aabb([W(0, 0, 0), W(W0, H0, 0), W(0, H0, PIN_TOP), W(W0, 0, PIN_TOP)]), s);
  },
  show: { breadboard: 'mini', holes: ['f3', 'f4', 'f5', 'f6', 'f7', 'f8', 'f9', 'f10'] },
});
})();

<script>/* figures/boards/nano.js */
// @cf title Arduino Nano
// @cf use engine/bench.list
// @cf use parts/push-button.js
// @cf use parts/potentiometer.js
// @cf use parts/mpu6050.js
/* Arduino Nano (classic), SKU A000005, board revision 3.3, as produced today. Every position is the part's centre
   from Arduino's own Eagle file NanoV3.3.brd (origin bottom-left, y up, 43.18 x 17.78 mm, square corners), as listed
   in docs/facts/nano.md section 2. Production parts follow the official photos: an FT232RNL USB-UART and an ST
   LD1117S50 regulator (15 V absolute maximum on VIN), the silk reads "ON" and "3.3V" and carries no branding on top.
   How it works: USB Mini-B (J3) VBUS goes through the 500 mA polyfuse F1 to VUSB and through the SS1P3L Schottky D1
   to +5V (about 4.65 V). VIN (7-12 V) feeds the LDO IC2, whose 5.0 V output is higher than VUSB minus the diode drop,
   so D1 turns off and the board runs from VIN: there is no switch and no reverse-polarity diode on VIN. The 5V pin
   ties straight to +5V. The 3V3 pin is the FT232's internal 3.3 V regulator (50 mA). The ATmega328P-MU (IC3, VQFN-32
   turned 45 degrees) runs from the 16 MHz ceramic resonator Y1; its brown-out detector trips at 2.7 V (fuse 0xFD).
   The FT232's DTR pulse reaches RESET through C4, which starts Optiboot for an upload; L flashes, then the sketch
   runs. The two 1x15 headers are fitted with their plastic underneath and the pins pointing down, so the board
   straddles a breadboard; on the mat it stands on its pins. The ICSP pads (J4) are left bare. */
(() => {
const B = SL.bench;
const blink = (t, on, off) => (t % (on + off)) < on ? 1 : 0;
const hx = k => 39.37 - 2.54 * (k - 1);         // header pin k (1..15) of J1 and J2, from the right-hand end

// The library's `male` draws a header standing on the component side. The Nano's headers hang under the board
// (plastic below, pins pointing down) and only short pin stubs with solder fillets show on top. side:'bottom' makes
// ctx.W measure z downward from the underside, so the stubs on top sit at negative z. `h` is the wire-end height:
// the engine plugs a wire 2 mm below a header's h, so h 3.2 puts it on the 1.2 mm stub.
B.kind('nano-header', {
  group: 'low', size: p => [p.pins.length * (p.pitch || 2.54), 2.54], h: 3.2, pins: p => B.rowPins(p),
  draw(ctx){
    const p = ctx.p, [l, w] = p.size, th = B.md.pcb.thick, pl = 2.5, len = 6, stub = 1.2, q = .32;
    const sold = !!(ctx.st.placed[p.id] && ctx.st.placed[p.id].sold);
    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, pl), ctx.slab(-l / 2, -w / 2, l / 2, w / 2, 0, pl, B.M.blackPl, toneI, .6));
    B.rowPins(p).forEach(([bx, by], i) => {
      if (p.pins[i] === null) return;
      const [a, b] = B.localOf(p, bx, by);
      ctx.put(ctx.B(a - q, b - q, pl, a + q, b + q, pl + len), ctx.slab(a - q, b - q, a + q, b + q, pl, pl + len, B.M.tin, toneI, .35));
      const top = -th - stub, fillet = sold ? ctx.disc(a, b, -th - .05, .72, B.M.tin.l, .35) : '';
      ctx.put(ctx.B(a - .8, b - .8, top, a + .8, b + .8, -th), fillet + ctx.slab(a - q, b - q, a + q, b + q, top, -th, B.M.tin, toneI, .35));
    });
  },
});

const J1 = ['D1', 'D0', 'RESET', 'GND', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8', 'D9', 'D10', 'D11', 'D12'];
const J1L = ['TX1', 'RX0', 'RST', 'GND', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8', 'D9', 'D10', 'D11', 'D12'];
const J2 = ['VIN', 'GND', 'RESET', '5V', 'A7', 'A6', 'A5', 'A4', 'A3', 'A2', 'A1', 'A0', 'AREF', '3V3', 'D13'];

const VUSB_RUN = [[7.06, 10.49], [7.9, 11.6], [7.9, 13.9], [19.2, 13.9], [19.6, 14.4], [27.0, 14.4], [28.58, 13.97]];
