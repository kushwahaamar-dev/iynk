    items.push({ box: B.aabb([W(-16, -6, 0), W(16, 6, .05)]), svg: castShadow([W(-11.1, -5.9, 0), W(11.1, -5.9, 0), W(11.1, 5.9, 0), W(-11.1, 5.9, 0), W(-11.1, -5.9, 26), W(11.1, -5.9, 26), W(11.1, 5.9, 26), W(-11.1, 5.9, 26)], o[2]) });

<script>/* figures/parts/stepper-28byj48.js */
// @cf title 28BYJ-48 stepper motor
// @cf use engine/bench.list
/* 28BYJ-48 5 V unipolar geared stepper standing on a wooden base, shaft up, with a pointer (or an eight-segment
   prize wheel, `wheel`) on the shaft. Can 28 mm across and 19 mm deep; the flange on top has two ears on 35 mm
   centres; the 5 mm shaft (flats 3 mm across) sits 8 mm off the can's centre on a small boss; the blue cover on
   the side lets out the 5-wire lead (1 blue, 2 pink, 3 yellow, 4 orange, 5 red = common +5 V) to a white 5-pin
   JST-XH plug. Legs [B, P, Y, O, R]: the plug's pins, in holes if given; else `plug: '<id>'` pushes the plug into
   that driver board's socket (uln2003: OUT1-OUT4 and +), `plug: [x, y]` lays it on the mat there (board mm), or it
   lies beside the motor.
   Facts (Kiatronics datasheet and teardown counts, la-components.md §15): coils 50 Ohm (5 V / 50 Ohm = 100 mA per
   energised phase; through a ULN2003 that drops about 0.9 V, 82 mA); 32 full steps per rotor turn (11.25°; the
   sheet's 5.625° is the half step); gearbox 9→32, 11→22, 9→26, 10→31 = 63.68395:1, so 2037.8864 full steps or
   4075.7728 half steps per output turn (2048 over-turns by 1.8° a turn). Half-step pull-out above 1000 Hz, pull-in
   above 600 Hz; in practice about 15 rpm (510 full steps/s) without a ramp. Faster than that it hums and stalls
   while the driver LEDs still blink; the wrong pin order (8, 9, 10, 11 instead of 8, 10, 9, 11) energises both ends
   of one winding on every other step, so the field flips 180° and the rotor jitters in place.
   Half-step sequence (wires pulled low): O, O+Y, Y, Y+P, P, P+B, B, B+O: O and P are the two ends of one
   centre-tapped winding, Y and B of the other.

   Inputs, in order: the solver's m.coils = {B, P, Y, O} (energised = true: a coil carrying a fifth of its rated
   current, once the plug is in a driver board that is wired up); else the host's params `steps` (full steps sent
   so far), `rate` (steps/s), `seq` ('full' | 'half' | 'wave') and `order`; else, while the board runs,
   the pins in `in` (default ['D8', 'D9', 'D10', 'D11'] = IN1..IN4 → blue, pink, yellow, orange) through the
   ULN2003 (input high = coil on). Reports m-like state 'ok' | 'off' | 'stall' | 'jitter'. */
(() => {
const B = SL.bench, T = B.T;
const callouts = ctx => typeof ctx.label === 'function' && (!!ctx.sel || !!(B.md && B.md.def && B.md.def.partPage));
const RATIO = 567424 / 8910, FULL = 32 * RATIO, HALF = 64 * RATIO;          // 63.68395, 2037.8864, 4075.7728
const MAXRATE = { full: 510, half: 1000, wave: 400 };                        // steps/s before it stalls (approximate)

  const k2 = { O: 'O', OY: 'OY', Y: 'Y', PY: 'PY', P: 'P', BP: 'BP', B: 'B', BO: 'BO' }[key]; return k2 != null ? SEQ[k2] : null; };
const COLS = { B: '#3e86d9', P: '#f29ab0', Y: '#f2c230', O: '#f08a2b', R: '#e2483d' };
const CAN = { l: '#e9ecec', m: '#bcc3c5', d: '#7f888b' }, COVER = { l: '#6f9fe0', m: '#4f7fc4', d: '#30558c' }, WOOD = { l: '#e3c79a', m: '#c9a874', d: '#8f7449' };
const COPPER = { l: '#f0a46b', m: '#d4834a', d: '#8f5226' }, GEAR = { l: '#f4efe2', m: '#ddd5c2', d: '#a89f88' };
const DEMO = { idle: { state: 'off' }, turning: { state: 'ok', rpm: 10 }, 'too fast': { state: 'stall', rpm: 24 }, 'wrong pin order': { state: 'jitter' } };
const WHEEL = ['#e2483d', '#f2c230', '#43b05c', '#3e86d9', '#f08a2b', '#8c4bd1', '#f29ab0', '#ece6d6'];
B.part('stepper-28byj48', {
  name: '28BYJ-48 stepper', fig: 'P19', legs: ['B', 'P', 'Y', 'O', 'R'], span: [4, 4],
  params: { wheel: ['pointer', 'wheel'], seq: ['full', 'half', 'wave'], order: ['8-10-9-11', '8-9-10-11'], demo: Object.keys(DEMO) },
  paramNames: { wheel: 'On the shaft', seq: 'Stepping', order: 'Pin order in code', demo: 'Show' },
  example: { demo: 'turning' },
  show: { breadboard: 'mini', parts: [{ id: 'ST1', part: 'stepper-28byj48', at: [-6, 0], rot: 0, demo: 'turning', holes: ['c3', 'c4', 'c5', 'c6', 'c7'] }], wires: [] },
  foot: [42, 32, 36],
  elec: () => ({ type: 'stepper', coils: ['B', 'P', 'Y', 'O'], common: 'R', ohms: 50, vrated: 5, fullSteps: FULL, halfSteps: HALF, maxRate: MAXRATE }),
  model: { RATIO, FULL, HALF, MAXRATE, field },
  tag: (p, m) => {
    const id = p.id; if (!m || !m.state) return id;
    if (m.state === 'stall') return T('{id} · too fast: it hums and stalls', { id });
    if (m.state === 'jitter') return T('{id} · wrong coil order: it jitters', { id });
    if (m.state === 'ok' && m.deg != null) return T('{id} · {n}°', { id, n: Math.round(m.deg) });
    return id;
  },
  draw(ctx){
    const p = ctx.p, st = ctx.st || {}, k = ctx.k != null ? ctx.k : st.xr || 0, legs = ctx.legs || [];
    const all = st.drv || (st.drv = {}), s = all[p.id] || (all[p.id] = { h: 0, t: st.t || 0, state: 'off', on: {} });
    let dt = (st.t || 0) - s.t; s.t = st.t || 0; if (!(dt > 0) || dt > .5) dt = 0;

      if (fh != null){ const cur = ((Math.round(s.h) % 8) + 8) % 8; let d = (fh - cur + 8) % 8; if (d > 4) d -= 8;
        if (Math.abs(d) === 4){ s.jit = (s.jit || 0) + 1; state = 'jitter'; } else { s.h = Math.round(s.h) + d; state = d ? 'ok' : (s.state === 'jitter' ? 'jitter' : 'ok'); } }

      const rate = Math.abs(+p.rate || 0);
      state = p.order === '8-9-10-11' ? 'jitter' : rate > MAXRATE[seq] ? 'stall' : 'ok';
      if (state === 'ok') s.deg = (+p.steps || 0) / perRev * 360;

    } else {
      const dm = DEMO[p.demo] || DEMO.idle; state = dm.state;
      deg = dm.rpm && state === 'ok' ? 40 : 0;
      on = state === 'off' ? {} : state === 'jitter' ? { Y: 1, B: 1 } : { O: 1, Y: 1 };
    }
    const jit = state === 'jitter' || state === 'stall' ? Math.sin((st.t || 0) * 47) * 1.6 : 0;
    const a = (deg + jit) * Math.PI / 180;
    const o = ctx.origin || legs[0] || [0, 0, 0], r = (+p.rot || 0) * Math.PI / 180, ax = [Math.cos(r), Math.sin(r), 0], ay = [-ax[1], ax[0], 0];
    const W = (x, y, z) => [o[0] + ax[0] * x + ay[0] * y, o[1] + ax[1] * x + ay[1] * y, o[2] + z];
    const zb = 6, zt = zb + 19, sx = 8, items = [];
    items.push({ box: B.aabb([W(-22, -18, 0), W(22, 18, .05)]), svg: castShadow([W(-22, -18, 0), W(22, -18, 0), W(22, 18, 0), W(-22, 18, 0), W(-16, -14, zt + 10), W(16, -14, zt + 10), W(16, 14, zt + 10), W(-16, 14, zt + 10)], o[2]) });
    items.push({ box: B.aabb([W(-22, -18, 0), W(22, 18, zb)]), svg: B.slabW(W, -22, -18, 22, 18, 0, zb, WOOD, toneI, 1.2) });
    // can, flange with ears, boss, shaft
    const [cx, cy] = W(0, 0, 0);
    let body = cyl(cx, cy, o[2] + zb, o[2] + zt - .8, 14, CAN, toneI, 1.4, 32);
    const fl = [];
    for (let i = 0; i <= 16; i++){ const q = -Math.PI / 2 + i / 16 * Math.PI; fl.push([17.5 + 3.5 * Math.cos(q), 3.5 * Math.sin(q)]); }
    for (let i = 0; i <= 16; i++){ const q = Math.PI / 2 + i / 16 * Math.PI; fl.push([-17.5 + 3.5 * Math.cos(q), 3.5 * Math.sin(q)]); }
    const flPts = z => fl.map(([x, y]) => W(x, y, z));
    body += loft(flPts(zt - .8), flPts(zt), nr => toneI(nr, CAN)) + shape(flPts(zt), CAN.l, .9);
    for (const ex of [-17.5, 17.5]) body += shape(Array.from({ length: 12 }, (_, i) => { const q = i / 12 * 2 * Math.PI; return W(ex + 2.1 * Math.cos(q), 2.1 * Math.sin(q), zt + .02); }), '#2b2825', .4);
    // the blue cover on the side, where the lead leaves: drawn before the can when it is on the far side
    const cover = B.slabW(W, -19, -8.5, -11, 8.5, zb, zb + 15, COVER, toneI, 1);
    body = vis(ax.map(v => -v)) ? body + cover : cover + body;
    if (k < .5 && vis([0, 0, 1])){ body += B.flatText(W(-4, -6, zt + .02), -ax[1], -ax[0], '28BYJ-48', 2.4, '#5d6467', 800) + B.flatText(W(-4, -9.5, zt + .02), -ax[1], -ax[0], '5VDC', 2, '#5d6467', 700); }
    if (k > .02){
      // inside: two centre-tapped windings on the claw-pole stator round the magnet rotor, and the gear train
      let ins = '';
      const coilOn = [[on.O || on.P, 'O/P'], [on.Y || on.B, 'Y/B']];
      ins += cyl(cx, cy, o[2] + zb + 1, o[2] + zb + 6, 12.5, coilOn[0][0] ? matOf('#ffb36b') : COPPER, toneI, .6, 28)
        + cyl(cx, cy, o[2] + zb + 6.5, o[2] + zb + 11.5, 12.5, coilOn[1][0] ? matOf('#ffb36b') : COPPER, toneI, .6, 28);
      // rotor magnet: alternating poles turning with the rotor (63.68 turns per output turn, drawn slowed)
      const ra = a * 4;
      for (let i = 0; i < 8; i++){ const q0 = ra + i * Math.PI / 4, q1 = q0 + Math.PI / 4, pts = [W(0, 0, zb + 12), W(5 * Math.cos(q0), 5 * Math.sin(q0), zb + 12), W(5 * Math.cos(q1), 5 * Math.sin(q1), zb + 12)];
        ins += shape(pts, i % 2 ? '#e2483d' : '#3e86d9', .3); }
      const gear = (x, y, rr, z, rot) => { let sv = cyl(...W(x, y, 0).slice(0, 2), o[2] + z, o[2] + z + 1, rr, GEAR, toneI, .5, 22);
        for (let i = 0; i < 10; i++){ const q = rot + i / 10 * 2 * Math.PI; sv += line([W(x + rr * .75 * Math.cos(q), y + rr * .75 * Math.sin(q), z + 1.02), W(x + rr * Math.cos(q), y + rr * Math.sin(q), z + 1.02)], .3); } return sv; };
      ins += gear(0, 0, 3, zt - 5, ra) + gear(-4, 6, 6.5, zt - 4, -a * 8) + gear(3, -5, 5.5, zt - 3, a * 2.5) + gear(sx, 0, 7.5, zt - 2.2, a);
      body = `<g opacity="${f(1 - .72 * k)}">${body}</g><g opacity="${f(k)}">${ins}</g>`;
      if (k > .5 && callouts(ctx)){
        ctx.label(W(-12.5, 0, zb + 3.5), 'Winding O–P', !!coilOn[0][0]);
        ctx.label(W(12.5, 0, zb + 9), 'Winding Y–B', !!coilOn[1][0]);
        ctx.label(W(0, 0, zb + 12), '32-step magnet rotor');
        ctx.label(W(sx, 0, zt - 1.2), 'Gears 63.68 : 1');
      }
    }
    items.push({ box: B.aabb([W(-21, -14, zb), W(21, 14, zt)]), svg: body });
    // boss, shaft with its flats, and the pointer or the prize wheel
    const [bx, by] = W(sx, 0, 0);
    let top = cyl(bx, by, o[2] + zt, o[2] + zt + 1.5, 4.5, CAN, toneI, .8) + cyl(bx, by, o[2] + zt + 1.5, o[2] + zt + 9.5, 2.5, B.M.steel, toneI, .7, 16);
    const hz = zt + 8, dir = [Math.cos(a), Math.sin(a)];
    if (p.wheel === 'wheel'){
      for (let i = 0; i < 8; i++){ const q0 = a + i * Math.PI / 4, q1 = q0 + Math.PI / 4, pts = [W(sx, 0, hz)];
        for (let j = 0; j <= 4; j++){ const q = q0 + (q1 - q0) * j / 4; pts.push(W(sx + 26 * Math.cos(q), 26 * Math.sin(q), hz)); }
        top += shape(pts, WHEEL[i], .7); }
      top += cyl(bx, by, o[2] + hz, o[2] + hz + 1.6, 3, B.M.white, toneI, .6);
    } else {
      const tipP = [[0, 2.4], [15, 1.2], [19, 0], [15, -1.2], [0, -2.4]].map(([u0, v0]) => W(sx + u0 * dir[0] - v0 * dir[1], u0 * dir[1] + v0 * dir[0], hz));
      top += loft(tipP.map(q => [q[0], q[1], q[2] - 1.2]), tipP, nr => toneI(nr, matOf('#e2483d'))) + shape(tipP, '#e2483d', .8) + cyl(bx, by, o[2] + hz - 1.2, o[2] + hz + .6, 3.4, matOf('#e2483d'), toneI, .7);
    }
    if (state === 'stall'){ const [X, Y] = P(...W(sx, 0, hz + 3)); top += `<path d="M${f(X - 8)} ${f(Y - 3)}q-2 -2 0 -4q2 -2 0 -4M${f(X + 8)} ${f(Y - 3)}q2 -2 0 -4q-2 -2 0 -4" fill="none" stroke="#e2483d" stroke-width=".8"/>`; }
    items.push({ box: B.aabb([W(sx - 26, -26, zt), W(sx + 26, 26, hz + 2)]), svg: top });
    // the lead: five wires from the cover to the JST plug
    const sock = typeof p.plug === 'string' && B.socketOf ? B.socketOf(p.plug) : null;
    const pl0 = legs.length === 5 ? legs : sock && sock.length === 5 ? sock : (Array.isArray(p.plug) ? [0, 1, 2, 3, 4].map(i => B.BP(p.plug[0] + (i - 2) * 2.5, p.plug[1], B.G.matH - B.G.top)) : [0, 1, 2, 3, 4].map(i => W(-8 + (i - 2) * 2.5, -36, 0)));
    ['B', 'P', 'Y', 'O', 'R'].forEach((w, i) => {
      const s0 = W(-19, (i - 2) * 1.2, zb + 4), e = pl0[i], e2 = [e[0], e[1], e[2] + 6.8], pts = [];      // into the plug's top
      for (let j = 0; j <= 10; j++){ const t = j / 10, sn = Math.sin(t * Math.PI); pts.push([s0[0] + (e2[0] - s0[0]) * t, s0[1] + (e2[1] - s0[1]) * t, s0[2] + (e2[2] - s0[2]) * t + sn * 3]); }
      for (let j = 0; j < pts.length - 1; j++) items.push({ box: B.aabb([pts[j], pts[j + 1]]).map((v, h) => v.map(c => c + (h ? .45 : -.45))), svg: rod(pts[j], pts[j + 1], .42, matOf(COLS[w]), toneI, .35) });
    });
    const pc = pl0[2], u2 = [pl0[4][0] - pl0[0][0], pl0[4][1] - pl0[0][1]], ul = Math.hypot(...u2) || 1, uu = [u2[0] / ul, u2[1] / ul, 0], nn = [-uu[1], uu[0], 0];
    const Wp = (x, y, z) => [pc[0] + uu[0] * x + nn[0] * y, pc[1] + uu[1] * x + nn[1] * y, pc[2] + z];
    items.push({ box: B.aabb([Wp(-6.4, -2.9, 0), Wp(6.4, 2.9, 7)]), svg: B.slabW(Wp, -6.2, -2.9, 6.2, 2.9, 0, 6.5, B.M.white, toneI, .9) });
    for (const it of items) ctx.put(it.box, it.svg);
    st.drv[p.id].state = state;
    s.out = { state, deg: Math.round(deg * 10) / 10 };
  },
});
})();

<script>/* figures/parts/uln2003.js */
// @cf title ULN2003 stepper driver board
// @cf use engine/bench.list
/* The common ULN2003 stepper driver board that comes with the 28BYJ-48: a green 35 x 32 mm board lying on the mat,
   the ULN2003APG (DIP-16, seven Darlington pairs, four used) in the middle, the white 5-pin JST-XH motor socket on
   the back edge, four red LEDs A-D (one per output, lit while that coil is on), and on the front edge the IN1-IN4
   header, the - + power pins (5-12 V) and the ON/OFF jumper. Legs ['IN1','IN2','IN3','IN4','GND','VCC']: the
   header pins a jumper wire pushes onto. The motor plugs in with `plug: '<this id>'` on the stepper; the socket
   is [OUT1, OUT2, OUT3, OUT4, +] = blue, pink, yellow, orange, red.
   Facts as in figures/modules/uln2003.js (the module page of the same board): each input is 2.7 kOhm into a
   Darlington, hFE about 1000; VCE(sat) about 1 V at 100 mA, 500 mA a channel at most; a clamp diode from every output
   to COM, which the board ties to + through the jumper. An input HIGH pulls its output LOW, so the coil between +
   and that output is on (about 80 mA from 5 V), and its LED lights. */
(() => {
const B = SL.bench, T = B.T;
const PCB = { l: '#4fa86a', m: '#2f8a4e', d: '#1d5c33' }, XH = B.M.white, LED_OFF = matOf('#c46a5e'), LED_ON = matOf('#ff5a3c');
const HL = 17.5, HD = 16, Z0 = 1.4, ZT = Z0 + 1.6;               // half length, half depth, board bottom and top
const HP = 2.54, HY = -13.4, PLASTIC = 2.5, PIN = 6;          // front header row, plastic and pin heights
const IN_X = [-14, -11.46, -8.92, -6.38], PWR_X = [3.4, 5.94], JMP_X = [11.6, 14.14];
const SOCK = { x: -3, y: 12.4, w: 12.4, d: 5.8, h: 6 }, LEDS = [8.2, 3.8, -.6, -5];      // socket; LED y at x = 12.6
const DEMO = { stepping: 'stepping', idle: 'idle' };
const callouts = ctx => typeof ctx.label === 'function' && (!!ctx.sel || !!(B.md && B.md.def && B.md.def.partPage));
const frame = (p, origin) => {
  const r = (+p.rot || 0) * Math.PI / 180, ax = [Math.cos(r), Math.sin(r), 0], ay = [-ax[1], ax[0], 0], o = origin;
  return { ax, ay, W: (x, y, z) => [o[0] + ax[0] * x + ay[0] * y, o[1] + ax[1] * x + ay[1] * y, o[2] + z] };
};
const legX = i => i < 4 ? IN_X[i] : PWR_X[i - 4];

B.part('uln2003', {
  name: 'ULN2003 driver board', fig: 'P25', legs: ['IN1', 'IN2', 'IN3', 'IN4', 'GND', 'VCC'],
  // inside: the four outputs and the four Darlington bases behind their 2.7 kOhm resistors
  nodes: ['OUT1', 'OUT2', 'OUT3', 'OUT4', 'B1', 'B2', 'B3', 'B4'],
  socket: ['OUT1', 'OUT2', 'OUT3', 'OUT4', 'VCC'],
  params: { demo: Object.keys(DEMO) },
  paramNames: { demo: 'Show' },
  example: { demo: 'stepping' },
  show: { breadboard: 'mini', parts: [{ id: 'U1', part: 'uln2003', at: [-30, 10], rot: 90, demo: 'stepping' }], wires: [] },
  foot: [35, 32, 12],
  elec: () => [1, 2, 3, 4].flatMap(n => [
    { type: 'res', ohms: 2700, legs: ['IN' + n, 'B' + n], ch: n },
    { type: 'npn', darlington: true, ch: n, pins: { B: 'B' + n, C: 'OUT' + n, E: 'GND' }, hfe: 1000, vbe: 1.4, vcesat: 1, icmax: .5, pmax: .4, theta: 70, tjmax: 150 },
    { type: 'diode', ch: n, legs: ['OUT' + n, 'VCC'], imax: .5 },
  ]),
  tag: (p, m) => {
    const ch = m && m.ch; if (!ch) return p.id;
    const lit = [1, 2, 3, 4].filter(n => ch[n] && ch[n].state === 'on').map(n => 'ABCD'[n - 1]);
    return lit.length ? T('{id} · coils {w} on', { id: p.id, w: lit.join('+') }) : p.id;
  },
  // a jumper wire's housing sits over the pin, a little above the header's plastic
  legAt: (p, origin, i) => frame(p, origin).W(legX(i), HY, ZT + PLASTIC + 1.5),
  // the stepper's plug, pushed into the socket from above: one point per socket pin
  socketAt: (p, origin) => { const { W } = frame(p, origin); return [0, 1, 2, 3, 4].map(i => W(SOCK.x + (i - 2) * 2.5, SOCK.y, ZT + SOCK.h - 2.5)); },
  draw(ctx){
    const p = ctx.p, st = ctx.st || {}, k = ctx.k != null ? ctx.k : st.xr || 0, o = ctx.origin || [0, 0, 0];
    const { ax, ay, W } = frame(p, o), items = [], put = (pts, svg) => items.push({ box: B.aabb(pts), svg });
    // which outputs are on: the solver's channels, else the demo walking the full-step sequence
    const ch = ctx.m && ctx.m.ch, burnt = n => !!(ch && ch[n] && ch[n].state === 'burnt');
    let lit;
    if (ch) lit = [1, 2, 3, 4].map(n => !!(ch[n] && (ch[n].state === 'on' || ch[n].state === 'linear')));
    else if (p.demo === 'stepping' || !p.demo){ const ph = Math.floor((st.t || 0) * 4) % 4; lit = [0, 1, 2, 3].map(i => i === ph || i === (ph + 1) % 4); }
    else lit = [false, false, false, false];
    put([W(-HL - 1, -HD - 1, 0), W(HL + 1, HD + 1, .05)], castShadow([W(-HL, -HD, 0), W(HL, -HD, 0), W(HL, HD, 0), W(-HL, HD, 0), W(-HL, -HD, ZT + 7), W(HL, HD, ZT + 7)], o[2]));
    // the board on its solder stubs, four mounting holes
    let pcb = B.slabW(W, -HL, -HD, HL, HD, Z0, ZT, PCB, toneI, 1.1);
    for (const [x, y] of [[-14.6, 13.2], [14.6, 13.2], [-14.6, -9], [14.6, -9]]) pcb += shape(B.circ(x, y, 1.5, 14).map(([a, b]) => W(a, b, ZT + .02)), '#2b2825', .4);
    if (k < .5 && vis([0, 0, 1])){
      IN_X.forEach((x, i) => { pcb += B.flatText(W(x, HY + 3.4, ZT + .03), -ax[1], -ax[0], 'IN' + (i + 1), 1.5, B.M.silk, 700); });
      pcb += B.flatText(W(PWR_X[0], HY + 3.4, ZT + .03), -ax[1], -ax[0], '−', 2.2, B.M.silk, 800) + B.flatText(W(PWR_X[1], HY + 3.4, ZT + .03), -ax[1], -ax[0], '+', 2.2, B.M.silk, 800)
        + B.flatText(W(4.7, HY + 5.6, ZT + .03), -ax[1], -ax[0], '5-12V', 1.5, B.M.silk, 700)
        + B.flatText(W(12.9, HY + 3.4, ZT + .03), -ax[1], -ax[0], 'ON/OFF', 1.3, B.M.silk, 700);
      LEDS.forEach((y, i) => { pcb += B.flatText(W(9.6, y - .5, ZT + .03), -ax[1], -ax[0], 'ABCD'[i], 1.8, B.M.silk, 800); });
    }
    put([W(-HL, -HD, Z0), W(HL, HD, ZT)], pcb);
    // see-through: the copper from each input to the chip, and from the chip's output to its LED and the socket
    if (k > .02){
      let cu = '';
      [0, 1, 2, 3].forEach(i => {
        const col = lit[i] ? '#e2483d' : B.M.copper.m, w = lit[i] ? 1.4 : .9;
        cu += `<path d="${pd([W(IN_X[i], HY + 1, ZT + .04), W(IN_X[i], -6, ZT + .04), W(-13 + i * 2.54, -4.2, ZT + .04)], false)}" stroke="${col}" stroke-width="${f(w)}" fill="none" opacity="${f(k)}"/>`;
        cu += `<path d="${pd([W(-13 + i * 2.54, 2.6, ZT + .04), W(-8 + i * 2.5, 9, ZT + .04), W(SOCK.x + (i - 2) * 2.5, SOCK.y - 2, ZT + .04)], false)}" stroke="${col}" stroke-width="${f(w)}" fill="none" opacity="${f(k)}"/>`;
      });
      put([W(-HL, -HD, ZT), W(HL, HD, ZT + .1)], cu);
    }
    // the ULN2003APG: 19.3 x 6.4 mm, its long side along x, eight legs a side bent down to the board
    const cx = -4.4, cy = -.8, chipZ = ZT + .5;
    let chip = '';
    for (let i = 0; i < 8; i++) for (const sd of [-1, 1]){ const x = cx - 8.9 + i * HP, y = cy + sd * 3.2;
      chip += B.slabW(W, x - .3, y - (sd < 0 ? 1.2 : 0), x + .3, y + (sd > 0 ? 1.2 : 0), ZT, chipZ + 1.2, B.M.tin, toneI, .3); }
    let body = B.slabW(W, cx - 9.65, cy - 3.2, cx + 9.65, cy + 3.2, chipZ, chipZ + 3.3, B.M.black, toneI, 1);
    if (vis([0, 0, 1])) body += shape(B.circ(cx - 8.2, cy, .8, 12).map(([a, b]) => W(a, b, chipZ + 3.32)), '#2b2825', .3)
      + (k < .5 ? B.flatText(W(cx, cy - .5, chipZ + 3.33), -ax[1], -ax[0], 'ULN2003APG', 1.6, '#bdb8ae', 700) : '');
    if (k > .02){
      // inside: the die and four lit channels
      let die = shape([W(cx - 2.5, cy - 1.8, chipZ + 1.6), W(cx + 2.5, cy - 1.8, chipZ + 1.6), W(cx + 2.5, cy + 1.8, chipZ + 1.6), W(cx - 2.5, cy + 1.8, chipZ + 1.6)], '#9aa4ad', .5);
      for (let i = 0; i < 4; i++) die += shape([W(cx - 2.2 + i * 1.2, cy - 1.4, chipZ + 1.62), W(cx - 1.4 + i * 1.2, cy - 1.4, chipZ + 1.62), W(cx - 1.4 + i * 1.2, cy + 1.4, chipZ + 1.62), W(cx - 2.2 + i * 1.2, cy + 1.4, chipZ + 1.62)], lit[i] ? '#ffb36b' : '#6e7880', .3);
      body = `<g opacity="${f(1 - .7 * k)}">${body}</g><g opacity="${f(k)}">${die}</g>`;
    }
    put([W(cx - 10.2, cy - 4.4, ZT), W(cx + 10.2, cy + 4.4, chipZ + 3.4)], chip + body);
    // LEDs A-D: 3 mm red domes, lit with their coil
    LEDS.forEach((y, i) => {
      const glow = lit[i] && !burnt(i + 1), m = glow ? LED_ON : LED_OFF, [lx, ly] = W(12.6, y, 0);
      let s = cyl(lx, ly, o[2] + ZT, o[2] + ZT + 3.2, 1.5, m, toneI, .6, 14) + cyl(lx, ly, o[2] + ZT + 3.2, o[2] + ZT + 4.2, 1.1, m, toneI, .5, 12);
      if (glow){ const [X, Y] = P(...W(12.6, y, ZT + 4)); s = `<circle cx="${f(X)}" cy="${f(Y)}" r="5" fill="#ff7a4d" opacity=".35"/>` + s; }
      put([W(11, y - 1.6, ZT), W(14.2, y + 1.6, ZT + 4.3)], s);
    });
    // the front header: IN1-IN4, then - +, then the jumper with its black cap
    const header = (xs, cap) => {
      const x0 = xs[0] - 1.27, x1 = xs[xs.length - 1] + 1.27;
      let s = B.slabW(W, x0, HY - 1.27, x1, HY + 1.27, ZT, ZT + PLASTIC, B.M.black, toneI, .7);
      for (const x of xs) s += B.slabW(W, x - .32, HY - .32, x + .32, HY + .32, ZT + PLASTIC, ZT + PLASTIC + PIN, B.M.gold, toneI, .35);
      if (cap) s += B.slabW(W, x0, HY - 1.3, x1, HY + 1.3, ZT + PLASTIC + 1, ZT + PLASTIC + 6.5, B.M.blackPl, toneI, .8);
      put([W(x0, HY - 1.3, ZT), W(x1, HY + 1.3, ZT + PLASTIC + PIN)], s);
    };
    header(IN_X); header(PWR_X); header(JMP_X, true);
    // the motor socket: a white 5-pin JST-XH, open on top
    let sk = B.slabW(W, SOCK.x - SOCK.w / 2, SOCK.y - SOCK.d / 2, SOCK.x + SOCK.w / 2, SOCK.y + SOCK.d / 2, ZT, ZT + SOCK.h, XH, toneI, .9);
    if (vis([0, 0, 1])) for (let i = 0; i < 5; i++) sk += shape([[-.9, -1.4], [.9, -1.4], [.9, 1.4], [-.9, 1.4]].map(([a, b]) => W(SOCK.x + (i - 2) * 2.5 + a, SOCK.y + b, ZT + SOCK.h + .02)), '#3a3633', .3);
    put([W(SOCK.x - SOCK.w / 2, SOCK.y - SOCK.d / 2, ZT), W(SOCK.x + SOCK.w / 2, SOCK.y + SOCK.d / 2, ZT + SOCK.h)], sk);
    if (k > .5 && callouts(ctx)){
      ctx.label(W(cx, cy, chipZ + 3.3), 'ULN2003: Darlington switches', lit.some(Boolean));
      ctx.label(W(IN_X[1], HY, ZT + PLASTIC), 'IN1-IN4 from the board');
      ctx.label(W(12.6, LEDS[1], ZT + 4), 'LED on = coil on', lit.some(Boolean));
      ctx.label(W(SOCK.x, SOCK.y, ZT + SOCK.h), 'Motor socket, red = +');
    }
    for (const it of items) ctx.put(it.box, it.svg);
  },
});
})();

</script>
<script>/* figures/parts/fsr402.js */
// @cf title Force sensor (FSR 402)
// @cf use engine/bench.list
/* Interlink FSR 402 force-sensing resistor: a round polymer-film sensor 18.3 mm across with a 12.7 mm active area,
   about 0.45 mm thick, on a flat tail that ends in two male crimp pins on 2.54 mm pitch (about 56 mm long overall),
   standing up out of two neighbouring holes. Non-polar. Unloaded it is an open circuit (over 10 MOhm); from about
   0.2 N it conducts, and the resistance falls with force along the Adafruit table (5 V, 10 kOhm pull-down): 0.2 N
   30 kOhm, 1 N 6 kOhm, 10 N 1 kOhm, 100 N 250 Ohm, interpolated in log R against log F. Its rated range is about
   0.2-20 N; it tells "how hard", not a weight (part-to-part spread is large). With the FSR from 5 V to A0 and
   10 kOhm from A0 to GND: 1 N reads about 3.1 V, 10 N about 4.5 V. Without the pull-down A0 floats while nobody
   presses. See-through: the layers spread apart, the top film with its interdigitated silver fingers, the spacer
   ring with its air vent along the tail, and the bottom film with the force-sensing ink; under force the films
   touch over a growing area. */
(() => {
const B = SL.bench, T = B.T;
const DEF = { force: 0, fault: 'none' };
// soldering the tabs melts the film and breaks the traces: open for good (use the crimp pins)
const melted = p => p.fault === 'tabs melted';
const TABLE = [[.2, 30000], [1, 6000], [10, 1000], [100, 250]], OPEN = 1e7, FMIN = .2;
const FILM = { l: '#e8d7a8', m: '#d4bf86', d: '#a68f55' }, INKC = '#3a3632', SILV = '#c9cfd1';
const HEAD = 9.15, ACT = 6.35, TAILW = 7.6, H_PIN = 2.6, H_TAIL = 47.4;

const frame = (legs, i0, i1) => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[i1][0] - legs[i0][0], dy = legs[i1][1] - legs[i0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W, v: [-uy, ux, 0],
    loc: q => { const x = q[0] - o[0], y = q[1] - o[1]; return [x * ux + y * uy, -x * uy + y * ux]; },
    slab: (a0, b0, a1, b1, z0, z1, m, w = .6) => B.slabW(W, a0, b0, a1, b1, z0, z1, m, toneI, w),
    bx: (a0, b0, z0, a1, b1, z1) => B.aabb([W(a0, b0, z0), W(a1, b1, z1), W(a0, b1, z0), W(a1, b0, z1)]) };
};
const xrK = ctx => ctx.k != null ? ctx.k : ease(Math.min(1, Math.max(0, (ctx.st && ctx.st.xr) || 0)));
const forceOf = p => Math.max(0, Math.min(100, +p.force || 0));
// log-log interpolation through the table; open below the actuation force
const ohmsAt = F => {
  if (F < FMIN) return OPEN;
  for (let i = 1; i < TABLE.length; i++){ const [f0, r0] = TABLE[i - 1], [f1, r1] = TABLE[i];
    if (F <= f1){ const t = Math.log(F / f0) / Math.log(f1 / f0); return Math.exp(Math.log(r0) + t * Math.log(r1 / r0)); } }
  return TABLE[TABLE.length - 1][1];
};
const nText = F => F >= 10 ? String(Math.round(F)) : String(+F.toFixed(1));
// a disc in the film's vertical plane (normal along b) at height zc
const disc = (F, b, zc, r, n = 28) => Array.from({ length: n }, (_, i) => { const t = i / n * 2 * Math.PI; return F.W(r * Math.cos(t), b, zc + r * Math.sin(t)); });

B.part('fsr402', {
  name: 'Force sensor (FSR 402)', fig: 'P9',
  legs: ['1', '2'],
  span: [1, 1],
  params: { force: [0, 100], fault: ['none', 'tabs melted'] },
  steps: { force: [0, .2, 1, 5, 10, 20, 100] },
  paramNames: { force: 'Force (N)', fault: 'Break it' },
  defaults: DEF,
  elec: p => { const q = Object.assign({}, DEF, p), F = forceOf(q); return melted(q) ? { type: 'res', ohms: OPEN, open: true } : { type: 'res', ohms: ohmsAt(F), open: F < FMIN }; },
  ohmsAt,
  // a press is a firm fingertip, about 10 N (1 kg); letting go takes the force off
  press: (p, down) => ({ force: down ? 10 : 0 }),
  tag: (p, m) => { const q = Object.assign({}, DEF, p), F = forceOf(q);
    if (melted(q)) return T('{id} · tabs melted: open circuit', { id: p.id });
    return F < FMIN ? T('{id} · no force · open', { id: p.id }) : T('{id} · {n} N · {r}', { id: p.id, n: nText(F), r: B.ohmsText(Math.round(ohmsAt(F))) }); },
  draw(ctx){
    const p = Object.assign({}, DEF, ctx.p), legs = ctx.legs, k = xrK(ctx), Fz = forceOf(p);
    const F = frame(legs, 0, legs.length - 1), zc = H_PIN + H_TAIL - HEAD, front = vis(F.v);
    // how hard the finger pushes (0..1, log scale), and how much of that the film conducts (none once the tabs melted)
    const push = Fz < FMIN ? 0 : Math.min(1, Math.log10(Fz / FMIN) / Math.log10(100 / FMIN)), press = melted(p) ? 0 : push;
    let s = '';
    // crimp pins in the holes and the black clincher housings that grip the tail
    for (const L of legs){ const [a, b] = F.loc(L);
      s += rod(F.W(a, b, -.3), F.W(a, b, H_PIN), .3, B.M.tin, toneI, .4); }
    s += F.slab(-2.6, -.9, 2.6, .9, H_PIN - .6, H_PIN + 2.6, B.M.black, .55);
    // melted tabs: the film has shrunk and browned where the iron touched it, and the traces are broken there
    const burntFilm = melted(p) ? (() => { const [X, Y] = P(...F.W(0, 0, H_PIN + 4.2));
      return `<ellipse cx="${f(X)}" cy="${f(Y)}" rx="4.6" ry="2.6" fill="#6b4a2a" stroke="${INK}" stroke-width=".5" opacity=".9"/>`; })() : '';
    // the film: tail then head, both in the vertical plane through the pins; the layers part in see-through
    const gap = .9 * k, layers = [[-gap, FILM, 'bottom'], [0, FILM, 'spacer'], [gap, FILM, 'top']];
    const tailPts = b => [F.W(-TAILW / 2, b, H_PIN + 2.6), F.W(TAILW / 2, b, H_PIN + 2.6), F.W(TAILW / 2, b, zc - HEAD + 2), F.W(-TAILW / 2, b, zc - HEAD + 2)];
    const order = front ? layers : layers.slice().reverse();
    for (const [b, mat, name] of order){
      if (k < .05 && name !== 'top') continue;
      const op = k < .05 ? 1 : name === 'spacer' ? .85 : .9;
      let x = `<path d="${pd(tailPts(b))}" fill="${mat.m}" stroke="${INK}" stroke-width=".5" opacity="${f(op)}"/>`;
      x += `<path d="${pd(disc(F, b, zc, HEAD))}" fill="${mat.l}" stroke="${INK}" stroke-width=".6" opacity="${f(op)}"/>`;
      if (name === 'top' || k < .05){
        // the silver traces down the tail and the interdigitated fingers on the active area
        x += `<path d="${pd([F.W(-1.27, b, H_PIN + 2.6), F.W(-1.27, b, zc - ACT)], false)}M${pd([F.W(1.27, b, H_PIN + 2.6), F.W(1.27, b, zc - ACT)], false).slice(1)}" stroke="${SILV}" stroke-width="1" fill="none"/>`;
        x += `<path d="${pd(disc(F, b, zc, ACT))}" fill="${mix('#4a4642', '#1d1b19', press)}" stroke="${INK}" stroke-width=".4"/>`;
        let fing = '';
        for (let i = -4; i <= 4; i++){ const zz = zc + i * 1.35, w = Math.sqrt(Math.max(0, ACT * ACT - (i * 1.35) * (i * 1.35))) - .5;
          if (w > .4) fing += (fing ? 'M' : '') + pd([F.W(i % 2 ? -w : -w + 1, b, zz), F.W(i % 2 ? w - 1 : w, b, zz)], false).slice(fing ? 1 : 0); }
        x += `<path d="${fing}" stroke="${SILV}" stroke-width=".55" fill="none" opacity=".85"/>`;
      }
      if (name === 'spacer' && k >= .05){
        // the spacer is a ring: cut the active area out, and show the vent channel down the tail
        x += `<path d="${pd(disc(F, b, zc, ACT + .4))}" fill="#f2efe7" stroke="${INK}" stroke-width=".4" opacity=".9"/>`
          + `<path d="${pd([F.W(0, b, zc - ACT - .4), F.W(0, b, H_PIN + 3)], false)}" stroke="#f2efe7" stroke-width="1.1" fill="none"/>`;
      }
      if (name === 'bottom' && k >= .05){
        x += `<path d="${pd(disc(F, b, zc, ACT - .3))}" fill="#26231f" opacity=".9"/>`;
        // contact patches: the area where the films touch grows with force
        if (press > 0) x += `<path d="${pd(disc(F, b + (front ? .01 : -.01), zc, .6 + (ACT - 1) * press))}" fill="#f4b829" opacity=".55"/>`;
      }
      s += x;
    }
    s += burntFilm;
    // the fingertip pressing on the head
    if (push > 0 && k < .5){
      const tip = F.W(0, (front ? 1 : -1) * (1.6 - .7 * push), zc), [X, Y] = P(...tip);
      s += `<ellipse cx="${f(X)}" cy="${f(Y)}" rx="${f(4.2 + 1.2 * push)}" ry="${f(3.2 + 1 * push)}" fill="#e9b99a" stroke="${INK}" stroke-width=".7" opacity=".92"/>`
        + `<ellipse cx="${f(X - 1)}" cy="${f(Y - 1)}" rx="1.8" ry="1.1" fill="#f6dcc8" opacity=".9"/>`;
    }
    if ((ctx.solo || (B.md && B.md.def && B.md.def.partPage)) && k > .5){
      ctx.label(F.W(3, gap, zc + 3), 'Silver fingers');
      ctx.label(F.W(ACT + 1.2, 0, zc - 2), 'Spacer, air vent');
      ctx.label(F.W(-2, -gap, zc - 2), 'Force-sensing ink');
    }
    ctx.put(F.bx(-HEAD - .3, -1.4, -.3, HEAD + .3, 1.4, zc + HEAD + .3), s);
  },
  show: { breadboard: 'mini', holes: ['e8', 'e9'], params: { force: 1 } },
});
})();

</script>
<script>/* figures/parts/hc-sr04.js */
// @cf title Ultrasonic distance sensor (HC-SR04)
// @cf use engine/bench.list
/* HC-SR04 module: a blue 45 x 20 mm board, 1.6 mm thick, standing on its 4-pin header (2.54 mm, centred on the
   bottom edge) with the two 16 mm transducers facing out of the front, 26 mm apart: T (transmit) on the left and
   R (receive) on the right as seen from the front, with the 12 MHz crystal between them. Legs ['VCC','TRIG','ECHO',
   'GND'] left to right from the front. 5 V, 15 mA. A 10 us HIGH on TRIG sends eight 40 kHz cycles; ECHO then stays
   HIGH for the round trip (58 us per cm, 2 cm to about 4 m, 38 ms when nothing echoes). The sensor's behaviour
   runs in the interpreter (the lesson's hc-sr04 world device); this drawing shows the module and, while the
   sketch runs, the 40 kHz bursts leaving T. */
(() => {
const B = SL.bench;
const PCB = { l: '#3b78c9', m: '#2c62a8', d: '#1c4277' }, CAN = { l: '#e9ebec', m: '#c3c7ca', d: '#8d9397' };
const MESH = '#3a3f44', W0 = 22.5, Z0 = 2.5, Z1 = 22.5, ZC = 12.5, RC = 8, DEPTH = 12;

const frame = legs => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[n - 1][0] - legs[0][0], dy = legs[n - 1][1] - legs[0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W, u: [ux, uy, 0], v: [-uy, ux, 0] };
};

B.part('hc-sr04', {
  name: 'Ultrasonic distance sensor (HC-SR04)', fig: 'P17',
  legs: ['VCC', 'TRIG', 'ECHO', 'GND'],
  span: [3, 3],
  show: { breadboard: 'mini', holes: ['a5', 'a6', 'a7', 'a8'] },
  tag: p => p.id,
  draw(ctx){
    const legs = ctx.legs, st = ctx.st || {}, F = frame(legs), W = F.W;
    const k = ctx.k != null ? ctx.k : ease(Math.min(1, Math.max(0, st.xr || 0)));
    const running = !!(st.ev && st.ev.status === 'running');
    let s = '';
    // header: the black plastic strip on the breadboard and the four pins through it into the board
    s += B.slabW(W, -5.1, -1.25, 5.1, 1.25, 0, Z0, B.M.black, toneI, .6);
    for (const L of legs) s += rod(L, [L[0], L[1], L[2] + Z0 + 1], .32, B.M.tin, toneI, .3);
    // the board, its silk and the crystal
    s += B.slabW(W, -W0, -.8, W0, .8, Z0, Z1, PCB, toneI, .8);
    s += B.slabW(W, -2.6, .8, 2.6, 2.6, ZC - 1.8, ZC + 1.8, B.M.steel, toneI, .5);
    const U = Dv(...F.u), V = Dv(0, 0, -1);
    if (vis(F.v)){
      s += `<text transform="${txM(P(...W(0, .82, Z1 - 2.2)), U, V)}" font-size="1.7" fill="#f2f4f6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">HC-SR04</text>`;
      ['VCC', 'Trig', 'Echo', 'Gnd'].forEach((t, i) => { s += `<text transform="${txM(P(...W((i - 1.5) * 2.54, .82, Z0 + 1.1)), U, V)}" font-size=".9" fill="#f2f4f6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">${t}</text>`; });
    }
    ctx.put(B.aabb([W(-W0, -1.3, 0), W(W0, 2.6, Z1)]), s);
    // the two transducers: aluminium cans with a dark mesh face
    for (const [a, name] of [[-13, 'T'], [13, 'R']]){
      const c0 = W(a, .8, ZC), c1 = W(a, .8 + DEPTH, ZC);
      let t = rod(c0, c1, RC, CAN, toneI, .8, RC, 24);
      if (vis(F.v)){
        const ring = rr => Array.from({ length: 24 }, (_, i) => { const q = i / 24 * 2 * Math.PI; return W(a + rr * Math.cos(q), .8 + DEPTH + .02, ZC + rr * Math.sin(q)); });
        t += shape(ring(RC - 1.2), MESH, .4);
        t += `<text transform="${txM(P(...W(a, .8 + DEPTH + .05, ZC - .7)), U, V)}" font-size="2.2" fill="#d9dde0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${name}</text>`;
      }
      ctx.put(B.aabb([W(a - RC, .8, ZC - RC), W(a + RC, .8 + DEPTH, ZC + RC)]), t);
    }
    // while the sketch runs, rings of sound leave T and spread out in front
    if (running && k < .5){
      const t = st.t || 0; let w = '';
      for (let i = 0; i < 3; i++){
        const ph = (t * 1.4 + i / 3) % 1, r = RC + 2 + ph * 14, y = .8 + DEPTH + 2 + ph * 22;
        const pts = Array.from({ length: 13 }, (_, j) => { const q = (j / 12 - .5) * Math.PI * .8; return W(-13 + r * .45 * Math.sin(q), y, ZC + r * .55 * Math.cos(q)); });
        w += `<path d="${pd(pts, false)}" fill="none" stroke="#3e86d9" stroke-width=".8" opacity="${f(.7 * (1 - ph))}"/>`;
      }
      ctx.put(B.aabb([W(-28, DEPTH, ZC - 12), W(2, DEPTH + 40, ZC + 12)]), w);
    }
  },
});
})();

</script>
<script>/* figures/parts/ssd1306.js */
// @cf title OLED display 128 x 64 (SSD1306, I2C)
// @cf use engine/bench.list
/* The common 0.96 inch I2C OLED module: a 27.3 x 27.8 mm board with an SSD1306 driver under a 26.7 x 19.3 mm glass
   panel (21.7 x 10.9 mm active area, 128 x 64 pixels), held on a 4-pin header along one edge. Legs ['GND','VCC',
   'SCL','SDA'] as printed on most of these boards (some swap GND and VCC: read the silk). 3.3-5 V, about 20 mA
   with half the pixels lit; I2C address 0x3C (0x3D with the jumper moved). On a breadboard it sits flat on its
   header, the board and glass reaching forward over the rows in front of the pins.
   The page does not run the SSD1306 driver: the glass shows dark, and glows faintly while the sketch runs and
   the module has power. */
(() => {
const B = SL.bench, T = B.T;
const PCB = { l: '#2a5fa8', m: '#204c88', d: '#14325c' }, GLASS = { l: '#2a2f36', m: '#1d2127', d: '#0f1215' };
const Z0 = 2.5, ZP = 4.1, ZG = 5.5;

const frame = legs => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[n - 1][0] - legs[0][0], dy = legs[n - 1][1] - legs[0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W, u: [ux, uy, 0], v: [-uy, ux, 0] };
};

B.part('ssd1306', {
  name: 'OLED display (SSD1306)', fig: 'P28',
  legs: ['GND', 'VCC', 'SCL', 'SDA'],
  span: [3, 3],
  show: { breadboard: 'mini', holes: ['a5', 'a6', 'a7', 'a8'] },
  tag: p => T('{id} · 0x3C', { id: p.id }),
  draw(ctx){
    const legs = ctx.legs, st = ctx.st || {}, F = frame(legs), W = F.W;
    const running = !!(st.ev && st.ev.status === 'running');
    let s = '';
    s += B.slabW(W, -5.1, -1.25, 5.1, 1.25, 0, Z0, B.M.black, toneI, .6);
    for (const L of legs) s += rod(L, [L[0], L[1], L[2] + ZP + .8], .32, B.M.tin, toneI, .3);
    // the board reaches forward (-b) from the header row, the glass on top of it
    s += B.slabW(W, -13.65, -26.4, 13.65, 1.4, Z0, ZP, PCB, toneI, .7);
    s += B.slabW(W, -13.35, -24.6, 13.35, -5.3, ZP, ZG, GLASS, toneI, .5);
    const area = [[-10.85, -9.4], [10.85, -9.4], [10.85, -20.3], [-10.85, -20.3]].map(([a, b]) => W(a, b, ZG + .02));
    s += fill(pd(area), running ? '#0f2d4a' : '#08090b');
    if (running) s += `<path d="${pd(area)}" fill="none" stroke="#5fb4ff" stroke-width=".5" opacity=".6"/>`;
    // silk over the pins, readable from the front
    const U = Dv(...F.u), V = Dv(-F.v[0], -F.v[1], 0);
    ['GND', 'VCC', 'SCL', 'SDA'].forEach((t, i) => {
      s += `<text transform="${txM(P(...W((i - 1.5) * 2.54, -1.6, ZP + .02)), U, V)}" font-size=".85" fill="#f2f4f6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">${t}</text>`;
    });
    ctx.put(B.aabb([W(-13.65, -26.4, 0), W(13.65, 1.4, ZG)]), s);

</script>
<script>/* figures/parts/traffic-light.js */
// @cf title Traffic light LED module
// @cf use engine/bench.list
/* The kit traffic-light module: a black 14 x 30 mm board standing on a 4-pin header (2.54 mm) with three 5 mm
   LEDs, red at the top, yellow, green at the bottom, each with its own series resistor on the board, so its pins
   go straight to Arduino outputs. Legs ['GND','R','Y','G'] left to right from the front. Each LED takes about 10 mA
   from a 5 V pin through its on-board resistor.
   The module has no solver model: each LED lights from the pin its leg is wired to while the sketch runs (a wire
   from a board pin into the same breadboard strip as the leg). */
(() => {
const B = SL.bench;
const PCB = { l: '#3a3836', m: '#2b2927', d: '#191817' };
const LEDS = [['R', '#e2483d', 27], ['Y', '#f2c230', 19.5], ['G', '#43b05c', 12]];
const Z0 = 2.5, Z1 = 32;

const frame = legs => {
  const n = legs.length, o = [0, 1, 2].map(k => legs.reduce((s, q) => s + q[k], 0) / n);
  const dx = legs[n - 1][0] - legs[0][0], dy = legs[n - 1][1] - legs[0][1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const W = (a, b, z) => [o[0] + ux * a - uy * b, o[1] + uy * a + ux * b, o[2] + z];
  return { o, W, u: [ux, uy, 0], v: [-uy, ux, 0] };
};

// the board net wired into the same breadboard strip as leg i, if any
const netOf = (ctx, i) => {
  const h = ctx.holes && ctx.holes[i], pl = ctx.pl; if (!h || !pl) return null;
  for (const w of pl.c.wires || []) for (const [x, y] of [[w.from, w.to], [w.to, w.from]]){
    const hx = B.hole(pl.geo, x); if (!hx || hx.node !== h.node) continue;
    const pin = B.pinOf(y); if (pin) return pin.net;
  }
  return null;
};
const litOf = ctx => {
  const st = ctx.st || {}, run = !!(st.ev && st.ev.status === 'running'), pins = (st.o && st.o.pins) || {};
  return LEDS.map((_, i) => { const net = netOf(ctx, i + 1); return run && net != null && +pins[net] > .5; });
};

B.part('traffic-light', {
  name: 'Traffic light module', fig: 'P29',
  legs: ['GND', 'R', 'Y', 'G'],
  span: [3, 3],
  show: { breadboard: 'mini', holes: ['a5', 'a6', 'a7', 'a8'] },
  tag: p => p.id,
  draw(ctx){
    const legs = ctx.legs, F = frame(legs), W = F.W, lit = litOf(ctx);
    let s = '';
    s += B.slabW(W, -5.1, -1.25, 5.1, 1.25, 0, Z0, B.M.black, toneI, .6);
    for (const L of legs) s += rod(L, [L[0], L[1], L[2] + Z0 + 1], .32, B.M.tin, toneI, .3);
    s += B.slabW(W, -7, -.8, 7, .8, Z0, Z1, PCB, toneI, .8);
    const U = Dv(...F.u), V = Dv(0, 0, -1);
    if (vis(F.v)) ['GND', 'R', 'Y', 'G'].forEach((t, i) => {
      s += `<text transform="${txM(P(...W((i - 1.5) * 2.54, .82, Z0 + 1.1)), U, V)}" font-size=".9" fill="#f2f4f6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">${t}</text>`;
    });
    // the lenses stand out of the board's face: one item with the board, drawn after it when the face is toward the
    // viewer and before it otherwise, so the depth sort can't put the tall board over a lens
    let lenses = '';
    LEDS.forEach(([, col, z], i) => {
      const glow = lit[i], m = matOf(glow ? col : mix(col, '#2b2927', .55));
      lenses += rod(W(0, .8, z), W(0, 4.2, z), 2.5, m, toneI, .5, 2.5, 18);
      if (glow){ const [X, Y] = P(...W(0, 4.4, z)); lenses += `<circle cx="${f(X)}" cy="${f(Y)}" r="5.5" fill="${col}" opacity=".35"/>`; }
    });
    ctx.put(B.aabb([W(-7, -1.3, 0), W(7, 4.4, Z1)]), vis(F.v) ? s + lenses : lenses + s);
  },
});
})();

</script>
<script>/* figures/parts/soil-moisture.js */
// @cf title Capacitive soil moisture sensor (v1.2)
// @cf use engine/bench.list
/* Capacitive soil moisture sensor v1.2: a black 98 x 23 mm board, the electronics (a TLC555 at about 1.5 MHz and a
   regulator) at the top under a 3-pin JST-PH socket, the sensing pad running down the long tip, which is pushed
   into the soil as far as the white line. No bare metal touches the soil, so it does not corrode. Legs ['AOUT',
   'VCC','GND'] in the board's silk order: the three header pins its cable plugs onto. 3.3-5.5 V, 5 mA. AOUT is
   about 2.5 V in dry air and about 1.3 V in water: wetter reads lower.
   With `at` (board mm), the sensor stands in a plant pot there and a three-wire cable runs to the holes. The
   `moisture` param (0-100 %) only darkens the soil; the reading itself comes from the lesson's world input. */
(() => {
const B = SL.bench, T = B.T;
const PCB = { l: '#3a3836', m: '#2b2927', d: '#191817' }, POT = { l: '#c96f45', m: '#a85a36', d: '#7a3f24' };
const DEF = { moisture: 40 };
const COLS = ['#f2c230', '#e2483d', '#34302c'];          // AOUT yellow, VCC red, GND black
const RP = 11, HP = 16, ABOVE = 34;                        // pot radius and height; board standing above the soil

B.part('soil-moisture', {
  name: 'Soil moisture sensor (capacitive)', fig: 'P27',
  legs: ['AOUT', 'VCC', 'GND'],
  span: [2, 2],
  params: { moisture: [0, 100] },
  paramNames: { moisture: 'Soil moisture (%)' },
  defaults: DEF,
  show: { breadboard: 'mini', parts: [{ id: 'S1', part: 'soil-moisture', at: [30, 12], holes: ['a5', 'a6', 'a7'] }], wires: [] },
  tag: p => T('{id} · {n} %', { id: p.id, n: Math.round(+(p.moisture != null ? p.moisture : DEF.moisture)) }),
  draw(ctx){
    const p = Object.assign({}, DEF, ctx.p), legs = ctx.legs || [], o = ctx.origin || legs[0] || [0, 0, 0];
    const W = (x, y, z) => [o[0] + x, o[1] + y, o[2] + z];
    const wet = Math.max(0, Math.min(100, +p.moisture || 0)) / 100;
    // the pot and its soil
    let pot = cyl(o[0], o[1], o[2], o[2] + HP, RP, POT, toneI, 1.1, 24);
    pot += shape(Array.from({ length: 24 }, (_, i) => { const q = i / 24 * 2 * Math.PI; return W((RP - 1) * Math.cos(q), (RP - 1) * Math.sin(q), HP - .6); }), mix('#8a6a48', '#3b2a1c', wet), .5);
    ctx.put(B.aabb([W(-RP, -RP, 0), W(RP, RP, HP)]), pot);
    // the board standing out of the soil, its white line at the surface, the socket on top
    const z0 = HP - .6, z1 = z0 + ABOVE;
    let s = B.slabW(W, -11.5, -.8, 11.5, .8, z0, z1, PCB, toneI, .8);
    s += B.slabW(W, -11.5, -.82, 11.5, -.8, z0 + 1, z0 + 1.8, matOf('#ece6d6'), toneI, 0);
    s += B.slabW(W, -4, -2.8, 4, .8, z1 - 5, z1 - 1, matOf('#ece6d6'), toneI, .5);
    s += B.slabW(W, -3.5, -2.2, 0, -.8, z1 - 12, z1 - 8, B.M.black, toneI, .4);
    ctx.put(B.aabb([W(-11.5, -2.8, z0), W(11.5, .8, z1)]), s);
    // the cable from the socket to the header pins in the holes
    if (legs.length === 3) COLS.forEach((col, i) => {
      const a = W((i - 1) * 2, -2, z1 - 3), e = legs[i], e2 = [e[0], e[1], e[2] + 9], pts = [];
      for (let j = 0; j <= 10; j++){ const t = j / 10, sn = Math.sin(t * Math.PI); pts.push([a[0] + (e2[0] - a[0]) * t, a[1] + (e2[1] - a[1]) * t, a[2] + (e2[2] - a[2]) * t + sn * 8]); }
      for (let j = 0; j < pts.length - 1; j++) ctx.put(B.aabb([pts[j], pts[j + 1]]).map((v, h) => v.map(c => c + (h ? .5 : -.5))), rod(pts[j], pts[j + 1], .45, matOf(col), toneI, .4));
      ctx.put(B.aabb([[e[0] - 1.3, e[1] - 1.3, e[2]], [e[0] + 1.3, e[1] + 1.3, e[2] + 9.5]]), B.slabW((x, y, z) => [e[0] + x, e[1] + y, e[2] + z], -1.25, -1.25, 1.25, 1.25, 1.5, 9.5, B.M.black, toneI, .5) + rod(e, [e[0], e[1], e[2] + 1.5], .32, B.M.gold, toneI, .3));
    });
  },
});
})();

</script>
<script>/* figures/engine/bench-props.js */
/* Lesson props: the scenery a lesson's world inputs name (FIGURES-BENCH §9.1). A circuit lists them as
   props: [{ id, prop, at: [x, y] board mm, aim?: part or prop id, rot?, ...params }]; each stands on the mat at `at`,
   turned to face its `aim`. They are not in the circuit: the solver never sees them. A host param `value` moves the
   world quantity the prop stands for (lux for the lamp, cm for the obstacle, °C for the dryer); without it the prop
   shows its everyday state. The UNO R3 lessons use every one:
     desk-lamp      a small anglepoise whose shade points at its aim (the LDR); value = lux, 0 is off
     hairdryer      standing on its handle, nozzle at its aim (the TMP36); value = °C at the sensor, warm air above 30
     obstacle       kind 'car' | 'box' | 'ball' | 'wall' in front of its aim (the HC-SR04); value = cm, moves it
     watering-can   spout toward its aim (the soil sensor's pot)
     strength-meter a card dial on its aim servo's case, the horn as the needle, a bell at full swing (180°)
     weights        50, 100, 200 and 500 g brass weights on cork coasters beside the FSR
   The stepper's prize wheel is the stepper part's own `wheel: 'wheel'` param, and the plant pot is the soil
   sensor's own pot (soil-moisture with `at`): neither is a prop. */
(() => {
const B = SL.bench;
const LAMP = matOf('#e2483d'), STEEL = B.M.steel, DRYER = matOf('#4fb8ad'), NOZZLE = matOf('#4a4642'), CARD = B.M.tan;
const RED = matOf('#d9483b'), GLASS = matOf('#9cc6e8'), TYRE = matOf('#2f2c29'), BALL = matOf('#e2483d'), BRICK = matOf('#b65a3c');
const CAN = matOf('#43b05c'), BRASS = B.M.gold, CORK = matOf('#c9a46e');
const clamp = B.clamp;

// the prop's own frame: x toward its aim (or along rot), y to its left, z up from the mat
const frame = ctx => {
  const o = ctx.origin, a = ctx.aim;
  let ax = null;
  if (a){ const dx = a[0] - o[0], dy = a[1] - o[1], L = Math.hypot(dx, dy); if (L > 1) ax = [dx / L, dy / L, 0]; }
  if (!ax){ const r = (+ctx.p.rot || 0) * Math.PI / 180; ax = [Math.cos(r), Math.sin(r), 0]; }
  const ay = [-ax[1], ax[0], 0];
  const W = (x, y, z) => [o[0] + ax[0] * x + ay[0] * y, o[1] + ax[1] * x + ay[1] * y, o[2] + z];
  return { W, o, ax, ay, dist: a ? Math.hypot(a[0] - o[0], a[1] - o[1]) : 40, aimZ: a ? a[2] - o[2] : 10 };
};
const ringW = (W, x, y, z, r, n = 24) => Array.from({ length: n }, (_, i) => { const q = i / n * 2 * Math.PI; return W(x + r * Math.cos(q), y + r * Math.sin(q), z); });
// a ring of radius r round centre c, square to the unit axis u
const ringAbout = (c, u, r, n = 20) => {
  const s = norm(cross(u, Math.abs(u[2]) < .9 ? [0, 0, 1] : [1, 0, 0])), t = cross(u, s);
  return Array.from({ length: n }, (_, i) => { const q = i / n * 2 * Math.PI, cq = Math.cos(q) * r, sq = Math.sin(q) * r;
    return [c[0] + s[0] * cq + t[0] * sq, c[1] + s[1] * cq + t[1] * sq, c[2] + s[2] * cq + t[2] * sq]; });
};
const along = (a, u, d) => [a[0] + u[0] * d, a[1] + u[1] * d, a[2] + u[2] * d];
const towards = (a, b) => norm(sub(b, a));
// a sphere: flat bands toward the light, an ink outline (orthographic, so its outline is a circle)
const ball = (c, r, m) => { const [X, Y] = P(...c), R = r * CAM_K;
  return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${m.d}"/><circle cx="${f(X - R * .12)}" cy="${f(Y - R * .14)}" r="${f(R * .84)}" fill="${m.m}"/>`
    + `<circle cx="${f(X - R * .3)}" cy="${f(Y - R * .34)}" r="${f(R * .42)}" fill="${m.l}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width="1.2"/>`; };
const shadow = (pts, o) => ({ box: B.aabb(pts.map(q => [q[0], q[1], o[2]])).map((v, i) => v.map(c => c + (i ? .05 : 0))), svg: castShadow(pts, o[2]) });
// see-through fades the scenery so the circuit shows
const fade = (k, svg) => k > .02 ? `<g opacity="${f(1 - .55 * k)}">${svg}</g>` : svg;
const out = (ctx, items) => { for (const it of items) if (it.svg) ctx.put(it.box, fade(ctx.k || 0, it.svg)); };
const val = (p, d) => typeof p.value === 'number' && Number.isFinite(p.value) ? p.value : d;

B.prop('desk-lamp', {
  name: 'Desk lamp', foot: [26, 26, 58], params: { value: [0, 100000] },
  draw(ctx){
    const { W, o, dist, aimZ } = frame(ctx), lux = val(ctx.p, 300), lit = lux > 0 ? clamp(Math.log10(1 + lux) / 3, .25, 1) : 0;
    const elbow = W(-5, 0, 36), head = W(clamp(dist - 22, 6, 30), 0, 50), target = W(dist, 0, aimZ);
    const u = towards(head, target), mouth = along(head, u, 13), items = [];
    items.push(shadow([...ringW(W, 0, 0, 0, 11), ...ringW(W, 0, 0, 3, 11)], o), shadow([...ringAbout(mouth, u, 8.5, 12), along(head, u, -2)], o));
    items.push({ box: B.aabb([W(-11, -11, 0), W(11, 11, 4)]), svg: cyl(...W(0, 0, 0).slice(0, 2), o[2], o[2] + 3, 11, LAMP, toneI, 1.2, 28)
      + B.slabW(W, 4, -2.2, 7.5, 2.2, 3, 4.6, B.M.blackPl, toneI, .6) });
    items.push({ box: B.aabb([W(-3, 0, 3), elbow]).map((v, i) => v.map(c => c + (i ? 2 : -2))), svg: rod(W(-2, 0, 3), elbow, 1.4, STEEL, toneI, .9) });
    items.push({ box: B.aabb([elbow, head]).map((v, i) => v.map(c => c + (i ? 2 : -2))), svg: rod(elbow, head, 1.4, STEEL, toneI, .9)
      + rod(W(-5, -2.8, 36), W(-5, 2.8, 36), 2.2, LAMP, toneI, .8) });
    // the shade: a cone opening toward the aim, the bulb glowing in its mouth while lit
    let shade = rod(along(head, u, -2), mouth, 3.2, LAMP, toneI, 1.1, 8.5, 22);
    if (vis(u)) shade += shape(ringAbout(mouth, u, 7.8, 22), lit ? mix('#fff3c4', '#ffd36a', 1 - lit) : '#5a5550', .6);
    items.push({ box: B.aabb([...ringAbout(mouth, u, 8.5, 8), along(head, u, -3)]), svg: shade });
    if (lit){
      // the light falling on the aim: a soft cone from the mouth to a spot round the target
      const spot = ringAbout(target, u, 10, 16), cone = hull([...ringAbout(mouth, u, 7.8, 16), ...spot].map(q => P(...q)));
      items.push({ box: B.aabb([mouth, target]), svg: fill(sp(cone), '#ffe08a', `opacity="${f(.12 + .2 * lit)}"`) });
    }
    out(ctx, items);
  },
});

B.prop('hairdryer', {
  name: 'Hair dryer', foot: [50, 24, 46], params: { value: [-40, 125] },
  draw(ctx){
    const { W, o, dist, aimZ } = frame(ctx), st = ctx.st || {}, t = val(ctx.p, 22), heat = clamp((t - 30) / 50, 0, 1), items = [];
    const hub = W(-8, 0, 33), u = towards(hub, W(dist, 0, aimZ)), back = along(hub, u, -15), front = along(hub, u, 14), tip = along(front, u, 13);
    items.push(shadow([...ringW(W, -10, 0, 0, 4.6), ...ringW(W, -8, 0, 26, 4.2)], o), shadow([...ringAbout(back, u, 10, 12), ...ringAbout(tip, u, 5.5, 12)], o));
    items.push({ box: B.aabb([W(-14, -6, 0), W(-2, 6, 28)]), svg: rod(W(-10, 0, 0), W(-8, 0, 26), 4.6, DRYER, toneI, 1.1, 4.2)
      + B.slabW(W, -8.2, -1.6, -5.8, 1.6, 14, 19, B.M.white, toneI, .6) });
    // the cord leaves the foot of the handle and trails off over the mat
    const cord = [W(-12, 0, .8), W(-20, 4, .8), W(-30, 2, .8), W(-38, 8, .8)];
    for (let i = 0; i < cord.length - 1; i++) items.push({ box: B.aabb([cord[i], cord[i + 1]]).map((v, j) => v.map(c => c + (j ? 1 : -1))), svg: rod(cord[i], cord[i + 1], .9, B.M.blackPl, toneI, .6) });
    let body = rod(back, front, 10, DRYER, toneI, 1.4, 10, 26);
    // the intake grille on the back, when the back faces the viewer
    if (!vis(u)) for (const r of [3, 6, 8.6]) body += `<path d="${pd(ringAbout(back, u, r, 22))}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".7"/>`;
    items.push({ box: B.aabb([...ringAbout(back, u, 10, 8), ...ringAbout(front, u, 10, 8)]), svg: body });
    items.push({ box: B.aabb([...ringAbout(front, u, 8.5, 8), ...ringAbout(tip, u, 5.5, 8)]), svg: rod(front, tip, 8.5, NOZZLE, toneI, 1.1, 5.5, 20) });
    if (heat > 0){
      // warm air: wavy streaks from the nozzle to the sensor, moving with the clock
      const ph = ((st.t || 0) * 1.6) % 1, to = W(dist, 0, aimZ), L = Math.hypot(...sub(to, tip));
      let s = '';
      for (const off of [-3.5, 0, 3.5]){
        const side = norm(cross(u, [0, 0, 1])), pts = Array.from({ length: 12 }, (_, i) => { const d = (i / 11) * L * .9;
          const w = Math.sin(i * 1.4 + ph * 6.28) * 1.6; return along(along(tip, u, d), side, off + w); });
        s += `<path d="${pd(pts, false)}" fill="none" stroke="${mix('#f08a2b', '#e2483d', heat)}" stroke-width="1.2" stroke-linecap="round" opacity="${f(.3 + .5 * heat)}"/>`;
      }
      items.push({ box: B.aabb([tip, to]), svg: s });
    }
    out(ctx, items);
  },
});

// the HC-SR04 sees 2-450 cm. On the mat the prop's own spot is 30 cm; nearer, it slides toward the sensor until it
// meets the breadboard's edge (ctx.breadboard, the sensor stands on it), and farther it goes out to TRAVEL times its
// distance, a mat the engine sizes for it (def.travel)
const TRAVEL = 1.8;
const obstacleShift = (ctx, F, half) => {
  const v = ctx.p.value; if (typeof v !== 'number' || !Number.isFinite(v) || !ctx.aim) return 0;
  // how far from the aim, back along the prop's axis, the breadboard ends
  let exit = 0;
  const bb = ctx.breadboard, a = ctx.aim, ux = -F.ax[0], uy = -F.ax[1];
  if (bb && a[0] >= bb[0] && a[0] <= bb[2] && a[1] >= bb[1] && a[1] <= bb[3]){
    exit = Infinity;
    for (const [u, lo, hi, p0] of [[ux, bb[0], bb[2], a[0]], [uy, bb[1], bb[3], a[1]]]) if (Math.abs(u) > 1e-6) exit = Math.min(exit, ((u > 0 ? hi : lo) - p0) / u);
    if (!Number.isFinite(exit)) exit = 0;
  }
  const near = Math.min(F.dist, exit + half + 3), d = clamp(F.dist * Math.pow(Math.max(2, v) / 30, .35), near, Math.max(near, F.dist * TRAVEL));
  return F.dist - d;
};
// each kind returns its items, the first one its shadow (o is the mat point under it)
const slabShadow = (W, o, x0, y0, x1, y1, h) => shadow([[x0, y0], [x1, y0], [x1, y1], [x0, y1]].flatMap(([x, y]) => [W(x, y, 0), W(x, y, h)]), o);
const OBSTACLES = {
  box: (W, o) => [slabShadow(W, o, -13, -15, 13, 15, 24), { box: B.aabb([W(-13, -15, 0), W(13, 15, 24)]), svg: B.slabW(W, -13, -15, 13, 15, 0, 24, CARD, toneI, 1.2)
    + B.slabW(W, -13, -2, 13, 2, 24, 24.3, matOf('#d7c49a'), toneI, .4) }],
  car: (W, o) => {
    const items = [slabShadow(W, o, -10, -17, 10, 17, 18)], body = B.slabW(W, -9, -17, 9, 17, 4, 13, RED, toneI, 1.2) + B.slabW(W, -7, -8, 7, 7, 13, 20, RED, toneI, 1);
    let win = '';
    for (const s of [-1, 1]) if (vis(sub(W(s, 0, 0), W(0, 0, 0)))) win += shape([W(s * 7.05, -6.5, 14), W(s * 7.05, -1.2, 14), W(s * 7.05, -1.2, 19), W(s * 7.05, -6.5, 19)], GLASS.m, .6)
      + shape([W(s * 7.05, .2, 14), W(s * 7.05, 5.5, 14), W(s * 7.05, 5.5, 19), W(s * 7.05, .2, 19)], GLASS.m, .6);
    items.push({ box: B.aabb([W(-9, -17, 4), W(9, 17, 20)]), svg: body + win });
    for (const y of [-11, 11]) for (const s of [-1, 1]) items.push({ box: B.aabb([W(s * 7.5, y - 4.5, 0), W(s * 10.5, y + 4.5, 9)]),
      svg: rod(W(s * 7.5, y, 4.5), W(s * 10.5, y, 4.5), 4.5, TYRE, toneI, .9) });
    return items;
  },
  ball: (W, o) => [shadow([...ringW(W, 0, 0, 0, 3, 8), ...ringW(W, 0, 0, 14, 14, 20)], o), { box: B.aabb([W(-14, -14, 0), W(14, 14, 28)]), svg: ball(W(0, 0, 14), 14, BALL) }],
  wall: (W, o) => {
    let s = B.slabW(W, -4, -32, 4, 32, 0, 36, BRICK, toneI, 1.2);
    for (const fx of [-4.02, 4.02]){
      if (!vis(sub(W(fx, 0, 0), W(0, 0, 0)))) continue;
      let d = '';
      for (let z = 6; z < 36; z += 6) d += `M${P(...W(fx, -32, z)).map(f).join(' ')}L${P(...W(fx, 32, z)).map(f).join(' ')}`;
      for (let row = 0; row < 6; row++) for (let y = -32 + (row % 2 ? 6 : 12); y < 32; y += 12) d += `M${P(...W(fx, y, row * 6)).map(f).join(' ')}L${P(...W(fx, y, row * 6 + 6)).map(f).join(' ')}`;
      s += `<path d="${d}" fill="none" stroke="#e8d9c4" stroke-width=".7" opacity=".85"/>`;
    }
    return [slabShadow(W, o, -4, -32, 4, 32, 36), { box: B.aabb([W(-4, -32, 0), W(4, 32, 36)]), svg: s }];
  },
};
// each kind's half depth along the axis toward the sensor
const OBSTACLE_HALF = { box: 13, car: 10.5, ball: 14, wall: 4 };
B.prop('obstacle', {
  name: 'Obstacle', foot: [30, 64, 36], params: { kind: Object.keys(OBSTACLES), value: [2, 450] }, defaults: { kind: 'box' }, travel: TRAVEL,
  draw(ctx){
    const kind = OBSTACLES[ctx.p.kind] ? ctx.p.kind : 'box';
    const F = frame(ctx), sh = obstacleShift(ctx, F, OBSTACLE_HALF[kind]), W = (x, y, z) => F.W(x + sh, y, z);
    out(ctx, OBSTACLES[kind](W, F.o));
  },
});

B.prop('watering-can', {
  name: 'Watering can', foot: [50, 26, 36], params: {},
  draw(ctx){
    const { W, o } = frame(ctx), items = [];
    items.push(shadow([...ringW(W, 0, 0, 0, 12), ...ringW(W, 0, 0, 22, 12)], o));
    let body = cyl(...W(0, 0, 0).slice(0, 2), o[2], o[2] + 22, 12, CAN, toneI, 1.4, 28) + cyl(...W(0, 0, 0).slice(0, 2), o[2] + 21, o[2] + 22.6, 12.6, CAN, toneI, .8, 28);
    body += shape(ringW(W, -4, 0, 22.62, 5.5, 18), '#2b2825', .5);
    items.push({ box: B.aabb([W(-12.6, -12.6, 0), W(12.6, 12.6, 22.6)]), svg: body });
    items.push({ box: B.aabb([W(8, -3, 4), W(31, 3, 28)]), svg: rod(W(9, 0, 5), W(30, 0, 26), 2.6, CAN, toneI, .9, 1.7) });
    // the rose: a flared cap with its holes on the face, when the face is toward the viewer
    const rose = towards(W(9, 0, 5), W(30, 0, 26)), face = along(W(30, 0, 26), rose, 4.05);
    let rs = rod(W(30, 0, 26), along(W(30, 0, 26), rose, 4), 1.7, CAN, toneI, .8, 4.2);
    if (vis(rose)) for (const h of [face, ...ringAbout(face, rose, 2.4, 6)]){ const [X, Y] = P(...h); rs += `<circle cx="${f(X)}" cy="${f(Y)}" r=".6" fill="#1f3d24"/>`; }
    items.push({ box: B.aabb([W(29, -4.5, 22), W(35, 4.5, 30)]), svg: rs });
    const handle = [W(-10, 0, 21), W(-9, 0, 30), W(-4, 0, 35), W(3, 0, 34), W(7, 0, 22)];
    for (let i = 0; i < handle.length - 1; i++) items.push({ box: B.aabb([handle[i], handle[i + 1]]).map((v, j) => v.map(c => c + (j ? 1.6 : -1.6))), svg: rod(handle[i], handle[i + 1], 1.5, CAN, toneI, .8) });
    out(ctx, items);
  },
});

// the meter is built on its aim servo: a card on the case top, centred on the output shaft, under the horn
B.prop('strength-meter', {
  name: 'Strength meter', foot: [50, 30, 42], params: {},
  draw(ctx){
    const q = ctx.aimPart, def = q && B.parts[q.part], sh = def && def.shaft;
    if (!q || !sh || !Array.isArray(q.at)){ B.note(`prop ${ctx.p.id}: a strength-meter needs a servo on the mat as its aim`); return; }
    const o = ctx.at(q.at[0], q.at[1]), r = (+q.rot || 0) * Math.PI / 180, ax = [Math.cos(r), Math.sin(r), 0], ay = [-ax[1], ax[0], 0];
    const W = (x, y, z) => [o[0] + ax[0] * x + ay[0] * y, o[1] + ax[1] * x + ay[1] * y, o[2] + z];
    const st = ctx.st || {}, drv = st.drv && st.drv[q.id], m = ctx.m || {};
    const angle = drv && Number.isFinite(drv.a) ? drv.a : Number.isFinite(m.angle) ? m.angle : 90;
    // horn direction for an angle, as the servo draws it: 0° along -x, 90° along +y, 180° along +x
    const dirAt = a => { const t = Math.PI - a * Math.PI / 180; return [Math.cos(t), Math.sin(t)]; };
    const z = sh.top + .3, R0 = 10, R1 = 25, at = (a, rr, zz = z) => { const [dx, dy] = dirAt(a); return W(sh.x + dx * rr, dy * rr, zz); };
    const items = [];
    let card = '';
    for (const [a0, a1, col] of [[0, 70, '#5cb85c'], [70, 120, '#f2c230'], [120, 160, '#f08a2b'], [160, 180, '#e2483d']]){
      const n = Math.max(3, Math.round((a1 - a0) / 6)), pts = [];
      for (let i = 0; i <= n; i++) pts.push(at(a0 + (a1 - a0) * i / n, R1));
      for (let i = n; i >= 0; i--) pts.push(at(a0 + (a1 - a0) * i / n, R0));
      card += shape(pts, col, 0);
    }
    const rim = []; for (let i = 0; i <= 30; i++) rim.push(at(i * 6, R1)); for (let i = 30; i >= 0; i--) rim.push(at(i * 6, R0));
    card += `<path d="${pd(rim)}" fill="none" stroke="${INK}" stroke-width="1"/>`;
    let ticks = ''; for (let a = 0; a <= 180; a += 20) ticks += `M${P(...at(a, R1 - 4)).map(f).join(' ')}L${P(...at(a, R1)).map(f).join(' ')}`;
    card += `<path d="${ticks}" stroke="${INK}" stroke-width=".7" fill="none"/>`;
    items.push({ box: B.aabb([W(sh.x - R1, -1, z - .1), W(sh.x + R1, R1, z + .1)]), svg: card });

    let bell = rod(post0, post1, .8, STEEL, toneI, .6) + rod(at(180, sh.tip + 3.4, sh.horn + 6), at(180, sh.tip + 3.4, sh.horn - 1), 1.2, BRASS, toneI, .9, 4.4, 18);

    items.push({ box: B.aabb([at(180, sh.tip, z), at(180, sh.tip + 6, sh.horn + 6)]).map((v, i) => v.map(c => c + (i ? 2 : -2))), svg: bell });
    out(ctx, items);
  },
});

const WEIGHTS = [[50, 4.5, 7], [100, 5.5, 9], [200, 7, 11], [500, 9.5, 15]];
B.prop('weights', {

        + cyl(...W(0, cy, 0).slice(0, 2), o[2] + 4 + h, o[2] + 6.5 + h, r * .62, BRASS, toneI, .8, 16);

      items.push({ box: B.aabb([W(-(r + 9), cy - r - 3, 0), W(r + 3, cy + r + 3, h + 6.5)]), svg: s });
      y += 2 * r + 9;
    }
    out(ctx, items);
  },
});
})();
