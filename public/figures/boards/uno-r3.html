<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Arduino Uno R3</title>
<script>
/* Colorfigures core.js, vendored for SimLab from the Colorfigures skill (MIT, see LICENSE in this folder).
   Upstream sha256 a78aab94ab7396b99080bf72673d5d4d689d771764d76cb08f1a0d28033f7fc3. SimLab patches: PATCHES.md. Regenerate with vendor.py, never edit by hand. */
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- SimLab patches (see figures/vendor/colorfigures/PATCHES.md) ---------- */
// P3 embedded mode: on inside any iframe or with ?embed=1; ?embed=0 forces it off. ?bare=1 also hides the figure's
// own buttons, stats, switches and keypad. ?theme=dark dims the paper (P4). ?lang=xx is the first language (P2).
const CF_Q = new URLSearchParams(location.search);
const CF_EMBED = CF_Q.get('embed') === '1' || (CF_Q.get('embed') !== '0' && window.parent !== window);
const CF_NOTE = m => { const h = document.documentElement, s = ' ' + m + ';'; if (!(h.dataset.errors || '').includes(s)) h.dataset.errors = (h.dataset.errors || '') + s; };
// P2: every figure string goes through CF_T(english, vars?). Keys are the English text, so a missing entry still
// reads; {name} placeholders are filled from vars after the lookup.
let CF_LANG = /^[a-z]{2}(-[A-Za-z]+)?$/.test(CF_Q.get('lang') || '') ? CF_Q.get('lang') : 'en', CF_STR = {};
const CF_T = (s, vars) => {
  let t = s != null && typeof s === 'string' && Object.prototype.hasOwnProperty.call(CF_STR, s) ? CF_STR[s] : s;
  if (vars && typeof t === 'string') t = t.replace(/\{(\w+)\}/g, (m, k) => Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m);
  return t; };
const CF_ESC = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// a translatable piece of chrome: English, or [template, vars] for one with a live value (['Press {name}', { name }]),
// which keeps its template and values so a new dictionary relabels it
const CF_L = s => { const [k, v] = Array.isArray(s) ? s : [s, null];
  return `<span data-cft="${CF_ESC(k)}"${v ? ` data-cftv="${CF_ESC(JSON.stringify(v))}"` : ''}>${CF_ESC(CF_T(k, v))}</span>`; };
const CF_SLUG = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'button';
// P1: label pills are sized from the real text width in the pill's font (cached per string at 100 px), not from
// text.length, which overflows CJK and doubles Devanagari (combining marks count as characters)
const CF_TW = (() => { const cache = new Map(); let g = null;
  return (text, fs) => { const s = String(text); let w = cache.get(s);
    if (w == null){
      const n = typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter().segment(s)].length : [...s].length;
      try { g = g || document.createElement('canvas').getContext('2d'); g.font = '800 100px ui-monospace,Menlo,monospace';
        w = g.measureText(s).width / 100 + .04 * n; }        // + the pill's letter-spacing of .04em per character
      catch (e) { w = .62 * n; }
      if (!(w > 0)) w = .62 * n;
      cache.set(s, w); }
    return w * fs; }; })();
// P5 (Appendix E): a material given as a colour string ('#rrggbb') is turned into a material; anything else is
// reported on data-errors and drawn dark instead of crashing the whole render
const CF_MAT = m => { if (typeof m === 'string' && /^#[0-9a-f]{6}$/i.test(m)) return matOf(m); CF_NOTE('bad material ' + String(m)); return DARK; };
// P5 (Appendix E): option objects are checked, so a misspelt or invented option is reported instead of ignored
const CF_OPTS = (who, o, known, need = []) => { if (!o || typeof o !== 'object') return CF_NOTE(who + ': options missing');
  for (const k of Object.keys(o)) if (!known.includes(k)) CF_NOTE(`${who}: unknown option "${k}"`);
  for (const k of need) if (o[k] == null) CF_NOTE(`${who}: option "${k}" missing`); };
// P3: the embedded frame follows the iframe's own shape (.7501 keeps the centred framing without the desktop nudge)
const CF_FRAME_A = () => { const w = innerWidth, h = innerHeight; return w > 50 && h > 50 ? Math.min(1.4, Math.max(.7501, h / w)) : .75; };
// P5 (Appendix E): html.cf-moving is set while frames are being drawn (drag, turn, animation) and cleared 220 ms after
// the last one; cfbuild.py drops the hand-drawn filter only then on phones, which is what build.py's docstring promises
let CF_MOVE_T = 0;
const CF_MOVED = () => { const h = document.documentElement; h.classList.add('cf-moving'); clearTimeout(CF_MOVE_T);
  CF_MOVE_T = setTimeout(() => h.classList.remove('cf-moving'), 220); };
const CF_MOUNT_HOOKS = [];       // functions (cfg, ui) run at the end of mountFigure; figures/engine/embed.js uses it
let CF_UI = null, CF_CFG = null;
// P2: swap the dictionary and relabel everything already on the page, then redraw
function CF_SETLOCALE(lang, strings){
  CF_LANG = typeof lang === 'string' && lang ? lang : 'en';
  CF_STR = strings && typeof strings === 'object' && !Array.isArray(strings) ? strings : {};
  document.documentElement.lang = CF_LANG === 'zh' ? 'zh-Hans' : CF_LANG;
  for (const el of document.querySelectorAll('.zchip button[aria-label]:not([data-cft-aria])')) el.dataset.cftAria = el.getAttribute('aria-label');
  for (const el of document.querySelectorAll('[data-cft]')) el.textContent = CF_T(el.dataset.cft, el.dataset.cftv ? JSON.parse(el.dataset.cftv) : null);
  for (const el of document.querySelectorAll('[data-cft-aria]')) el.setAttribute('aria-label', CF_T(el.dataset.cftAria));
  if (CF_CFG) document.title = CF_T(CF_CFG.title);
  if (CF_UI) CF_UI.render();
}
// P4: a dark host keeps the figure a paper plate, only dimmer (the colours, ink and pills are designed for paper)
const CF_THEME = mode => document.documentElement.classList.toggle('cf-dark', mode === 'dark');
const CF_CSS = `
  :root{color-scheme:light}
  html.cf-dark{--paper:#e4ddcf;--rule:#cbc2b1;--muted:#6a6357}
  #fig:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
  html.cf-embed,html.cf-embed body{height:100%;overflow:hidden}
  html.cf-embed body{padding:0;display:block}
  html.cf-embed body>header,html.cf-embed .controls,html.cf-embed .made-with,html.cf-embed .lgd,html.cf-embed .mcap{display:none!important}
  html.cf-embed .stage{max-width:none;height:100%;display:flex;flex-direction:column}
  html.cf-embed .zwrap{flex:1 1 auto;min-height:0}
  html.cf-embed #fig{max-width:none;width:100%;height:100%!important;max-height:none!important;margin:0;flex:1 1 auto;min-height:0}
  @media (min-width:561px){html.cf-embed .actions{left:12px;top:10px}html.cf-embed .vset{right:12px;top:10px!important}html.cf-embed #stats{right:12px}}
  @media (max-width:560px){html.cf-embed .stage{padding:8px 10px 0}}
  html.cf-bare .actions,html.cf-bare .vset,html.cf-bare .stats,html.cf-bare .kpad{display:none!important}
  html.cf-wait .stage{visibility:hidden}`;
{ const h = document.documentElement;
  if (CF_EMBED) h.classList.add('cf-embed');
  if (CF_EMBED && CF_Q.get('bare') === '1') h.classList.add('cf-bare');
  if (CF_Q.get('theme') === 'dark') h.classList.add('cf-dark');
  h.lang = CF_LANG === 'zh' ? 'zh-Hans' : CF_LANG; }

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { if (!m || typeof m !== 'object') m = CF_MAT(m); const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;

    if (q.y > 0){ top[-1] = q.y + hgt; tight = new DOMPoint(r.right, r.bottom + 6).matrixTransform(inv).y + hgt/2; } }

    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const ct = CF_T(c.text), w = u ? hgt*(c.n > 9 ? 1.3 : 1) : CF_TW(ct, fs) + fs*1.5;

        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`

      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', CF_T('Keypad')); pad.dataset.cftAria = 'Keypad';
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', CF_T(k.name)); b.dataset.cftAria = k.name;
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${CF_L(spec.action)}<small>${CF_L('SPACE')}</small>`; go.setAttribute('aria-label', CF_T(spec.action)); go.dataset.cftAria = spec.action;
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>/* figures/engine/embed.js */
/* SimLab figure bridge, figure side. The protocol is in docs/FIGURES.md (after colorfigures-guide 2.3).
   It is inlined right after the vendored core.js and hooks mountFigure through CF_MOUNT_HOOKS, so any figure that
   calls mountFigure(cfg) speaks it. A figure opts in to state with
     cfg.embed = { accept(st, patch, ui) -> true | false | 'why not', report(st) -> small object of discrete values }
   Nothing else in the state can be written from outside. */
(() => {
  const IN = 'simlab', OUT = 'simlab-figure', V = 1;
  const html = document.documentElement;
  const host = CF_EMBED && window.parent !== window ? window.parent : null;
  const fileMode = location.protocol === 'file:';
  // same-origin hosting by default; ?origin= names the host when the figure is served from elsewhere
  const hostOrigin = (() => { const o = CF_Q.get('origin'); if (!o) return location.origin;
    try { const u = new URL(o); return /^https?:$/.test(u.protocol) ? u.origin : location.origin; } catch (e) { return location.origin; } })();
  // under file:// the real origin is opaque and a message aimed at "file://" is dropped, so tests post to '*'
  const target = fileMode ? '*' : hostOrigin;
  const send = (type, data) => { if (!host) return; try { host.postMessage({ source: OUT, v: V, type, ...(data || {}) }, target); } catch (e) {} };
  const err = message => { CF_NOTE(message); send('error', { message: String(message) }); };
  const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);

  addEventListener('error', e => send('error', { message: String(e.message || e) }));
  addEventListener('unhandledrejection', e => send('error', { message: String((e.reason && e.reason.message) || e.reason) }));

  // a non-English first paint waits (briefly) for the host's dictionary instead of flashing English
  let waitT = 0;
  const unwait = () => { clearTimeout(waitT); html.classList.remove('cf-wait'); };
  if (host && CF_LANG !== 'en'){ html.classList.add('cf-wait'); waitT = setTimeout(unwait, 1500); }

  let cfg = null, ui = null, live = false, byHost = false, plain = null;
  const queue = [], custom = {};
  addEventListener('message', ev => {
    if (!host || ev.source !== host) return;
    if (fileMode ? !(ev.origin === 'null' || ev.origin === 'file://') : ev.origin !== hostOrigin) return;
    const m = ev.data;
    if (!m || typeof m !== 'object' || m.source !== IN || m.v !== V || typeof m.type !== 'string') return;
    if (!live){ if (queue.length < 200) queue.push(m); return; }
    handle(m);
  });

  const labelOf = el => { const s = el.querySelector('[data-cft]'); return (s ? s.textContent : el.textContent).replace('▾', '').trim(); };
  // the English label; a label with a live value keeps its template and values (core CF_L) and is filled in here
  const enOf = el => { const s = el.querySelector('[data-cft]'); if (!s) return labelOf(el);
    const v = s.dataset.cftv ? JSON.parse(s.dataset.cftv) : null;
    return v ? s.dataset.cft.replace(/\{(\w+)\}/g, (m, k) => own(v, k) ? String(v[k]) : m) : s.dataset.cft; };
  const readout = () => { if (typeof cfg.readout !== 'function') return '';
    try { return String(CF_T(cfg.readout(ui.st)) ?? ''); } catch (e) { return ''; } };
  const report = () => { if (!cfg.embed || typeof cfg.embed.report !== 'function') return null;
    try { return cfg.embed.report(ui.st); } catch (e) { CF_NOTE('report: ' + e.message); return null; } };
  // pressable parts in the drawing right now (for the host's accessible list); a part may carry data-id and data-label
  const parts = () => { const seen = new Set(), out = [];
    for (const el of document.querySelectorAll('#art [data-act]')){
      const act = el.dataset.act; if (!own(cfg.acts, act)) continue;
      const id = el.dataset.id ?? null, key = act + '|' + (id ?? ''); if (seen.has(key)) continue; seen.add(key);
      const en = el.dataset.label || act; out.push({ act, id, label: CF_T(en), en }); }
    return out; };
  const labels = () => { if (html.classList.contains('nolabels')) return [];
    const m = new Map();
    for (const g of document.querySelectorAll('#fig .tag[data-t]')){ const n = +g.dataset.n;
      if (!m.has(n)) m.set(n, { n, text: g.dataset.t, en: g.dataset.en ?? g.dataset.t, on: g.classList.contains('on') }); }
    return [...m.values()].sort((a, b) => a.n - b.n); };
  // what the host hides because it draws it itself (chrome): the figure's buttons, its See-through and Labels switches,
  // and 'stats', the big numbers top right. A hidden button is still pressed by id and a hidden switch still follows
  // the host's xr and labels messages
  let hidden = new Set();
  const mark = id => hidden.has(id) ? { hidden: true } : {};
  const buttons = () => [...document.querySelectorAll('#btns .act[data-id]')]
    .map(b => ({ id: b.dataset.id, label: labelOf(b), en: enOf(b), picker: !!b.querySelector('.car'), ...mark(b.dataset.id) }));
  const chrome = hide => {
    if (!Array.isArray(hide) || hide.some(id => typeof id !== 'string')) return err('chrome: hide must be a list of button ids');
    // besides buttons and switches: the HUD, the zoom chip and the toast, for a host that draws its own or none
    const all = [...document.querySelectorAll('#btns .act[data-id], .vset .act[data-id]')];
    const panels = Object.entries({ stats: document.getElementById('stats'), zoom: document.querySelector('.zchip'), toast: document.getElementById('toast') }).filter(([, el]) => el);
    const ids = new Set([...all.map(b => b.dataset.id), ...panels.map(([id]) => id)]);
    hidden = new Set(hide.filter(id => ids.has(id)));
    for (const b of all) (b.closest('.stepwrap') || b).toggleAttribute('data-cf-hidden', hidden.has(b.dataset.id));
    // inline, because the toast's own style is display:flex!important and comes later in the page
    for (const [id, el] of panels){ const off = hidden.has(id); el.toggleAttribute('data-cf-hidden', off); if (off) el.style.setProperty('display', 'none', 'important'); else el.style.removeProperty('display'); }
    ui.render();
    const unknown = hide.filter(id => !ids.has(id));
    if (unknown.length) err(`chrome: no button "${unknown.join('", "')}"`);
  };
  const switches = () => [...document.querySelectorAll('.vset .act[data-id]')]
    .map(b => ({ id: b.dataset.id, label: labelOf(b), on: b.getAttribute('aria-pressed') === 'true', ...mark(b.dataset.id) }));

  const sendReady = () => plain ? send('ready', { ...plain(), lang: CF_LANG, embedded: true }) : send('ready', {
    fig: cfg.fig ?? null, title: CF_T(cfg.title), en: cfg.title, lang: CF_LANG,
    buttons: buttons(), switches: switches(), acts: Object.keys(cfg.acts || {}), parts: parts(),
    pals: Object.keys(PALS), pal: ui.st.pal, view: { yaw: YAW, pitch: PITCH },
    state: report(), readout: readout(), embedded: true });

  // after renders: state, readout and parts at most ~30 times a second, labels whenever they change
  let last = { state: undefined, readout: undefined, parts: undefined, labels: undefined }, flushT = 0, sentAt = 0;
  const flush = () => { flushT = 0; sentAt = performance.now();
    const st = report(), sj = JSON.stringify(st), ro = readout(), pj = JSON.stringify(parts()), lb = labels(), lj = JSON.stringify(lb);
    if (sj !== last.state || ro !== last.readout || pj !== last.parts){
      const prev = last.state ? JSON.parse(last.state) : null, changed = [];
      if (st && typeof st === 'object') for (const k of Object.keys(st)) if (!prev || JSON.stringify(prev[k]) !== JSON.stringify(st[k])) changed.push(k);
      last.state = sj; last.readout = ro; last.parts = pj;
      send('state', { state: st, changed, readout: ro, parts: JSON.parse(pj) }); }
    if (lj !== last.labels){ last.labels = lj; send('labels', { items: lb }); } };
  const schedule = () => { if (!flushT) flushT = setTimeout(flush, Math.max(0, 33 - (performance.now() - sentAt))); };

  const click = el => { byHost = true; try { el.click(); } finally { byHost = false; } };
  const press = (id, choice) => {
    const b = [...document.querySelectorAll('.act[data-id]')].find(e => e.dataset.id === String(id));
    if (!b) return err(`no button "${id}"`);
    const wrap = b.closest('.stepwrap');
    if (choice == null || !(wrap && wrap.classList.contains('open'))) click(b);
    if (choice == null) return;
    const c = wrap && [...wrap.querySelectorAll('.chip')].find(e => e.dataset.id === String(choice));
    if (!c) return err(`no choice "${choice}" in "${id}"`);
    click(c);
  };
  const runAct = (name, data) => {
    if (typeof name !== 'string' || !own(cfg.acts, name)) return err(`no act "${name}"`);
    const d = {}; if (data && typeof data === 'object') for (const [k, v] of Object.entries(data)) d[k] = String(v);
    const el = [...document.querySelectorAll('#art [data-act]')].find(e => e.dataset.act === name && Object.entries(d).every(([k, v]) => e.dataset[k] === v))
      || { dataset: { act: name, ...d }, getAttribute: k => (k.startsWith('data-') ? d[k.slice(5)] : null) ?? null, closest: () => null };
    send('part', { act: name, id: el.dataset.id ?? null, data: { ...el.dataset }, by: 'host' });
    cfg.acts[name](ui.st, el, ui); ui.render();
  };
  const setState = patch => {
    const accept = cfg.embed && cfg.embed.accept;
    if (typeof accept !== 'function') return err('set: this figure takes no state');
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return err('set: state must be an object');
    let r; try { r = accept(ui.st, patch, ui); } catch (e) { return err('set: ' + e.message); }
    if (r === false || typeof r === 'string') err('set rejected' + (typeof r === 'string' ? ': ' + r : ''));
    ui.render();
  };
  const num = (v, lo, hi, dflt) => { const x = +v; return v != null && Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : dflt; };

  // pause: the host hid the figure (or the tab is hidden). Every animation step is held instead of run, so the figure's
  // clock stops where it is; resume hands the held steps back to the core's frame driver
  let hostPaused = false, held = new Set(), animate0 = null;
  const paused = () => hostPaused || document.hidden;
  const wake = () => { if (paused() || !animate0) return; const steps = [...held]; held = new Set(); for (const s of steps) animate0(s); };
  const holdable = step => function held1(dt){ if (paused()){ held.add(held1); return false; } return step(dt); };
  document.addEventListener('visibilitychange', wake);

  const H = {
    hello: () => sendReady(),
    pause: () => { hostPaused = true; },
    resume: () => { hostPaused = false; wake(); },
    press: m => press(m.id, m.choice),
    chrome: m => chrome(m.hide),
    act: m => runAct(m.name, m.data),
    set: m => setState(m.state),
    view: m => { const y = num(m.yaw, -720, 720, null); if (y == null) return err('view: yaw must be a number');
      ui.camTo(y, num(m.pitch, -90, 90, PITCH), num(m.ms, 1, 5000, 700)); },
    xr: m => { const b = document.getElementById('xrb'); if (!b) return err('xr: this figure has no see-through');
      if (!!ui.st.xrT !== !!m.on) click(b); },
    labels: m => { const b = document.getElementById('lblb') || document.getElementById('lbl');
      if (!html.classList.contains('nolabels') !== !!m.on && b) click(b); schedule(); },
    pal: m => { if (typeof m.key !== 'string' || !own(PALS, m.key)) return err(`pal: no palette "${m.key}"`);
      ui.st.pal = m.key; for (const s of document.querySelectorAll('#pals .sw')) s.setAttribute('aria-pressed', s.title === m.key); ui.render(); },
    locale: m => { CF_SETLOCALE(typeof m.lang === 'string' ? m.lang : 'en', m.strings); unwait(); if (cfg) schedule(); },
    theme: m => CF_THEME(m.mode),
    flash: m => { if (m.text == null) return err('flash: text missing'); ui.flash(String(m.text), num(m.ms, 300, 15000, 1600)); },
    query: () => { const st = report(), ro = readout(), ps = parts();
      send('state', { state: st, changed: [], readout: ro, parts: ps }); send('labels', { items: labels() }); },
  };
  const handle = m => { const h = own(H, m.type) && (cfg || m.type === 'hello' || m.type === 'locale' || m.type === 'theme') ? H[m.type]
      : own(custom, m.type) ? custom[m.type] : null;
    if (!h) return err(`unknown message "${m.type}"`);
    try { h(m); } catch (e) { err(`${m.type}: ${e.message}`); } };

  // for engines and pages: extra events (e.g. sfx), extra commands, and pages that never call mountFigure
  window.CF_BRIDGE = Object.freeze({
    embedded: !!host,
    send: (type, data) => { if (typeof type !== 'string' || !type || type === 'ready') return err(`CF_BRIDGE.send: "${type}" is reserved or invalid`); send(type, data); },
    on: (type, fn) => { if (typeof type !== 'string' || own(H, type) || typeof fn !== 'function') return err(`CF_BRIDGE.on: "${type}" is reserved or invalid`); custom[type] = fn; },
    // a page without mountFigure (the flight range): info() returns its ready payload; queued commands then run
    plain: info => { if (cfg || plain || typeof info !== 'function') return; plain = info; live = true; unwait(); sendReady();
      for (const m of queue.splice(0)) if (m.type !== 'hello') handle(m); },
  });

  CF_MOUNT_HOOKS.push((c, u) => {
    cfg = c; ui = u;
    const fig = document.getElementById('fig');
    fig.setAttribute('tabindex', '0');
    const css = document.createElement('style');
    // a phone-sized frame draws labels as numbered badges whose legend embedding hides, so the numbers would mean
    // nothing there: no badges, and no Labels switch (the 560 px is build.py's LBL_U threshold)
    css.textContent = '[data-cf-hidden]{display:none!important}@media (max-width:560px){html.cf-embed #fig g.tag,html.cf-embed #lblb{display:none!important}}';
    document.head.appendChild(css);
    // parts: report the press before the figure acts on it, so 'part' arrives ahead of the 'state' it causes
    fig.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest && e.target.closest('[data-act]');
      if (a && own(cfg.acts, a.dataset.act)) send('part', { act: a.dataset.act, id: a.dataset.id ?? null, data: { ...a.dataset }, by: 'user' }); }, true);
    // buttons, chips and switches, whoever pressed them, reported before their handlers run (so ahead of the
    // flash and state they cause); a switch reports the position it is turning to
    document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('.act[data-id], .chip[data-id]'); if (!el) return;
      const by = byHost ? 'host' : 'user';
      if (el.classList.contains('chip')){ const p = el.closest('.stepwrap'), b = p && p.querySelector('.act[data-id]');
        send('button', { id: b ? b.dataset.id : null, choice: el.dataset.id, by }); }
      else send('button', { id: el.dataset.id, by, ...(el.closest('.vset') ? { on: el.getAttribute('aria-pressed') !== 'true' } : {}) }); }, true);
    addEventListener('focus', () => send('focus', { on: true }));
    addEventListener('blur', () => send('focus', { on: false }));
    const f0 = ui.flash; ui.flash = (text, ms) => { f0(text, ms); send('flash', { text: CF_T(text), en: String(text) }); };
    const r0 = ui.render; ui.render = () => { r0(); schedule(); };
    animate0 = ui.animate; ui.animate = step => animate0(holdable(step));
    const go = () => { if (live) return; live = true; sendReady(); flush();
      for (const m of queue.splice(0)) if (m.type !== 'hello') handle(m); };
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', go, { once: true }); else queueMicrotask(go);
  });
})();

<script>/* figures/engine/bench.js */
// The engine itself: pages load it through engine/bench.list (// @cf use engine/bench.list).
/* SimLab Board Bench engine. Boards, modules and benches are data (docs/FIGURES-BENCH.md); this file turns one of
   them into a Colorfigures figure: the board on its cutting mat, the build flow with its refusals, the power tree
   and faults, built-in programs on a virtual clock, on-board controls, see-through, exploded view, the views
   (board / breadboard / schematic / power) and the bridge traffic (accept / report).
   Part drawings: bench-kinds.js. Breadboard scene and circuit solver: bench-bb.js. Flat sheets: sheets.js. */
(() => {
const SL = window.SL = window.SL || {};
const B = SL.bench = {};
const T = (s, v) => CF_T(s, v);
const note = m => CF_NOTE('bench: ' + m);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const mean = pts => { const s = [0, 0, 0]; for (const p of pts) for (let k = 0; k < 3; k++) s[k] += p[k]; return s.map(v => v / pts.length); };
B.T = T; B.note = note; B.clamp = clamp; B.mean = mean;

/* ---------- registry ---------- */
B.kinds = {}; B.parts = {}; B.defs = { board: {}, module: {}, bench: {} };
const order = [];
B.kind = (name, def) => { if (!def || typeof def.draw !== 'function') return note(`kind "${name}" has no draw`); B.kinds[name] = def; };
B.part = (name, def) => { if (!def || typeof def.draw !== 'function') return note(`part "${name}" has no draw`); B.parts[name] = def; order.push(['part', name]);
  if (mine('part', name)) mountNow(['part', name]); };
// a page mounts its own item as soon as it registers (build.py's TAIL needs #fig right after the scripts):
// the item is the one whose kind and id match the page file, public/figures/<dir>/<id>.html, or ?id=
const DIRS = { board: 'boards', module: 'modules', bench: 'robotics', part: 'parts' };
const mine = (type, id) => CF_Q.get('id') ? CF_Q.get('id') === id : new RegExp('/' + DIRS[type] + '/' + id.replace(/[^\w-]/g, '') + '\\.html$').test(location.pathname);
const register = type => def => { if (!def || typeof def.id !== 'string') return note(type + ' without an id'); B.defs[type][def.id] = def; order.push([type, def.id]);
  if (mine(type, def.id)) mountNow([type, def.id]); };
B.board = register('board'); B.module = register('module'); B.bench = register('bench');

/* ---------- materials ---------- */
const M = B.M = {
  gold: { l: '#f4d37c', m: '#d8b04f', d: '#8d6a24' }, tin: METAL, black: DARK, ceramic: CERAMIC,
  steel: { l: '#e9ecec', m: '#bcc3c5', d: '#7f888b' }, blackPl: { l: '#5a5550', m: '#403c38', d: '#2a2725' },
  white: { l: '#fbf8ef', m: '#e7e2d3', d: '#c4bdab' }, tan: { l: '#e3c79a', m: '#c9a874', d: '#8f7449' },
  fr4: { l: '#d9cf9a', m: '#bfb47c', d: '#8c8352' }, mat: { l: '#dfe3d2', m: '#c6cbb6', d: '#9da38c' },
  copper: { l: '#f0a46b', m: '#d4834a', d: '#8f5226' }, hole: '#2b2825', silk: '#f6f4ea',
};
B.mat = hex => matOf(hex);
const WIRE = B.WIRE = { red: '#e2483d', black: '#3a3632', orange: '#f08a2b', yellow: '#f2c230', green: '#43b05c', blue: '#3e86d9',
  white: '#ece6d6', purple: '#8c4bd1', brown: '#8a5a34', grey: '#9a958c' };

/* ---------- model ---------- */
const GROUPS = ['smd', 'low', 'tall', 'last'];
const LIFT = { smd: 4, low: 9, tall: 14, last: 19 };
B.rowPins = p => {
  const n = p.pins.length, rows = p.rows || 1, pitch = p.pitch || 2.54, cols = Math.ceil(n / rows);
  const r = (p.rot || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return p.pins.map((_, i) => {
    let col, row;
    if (rows === 1){ col = i; row = 0; } else if (p.order === 'rows'){ row = Math.floor(i / cols); col = i % cols; } else { col = Math.floor(i / rows); row = i % rows; }
    const a = (p.mirror ? -1 : 1) * (col - (cols - 1) / 2) * pitch, b = ((rows - 1) / 2 - row) * pitch;
    return [p.at[0] + a * c - b * s, p.at[1] + a * s + b * c];
  });
};
function prep(def, type){
  const pcb = Object.assign({ w: 50, h: 30, thick: 1.6, r: 1, color: '#2f9ea3', silk: M.silk, standoff: 4 }, def.pcb || {});
  const mat = Object.assign({ front: 8, back: 8, left: 14, right: 8 }, def.mat || {});
  const parts = [], byId = {};
  for (const q of def.parts || []){
    const k = B.kinds[q && q.kind];
    if (!k){ note(`${def.id}: part ${q && q.id} has unknown kind "${q && q.kind}"`); continue; }
    if (!q.id || byId[q.id]){ note(`${def.id}: duplicate or missing part id "${q.id}"`); continue; }
    if (!Array.isArray(q.at) || q.at.length < 2){ note(`${def.id}: part ${q.id} has no "at"`); continue; }
    const p = Object.assign({ rot: 0, z: 0, side: 'top' }, k.defaults || {}, q);
    p.group = q.group || k.group || 'smd';
    if (!GROUPS.includes(p.group)){ note(`${def.id}: part ${p.id} has unknown group "${p.group}"`); p.group = 'smd'; }
    if (!p.size) p.size = k.size ? k.size(p) : [2, 1.2];
    if (p.h == null) p.h = typeof k.h === 'function' ? k.h(p) : k.h != null ? k.h : 1;
    if (!p.name) p.name = p.id;
    parts.push(p); byId[p.id] = p;
  }
  const pins = {}, netPins = {};
  for (const p of parts){
    const k = B.kinds[p.kind];
    if (!Array.isArray(p.pins)) continue;
    const pts = k.pins ? k.pins(p) : B.rowPins(p);
    p.pins.forEach((net, i) => {
      if (net === null) return;
      const id = p.id + '.' + (i + 1), label = (p.labels && p.labels[i]) || net || id;
      pins[id] = { id, part: p.id, n: i + 1, at: pts[i], net: net || id, label };
      if (net) (netPins[net] = netPins[net] || []).push(id);
    });
  }
  const power = def.power || {};
  return { def, type, id: def.id, name: def.name || def.id, sub: def.sub || '', pcb, mat, parts, byId, pins, netPins, power,
    modes: def.modes || {}, circuits: def.circuits || {}, height: def.height || 14 };
}
B.prep = prep;

/* ---------- world mapping: board mm (x right, y up, z up) to Colorfigures world (x depth, y width) ---------- */
const G = B.G = { matH: 3, ox: 0, oy: 0, pw: 0, ph: 0, z0: 0, top: 0 };
function layoutFor(md){
  const { pcb, mat } = md;
  G.ox = mat.back; G.oy = mat.right; G.pw = pcb.w; G.ph = pcb.h;
  G.z0 = G.matH + pcb.standoff; G.top = G.z0 + pcb.thick;
}
const BP = B.BP = (x, y, z = 0) => [G.ox + G.ph - y, G.oy + G.pw - x, G.top + z];
const BPs = B.BPs = (x, y, z = 0) => P(...BP(x, y, z));
const wdir = (vx, vy) => [-vy, -vx, 0];     // a board direction as a world direction
B.wdir = wdir;
// text lying on a horizontal plane, reading along the board direction (dx, dy)
B.flatText = (wpt, dx, dy, str, size, col = INK, weight = 800, anchor = 'middle') => {
  const o = P(...wpt), U = Dv(...wdir(dx, dy)), V = Dv(...wdir(dy, -dx));
  return `<text transform="${txM(o, U, V)}" font-size="${f(size)}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${CF_ESC(str)}</text>`;
};
// a box through any 8 world points: [[lo],[hi]]
const aabb = pts => { const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (const w of pts) for (let k = 0; k < 3; k++){ lo[k] = Math.min(lo[k], w[k]); hi[k] = Math.max(hi[k], w[k]); } return [lo, hi]; };
B.aabb = aabb;
// a box with any rotation: faces culled and shaded from their own normals
const slabW = (W3, a0, b0, a1, b1, z0, z1, m, shade = toneI, w = .9) => {
  const q = [[a0, b0], [a1, b0], [a1, b1], [a0, b1]];
  const lo = q.map(([a, b]) => W3(a, b, z0)), hi = q.map(([a, b]) => W3(a, b, z1)), cen = mean([...lo, ...hi]);
  const faces = []; for (let i = 0; i < 4; i++){ const j = (i + 1) % 4; faces.push([lo[i], lo[j], hi[j], hi[i]]); }
  faces.push(hi);
  let s = '';
  for (const fq of faces){ const n = norm(sub(mean(fq), cen)); if (vis(n)) s += shape(fq, shade(n, m), w); }
  return s;
};
B.slabW = slabW;
const circ = (cx, cy, r, n = 18) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(i / n * 2 * Math.PI), cy + r * Math.sin(i / n * 2 * Math.PI)]);
B.circ = circ;

/* part context for kinds: local frame (centre origin, own x along size[0]) */
function partCtx(p, st, o){
  const r = (p.rot || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const bottom = p.side === 'bottom', th = B.md.pcb.thick, zb = (p.z || 0) + (o.lift || 0);
  const Lb = (a, b) => [p.at[0] + a * c - b * s, p.at[1] + a * s + b * c];
  const W3 = (a, b, z) => { const [x, y] = Lb(a, b); return BP(x, y, bottom ? -th - zb - z : zb + z); };
  const items = [];
  const ctx = {
    p, st, o, T, k: o.k || 0, lit: o.lit || 0, hot: !!o.hot, pop: !!o.pop, rev: !!o.rev, sel: !!o.sel, on: !!o.on,
    L: Lb, W: W3, P: (a, b, z) => P(...W3(a, b, z)),
    B: (a0, b0, z0, a1, b1, z1) => aabb([[a0, b0], [a1, b0], [a1, b1], [a0, b1]].flatMap(([a, b]) => [W3(a, b, z0), W3(a, b, z1)])),
    put: (bx, svg) => { if (svg) items.push({ box: bx, svg }); },
    slab: (a0, b0, a1, b1, z0, z1, m, shade = toneI, w = .9) => slabW(W3, a0, b0, a1, b1, z0, z1, m, shade, w),
    poly: (pts, z, col, w = .6) => { const d = pd(pts.map(([a, b]) => W3(a, b, z))); return fill(d, col) + (w ? ink(d, w) : ''); },
    disc: (a, b, z, rad, col, w = .5) => { const d = pd(circ(a, b, rad).map(([u, v]) => W3(u, v, z))); return fill(d, col) + (w ? ink(d, w) : ''); },
    text: (a, b, z, str, size, col = '#f2efe7', weight = 800) => B.flatText(W3(a, b, z), c, s, str, size, col, weight),
    cyl: (a, b, z0, z1, rad, m, shade = toneI, w = 1, n = 18) => { const [x, y, zA] = W3(a, b, z0), zB = W3(a, b, z1)[2]; return cyl(x, y, Math.min(zA, zB), Math.max(zA, zB), rad, m, shade, w, n); },
    rod: (a, b, rad, m, shade = toneI, w = .8) => rod(W3(...a), W3(...b), rad, m, shade, w),
    line: (pts, w = .6, col = INK) => `<path d="${pd(pts.map(q => W3(...q)), false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,
    glow: (a, b, z, rad, col, op = .5) => { const [X, Y] = P(...W3(a, b, z)); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(rad)}" fill="${col}" opacity="${f(op)}"/>`; },
  };
  return { ctx, items };
}
B.partCtx = partCtx;

/* ---------- state ---------- */
let MD = null, ui = null, st = null;
const isIn = id => !!(st.placed[id]);
const isSet = id => { const q = st.placed[id]; return !!(q && q.sold); };
const isRev = id => { const q = st.placed[id]; return !!(q && q.orient === 1); };
B.isIn = id => isIn(id); B.isSet = id => isSet(id);
const nameOf = id => { const p = MD.byId[id] || MAT.byId[id]; return p ? T(p.name) : id; };
const partsIn = g => MD.parts.filter(p => p.group === g);
const coldHit = (seed, t) => { const k = Math.floor(t * 3.3), x = Math.sin((k + 1) * 12.9898 + seed * 78.233) * 43758.5453; return x - Math.floor(x) < .42; };
const hashS = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 9973; return h; };
// fault patterns run on st.on, the time since the supply went in, so a program restart doesn't replay them
const coldOff = id => st.faults.includes('cold:' + id) && coldHit(hashS(id), st.on);

/* ---------- the mat: boards and parts beside the base with fixed, pre-routed wires, set out one step at a time ----------
   def.periph   [{ id, board | part, at: [x, y], size?, legs?, params?, step? }]: at is the item's lower-left corner in
                base board mm; a board is drawn assembled, a part with its breadboard drawing (legs at `legs` or spread
                along its front edge)
   def.wires    [{ from, to, color, step? }]: ends are base pins ('J1.4' or a net), a periph board's pin ('NANO.D5')
                or a periph part's leg ('MOTA.+')
   def.matSteps [{ id, label }] in order; the 'mat' button and set {matStep} reveal items up to that step, items
                without a step are always there. The wires carry no current: the bench's model() says what they do. */
let MAT = { items: [], byId: {}, steps: [], wires: [] };
function prepMat(def){
  const items = [], byId = {};
  for (const q of def.periph || []){
    if (!q || typeof q.id !== 'string' || !Array.isArray(q.at)){ note('periph without an id or "at"'); continue; }
    if (byId[q.id] || MD.byId[q.id]){ note(`periph ${q.id}: the id is already used`); continue; }
    let it;
    if (q.board){
      const reg = B.defs.board[q.board] || B.defs.module[q.board];
      if (!reg){ note(`periph ${q.id}: board "${q.board}" is not on the page (add // @cf use boards/${q.board}.js)`); continue; }
      const pmd = prep(withVariant(reg, q.variant || reg.variant), 'board');
      it = { kind: 'board', md: pmd, w: pmd.pcb.w, h: pmd.pcb.h, name: q.name || pmd.name };
    } else if (q.part){
      const partDef = B.parts[q.part];
      if (!partDef){ note(`periph ${q.id}: unknown part "${q.part}"`); continue; }
      const [w, h] = q.size || partDef.matSize || [20, 12];
      it = { kind: 'part', def: partDef, w, h, name: q.name || partDef.name || q.part };
    } else { note(`periph ${q.id}: give it a board or a part`); continue; }
    Object.assign(it, { id: q.id, q, at: q.at, step: q.step || null });
    items.push(it); byId[q.id] = it;
  }
  const steps = (def.matSteps || []).map(s => typeof s === 'string' ? { id: s, label: s } : s).filter(s => s && typeof s.id === 'string');
  for (const s of steps) if (CF_SLUG(s.id) !== s.id) note(`mat step "${s.id}": use a lower-case slug id`);
  const wires = (def.wires || []).filter(w => w && typeof w.from === 'string' && typeof w.to === 'string');
  for (const x of [...items, ...wires]) if (x.step && !steps.some(s => s.id === x.step)) note(`mat: step "${x.step}" is not in matSteps`);
  MAT = { items, byId, steps, wires };
}
const stepOn = sid => !sid || MAT.steps.findIndex(s => s.id === sid) <= st.matStep;
const periphOn = id => { const it = MAT.byId[id]; return !!it && stepOn(it.step); };
B.matSetup = () => MAT;

/* ---------- messages ---------- */
const MSG = {
  live: 'Unplug the power first: never work on a live board',
  exploded: 'Close the exploded view first',
  smdFirst: 'SMD parts first: run pick and place + reflow. The oven would melt plastic parts',
  lowFirst: 'Low parts first: with tall parts on, the board rocks and loose parts fall out when you flip it to solder',
  lastAfter: 'Solder everything first: this part goes on last',
  socketAfter: 'Solder everything first. Never heat a chip sitting in its socket',
  nothing: 'Nothing to solder yet: place a part first',
  plugFirst: 'Plug in USB first: uploads go over the cable',
  busy: 'Uploading: wait for it',
  faulted: 'Fix the fault first: unplug, then repair',
};
B.MSG = MSG;
const say = (text, vars, ms = 2200) => { const t = T(text, vars); st.msg = t; ui && ui.flash(t, ms); };
B.say = (t, v, ms) => say(t, v, ms);

/* ---------- power tree ---------- */
function evaluate(){
  const pw = MD.power, ev = { rails: {}, status: 'off', fault: null, why: '', load: 0 };
  const src = st.power ? (pw.sources || {})[st.power] : null;
  if (!src){ return ev; }
  // one source can feed several rails at once (a bench supply: feeds { VM: 7.4, VCC: 5 }); a wrong voltage scales them all
  const feeds = src.feeds || {}, v0 = src.v != null ? src.v : Math.max(0, ...Object.values(feeds).map(Number));
  const sv = st.supply[st.power] != null ? st.supply[st.power] : v0, scale = v0 ? sv / v0 : 1;
  const rev = st.faults.includes('reverse-polarity:' + st.power);
  const ok = id => !id || (isSet(id) && !isRev(id) && !coldOff(id));
  const gone = [src.part, ...(src.parts || [])].find(id => id && (MAT.byId[id] ? !periphOn(id) : !isSet(id)));
  if (gone){ ev.status = 'no-power'; ev.why = T('No power: {name} is missing', { name: nameOf(gone) }); return ev; }
  const rails = Object.assign(Object.fromEntries(Object.keys(feeds).map(r => [r, { from: [] }])), pw.rails || {});
  // a feed condition [ref, op, value]: ref a rail (its volts so far) or 'ctl:<id>' (a control's position: a power switch)
  const cmp = ([ref, op, lim]) => { const v2 = typeof ref === 'string' && ref.startsWith('ctl:') ? (st.ctl[ref.slice(4)] || 0) : (ev.rails[ref] || 0);
    return op === '>' ? v2 > lim : op === '<' ? v2 < lim : op === '!=' ? v2 !== lim : v2 === lim; };
  let burned = null;
  const fedBy = {};     // the feed each rail takes its voltage from (null: straight from the source)
  for (const [rid, rail] of Object.entries(rails)){
    let best = 0, bestFd = null;
    if (own(feeds, rid)){
      if (rev) burned = burned || { part: rail.burns || (pw.mcu && pw.mcu.part), kind: 'reverse' };
      else best = +feeds[rid] * scale;
    }
    for (const fd of rail.from || []){
      let vin = 0;
      if (fd.src){ if (fd.src !== st.power) continue; vin = rev ? -sv : sv; }
      else if (fd.rail){ vin = ev.rails[fd.rail] || 0; }
      const via = fd.via || [];
      if (!via.every(ok)){ continue; }
      if (vin < 0){
        if (fd.protect && via.includes(fd.protect)){ ev.why = T('Reverse polarity: {name} blocks it, nothing powers up', { name: nameOf(fd.protect) }); continue; }
        burned = burned || { part: fd.burns || via[via.length - 1] || (pw.mcu && pw.mcu.part), kind: 'reverse' }; continue;
      }
      if (fd.offIf && cmp(fd.offIf)) continue;
      if (fd.onlyIf && !cmp(fd.onlyIf)) continue;
      if (fd.max != null && vin > fd.max){ burned = burned || { part: via[via.length - 1], kind: 'over', v: vin }; continue; }
      let v = vin;
      if (fd.reg != null) v = Math.min(fd.reg, vin - (fd.dropout || 0));
      else v = vin - (fd.drop || 0);
      if (v > best){ best = v; bestFd = fd; }
    }
    // victim: the part an over-voltage damages (a name, or { part, fails: 'short' }: it fails short and takes the rail down)
    if (rail.max != null && best > rail.max){ const vc = rail.victim && typeof rail.victim === 'object' ? rail.victim : { part: rail.victim };
      burned = burned || { part: vc.part || (pw.mcu && pw.mcu.part), kind: 'over', v: best, rail: rid, short: vc.fails === 'short' }; }
    ev.rails[rid] = Math.max(0, best); fedBy[rid] = bestFd;
  }
  // overloads and shorts sag a rail
  // (the circuit on the breadboard can do it too: more current than the source gives, st.sag from bench-bb.js)
  const sag = !!(st.sag && st.sag.until > st.on);
  if (st.faults.includes('brownout') && brownout()){ const r = pw.mcu.rail; if (ev.rails[r]) ev.rails[r] = coldHit(5, st.on * 1.4) ? ev.rails[r] * .42 : ev.rails[r] * .9; }
  else if (sag && pw.mcu){ const r = pw.mcu.rail; if (ev.rails[r]) ev.rails[r] *= .42; }
  // a short on a rail fed through a current-limited regulator (feed ilim, amps) folds that regulator back: the rail and
  // the rails it feeds fall to 0 V and the rest keeps running; any other short trips the supply
  for (const fid of st.faults) if (fid.startsWith('short:')){
    const [, a, b2] = fid.split(':');
    for (const r of [a, b2]) if (own(ev.rails, r)){
      const fd = fedBy[r];
      if (fd && fd.ilim && ev.rails[r] > 0){
        const dead = new Set([r]);
        for (const k of Object.keys(ev.rails)) if (dead.has(k) || (fedBy[k] && fedBy[k].rail && dead.has(fedBy[k].rail))){ dead.add(k); ev.rails[k] = 0; }
        const reg = (fd.via || [])[(fd.via || []).length - 1];
        ev.why = T('Short between {a} and {b}: {name} limits its current, so {rail} falls to 0 V and the rest runs', { a, b: b2, name: reg ? nameOf(reg) : r, rail: r });
      } else { for (const k of Object.keys(ev.rails)) ev.rails[k] = 0; ev.why = T('Short between {a} and {b}: the supply trips', { a, b: b2 }); }
    }
  }
  if (burned){
    const pid = burned.part || '';
    ev.status = 'fault';
    // a victim that fails short pulls its rail to 0 V, and every rail fed from it
    if (burned.short){ const dead = new Set([burned.rail]);
      for (const k of Object.keys(ev.rails)) if (dead.has(k) || (fedBy[k] && fedBy[k].rail && dead.has(fedBy[k].rail))){ dead.add(k); ev.rails[k] = 0; } }
    ev.fault = burned.kind === 'reverse'
      ? { id: 'reverse-polarity:' + st.power, kind: 'hot', part: pid, msg: T('Reverse polarity: {name} burned', { name: nameOf(pid) }), fix: T('Swap the leads') }
      : { id: 'wrong-voltage:' + st.power, kind: 'hot', part: pid, msg: T('{v} V on {src}: {name} is damaged', { v: (+burned.v).toFixed(1), src: T(src.label || st.power), name: nameOf(pid) }), fix: T('Use {range} V', { range: (src.range || [src.v, src.v]).join('–') }) };
    return ev;
  }
  // reversed polar parts on a live board (polar.rail: only while that rail is live, so a cap on VIN is safe on USB)
  for (const p of MD.parts) if (p.polar && isIn(p.id) && isRev(p.id) && isSet(p.id)){
    if (p.polar.rail && !((ev.rails[p.polar.rail] || 0) > .5)) continue;
    const kind = p.polar.fault || (p.kind === 'ecap' || p.kind === 'ecap-smd' ? 'pop' : /led/.test(p.kind) ? 'dark' : 'hot');
    if (kind === 'dark') continue;
    ev.status = 'fault';
    ev.fault = { id: 'reversed:' + p.id, kind, part: p.id, msg: T('{name} is in backwards', { name: nameOf(p.id) }), fix: T('Unplug, then turn it round') };
    return ev;
  }
  const live = Object.values(ev.rails).some(v => v > .5);
  if (!live){ ev.status = 'no-power'; if (!ev.why) ev.why = T('No power: nothing reaches the board'); return ev; }
  ev.status = 'powered';
  const mcu = pw.mcu;
  if (mcu){
    const v = ev.rails[mcu.rail] || 0;
    if (v < .5){ ev.status = 'no-power'; ev.why = T('No power on {rail}: nothing reaches the chip', { rail: mcu.rail }); return ev; }
    if (v < (mcu.min || 0)){ ev.status = 'brownout';
      ev.why = sag ? T('Brown-out: the circuit draws {n} mA, more than {src} gives ({max} mA), so the chip keeps resetting', { n: st.sag.mA, src: T(src.label || st.power), max: st.sag.max })
        : T('Brown-out: {rail} is at {v} V, the chip keeps resetting', { rail: mcu.rail, v: v.toFixed(1) }); return ev; }
    const miss = (mcu.needs || []).find(id => !isSet(id) || coldOff(id));
    if (miss){ ev.why = T('Powered, but nothing runs: {name} is missing', { name: nameOf(miss) }); return ev; }
    // bootNeeds: parts only the power-up start reads (an FPGA's config flash); a program uploaded since runs without them
    const bootMiss = !st.loaded && !st.ext && (mcu.bootNeeds || []).find(id => !isSet(id) || coldOff(id));
    if (bootMiss){ ev.why = T('Powered, but nothing loads at power-up: {name} is missing', { name: nameOf(bootMiss) }); return ev; }
    if (st.ctl && Object.entries(st.ctl).some(([id, v]) => v && MD.byId[id] && MD.byId[id].control && MD.byId[id].control.action === 'reset')){ ev.status = 'reset'; return ev; }
    ev.status = 'running';
    // a strap latched at the last restart that keeps the sketch from starting (ROM boot mode)
    if (st.strap && st.strap.halts){ ev.status = 'fault'; ev.fault = { id: st.strap.fault, kind: 'boot', part: st.strap.part || mcu.part, msg: T(st.strap.msg || 'Boot strap'), fix: T(st.strap.fix || 'Free the pin and press RESET') }; }
  }
  return ev;
}
B.evaluate = () => evaluate();

/* boot straps (def.straps: [{ fault, boot, halts?, part?, blocks?: ['upload', 'serial'], msg, fix }]): the chip reads its
   mode pins when the program (re)starts (power on, RESET released, an upload done), so a strap fault in force then is
   latched until the next restart. halts: the sketch never starts (status fault, kind boot); blocks: it runs, but
   uploads are refused with msg and its Serial lines stop. state.boot reports the latched strap's boot. */
const sampleStraps = () => { st.strap = (MD.def.straps || []).find(x => x && typeof x.fault === 'string' && st.faults.includes(x.fault)) || null; };
const strapBlocks = what => !!(st.strap && (st.strap.blocks || []).includes(what));

/* ---------- outputs: pin levels and LEDs ---------- */
function outputs(){
  const o = { pins: {}, leds: {}, ev: st.ev };
  const ev = st.ev, running = ev.status === 'running' && !st.up && st.t >= 0, bl = MD.def.bootloader;

  const prev = st.ev ? st.ev.status : 'off';
  st.ev = evaluate(); st.o = outputs();
  if (B.bbStep) B.bbStep(st, 0);
  runModel(0);
  if (newPower && st.power){
    const ev = st.ev;
    if (ev.status === 'fault' && prev !== 'fault'){ const fk = ev.fault.kind; if (fk !== 'boot') sfx(fk === 'pop' ? 'pop' : 'sizzle'); say(ev.fault.msg, null, 3200); }
    else if (ev.status === 'running' && prev !== 'running'){ const md = MD.modes[st.mode]; say(md && md.powerMsg ? md.powerMsg : 'Powered: {name} starts', { name: md ? T(md.title) : '' }); }
    else if (ev.why && ev.status !== prev) say(ev.why, null, 3000);
  }
  syncKeys();
  kick();
}
B.refresh = () => refresh();

/* ---------- drawing ---------- */
const pcbOutline = () => {
  const { w, h, r } = MD.pcb;
  if (MD.pcb.outline) return MD.pcb.outline;
  const rr = Math.min(r || 0, w / 2, h / 2), pts = [];
  const corner = (cx, cy, a0) => { for (let i = 0; i <= 4; i++){ const a = (a0 + i * 22.5) * Math.PI / 180; pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); } };
  if (rr <= .05) return [[0, 0], [w, 0], [w, h], [0, h]];
  corner(w - rr, rr, 270); corner(w - rr, h - rr, 0); corner(rr, h - rr, 90); corner(rr, rr, 180);
  return pts;
};
B.pcbOutline = () => pcbOutline();
const area2 = pts => { let a = 0; for (let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a; };

function drawMat(x0, y0, x1, y1){
  // the cutting mat in board coordinates (x0..x1, y0..y1)
  const c = [BP(x0, y0, -G.top), BP(x1, y1, -G.top)];
  const wx0 = Math.min(c[0][0], c[1][0]), wx1 = Math.max(c[0][0], c[1][0]), wy0 = Math.min(c[0][1], c[1][1]), wy1 = Math.max(c[0][1], c[1][1]);
  let s = board(wx0, wy0, wx1, wy1, G.matH, 4, M.mat);
  let g = '';
  for (let x = Math.ceil(wx0 / 10) * 10; x < wx1; x += 10) g += `M${P(x, wy0 + 1, G.matH).map(f).join(' ')}L${P(x, wy1 - 1, G.matH).map(f).join(' ')}`;
  for (let y = Math.ceil(wy0 / 10) * 10; y < wy1; y += 10) g += `M${P(wx0 + 1, y, G.matH).map(f).join(' ')}L${P(wx1 - 1, y, G.matH).map(f).join(' ')}`;
  s += `<path d="${g}" fill="none" stroke="#a9b096" stroke-width=".5" opacity=".7"/>`;
  return { svg: s, top: boardTop(wx0, wy0, wx1, wy1, G.matH, 4) };
}
B.drawMat = drawMat;

function drawPCB(k){
  const pcb = MD.pcb, out = pcbOutline(), th = pcb.thick;
  const top = out.map(([x, y]) => BP(x, y, 0)), bot = out.map(([x, y]) => BP(x, y, -th));
  const sgn = Math.sign(area2(top.map(p => [p[0], p[1]]))) || 1, mm = matOf(pcb.color);
  const walls = [];
  for (let i = 0; i < out.length; i++){
    const j = (i + 1) % out.length, d = sub(top[j], top[i]), n = norm([d[1] * sgn, -d[0] * sgn, 0]);
    if (!vis(n)) continue;
    walls.push({ at: mean([top[i], top[j]]), svg: face(pd([bot[i], bot[j], top[j], top[i]]), toneI(n, { l: mm.m, m: mm.d, d: mix(mm.d, '#000000', .3) })) });
  }
  walls.sort((a, b) => depthOf(a.at) - depthOf(b.at));
  const op = 1 - .4 * k;
  let s = `<g opacity="${f(op)}">` + walls.map(w => w.svg).join('') + fill(pd(top), mm.l) + '</g>';
  // FR-4 core line on the visible edges and the outline
  s += `<path d="${pd(bot)}" fill="none" stroke="${INK}" stroke-width="1"/>` + ink(pd(top), 1.1);
  s += hullInk([...top, ...bot], 1.6);
  // copper traces under the mask
  const tcol = mix(mm.l, '#ffffff', .16);
  for (const tr of MD.def.traces || []) s += `<path d="${pd(tr.map(([x, y]) => BP(x, y, .02)), false)}" fill="none" stroke="${tcol}" style="stroke-width:.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  // mounting holes
  for (const [x, y, d = 3.2] of MD.def.holes || []){
    s += fill(pd(circ(x, y, d / 2 + 1.1).map(([u, v]) => BP(u, v, .03))), M.tin.l) + ink(pd(circ(x, y, d / 2 + 1.1).map(([u, v]) => BP(u, v, .03))), .5);
    s += fill(pd(circ(x, y, d / 2).map(([u, v]) => BP(u, v, .04))), M.hole);
  }
  // silkscreen: printed on the board, so it reads the same in every language (never through T, whose keys it would
  // share with on-screen labels such as "ON" and "POWER")
  for (const [x, y, str, size = 1.6, rot = 0] of MD.def.silk || []){
    const r = rot * Math.PI / 180;
    s += B.flatText(BP(x, y, .05), Math.cos(r), Math.sin(r), String(str), size * 1.3, pcb.silk, 800);
  }
  // footprints of parts that are off the board: pads and a silk outline
  for (const p of MD.parts){
    if (isIn(p.id) || p.side === 'bottom' || p.kind === 'passives') continue;
    const { ctx } = partCtx(Object.assign({}, p, { z: 0 }), st, {});
    const [l, w] = p.size;
    s += `<path d="${pd([[-l / 2, -w / 2], [l / 2, -w / 2], [l / 2, w / 2], [-l / 2, w / 2]].map(([a, b]) => ctx.W(a, b, .05)))}" fill="none" stroke="${pcb.silk}" stroke-width=".7" stroke-dasharray="1.5 1.2" opacity=".85"/>`;
    const kd = B.kinds[p.kind]; if (kd.pads) s += kd.pads(ctx);
  }
  return { svg: s, top, bot };
}

function drawParts(o, k){
  const items = [];
  const ex = ease(clamp(st.exK, 0, 1));
  for (const p of MD.parts){
    if (!isIn(p.id)) continue;
    const kd = B.kinds[p.kind];
    const drop = st.drop[p.id] != null ? clamp(st.drop[p.id], 0, 1) : 1;
    const lift = (LIFT[p.group] || 0) * ex + (1 - ease(drop)) * 14;
    const fault = st.ev.fault && st.ev.fault.part === p.id ? st.ev.fault.kind : null;
    const opt = { lift, k, lit: o.leds[p.id] || 0, rev: isRev(p.id), sel: st.sel === p.id || (st.accent || []).includes(p.id), hot: fault === 'hot', pop: fault === 'pop',
      on: !!(st.ctl[p.id]), sold: isSet(p.id), o };
    const { ctx, items: its } = partCtx(p, st, opt);
    try { kd.draw(ctx); } catch (e) { note(`${p.id} (${p.kind}): ${e.message}`); }
    if (k > 0 && kd.xr) try { kd.xr(ctx); } catch (e) { note(`${p.id} xr: ${e.message}`); }
    const actName = p.control ? 'ctl' : 'part', data = `data-id="${CF_ESC(p.id)}" data-label="${CF_ESC(p.name)}"`;
    for (const it of its){
      let svg = it.svg;
      if (opt.sel) svg = `<g class="bsel">${svg}</g>`;
      if (opt.hot) svg = `<g filter="url(#bhot)">${svg}</g>`;
      items.push({ box: it.box, svg: act(actName, svg, data) });
    }
    // the soldering iron visits the part being soldered
    if (st.solderQ && st.solderQ[0] === p.id){ const tp = ctx.W(0, 0, p.h + 2); items.push({ box: [[tp[0] - 1, tp[1] - 1, tp[2]], [tp[0] + 1, tp[1] + 1, tp[2] + 30]], svg: ironSvg(tp) }); }
    if ((fault === 'hot' || fault === 'pop') && st.power) items.push({ box: [ctx.W(0, 0, p.h + 1), ctx.W(0, 0, p.h + 1)].map((q, i) => i ? q.map(v => v + 1) : q), svg: smokeSvg(ctx, p) });
  }

}
const ironSvg = tp => {
  const a = [tp[0], tp[1], tp[2]], b = [tp[0] + 10, tp[1] + 14, tp[2] + 26];
  return rod(a, [tp[0] + 2.5, tp[1] + 3.5, tp[2] + 6.5], .5, M.steel, toneI, .7, .2) + rod([tp[0] + 2.5, tp[1] + 3.5, tp[2] + 6.5], b, 1.6, matOf('#3f6fb5'), toneI, 1)
    + `<circle cx="${f(P(...a)[0])}" cy="${f(P(...a)[1])}" r="1.4" fill="#ffd27a" opacity=".9"/>`;
};
const smokeSvg = (ctx, p) => {
  const t = st.t; let s = '';
  for (let i = 0; i < 4; i++){ const ph = (t * .7 + i / 4) % 1, [X, Y] = ctx.P(0, 0, p.h + 1 + ph * 16);
    s += `<circle cx="${f(X + Math.sin(i * 2 + t) * 2.5)}" cy="${f(Y)}" r="${f(1.6 + ph * 4)}" fill="#8a847a" opacity="${f(.45 * (1 - ph))}"/>`; }
  return s;
};

/* the plug and cable for the connected source */
function drawSupply(){
  const src = st.power ? MD.power.sources[st.power] : null;
  if (!src || !src.part || !isIn(src.part)) return [];
  const p = MD.byId[src.part], kd = B.kinds[p.kind];
  if (!kd.plug) return [];
  const { ctx, items } = partCtx(p, st, { lift: 0 });
  try { kd.plug(ctx, src, st.faults.includes('reverse-polarity:' + st.power)); } catch (e) { note('plug: ' + e.message); }
  return items;
}

function drawTags(k){
  let s = '';
  if (k > .6) return s;
  // parts close together would stack their pills (the Uno's crystal over its power jack): each pill moves on along
  // its own direction past the ones already placed (sizes as tag() draws them: a numbered badge on a phone)
  const placed = [];
  const u = window.LBL_U ? LBL_U() : 0, fs = u ? 10 * u : 8.6 * INK_K, h = u ? 17 * u : fs * 1.8;
  const hits = b => placed.some(o => b.x0 < o.x1 + 2 && o.x0 - 2 < b.x1 && b.y0 < o.y1 + 2 && o.y0 - 2 < b.y1);
  for (const [id, dx, dy0] of MD.def.tags || []){
    const p = MD.byId[id]; if (!p || !isIn(id)) continue;
    const { ctx } = partCtx(p, st, { lift: (LIFT[p.group] || 0) * ease(clamp(st.exK, 0, 1)) });
    const working = (st.o.leds[id] || 0) > .5 || (st.ev.status === 'running' && MD.power.mcu && MD.power.mcu.part === id) || st.sel === id;
    const at = ctx.W(0, 0, p.h), [X, Y] = P(...at), txt = p.short || p.name, w = u ? h * 1.3 : CF_TW(CF_T(txt), fs) + fs * 1.5;
    const pill = dy => ({ x0: X + dx * INK_K - w / 2, x1: X + dx * INK_K + w / 2, y0: Y + dy * INK_K - h / 2, y1: Y + dy * INK_K + h / 2 });
    const step = (dy0 < 0 ? -1 : 1) * (h / INK_K + 3);
    let dy = dy0;
    for (let n = 0; n < 6 && hits(pill(dy)); n++) dy += step;
    placed.push(pill(dy));
    s += tag(at, dx, dy, txt, working);

}
function xrLayer(k){
  if (k < .05) return '';

  for (const [net, path] of (MD.def.xr && MD.def.xr.flow) || []){
    const live = (st.ev.rails[net] || 0) > .5 || (st.o.pins[net] || 0) > .5 || flowOn(net);
    const pts = path.map(([x, y]) => BP(x, y, .3));
    s += `<path d="${pd(pts, false)}" fill="none" stroke="#f7a531" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="${f(.55 * k)}"/>`;
    if (!live) continue;
    let len = 0; const seg = []; for (let i = 1; i < pts.length; i++){ const d = Math.hypot(...sub(pts[i], pts[i - 1])); seg.push(d); len += d; }
    for (let j = 0; j < Math.max(2, Math.floor(len / 9)); j++){
      let u = ((t * 14 + j * 9) % len); let i = 0; while (i < seg.length - 1 && u > seg[i]){ u -= seg[i]; i++; }
      const a = pts[i], b2 = pts[i + 1] || a, q = seg[i] ? u / seg[i] : 0, pt = a.map((v, kk) => v + (b2[kk] - v) * q), [X, Y] = P(...pt);
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.3" fill="#ffd34d" stroke="${INK}" stroke-width=".5" opacity="${f(k)}"/>`;
    }
  }
  return s;
}
function xrNotes(k){
  if (k <= .6) return '';
  const items = [];
  for (const p of MD.parts){
    if (!isIn(p.id)) continue;
    const kd = B.kinds[p.kind]; if (!kd.xr) continue;
    const notes = (MD.def.xr && MD.def.xr.notes) || [], note2 = notes.find(n => n[0] === p.id);
    if (notes.length ? !note2 : !kd.xrLabel) continue;
    const { ctx } = partCtx(p, st, {});
    items.push({ at: ctx.W(0, 0, p.h), text: note2 ? note2[1] : kd.xrLabel(p), on: (st.o.leds[p.id] || 0) > .5 || (MD.power.mcu && MD.power.mcu.part === p.id && st.ev.status === 'running') });
  }
  if (!items.length) return '';
  items.splice(8);
  const pc = [BP(0, 0, 0), BP(MD.pcb.w, MD.pcb.h, MD.height)];
  LBL.items.push(...items);
  LBL.box = growBox(LBL.box, [[Math.min(pc[0][0], pc[1][0]), Math.min(pc[0][1], pc[1][1]), G.top], [Math.max(pc[0][0], pc[1][0]), Math.max(pc[0][1], pc[1][1]), G.top + 10]]);

/* callouts: the board's notes (xrNotes) and the see-through labels of breadboard and mat parts, whose draw calls

B.labeller = () => {
  const mine = [];
  return { label: (at, text, on) => { if (Array.isArray(at) && at.length === 3 && text) mine.push({ at, text, on: !!on }); },
    done: boxes => { if (!mine.length) return; LBL.items.push(...mine); for (const b of boxes) if (b) LBL.box = growBox(LBL.box, b); } };
};

/* things on the mat: a periph board is drawn in its own frame (G and B.md swapped while it draws) */
function inFrame(it, fn){
  const s = { ox: G.ox, oy: G.oy, pw: G.pw, ph: G.ph, z0: G.z0, top: G.top }, md0 = B.md, pc = it.md.pcb;
  G.ox = s.ox + s.ph - it.at[1] - pc.h; G.oy = s.oy + s.pw - it.at[0] - pc.w; G.pw = pc.w; G.ph = pc.h;
  G.z0 = G.matH + pc.standoff; G.top = G.z0 + pc.thick; B.md = it.md;
  try { return fn(); } finally { Object.assign(G, s); B.md = md0; }
}
const matErrs = new Set();
const matNote = m => { if (!matErrs.has(m)){ matErrs.add(m); note(m); } };
const periphData = it => `data-id="${CF_ESC(it.id)}" data-label="${CF_ESC(it.name)}"`;
function periphBoard(it, k, live){
  return inFrame(it, () => {
    const pc = it.md.pcb, items = [], data = periphData(it), sel = st.sel === it.id || (st.accent || []).includes(it.id);
    const wrap = svg => act('periph', sel ? `<g class="bsel">${svg}</g>` : svg, data);
    items.push({ box: aabb([BP(0, 0, -pc.thick), BP(pc.w, pc.h, 0)]), svg: wrap(slabW(BP, 0, 0, pc.w, pc.h, -pc.thick, 0, matOf(pc.color))) });
    for (const [x, y] of [[1.5, 1.5], [pc.w - 1.5, 1.5], [1.5, pc.h - 1.5], [pc.w - 1.5, pc.h - 1.5]]){
      const w = BP(x, y, 0); items.push({ box: [[w[0] - 1, w[1] - 1, G.matH], [w[0] + 1, w[1] + 1, G.z0]], svg: cyl(w[0], w[1], G.matH, G.z0, 1.1, M.gold, toneI, .6, 10) });
    }
    const o = { pins: {}, leds: {}, ev: st.ev };
    for (const p of it.md.parts){
      const kd = B.kinds[p.kind], lit = p.led && p.led.rail && live ? 1 : 0;
      const { ctx, items: its } = partCtx(p, st, { k, lit, sold: true, o });
      try { kd.draw(ctx); } catch (e) { matNote(`periph ${it.id} ${p.id}: ${e.message}`); }
      for (const x of its) items.push({ box: x.box, svg: wrap(x.svg) });
    }

const legsOf = it => {
  const n = (it.def.legs || []).length, z = G.matH - G.top;

  return pts.map(([x, y]) => BP(x, y, z));
};

  const p = Object.assign({ id: it.id, part: it.q.part }, it.def.example || {}, it.q.params || {});
  const pl = { at: (x, y, zz = z) => BP(it.at[0] + x, it.at[1] + y, zz), zTop: z, geo: null };
  const put = (bx, svg) => { if (svg) items.push({ box: bx, svg: act('periph', sel ? `<g class="bsel">${svg}</g>` : svg, periphData(it)) }); };
  const lb = B.labeller();
  try { it.def.draw({ p, st, legs, holes: [], origin: BP(it.at[0] + it.w / 2, it.at[1] + it.h / 2, z), pl, m: (st.readings || {})[it.id] || {}, lit: live ? 1 : 0, sel, k, put, label: lb.label }); }

// a wire end in world coordinates, and the base net it sits on (for the live colour)
function matEnd(ref){
  const m = /^([A-Za-z_][\w-]*)\.(.+)$/.exec(ref), it = m && MAT.byId[m[1]];
  if (it && it.kind === 'board'){
    const pmd = it.md, pin = pmd.pins[m[2]] || (pmd.netPins[m[2]] || []).map(id => pmd.pins[id])[0] || Object.values(pmd.pins).find(q => q.label === m[2]);
    if (!pin) return null;
    const part = pmd.byId[pin.part];
    return { pt: inFrame(it, () => BP(pin.at[0], pin.at[1], part && part.side === 'bottom' ? .5 : (part ? part.h + (part.z || 0) - 2 : 1))), net: null };
  }
  if (it){ const i = (it.def.legs || []).indexOf(m[2]); return i < 0 ? null : { pt: legsOf(it)[i], net: null }; }
  const pin = MD.pins[ref] || (MD.netPins[ref] ? MD.pins[MD.netPins[ref][0]] : null);

function matItems(k){

  for (const it of MAT.items) if (stepOn(it.step)) items.push(...(it.kind === 'board' ? periphBoard(it, k, live) : periphPart(it, k, live)));
  const wire = B.parts.wire;
  if (wire) for (const w of MAT.wires){
    if (!stepOn(w.step)) continue;
    const a = matEnd(w.from), b = matEnd(w.to);
    if (!a || !b){ matNote(`wire ${w.from}-${w.to}: unknown end`); continue; }
    const net = a.net || b.net, on = !!net && ((st.o.pins[net] || 0) > .5 || (st.ev.rails[net] || 0) > .5 || flowOn(net));
    const pin = a.pin || b.pin;
    wire.draw({ a: a.pt, b: b.pt, color: w.color || 'green', live: on, k, put: (bx, svg) => items.push({ box: bx, svg: act('pin', svg,
      `data-id="${CF_ESC(pin ? pin.id : w.from)}" data-part="${CF_ESC(pin ? pin.part : '')}" data-label="${CF_ESC(T('Wire from {a} to {b}', { a: w.from, b: w.to }))}"`) }) });
  }

// the mat's extent in base board mm: the board's margins, grown to hold every periph (set out or not, so the frame never jumps)
const matBox = () => {
  const m = MD.mat, box = [-m.left, -m.front, MD.pcb.w + m.right, MD.pcb.h + m.back];
  for (const it of MAT.items){ box[0] = Math.min(box[0], it.at[0] - 6); box[1] = Math.min(box[1], it.at[1] - 6); box[2] = Math.max(box[2], it.at[0] + it.w + 6); box[3] = Math.max(box[3], it.at[1] + it.h + 6); }
  return box;

// the tallest thing on the mat, in board z: the board, or a periph standing higher (a TT motor's wheel, a module on
// its standoffs), so the frame holds it at every step of the mat
const matTop = () => {
  let h = MD.height;
  for (const it of MAT.items){
    if (it.kind === 'board') h = Math.max(h, G.matH + it.md.pcb.standoff + it.md.pcb.thick + it.md.height - G.top);
    else { const ft = Array.isArray(it.def.foot) ? it.def.foot[2] : +it.def.height; if (ft > 0) h = Math.max(h, G.matH - G.top + ft); }
  }
  return h;
