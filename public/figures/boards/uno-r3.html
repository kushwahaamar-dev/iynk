/* the board view (also the base of the breadboard view) */
B.boardItems = (o, k) => [...drawParts(o, k), ...drawSupply()];
B.drawBoardBase = k => drawPCB(k);
function sceneBoard(k){
  if (MD.def.noBoard) return VIEWS.breadboard ? VIEWS.breadboard.scene(k) : '';
  const mat = drawMat(...matBox());
  const pcb = drawPCB(k);
  let s = mat.svg;
  // standoffs (none on a board that stands on its header pins: pcb.standoffs false), then the PCB's shadow on the mat
  if (MD.pcb.standoffs !== false) for (const [x, y] of MD.def.holes || []){ const w = BP(x, y, 0); s += cyl(w[0], w[1], G.matH, G.z0, 2.3, M.gold, toneI, .8, 12); }
  s += castShadow([...pcb.top, ...pcb.bot], G.matH, mat.top);
  s += pcb.svg;
  const items = [...B.boardItems(st.o, k), ...matItems(k)];
  s += byDepth(items);

}

/* views share one frame: each view's bounds are fitted into the frame the core computed at mount */
const VIEWS = {};
B.viewDef = (name, def) => { VIEWS[name] = def; };
let fitCache = {};
function viewFit(name, corners){

  if (!fitCache[name]){
    const saveY = YAW, saveP = PITCH; setCam(YAW0, PITCH0);
    const ext = cs => { const pts = cs.map(c => P(...c)); const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)]; };
    const base = ext(B.boxCorners(VIEWS[B.mountView || 'board'].bounds())), cur = ext(corners);
    fitCache[name] = Math.min(base[0] / cur[0], base[1] / cur[1], 1);

}
B.boxCorners = ([x0, y0, z0, x1, y1, z1]) => { const c = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) c.push([x, y, z]); return c; };

  scene: k => sceneBoard(k),

const fadeToFrame = svg => {
  const el = document.getElementById('fig'), vb = el && el.viewBox && el.viewBox.baseVal;
  if (!vb || !vb.width) return svg;
  const r = `x="${f(vb.x)}" y="${f(vb.y)}" width="${f(vb.width)}" height="${f(vb.height)}"`;
  return `<defs><radialGradient id="bpfade" cx=".5" cy=".5" r=".5"><stop offset=".68" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>`
    + `<mask id="bpmask" maskUnits="userSpaceOnUse" ${r}><rect ${r} fill="url(#bpfade)"/></mask></defs><g mask="url(#bpmask)">${svg}</g>`;
};
function scene(stt){
  const k = ease(stt.xr || 0);
  const v = VIEWS[stt.view] ? stt.view : 'board';
  const vd = VIEWS[v];
  if (vd.flat) return vd.scene(k);
  const bnd = vd.bounds(), corners = B.boxCorners(bnd);
  // the breadboard view is fitted per circuit: a motor on the mat needs a wider frame than a blinking LED
  const sc = v === (B.mountView || 'board') ? 1 : viewFit(v === 'breadboard' ? v + ':' + stt.circuit : v, corners);
  LBL.items = []; LBL.box = null;
  let svg = vd.scene(k), map = w => w;
  if (sc !== 1){
    const c3 = [(bnd[0] + bnd[3]) / 2, (bnd[1] + bnd[4]) / 2, (bnd[2] + bnd[5]) / 2], pc = P(...c3), rc = P(RC[0], RC[1], RCZ);
    svg = `<g transform="translate(${f(rc[0])} ${f(rc[1])}) scale(${sc.toFixed(4)}) translate(${f(-pc[0])} ${f(-pc[1])})">${strokeDiv(svg, sc)}</g>`;
    // P is affine, so the world point RC + sc·(w − c3) lands where the scaled drawing put w
    map = w => [RC[0] + sc * (w[0] - c3[0]), RC[1] + sc * (w[1] - c3[1]), RCZ + sc * (w[2] - c3[2])];

  if (MD.def.partPage) svg = fadeToFrame(svg);
  if (LBL.items.length && LBL.box){
    const a = map(LBL.box[0]), b = map(LBL.box[1]);
    svg += xrCallouts(LBL.items.map(it => Object.assign({}, it, { at: map(it.at) })), [a[0], b[0], a[1], b[1], a[2], b[2]]);
  }
  return svg;
}

function faultChoices(){
  const out = [['', '']]; out.length = 0;
  const srcs = MD.power.sources || {};
  for (const [key, s] of Object.entries(srcs)){
    // a scenario source (a sensor's 5 V output on a pin, set up by a lesson) is not a supply to get wrong
    if (s.scenario) continue;
    if (s.plug === 'barrel' || s.pin) out.push(['reverse-polarity:' + key, T('Reverse polarity on {src}', { src: T(s.label || key) })]);
    if (s.range){ out.push([`wrong-voltage:${key}:${s.max != null ? s.max + 4 : s.range[1] * 2}`, T('Too high a voltage on {src}', { src: T(s.label || key) })]);

  }
  if (brownout() && !listsFault('brownout')) out.push(['brownout', T(typeof MD.power.brownout === 'string' ? MD.power.brownout : 'Motor on the 5 V pin (brown-out)')]);
  for (const p of MD.parts) if (p.polar && !p.fixed) out.push(['reversed:' + p.id, T('{name} in backwards', { name: p.id })]);

  for (const p of cold) out.push(['cold:' + p.id, T('Cold joint on {name}', { name: p.id })]);

// One patch is one moment on the bench: unplug first, then change the board (build, parts, fault, mat, controls), then
// plug in, so { power: 'usb', fault: 'missing:Y2' } shows the powered board without Y2 and { power: null, build: 'bare' }
// unplugs before it strips. A host fault replaces the one before it (the host shows one failure at a time).
// A key the bench does not read is reported (the rest still apply): a host patching what a figure only takes at load
// (?variant=) otherwise fails silently.
const ACCEPT_KEYS = new Set(['power', 'pins', 'mode', 'exploded', 'build', 'remove', 'restore', 'fault', 'matStep', 'circuit',
  'params', 'tones', 'inputs', 'press', 'view', 'select', 'serial']);
const accept = (s, p) => {

  for (const k of Object.keys(p)) if (!ACCEPT_KEYS.has(k)) bad('unknown key ' + k);
  const powerOk = own(p, 'power') && (p.power === null || own(MD.power.sources, p.power));
  if (own(p, 'power') && !powerOk) bad('unknown power source');
  if (own(p, 'pins')){ if (p.pins && typeof p.pins === 'object') A.setPins(p.pins); else bad('pins must be an object'); }
  if (own(p, 'mode')){ if (!A.mode(p.mode)) bad('unknown mode'); }
  if (powerOk && p.power === null) A.power(null);
  if (own(p, 'exploded')) A.explode(!!p.exploded);
  if (own(p, 'build')){ if (p.build === 'bare' || p.build === 'assembled') A.build(p.build); else bad('build must be bare or assembled'); }
  if (own(p, 'remove') && typeof p.remove === 'string') A.remove(p.remove);
  if (own(p, 'restore') && typeof p.restore === 'string') A.restore(p.restore);
  if (own(p, 'fault')){
    if (p.fault === null) A.fault(null);
    else if (typeof p.fault === 'string'){ if (st.faults.length || reversedIds().length) A.fault(null); A.fault(p.fault); }
    else bad('fault must be a string or null');
  }
  if (own(p, 'matStep')){ if (p.matStep === null || MAT.steps.some(s => s.id === p.matStep)){ if (A.matStep(p.matStep) !== true) bad('mat step refused'); } else bad('unknown mat step'); }
  if (own(p, 'circuit')){ if (p.circuit === null || own(MD.circuits, p.circuit)){ pickCircuit(p.circuit, own(p, 'mode')); refresh(); } else bad('unknown circuit'); }
  if (own(p, 'params') && p.params && typeof p.params === 'object' && B.bbParams) B.bbParams(st, p.params);
  if (own(p, 'tones')){ if (p.tones && typeof p.tones === 'object') A.setTones(p.tones); else bad('tones must be an object'); }

  if (own(p, 'inputs') && p.inputs && typeof p.inputs === 'object') for (const [k, v] of Object.entries(p.inputs)){
    if (MD.byId[k] && MD.byId[k].control){ st.ctl[k] = +v || 0; continue; }
    const part = inputParts().find(q => q.control.net === k);
    if (part) st.ctl[part.id] = +v === (part.control.active === 0 ? 0 : 1) ? 1 : 0;
    else bad(`unknown input ${k}`);
  }
  if (own(p, 'press') && p.press && typeof p.press.id === 'string') A.press(p.press.id, !!p.press.down);
  if (powerOk && p.power !== null) A.power(p.power);
  if (own(p, 'view')){ if (!A.view(p.view)) bad('unknown view'); }
  if (own(p, 'select')) A.select(typeof p.select === 'string' ? p.select : null);
  // a line from the host's program means the host runs the board, even before it has sent any pin levels (a sketch
  // that only reads and prints): the built-in program stops and the Program stat says so
  if (own(p, 'serial') && typeof p.serial === 'string'){ st.txT = .09; if (!st.ext && !st.up){ st.ext = true; refresh(); } kick(); }
  return ok;
};

/* ---------- variants: a patch on a copy of the board (functions kept), applied before a bench merges over it ---------- */
const copyDef = v => Array.isArray(v) ? v.map(copyDef) : v && typeof v === 'object' && Object.getPrototypeOf(v) === Object.prototype
  ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, copyDef(x)])) : v;
const withVariant = (def, vk) => {
  const v = def && def.variants && vk ? def.variants[vk] : null;
  if (vk && def && def.variants && !v) note(`${def.id}: no variant "${vk}"`);
  if (!v || typeof v.patch !== 'function') return def;
  return v.patch(copyDef(def)) || def;
};
B.withVariant = withVariant;

/* ---------- robotics benches: a board (or none) plus a circuit, programs and practice tasks ---------- */
B.benchToBoard = def => {
  const reg = def.board ? (B.defs.board[def.board] || B.defs.module[def.board]) : null;
  const base = reg ? withVariant(reg, CF_Q.get('variant') || def.variant || reg.variant) : null;
  if (def.board && !base) note(`bench ${def.id}: board "${def.board}" is not on the page (add // @cf use boards/${def.board}.js)`);
  const out = Object.assign({}, base || {}, def);
  if (def.circuit && typeof def.circuit === 'object'){ out.circuits = Object.assign({}, (base && base.circuits) || {}, { bench: def.circuit }); out.circuit = 'bench'; }
  if (!def.modes && base){ out.modes = base.modes; out.mode = base.mode; }
  out.faults = [...((base && base.faults) || []), ...(def.faults || [])];
  out.view = def.view || (out.circuits && Object.keys(out.circuits).length ? 'breadboard' : 'board');
  if (!base && !def.pcb) out.noBoard = true;
  return out;
};
const taskState = () => { const out = {};
  for (const t of MD.def.tasks || []){ let ok = false; try { ok = !!(t.check && t.check(st, st.o)); } catch (e) { note(`task ${t.id}: ${e.message}`); } out[t.id] = ok; }
  return out; };

/* ---------- choice ids: every id a picker can ever offer (content steps press them), checked once at mount ---------- */
function choiceIds(){
  const out = {}, loose = MD.parts.filter(p => !p.fixed);
  for (const b of buttons()){
    if (!b.choices) out[b.id] = null;
    else if (b.id === 'place') out.place = [
      ...['low', 'tall', 'last'].filter(g => loose.filter(p => p.group === g).length > 1).map(g => 'group-' + g),
      ...loose.flatMap(p => p.polar ? [p.id.toLowerCase(), p.id.toLowerCase() + '-rev'] : [p.id.toLowerCase()])];
    else if (b.id === 'remove') out.remove = loose.map(p => p.id.toLowerCase());
    else out[b.id] = b.choices().map(c => c.id);
  }
  // a control folded into a picker is still pressable on its own (its hidden button)
  for (const cid of Object.keys(ctlFolded)) out[cid] = null;
  return out;
}
B.choices = () => choiceIds();
function checkChoices(){
  const ids = new Set();
  for (const b of buttons()){ if (ids.has(b.id)) note(`two buttons have the id "${b.id}"`); ids.add(b.id); }
  for (const [id, list] of Object.entries(choiceIds())){
    const seen = new Set();
    for (const c of list || []){ if (seen.has(c)) note(`button ${id}: two choices have the id "${c}"`); seen.add(c); }
  }
}

/* ---------- mount ---------- */
function mountNow(pick){ try { start(pick); } catch (e) { note('start: ' + e.message); throw e; } }
function start(pick){
  if (B.started) return; B.started = true;
  if (!pick) pick = [...order].reverse().find(([t]) => t === 'bench') || [...order].reverse().find(([t]) => t === 'board' || t === 'module') || [...order].reverse().find(([t]) => t === 'part');
  if (!pick){ note('nothing registered'); return; }
  if (pick[0] === 'part'){ B.started = false; if (B.mountPart) B.mountPart(pick[1]); else note('no part page support'); return; }
  let def = B.defs[pick[0]][pick[1]];
  def = pick[0] === 'bench' ? B.benchToBoard(def) : withVariant(def, CF_Q.get('variant') || def.variant);
  MD = B.md = prep(def, pick[0]); layoutFor(MD); prepMat(def);
  st = B.st = {
    view: 'board', exploded: false, exK: 0, placed: {}, left: {}, drop: {}, reflowT: null, solderQ: null, solderT: 0,
    power: null, supply: {}, faults: [], mode: def.mode || Object.keys(MD.modes)[0] || null, ext: false, pins: {}, t: 0, on: 0, down: null, serialN: -1,
    up: null, upT: 0, upDur: 2.2, ctl: {}, boot: null, sel: null, serial: null, txT: 0, circuit: def.circuit || null, meas: {}, sfx: null, tones: {}, strap: null,
    matStep: MAT.steps.length - 1, readings: {}, benchStatus: null, benchStatusT: null, volts: {}, sound: null, sag: null,
  };
  for (const p of MD.parts) st.placed[p.id] = { orient: 0, sold: true };
  // a slide starts at control.start (a power switch that ships ON), else position 0
  for (const p of MD.parts) if (p.control && p.control.type === 'slide') st.ctl[p.id] = +p.control.start || 0;
  st.ev = evaluate(); st.o = outputs();
  const q = CF_Q;
  if (q.get('bare') === '1' && q.get('build') === 'bare') A.build('bare');
  if (q.get('build') === 'bare') { st.placed = {}; st.matStep = -1; for (const p of MD.parts) if (p.fixed) st.placed[p.id] = { orient: 0, sold: true }; }
  if (q.get('mat') != null){ const i = MAT.steps.findIndex(s => s.id === q.get('mat')); if (i >= 0 || q.get('mat') === '') st.matStep = i; }
  if (def.view && VIEWS[def.view]) st.view = def.view;
  if (q.get('view') && VIEWS[q.get('view')]) st.view = q.get('view');
  B.mountView = VIEWS[st.view] && !VIEWS[st.view].flat ? st.view : 'board';
  if (q.get('circuit') && own(MD.circuits, q.get('circuit'))) st.circuit = q.get('circuit');
  pickCircuit(st.circuit);
  if (q.get('exploded') === '1' || q.get('ex') === '1'){ st.exploded = true; st.exK = 1; }
  if (q.get('mode') && MD.modes[q.get('mode')]) st.mode = q.get('mode');
  if (q.get('sel')) st.sel = q.get('sel');
  for (const fid of (q.get('fault') || '').split(',').filter(Boolean)) { const [kind, a] = fid.split(':'); if (kind === 'reversed' && MD.byId[a]) st.placed[a] = { orient: 1, sold: true }; else if (kind === 'missing' && MD.byId[a]) { delete st.placed[a]; st.left[a] = true; st.faults.push(fid); } else st.faults.push(fid); }
  if (q.get('power') && own(MD.power.sources, q.get('power'))) { st.power = q.get('power'); }
  else if (q.get('power') !== '0' && q.get('build') !== 'bare' && MD.power.default && !q.get('fault')) st.power = MD.power.default;
  else if (q.get('fault') && q.get('power') !== '0' && MD.power.default) st.power = MD.power.default;
  if (st.power) sampleStraps();
  checkChoices();
  // the core frames the box [0,W] x [0,D] x [0,H]: shift the world so the mount view's bounds start at 0
  let vb = VIEWS[B.mountView].bounds(); G.ox -= vb[0]; G.oy -= vb[1]; vb = VIEWS[B.mountView].bounds();
  const z0 = Math.max(0, vb[2] || 0);
  ui = mountFigure({
    fig: def.fig || '', title: def.name, turn: 'full', size: [vb[3] - vb[0], vb[4] - vb[1], vb[5] - z0], center: [(vb[0] + vb[3]) / 2, (vb[1] + vb[4]) / 2],
    palette: def.pal || 'cobalt', state: st, scene: (s) => scene(s), buttons: buttons(), stats: () => stats(),
    acts: {
      part: (s, el) => { const id = el.dataset.id; A.select(st.sel === id ? null : id); },
      ctl: (s, el) => { const id = el.dataset.id; A.press(id, true); held = id; },
      pin: (s, el) => { A.select(el.dataset.part || null); },
      hole: () => {},
      bb: (s, el) => { const id = el.dataset.id; A.select(st.sel === id ? null : id); if (B.bbPress && B.bbPress(id, true)) heldBb = id; },
      periph: (s, el) => { A.select(st.sel === el.dataset.id ? null : el.dataset.id); },
    },
    readout: () => st.msg || '',
    embed: { report: () => report(), accept: (s, p) => accept(s, p) },
    credit: true,
  });
  addEventListener('pointerup', () => { if (heldBb){ const id = heldBb; heldBb = null; B.bbPress(id, false); } if (held){ const id = held; held = null; const p = MD.byId[id]; if (p && p.control && p.control.type !== 'slide') A.press(id, false); } });
  addEventListener('keyup', e => { if (e.key !== 'Enter' && e.key !== ' ') return;
    if (held){ const id = held; held = null; A.press(id, false); } if (heldBb){ const id = heldBb; heldBb = null; B.bbPress(id, false); } });
  // the core frames z from 0; bounds that start higher (a part page framed on its part) move the world down by z0:
  // P is affine, so raising the rotation centre and the screen offset by z0 maps z0 to where the core put 0, at any angle
  if (z0){ RCZ += z0; OY += z0; ui.render(); }
  keepFolded();
  clearStats();
  if (typeof xrMount === 'function') xrMount(() => ui, s => s.xr > .5 ? T('See-through: the chips show their silicon, copper shows where current flows') : '');
  // a hot part gets a red tint filter
  const defs = document.getElementById('fdefs') || document.querySelector('#fig defs');
  if (defs) defs.insertAdjacentHTML('beforeend', '<filter id="bhot"><feColorMatrix type="matrix" values="1 .25 .1 0 .12  .1 .45 .05 0 0  .05 .05 .35 0 0  0 0 0 1 0"/></filter>');
  const css = document.createElement('style');
  // a bench's long stats column (battery, motors, heat…) is set smaller and wraps a value at its spaces, so it stays a
  // narrow strip at the right edge instead of running over the drawing
  css.textContent = '#fig .bsel > *{filter:drop-shadow(0 0 1.6px var(--accent,#f4b829)) drop-shadow(0 0 1.6px var(--accent,#f4b829))}#fig [data-act]{cursor:pointer}'
    + '.stat.small .v{max-width:9em;text-wrap:balance}'
    + 'html.bstats-long .stats{gap:5px}html.bstats-long .stat .k{font-size:9.5px}html.bstats-long .stat .v{font-size:24px}'
    + 'html.bstats-long .stat.small .v{font-size:14px;line-height:1.15;max-width:7.5em;text-wrap:balance}'
    // on a phone the core sets the stats in one row, which runs off the left edge with this many: a three-column grid
    + '@media (max-width:560px){html.bstats-long .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;text-align:left}'
    + 'html.bstats-long .stat .v,html.bstats-long .stat.small .v{font-size:14px;max-width:none}}';
  document.head.appendChild(css);
  if (!CF_EMBED) keyList();
  if (st.power) refresh(true); else kick();
}
let held = null, heldBb = null;

// the core frames the drawing a little high and right of centre, so on a wide board the stats column (top right) can
// sit on its far end. Once laid out, the drawing moves down into the room the frame leaves below it, a few px at a
// time, until no stat (with a small margin) covers anything drawn. A stat that appears later (a program's name once it
// runs) only ever moves it further down; a resize starts again from the core's frame, since the stats keep their size
// while the drawing scales. Only in the view it opened in: once someone turns the figure, it stays where they put it.
// A phone's stats sit in a row above the drawing and never trigger it.
function clearStats(){
  const svg = document.getElementById('fig'), art = document.getElementById('art'), box = document.getElementById('stats');
  if (!svg || !art || !box || typeof document.elementsFromPoint !== 'function') return;
  const base = OY, pad = 8, step = 6, yaw = YAW, pitch = PITCH;
  const covered = () => [...box.querySelectorAll('.stat')].some(el => {
    const q = el.getBoundingClientRect(), x0 = q.left - pad, y0 = q.top - pad, w = q.width + 2 * pad, h = q.height + 2 * pad;
    for (let i = 0; i <= 8; i++) for (let j = 0; j <= 4; j++)
      if (document.elementsFromPoint(x0 + w * i / 8, y0 + h * j / 4).some(e => e !== art && art.contains(e))) return true;
    return false;
  });
  const fit = again => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox && svg.viewBox.baseVal;
    if (!r.width || !vb || !vb.width) return;
    if (again && OY !== base){ OY = base; ui.render(); }
    if (YAW !== yaw || PITCH !== pitch) return;
    const k = vb.width / r.width, most = base + r.height * .3 * k;
    while (OY + step * k <= most && r.bottom - art.getBoundingClientRect().bottom > step && covered()){ OY += step * k; ui.render(); }
  };
  let queued = 0;
  const later = again => { if (!queued) requestAnimationFrame(() => { const a = queued === 2; queued = 0; fit(a); }); queued = Math.max(queued, again ? 2 : 1); };
  later(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => later(false));
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => later(false)).observe(box);
  addEventListener('resize', () => later(true));
}

// standalone page: the SVG re-renders all the time, so keyboard and screen-reader access to the parts drawn in it is a
// group of real buttons kept off-screen (the focused one shows as a chip). Focus selects the part, Enter or Space
// presses a control for as long as the key is held. Inside the SimLab host the host's own part list does this.
let keysBox = null, keysKey = '';
function keyList(){
  keysBox = document.createElement('div'); keysBox.className = 'bkeys'; keysBox.setAttribute('role', 'group'); keysBox.setAttribute('aria-label', T('Parts'));
  document.getElementById('fig').insertAdjacentElement('afterend', keysBox);
  const css = document.createElement('style');
  css.textContent = '.bkeys button{position:fixed;left:-9999px;top:0}.bkeys button:focus{left:16px;top:auto;bottom:16px;z-index:9;padding:8px 14px;border:2px solid #1f1b16;border-radius:999px;background:#fff4d6;color:#1f1b16;font:600 14px/1.2 inherit}';
  document.head.appendChild(css);
  keysBox.addEventListener('focusin', e => { const b = e.target.closest('button'); if (b && st.sel !== b.dataset.id) A.select(b.dataset.id); });
  keysBox.addEventListener('keydown', e => { const b = e.target.closest('button'); if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); if (e.repeat) return;
    if (b.dataset.ctl && !held){ A.press(b.dataset.id, true); held = b.dataset.id; }
    else if (b.dataset.press && !heldBb && B.bbPress(b.dataset.id, true)) heldBb = b.dataset.id; });
  // a screen reader's virtual click comes without key events
  keysBox.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || held || heldBb) return;
    const id = b.dataset.id;
    if (b.dataset.ctl){ A.press(id, true); setTimeout(() => A.press(id, false), 200); }
    else if (b.dataset.press && B.bbPress(id, true)) setTimeout(() => B.bbPress(id, false), 200); });
  syncKeys();
}
function syncKeys(){
  if (!keysBox) return;
  const c = st.circuit && B.circuitNow ? B.circuitNow() : null;
  const items = MD.parts.filter(p => isIn(p.id)).map(p => [p.id, T(p.name), !!p.control]);
  if (c && st.view !== 'board') for (const q of c.parts || []) items.push([q.id, q.id + ' · ' + T((B.parts[q.part] || {}).name || q.part), false, typeof (B.parts[q.part] || {}).press === 'function']);
  const key = items.map(i => i[0]).join(' ');
  if (key === keysKey) return;
  keysKey = key; keysBox.textContent = '';
  for (const [id, label, ctl, press] of items){ const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id; if (ctl) b.dataset.ctl = '1'; if (press) b.dataset.press = '1'; b.textContent = label; keysBox.append(b); }
}
B.start = pick => start(pick);
B.ui = () => ui;
// a page built somewhere else (cfbuild --out) mounts the last item once everything has registered
addEventListener('DOMContentLoaded', () => { if (!B.started) mountNow(null); });
})();

</script>
<script>/* figures/engine/bench-kinds.js */
// needs: engine/bench
/* Board Bench part drawings. Each kind draws one part in its own frame: centre at the origin, its x along size[0],
   z up from its base (mm). It puts boxed items with ctx.put(box, svg) so they sort against neighbours from every
   side. Fields: group (default build group), size(p) / h (defaults), draw(ctx), xr(ctx) see-through internals,
   xrLabel(p), pads(ctx) footprint while the part is off the board, plug(ctx, src, reversed) the cable it takes,
   pins(p) pin positions in board mm. The data format is docs/FIGURES-BENCH.md section 5. */
(() => {
const B = SL.bench, M = B.M, K = B.kind;
const lw = (p, a = .45, b = .8) => Math.max(p.size[0], p.size[1]) < 4 ? a : b;    // thinner ink on tiny parts
const DIE = { l: '#8c95b8', m: '#6b7397', d: '#3f4565' };
const GLASS = { l: '#f4f1e6', m: '#dcd6c4', d: '#aaa38e' };
const lens = (hex, lit) => mix(mix(hex, '#ffffff', .1), '#4a4238', lit > .05 ? 0 : .38);

// bond wires from the die edge to the leads, drawn over a ghosted body
const dieXr = (ctx, n = 8, frac = .45) => {
  const p = ctx.p, [l, w] = p.size, h = p.h, k = ctx.k, d = Math.min(l, w) * frac / 2;
  let s = ctx.slab(-d, -d, d, d, h * .5, h * .58, DIE, toneI, .5);
  const sides = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  for (const [sx, sy] of sides){
    for (let i = 0; i < n; i++){
      const t = (i + .5) / n - .5, a0 = sx ? sx * d : t * 2 * d, b0 = sy ? sy * d : t * 2 * d;
      const a1 = sx ? sx * l / 2 : t * l * .9, b1 = sy ? sy * w / 2 : t * w * .9;
      s += `<path d="${pd([ctx.W(a0, b0, h * .58), ctx.W((a0 + a1) / 2, (b0 + b1) / 2, h * .8), ctx.W(a1, b1, h * .3)], false)}" fill="none" stroke="#e8c36a" stroke-width=".35"/>`;
    }
  }
  ctx.put(ctx.B(-l / 2, -w / 2, h + .01, l / 2, w / 2, h + .02), `<g opacity="${f(k)}">${s}</g>`);
};
const ghost = (ctx, svg) => ctx.k > 0 ? `<g opacity="${f(1 - .7 * ctx.k)}">${svg}</g>` : svg;

/* ---------- small SMD parts ---------- */
K('chip', { group: 'smd', size: () => [1.6, .8], h: .5,
  draw(ctx){ const p = ctx.p, [l, w] = p.size, h = p.h, e = Math.min(.35, l * .2), wd = lw(p);
    const body = p.cap ? M.tan : p.ferrite ? { l: '#5d5a56', m: '#45423f', d: '#2c2a28' } : { l: '#3c3935', m: '#2c2a27', d: '#1c1b19' };
    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, h), ctx.slab(-l / 2 + e, -w / 2, l / 2 - e, w / 2, 0, h, body, toneI, wd) + ctx.slab(-l / 2, -w / 2, -l / 2 + e, w / 2, 0, h, M.tin, toneI, wd) + ctx.slab(l / 2 - e, -w / 2, l / 2, w / 2, 0, h, M.tin, toneI, wd)); },
  pads(ctx){ const [l, w] = ctx.p.size, e = Math.min(.45, l * .25); return ctx.poly([[-l / 2, -w / 2], [-l / 2 + e, -w / 2], [-l / 2 + e, w / 2], [-l / 2, w / 2]], .04, M.tin.l, 0) + ctx.poly([[l / 2 - e, -w / 2], [l / 2, -w / 2], [l / 2, w / 2], [l / 2 - e, w / 2]], .04, M.tin.l, 0); },
});
K('led', { group: 'smd', size: () => [2, 1.25], h: .8,
  draw(ctx){ const p = ctx.p, [l, w] = p.size, h = p.h, col = (p.led && p.led.color) || '#f7a531', lit = ctx.lit, wd = lw(p);
    let s = ctx.slab(-l / 2, -w / 2, -l / 2 + .35, w / 2, 0, h * .5, M.tin, toneI, wd) + ctx.slab(l / 2 - .35, -w / 2, l / 2, w / 2, 0, h * .5, M.tin, toneI, wd)
      + ctx.slab(-l / 2 + .3, -w / 2, l / 2 - .3, w / 2, 0, h, matOf(lens(col, lit)), toneI, wd);
    if (lit > .05) s += ctx.glow(0, 0, h, 1.2 + 2.6 * lit, col, .3 * lit) + ctx.glow(0, 0, h, .6 + 1 * lit, '#fffbe8', .75 * lit);
    ctx.put(ctx.B(-l / 2, -w / 2, 0, l / 2, w / 2, h), s); },
  xr(ctx){ const h = ctx.p.h; ctx.put(ctx.B(-.3, -.3, h + .01, .3, .3, h + .02), `<g opacity="${f(ctx.k)}">${ctx.slab(-.25, -.25, .25, .25, h * .6, h * .7, DIE, toneI, .3)}</g>`); },
  xrLabel: () => 'LED DIE',
  pads(ctx){ const [l, w] = ctx.p.size; return ctx.poly([[-l / 2, -w / 2], [-l / 2 + .5, -w / 2], [-l / 2 + .5, w / 2], [-l / 2, w / 2]], .04, M.tin.l, 0) + ctx.poly([[l / 2 - .5, -w / 2], [l / 2, -w / 2], [l / 2, w / 2], [l / 2 - .5, w / 2]], .04, M.tin.l, 0); },
});
K('rgb', { group: 'smd', size: () => [5, 5], h: 1.6,
  draw(ctx){ const p = ctx.p, [l, w] = p.size, h = p.h, o = ctx.o.o || { pins: {} }, net = (p.led && p.led.net) || '';
    const c = (o.pins && o.pins[net + '.rgb']) || null, lit = ctx.lit;
    const hex = typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c) ? c : (p.led && p.led.color) || '#ffffff';
    let s = ctx.slab(-l / 2, -w / 2, l / 2, w / 2, 0, h, M.white, toneI, .6) + ctx.disc(0, 0, h + .01, Math.min(l, w) * .36, lens(hex, lit), .4);
    if (lit > .05) s += ctx.glow(0, 0, h, 3 + 7 * lit, hex, .3 * lit) + ctx.glow(0, 0, h, 1.4 + 2 * lit, '#ffffff', .7 * lit);

<script>/* figures/engine/bench-bb.js */
// Board Bench breadboard view: the board on the mat beside a breadboard, the lesson circuit on named holes, jumper
// wires from board pins, and a small solver that finds what each LED really does (current, dark, burnt).
// Breadboard parts (led, resistor, wire, the breadboard itself) live in figures/parts/. Format: FIGURES-BENCH.md §8-9.
(() => {
const B = SL.bench, T = B.T;
const BBS = B.BBS = {
  half: { cols: 30, w: 82.5, h: 54.5, rails: true },
  full: { cols: 63, w: 165.1, h: 54.5, rails: true },
  mini: { cols: 17, w: 46, h: 35.5, rails: false },
};
const ROWS = 'abcdefghij';
// hole positions in breadboard mm (origin bottom-left, row a at the back)
B.bbGeom = kind => {
  const g = BBS[kind] || BBS.half, x0 = (g.w - (g.cols - 1) * 2.54) / 2;
  const off = g.rails ? 0 : -9.06;
  const rowY = { j: 12.5, i: 15.04, h: 17.58, g: 20.12, f: 22.66, e: 30.28, d: 32.82, c: 35.36, b: 37.9, a: 40.44 };
  for (const r of ROWS) rowY[r] += off;
  const rails = g.rails ? { 'T+': 48.56, 'T-': 51.1, 'B-': 5.94, 'B+': 3.4 } : {};
  const railCols = []; if (g.rails) for (let k = 0; k < Math.floor(g.cols * 5 / 6); k++){ const c = 2 + k + Math.floor(k / 5); if (c <= g.cols) railCols.push(c); }
  return { ...g, kind, x0, rowY, rails, railCols, colX: c => x0 + (c - 1) * 2.54 };
};
// 'b10' -> {x, y, node}; 'T+12' -> nearest rail hole
B.hole = (geo, ref) => {
  let m = /^([a-j])(\d{1,2})$/.exec(ref);
  if (m){ const c = +m[2]; if (c < 1 || c > geo.cols) return null; const r = m[1];
    return { x: geo.colX(c), y: geo.rowY[r], node: 'S' + c + ('abcde'.includes(r) ? 'u' : 'l'), ref }; }
  m = /^([TB][+-])(\d{1,2})$/.exec(ref);
  if (m && geo.rails[m[1]] != null){ const want = +m[2]; let best = geo.railCols[0];
    for (const c of geo.railCols) if (Math.abs(c - want) < Math.abs(best - want)) best = c;
    return { x: geo.colX(best), y: geo.rails[m[1]], node: 'R' + m[1], ref }; }
  return null;
};

/* circuit faults: a fault can change what is on the breadboard. `missing:<id>` leaves a circuit part out, with the
   wires that end on its legs; `reversed:<id>` turns it round (its `reversed` param when the part has one, else its
   holes in the other order). Ids the board itself has stay board faults. A listed fault [id, label, edit] does the
   same for its own id: edit = { missing: [ids], reversed: [ids], cut: [[from, to]] (wires left out), wires: [extra
   wires], holes: { id: [holes] } (parts moved) }, each applied where the circuit has it. The solver, the drawing and
   the schematic all read the changed circuit. */
let faulted = { key: null, md: null, c: null };
const circuitNow = () => {
  const md = B.md, st = B.st, c = md.circuits[st.circuit]; if (!c) return null;
  const fs = st.faults || []; if (!fs.length) return c;
  const key = st.circuit + '|' + fs.join(',');
  if (faulted.key === key && faulted.md === md) return faulted.c;
  const missing = new Set(), reversed = new Set(), cut = [], add = [], holes = {};
  const inCircuit = id => (c.parts || []).some(p => p.id === id);
  for (const f of fs){
    const m = /^(missing|reversed):(.+)$/.exec(f);
    if (m && inCircuit(m[2]) && !md.byId[m[2]]) (m[1] === 'missing' ? missing : reversed).add(m[2]);
    const fd = (md.def.faults || []).find(x => Array.isArray(x) && x[0] === f && x[2] && typeof x[2] === 'object');
    if (!fd) continue;
    const e = fd[2];
    for (const id of e.missing || []) if (inCircuit(id)) missing.add(id);
    for (const id of e.reversed || []) if (inCircuit(id)) reversed.add(id);
    for (const w of e.cut || []) if (Array.isArray(w) && w.length === 2) cut.push(w);
    for (const w of e.wires || []) if (w && typeof w.from === 'string' && typeof w.to === 'string') add.push(w);

  const switched = el => peak(r => Math.abs(r.el[el.n].i)) - Math.min(...res.map(r => Math.abs(r.el[el.n].i))) > 1e-3

/* ---------- sound: the loudest part that makes one (def.sound(p, m) → { hz, loud, how }) goes to the host ---------- */
B.solveSound = (st, parts) => {
  let best = null;

<script>/* figures/engine/sheets.js */

    if (btn && btn.offsetParent){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right + 10, r.top).matrixTransform(inv); if (q.x > x0 && q.x < v.x + v.width * .45) x0 = q.x; }
    if (sts && sts.offsetParent){ const r = sts.getBoundingClientRect(), q = new DOMPoint(r.left - 10, r.top).matrixTransform(inv); if (q.x < x1 && q.x > v.x + v.width * .55) x1 = q.x; } } } catch (e) {}

const accent = 'var(--accent,#f4b829)';

  const u = v.width / 100, x0 = v.x + 12 * u, y0 = v.y + 20 * u;

  const bh = Math.max(24 * u, used.length * 12 * u + 8 * u), bw = 20 * u;

  const pinY = {}; used.forEach((net, i) => { pinY[net] = y0 + 8 * u + i * 12 * u;
    const lv = st.o.pins[net], live = (+lv || 0) > .5 || (st.ev.rails[net] || 0) > .5;
    s += txt(x0 + bw - 1.2 * u, pinY[net] + 1.1 * u, net, 2.4 * u, live ? '#b8402f' : INK, 'end', 800)
      + (net !== 'GND' ? txt(x0 + bw + 2 * u, pinY[net] - 1.6 * u, live ? 'HIGH' : 'LOW', 1.8 * u, live ? '#b8402f' : '#857d6e', 'start', 800) : ''); });
  let row = 0;
  for (const q of ch){
    const y = (q.up && pinY[q.up.net]) || y0 + 8 * u + row * 12 * u; row++;
    const live = q.up && (((+st.o.pins[q.up.net] || 0) > .5) || (st.ev.rails[q.up.net] || 0) > .5);
    let x = x0 + bw; const seg = w => { const a = x; x += w; return a; };
    const wcol = live ? '#b8402f' : INK;
    s += ln([[seg(6 * u), y], [x, y]], 1.3, wcol);
    for (const r of (q.up ? q.up.rs : [])){ const a = seg(12 * u); s += act('bb', resSym(a, y, 12 * u, st.sel === r.id, live) + txt(a + 6 * u, y - 3.2 * u, r.id + ' ' + B.ohmsText(r.ohms), 2.1 * u), `data-id="${esc(r.id)}" data-label="${esc(T('Resistor') + ' ' + r.id)}"`); s += ln([[x, y], [x + 4 * u, y]], 1.3, wcol); x += 4 * u; }
    const m = meas[q.led.id] || {}, lit = m.state === 'ok' ? Math.min(1, Math.pow(Math.max(0, m.i_mA) / 13.6, .55)) : 0, col = (B.LED_COLORS || {})[q.led.color] || '#e8392e';
    const lx = seg(9 * u);
    s += act('bb', ledSym(lx, y, 6 * u, lit, col, st.sel === q.led.id) + txt(lx + 3 * u, y + 7.5 * u, q.led.id + ' ' + T(q.led.color || ''), 2.1 * u)
      + txt(lx + 3 * u, y - 9.5 * u, m.state === 'ok' && m.i_mA > 0 ? T('{n} mA', { n: m.i_mA.toFixed(1) }) : m.state ? T(m.state) : '', 2 * u, m.state === 'burnt' ? '#b8402f' : '#2f6b4f', 'middle', 800), `data-id="${esc(q.led.id)}" data-label="${esc(T('LED') + ' ' + q.led.id)}"`);
    s += ln([[x - 3 * u, y], [x + 4 * u, y]], 1.3); x += 4 * u;
    for (const r of (q.dn ? q.dn.rs : [])){ const a = seg(12 * u); s += act('bb', resSym(a, y, 12 * u, st.sel === r.id, false) + txt(a + 6 * u, y - 3.2 * u, r.id + ' ' + B.ohmsText(r.ohms), 2.1 * u), `data-id="${esc(r.id)}" data-label="${esc(T('Resistor') + ' ' + r.id)}"`); s += ln([[x, y], [x + 4 * u, y]], 1.3); x += 4 * u; }
    if (q.dn && q.dn.net === 'GND'){ s += ln([[x, y], [x, y + 8 * u]], 1.3) + gndSym(x, y + 8 * u, 6 * u) + txt(x + 5 * u, y + 9 * u, 'GND', 2 * u, INK, 'start'); }
    else s += txt(x + 2 * u, y + .8 * u, q.dn ? q.dn.net : T('not connected'), 2.2 * u, '#b8402f', 'start', 800);
  }
  return s;
} });

/* ---------- power tree ---------- */
B.viewDef('power', { flat: true, scene: () => {
  const v = sheetBox(), md = B.md, st = B.st, pw = md.power, u = v.width / 100;
  let s = plate(v, T('Power tree · {name}', { name: T(md.name) }));
  const rails = pw.rails || {}, srcs = pw.sources || {};
  // columns: sources, then rails by depth
  const depth = {}; const dOf = id => { if (depth[id] != null) return depth[id]; depth[id] = 1; const r = rails[id];
    let d = 1; for (const fd of r.from || []) if (fd.rail && rails[fd.rail] && fd.rail !== id) d = Math.max(d, dOf(fd.rail) + 1); return depth[id] = d; };
  Object.keys(rails).forEach(dOf);
  const cols = Math.max(1, ...Object.values(depth)) + 1, cw = (v.width - 16 * u) / cols, pos = {};
  const place = (ids, col) => ids.forEach((id, i) => { pos[id] = [v.x + 8 * u + cw * col + cw * .1, v.y + 16 * u + i * (v.height - 22 * u) / Math.max(1, ids.length) + 2 * u]; });
  place(Object.keys(srcs), 0);
  for (let d = 1; d < cols; d++) place(Object.keys(rails).filter(id => depth[id] === d), d);
  const bw = cw * .58, bh = 9 * u;
  // edges first, then the boxes, then the via-part pills on top
  let pills = '';
  for (const [rid, r] of Object.entries(rails)) for (const fd of r.from || []){
    const a = pos[fd.src || fd.rail], b = pos[rid]; if (!a || !b) continue;
    const live = (st.ev.rails[rid] || 0) > .5 && (fd.src ? st.power === fd.src : (st.ev.rails[fd.rail] || 0) > .5);
    const p0 = [a[0] + bw, a[1] + bh / 2], p1 = [b[0], b[1] + bh / 2], mx = (p0[0] + p1[0]) / 2;
    s += ln([p0, [mx, p0[1]], [mx, p1[1]], p1], live ? 2 : 1.1, live ? '#b8402f' : '#857d6e');
    const via = (fd.via || []).filter(id => !(srcs[fd.src] && srcs[fd.src].part === id));
    // a pill on a straight run between two boxes only has the gap, so it keeps to the part ids
    const horiz = Math.abs(p1[1] - p0[1]) < 1;
    if (via.length){ const lbl = via.join(' + ') + (!horiz && fd.reg != null ? ' · ' + T('{v} V reg.', { v: fd.reg }) : ''), missing = via.filter(id => !B.isSet(id));
      const fs = horiz ? Math.min(1.9 * u, (p1[0] - p0[0] - 2) / (CF_TW(lbl, 1) + 1.2)) : 1.9 * u, pw2 = CF_TW(lbl, fs) + fs * 1.2, my = (p0[1] + p1[1]) / 2;
      pills += act('part', `<rect x="${f(mx - pw2 / 2)}" y="${f(my - fs * .95)}" width="${f(pw2)}" height="${f(fs * 1.9)}" rx="${f(fs * .95)}" fill="${missing.length ? '#f6d1c9' : '#fff4d6'}" stroke="${INK}" stroke-width=".9"/>`
        + txt(mx, my + fs * .36, lbl, fs, INK, 'middle', 800), `data-id="${esc(via[0])}" data-label="${esc(B.md.byId[via[0]] ? B.md.byId[via[0]].name : via[0])}"`); }
  }
  const boxAt = (id, label, sub, live, actId) => { const [x, y] = pos[id];
    return act('part', `<rect x="${f(x)}" y="${f(y)}" width="${f(bw)}" height="${f(bh)}" rx="${f(1.5 * u)}" fill="${live ? accent : '#fbf8ef'}" stroke="${INK}" stroke-width="1.4"/>`
      + txt(x + bw / 2, y + bh * .45, label, Math.min(2.4 * u, bw / Math.max(4, label.length) * 1.3), INK, 'middle', 800) + txt(x + bw / 2, y + bh * .82, sub, Math.min(1.9 * u, bw / Math.max(4, String(sub).length) * 1.3), INK, 'middle', 700), `data-id="${esc(actId || '')}" data-label="${esc(label)}"`); };
  for (const [k, src] of Object.entries(srcs)){ const on = st.power === k, v2 = st.supply[k] != null ? st.supply[k] : src.v;
    s += boxAt(k, T(src.label || k), on ? T('{v} V connected', { v: v2 }) : T('{v} V', { v: src.range ? src.range.join('–') : src.v }), on, src.part); }
  for (const rid of Object.keys(rails)){ const vv = st.ev.rails[rid] || 0; s += boxAt(rid, rid, vv > .05 ? vv.toFixed(2) + ' V' : T('off'), vv > .5, ''); }
  s += pills;
  if (st.ev.why) s += txt(v.x + v.width / 2, v.y + v.height - 7 * u, st.ev.why, 2.2 * u, '#b8402f', 'middle', 800);
  return s;
} });
})();

</script>
<script>/* figures/parts/breadboard.js */
// @cf title Breadboard
// @cf use engine/bench.list
/* Solderless breadboard. Half size (the default): 30 columns of five-hole strips either side of the centre channel
   (rows a-e and f-j, 2.54 mm pitch, 7.62 mm across the channel) and two power rails along each long edge, 82.5 x
   54.5 x 8.5 mm. Full size has 63 columns; mini has 17 and no rails. Holes are named a1..j30 and T+12, T-12, B+12,
   B-12 (the rail hole nearest that column). Every strip of five is one node; every rail is one node. */
(() => {
const B = SL.bench, T = B.T;
const BODY = { l: '#fbf8ef', m: '#e8e3d4', d: '#c8c1ae' };
B.part('breadboard', {
  name: 'Breadboard', fig: 'P1', legs: [],
  draw(ctx){
    const { pl } = ctx, g = pl.geo, zb = B.G.matH - B.G.top, zt = pl.zTop;
    const a = pl.at(0, 0, zb), b = pl.at(g.w, g.h, zt);
    const lo = [Math.min(a[0], b[0]), Math.min(a[1], b[1]), a[2]], hi = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), b[2]];
    let s = box(lo[0], lo[1], lo[2], hi[0], hi[1], hi[2], BODY, toneI, 1.1);
    // centre channel
    const cy = (g.rowY.e + g.rowY.f) / 2;
    s += fill(pd([pl.at(1, cy - 1, zt + .01), pl.at(g.w - 1, cy - 1, zt + .01), pl.at(g.w - 1, cy + 1, zt + .01), pl.at(1, cy + 1, zt + .01)]), '#d9d3c2');
    // holes: one path for all of them
    let d = '';
    const sq = (x, y) => { const q = .42; d += 'M' + [pl.at(x - q, y - q, zt + .02), pl.at(x + q, y - q, zt + .02), pl.at(x + q, y + q, zt + .02), pl.at(x - q, y + q, zt + .02)].map(p => P(...p).map(f).join(' ')).join('L') + 'Z'; };
    for (let c = 1; c <= g.cols; c++) for (const r of 'abcdefghij') sq(g.colX(c), g.rowY[r]);
    for (const [name, y] of Object.entries(g.rails)) for (const c of g.railCols) sq(g.colX(c), y);
    s += `<path d="${d}" fill="#3b3631"/>`;
    // rail stripes and labels
    for (const [name, y] of Object.entries(g.rails)){
      const yy = y + (name[0] === 'T' ? (name[1] === '+' ? -1.4 : 1.4) : (name[1] === '+' ? -1.4 : 1.4));
      s += `<path d="${pd([pl.at(2, yy, zt + .02), pl.at(g.w - 2, yy, zt + .02)], false)}" fill="none" stroke="${name[1] === '+' ? '#e2483d' : '#3e86d9'}" style="stroke-width:.45"/>`;
      s += B.flatText(pl.at(1.2, y - .6, zt + .03), 1, 0, name[1] === '+' ? '+' : '−', 1.8, name[1] === '+' ? '#c63b30' : '#2f6fc0', 800);
    }
    for (const r of 'abcdefghij') s += B.flatText(pl.at(g.x0 - 2.2, g.rowY[r] - .5, zt + .03), 1, 0, r, 1.3, '#8a8373', 700);
    for (let c = 1; c <= g.cols; c += (c === 1 ? 4 : 5)) s += B.flatText(pl.at(g.colX(c), g.rowY.a + 2.1, zt + .03), 1, 0, String(c), 1.2, '#8a8373', 700);
    ctx.put([lo, hi], act('bb', s, `data-id="BB" data-label="${CF_ESC(T('Breadboard'))}"`));
  },
});
})();

</script>
<script>/* figures/parts/led.js */
// @cf title LED
// @cf use engine/bench.list
/* 5 mm through-hole LED on a breadboard. Legs [anode, cathode]: the anode is the longer, bent leg; the cathode side
   of the rim is flat. Forward voltage by colour (red 2.0, yellow 2.1, green 2.2, blue 3.0, white 3.1 V), 20 mA
   continuous. Brightness follows (I / 13.6 mA)^0.55, the curve the Learn Arduino lesson uses. */
(() => {
const B = SL.bench, T = B.T;
const COL = { red: '#e8392e', yellow: '#f2c23a', green: '#3fbf6a', blue: '#3d7be0', white: '#f2efe6' };
const VF = { red: 2.0, yellow: 2.1, green: 2.2, blue: 3.0, white: 3.1 };
B.LED_COLORS = COL;
B.part('led', {
  name: 'LED', fig: 'P2', legs: ['A', 'K'], span: [1, 3],
  params: { color: Object.keys(COL) },
  elec: p => ({ type: 'led', vf: VF[p.color] || 2.0, imax: .02 }),
  tag: (p, m) => m && m.state === 'ok' && m.i_mA > 0 ? T('{id} · {n} mA', { id: p.id, n: m.i_mA.toFixed(1) }) : m && m.state === 'burnt' ? T('{id} · burnt', { id: p.id }) : m && m.state === 'reverse' ? T('{id} · backwards', { id: p.id }) : p.id,
  draw(ctx){
    const { legs, p, lit } = ctx, col = COL[p.color] || COL.red, burnt = ctx.m && ctx.m.state === 'burnt';
    const [A, K] = legs, mid = A.map((v, i) => (v + K[i]) / 2), zl = 7;
    const top = [mid[0], mid[1], mid[2] + zl];
    // legs: the anode has a small knee, so it reads as the longer leg
    let s = rod(A, [A[0], A[1], A[2] + zl * .55], .25, B.M.tin, toneI, .5) + rod([A[0], A[1], A[2] + zl * .55], [A[0] * .7 + mid[0] * .3, A[1] * .7 + mid[1] * .3, top[2]], .25, B.M.tin, toneI, .5)
      + rod(K, [K[0] * .7 + mid[0] * .3, K[1] * .7 + mid[1] * .3, top[2]], .25, B.M.tin, toneI, .5);
    const body = matOf(burnt ? '#5a4330' : mix(col, '#ffffff', lit > .05 ? .25 + .3 * lit : 0));
    s += cyl(top[0], top[1], top[2], top[2] + .9, 2.9, body, toneI, .8) + cyl(top[0], top[1], top[2] + .9, top[2] + 5, 2.5, body, toneI, .9)
      + rod([top[0], top[1], top[2] + 5], [top[0], top[1], top[2] + 7.4], 2.5, body, toneI, .9, .9);
    if (lit > .05 && !burnt){ const [X, Y] = P(top[0], top[1], top[2] + 5.5);
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(5 + 9 * lit)}" fill="${col}" opacity="${f(.25 * lit)}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(2 + 2 * lit)}" fill="#fffbe8" opacity="${f(.8 * lit)}"/>`; }
    if (burnt){ const [X, Y] = P(top[0], top[1], top[2] + 8); s += `<circle cx="${f(X)}" cy="${f(Y - 4)}" r="3" fill="#8a847a" opacity=".45"/>`; }
    const lo = [Math.min(A[0], K[0]) - 3, Math.min(A[1], K[1]) - 3, A[2]], hi = [Math.max(A[0], K[0]) + 3, Math.max(A[1], K[1]) + 3, top[2] + 7.4];
    ctx.put([lo, hi], s);
  },
});
})();

<script>/* figures/parts/resistor.js */
// @cf title Resistor
// @cf use engine/bench.list
/* Axial through-hole resistor, 1/4 W, 6.3 mm body, four colour bands worked out from the value (two digits, the
   multiplier, gold for 5 %). Legs bend down into two holes, usually four columns apart. */
(() => {
const B = SL.bench, T = B.T;
const BAND = ['#2a2623', '#8a5a34', '#e2483d', '#f08a2b', '#f2c230', '#43b05c', '#3e86d9', '#8c4bd1', '#9a958c', '#f6f3ea'];
const GOLD = '#d4a93c', SILVER = '#c9cfd1';
B.resBands = ohms => {
  const v = Math.max(.1, +ohms || 0), e = Math.floor(Math.log10(v) + 1e-9) - 1, sig = Math.round(v / Math.pow(10, e));
  const d1 = Math.floor(sig / 10) % 10, d2 = sig % 10, mult = e === -1 ? GOLD : e === -2 ? SILVER : BAND[Math.max(0, Math.min(9, e))];
  return [BAND[d1], BAND[d2], mult, GOLD];
};
B.ohmsText = ohms => ohms >= 1e6 ? (+(ohms / 1e6).toFixed(2)) + ' MΩ' : ohms >= 1e3 ? (+(ohms / 1e3).toFixed(2)) + ' kΩ' : (+(+ohms).toFixed(1)) + ' Ω';
B.part('resistor', {
  name: 'Resistor', fig: 'P3', legs: ['1', '2'], span: [3, 8],
  params: { ohms: [1, 1e7] },
  elec: p => ({ type: 'res', ohms: Math.max(0, +p.ohms || 0) }),
  tag: p => p.id + ' · ' + B.ohmsText(p.ohms),
  draw(ctx){
    const [a, b] = ctx.legs, z = 2.6, d = [b[0] - a[0], b[1] - a[1]], len = Math.hypot(...d) || 1, u = d.map(v => v / len);
    const e0 = [a[0] + u[0] * 1, a[1] + u[1] * 1, a[2] + z], e1 = [b[0] - u[0] * 1, b[1] - u[1] * 1, b[2] + z];
    const bl = Math.min(6.3, len - 2.6), c0 = [(a[0] + b[0]) / 2 - u[0] * bl / 2, (a[1] + b[1]) / 2 - u[1] * bl / 2, a[2] + z], c1 = [(a[0] + b[0]) / 2 + u[0] * bl / 2, (a[1] + b[1]) / 2 + u[1] * bl / 2, a[2] + z];
    let s = rod(a, [a[0], a[1], a[2] + z - .3], .22, B.M.tin, toneI, .45) + rod([a[0], a[1], a[2] + z - .3], c0, .22, B.M.tin, toneI, .45)
      + rod(b, [b[0], b[1], b[2] + z - .3], .22, B.M.tin, toneI, .45) + rod([b[0], b[1], b[2] + z - .3], c1, .22, B.M.tin, toneI, .45);
    s += rod(c0, c1, 1.15, { l: '#e9d3a6', m: '#d1b684', d: '#9c8256' }, toneI, .8);
    const bands = B.resBands(ctx.p.ohms), at = [.16, .32, .48, .8];
    bands.forEach((col, i) => { const t0 = at[i] - .05, t1 = at[i] + .05, p0 = c0.map((v, k) => v + (c1[k] - v) * t0), p1 = c0.map((v, k) => v + (c1[k] - v) * t1);
      s += rod(p0, p1, 1.2, matOf(col), toneI, .3); });
    const lo = [Math.min(a[0], b[0]) - 1.3, Math.min(a[1], b[1]) - 1.3, a[2]], hi = [Math.max(a[0], b[0]) + 1.3, Math.max(a[1], b[1]) + 1.3, a[2] + z + 1.3];
    ctx.put([lo, hi], s);
    void e0; void e1;
  },
});
})();

<script>/* figures/parts/wire.js */
// @cf title Jumper wire
// @cf use engine/bench.list
/* Male-to-male jumper wire: a 22 AWG lead in an arc from a board pin (it plugs into the female header from above)
   to a breadboard hole, with a black housing at each end. Cut into short boxed pieces so it sorts at every angle. */
(() => {
const B = SL.bench, T = B.T;
B.part('wire', {
  name: 'Jumper wire', fig: 'P4', legs: ['1', '2'],
  elec: () => ({ type: 'wire' }),
  draw(ctx){
    const { a, b } = ctx, col = B.WIRE[ctx.color] || ctx.color || B.WIRE.green, m = matOf(/^#[0-9a-f]{6}$/i.test(col) ? col : '#43b05c');
    const lift = 7 + Math.hypot(b[0] - a[0], b[1] - a[1]) * .18, top = Math.max(a[2], b[2]) + lift;
    const pts = [];

      pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (a[2] + 4.5) * (1 - t) + (b[2] + 4.5) * t + (top - Math.max(a[2], b[2]) - 4.5) * s]); }

    for (let i = 0; i < pts.length - 1; i++){ const p = pts[i], q = pts[i + 1];
      ctx.put([[Math.min(p[0], q[0]) - r, Math.min(p[1], q[1]) - r, Math.min(p[2], q[2]) - r], [Math.max(p[0], q[0]) + r, Math.max(p[1], q[1]) + r, Math.max(p[2], q[2]) + r]], rod(p, q, r, m, toneI, .6)); }
    for (const e of [a, b]){ const h = [e[0], e[1], e[2] + 4.5];
      ctx.put([[e[0] - 1.3, e[1] - 1.3, e[2]], [e[0] + 1.3, e[1] + 1.3, e[2] + 4.6]], rod([e[0], e[1], e[2] + .2], [e[0], e[1], e[2] + 1.2], .3, B.M.tin, toneI, .4) + box(e[0] - 1.25, e[1] - 1.25, e[2] + 1.2, e[0] + 1.25, e[1] + 1.25, h[2], B.M.black, toneI, .6)); }
  },
});
})();
