<title>FPV flying wing on INAV</title>
<script>
/* Colorfigures core.js, vendored for SimLab from the Colorfigures skill (MIT, see LICENSE in this folder).
   Upstream sha256 a78aab94ab7396b99080bf72673d5d4d689d771764d76cb08f1a0d28033f7fc3. SimLab patches: PATCHES.md. Regenerate with vendor.py, never edit by hand. */
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- SimLab patches (see figures/vendor/colorfigures/PATCHES.md) ---------- */
// P3 embedded mode: on inside any iframe or with ?embed=1; ?embed=0 forces it off. ?bare=1 also hides the figure's
// own buttons, stats, switches and keypad. ?theme=dark dims the paper (P4). ?lang=xx is the first language (P2).
const CF_Q = new URLSearchParams(location.search);
const CF_EMBED = CF_Q.get('embed') === '1' || (CF_Q.get('embed') !== '0' && window.parent !== window);
const CF_NOTE = m => { const h = document.documentElement, s = ' ' + m + ';'; if (!(h.dataset.errors || '').includes(s)) h.dataset.errors = (h.dataset.errors || '') + s; };
// P2: every figure string goes through CF_T(english, vars?). Keys are the English text, so a missing entry still
// reads; {name} placeholders are filled from vars after the lookup.
let CF_LANG = /^[a-z]{2}(-[A-Za-z]+)?$/.test(CF_Q.get('lang') || '') ? CF_Q.get('lang') : 'en', CF_STR = {};
const CF_T = (s, vars) => {
  let t = s != null && typeof s === 'string' && Object.prototype.hasOwnProperty.call(CF_STR, s) ? CF_STR[s] : s;
  if (vars && typeof t === 'string') t = t.replace(/\{(\w+)\}/g, (m, k) => Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m);
  return t; };
const CF_ESC = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CF_L = s => `<span data-cft="${CF_ESC(s)}">${CF_ESC(CF_T(s))}</span>`;   // a translatable piece of chrome
const CF_SLUG = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'button';
// P1: label pills are sized from the real text width in the pill's font (cached per string at 100 px), not from
// text.length, which overflows CJK and doubles Devanagari (combining marks count as characters)
const CF_TW = (() => { const cache = new Map(); let g = null;
  return (text, fs) => { const s = String(text); let w = cache.get(s);
    if (w == null){
      const n = typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter().segment(s)].length : [...s].length;
      try { g = g || document.createElement('canvas').getContext('2d'); g.font = '800 100px ui-monospace,Menlo,monospace';
        w = g.measureText(s).width / 100 + .04 * n; }        // + the pill's letter-spacing of .04em per character
      catch (e) { w = .62 * n; }
      if (!(w > 0)) w = .62 * n;
      cache.set(s, w); }
    return w * fs; }; })();
// P5 (Appendix E): a material given as a colour string ('#rrggbb') is turned into a material; anything else is
// reported on data-errors and drawn dark instead of crashing the whole render
const CF_MAT = m => { if (typeof m === 'string' && /^#[0-9a-f]{6}$/i.test(m)) return matOf(m); CF_NOTE('bad material ' + String(m)); return DARK; };
// P5 (Appendix E): option objects are checked, so a misspelt or invented option is reported instead of ignored
const CF_OPTS = (who, o, known, need = []) => { if (!o || typeof o !== 'object') return CF_NOTE(who + ': options missing');
  for (const k of Object.keys(o)) if (!known.includes(k)) CF_NOTE(`${who}: unknown option "${k}"`);
  for (const k of need) if (o[k] == null) CF_NOTE(`${who}: option "${k}" missing`); };
// P3: the embedded frame follows the iframe's own shape (.7501 keeps the centred framing without the desktop nudge)
const CF_FRAME_A = () => { const w = innerWidth, h = innerHeight; return w > 50 && h > 50 ? Math.min(1.4, Math.max(.7501, h / w)) : .75; };
// P5 (Appendix E): html.cf-moving is set while frames are being drawn (drag, turn, animation) and cleared 220 ms after
// the last one; cfbuild.py drops the hand-drawn filter only then on phones, which is what build.py's docstring promises
let CF_MOVE_T = 0;
const CF_MOVED = () => { const h = document.documentElement; h.classList.add('cf-moving'); clearTimeout(CF_MOVE_T);
  CF_MOVE_T = setTimeout(() => h.classList.remove('cf-moving'), 220); };
const CF_MOUNT_HOOKS = [];       // functions (cfg, ui) run at the end of mountFigure; figures/engine/embed.js uses it
let CF_UI = null, CF_CFG = null;
// P2: swap the dictionary and relabel everything already on the page, then redraw
function CF_SETLOCALE(lang, strings){
  CF_LANG = typeof lang === 'string' && lang ? lang : 'en';
  CF_STR = strings && typeof strings === 'object' && !Array.isArray(strings) ? strings : {};
  document.documentElement.lang = CF_LANG === 'zh' ? 'zh-Hans' : CF_LANG;
  for (const el of document.querySelectorAll('.zchip button[aria-label]:not([data-cft-aria])')) el.dataset.cftAria = el.getAttribute('aria-label');
  for (const el of document.querySelectorAll('[data-cft]')) el.textContent = CF_T(el.dataset.cft);
  for (const el of document.querySelectorAll('[data-cft-aria]')) el.setAttribute('aria-label', CF_T(el.dataset.cftAria));
  if (CF_CFG) document.title = CF_T(CF_CFG.title);
  if (CF_UI) CF_UI.render();
}
// P4: a dark host keeps the figure a paper plate, only dimmer (the colours, ink and pills are designed for paper)
const CF_THEME = mode => document.documentElement.classList.toggle('cf-dark', mode === 'dark');
const CF_CSS = `
  :root{color-scheme:light}
  html.cf-dark{--paper:#e4ddcf;--rule:#cbc2b1;--muted:#6a6357}
  #fig:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
  html.cf-embed,html.cf-embed body{height:100%;overflow:hidden}
  html.cf-embed body{padding:0;display:block}
  html.cf-embed body>header,html.cf-embed .controls,html.cf-embed .made-with,html.cf-embed .lgd,html.cf-embed .mcap{display:none!important}
  html.cf-embed .stage{max-width:none;height:100%;display:flex;flex-direction:column}
  html.cf-embed .zwrap{flex:1 1 auto;min-height:0}
  html.cf-embed #fig{max-width:none;width:100%;height:100%!important;max-height:none!important;margin:0;flex:1 1 auto;min-height:0}
  @media (min-width:561px){html.cf-embed .actions{left:12px;top:10px}html.cf-embed .vset{right:12px;top:10px!important}html.cf-embed #stats{right:12px}}
  @media (max-width:560px){html.cf-embed .stage{padding:8px 10px 0}}
  html.cf-bare .actions,html.cf-bare .vset,html.cf-bare .stats,html.cf-bare .kpad{display:none!important}
  html.cf-wait .stage{visibility:hidden}`;
{ const h = document.documentElement;
  if (CF_EMBED) h.classList.add('cf-embed');
  if (CF_EMBED && CF_Q.get('bare') === '1') h.classList.add('cf-bare');
  if (CF_Q.get('theme') === 'dark') h.classList.add('cf-dark');
  h.lang = CF_LANG === 'zh' ? 'zh-Hans' : CF_LANG; }

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { if (!m || typeof m !== 'object') m = CF_MAT(m); const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(0, ...items.map(it => CF_TW(CF_T(it.text), fs))) + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const ct = CF_T(c.text), w = u ? hgt*(c.n > 9 ? 1.3 : 1) : CF_TW(ct, fs) + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${CF_ESC(ct)}" data-en="${CF_ESC(c.text)}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : CF_ESC(ct)}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;

function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)

  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" data-id="xr" aria-pressed="false">' + CF_L('See-through') + '</button>') + '<button class="act" id="lblb" data-id="labels" aria-pressed="false">' + CF_L('Labels') + '</button></div>';

  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);

    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };

  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = CF_T(caption(st)); };

// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them

function xrWrap(sceneFn, opts){
  CF_OPTS('xrWrap', opts, ['mech', 'inside', 'surface', 'B', 'getSt', 'under', 'inline'], ['inside', 'B', 'getSt']);

    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', CF_T(k.name)); b.dataset.cftAria = k.name;
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${CF_L(spec.action)}<small>${CF_L('SPACE')}</small>`; go.setAttribute('aria-label', CF_T(spec.action)); go.dataset.cftAria = spec.action;
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>/* figures/engine/embed.js */
/* SimLab figure bridge, figure side. The protocol is in docs/FIGURES.md (after colorfigures-guide 2.3).
   It is inlined right after the vendored core.js and hooks mountFigure through CF_MOUNT_HOOKS, so any figure that
   calls mountFigure(cfg) speaks it. A figure opts in to state with
     cfg.embed = { accept(st, patch, ui) -> true | false | 'why not', report(st) -> small object of discrete values }
   Nothing else in the state can be written from outside. */
(() => {
  const IN = 'simlab', OUT = 'simlab-figure', V = 1;
  const html = document.documentElement;
  const host = CF_EMBED && window.parent !== window ? window.parent : null;
  const fileMode = location.protocol === 'file:';
  // same-origin hosting by default; ?origin= names the host when the figure is served from elsewhere
  const hostOrigin = (() => { const o = CF_Q.get('origin'); if (!o) return location.origin;
    try { const u = new URL(o); return /^https?:$/.test(u.protocol) ? u.origin : location.origin; } catch (e) { return location.origin; } })();
  // under file:// the real origin is opaque and a message aimed at "file://" is dropped, so tests post to '*'
  const target = fileMode ? '*' : hostOrigin;
  const send = (type, data) => { if (!host) return; try { host.postMessage({ source: OUT, v: V, type, ...(data || {}) }, target); } catch (e) {} };
  const err = message => { CF_NOTE(message); send('error', { message: String(message) }); };
  const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);

  addEventListener('error', e => send('error', { message: String(e.message || e) }));
  addEventListener('unhandledrejection', e => send('error', { message: String((e.reason && e.reason.message) || e.reason) }));

  // a non-English first paint waits (briefly) for the host's dictionary instead of flashing English
  let waitT = 0;
  const unwait = () => { clearTimeout(waitT); html.classList.remove('cf-wait'); };
  if (host && CF_LANG !== 'en'){ html.classList.add('cf-wait'); waitT = setTimeout(unwait, 1500); }

  let cfg = null, ui = null, live = false, byHost = false, plain = null;
  const queue = [], custom = {};
  addEventListener('message', ev => {
    if (!host || ev.source !== host) return;
    if (fileMode ? !(ev.origin === 'null' || ev.origin === 'file://') : ev.origin !== hostOrigin) return;
    const m = ev.data;
    if (!m || typeof m !== 'object' || m.source !== IN || m.v !== V || typeof m.type !== 'string') return;
    if (!live){ if (queue.length < 200) queue.push(m); return; }
    handle(m);
  });

  const labelOf = el => { const s = el.querySelector('[data-cft]'); return (s ? s.textContent : el.textContent).replace('▾', '').trim(); };
  const enOf = el => { const s = el.querySelector('[data-cft]'); return s ? s.dataset.cft : labelOf(el); };
  const readout = () => { if (typeof cfg.readout !== 'function') return '';
    try { return String(CF_T(cfg.readout(ui.st)) ?? ''); } catch (e) { return ''; } };
  const report = () => { if (!cfg.embed || typeof cfg.embed.report !== 'function') return null;
    try { return cfg.embed.report(ui.st); } catch (e) { CF_NOTE('report: ' + e.message); return null; } };
  // pressable parts in the drawing right now (for the host's accessible list); a part may carry data-id and data-label
  const parts = () => { const seen = new Set(), out = [];
    for (const el of document.querySelectorAll('#art [data-act]')){
      const act = el.dataset.act; if (!own(cfg.acts, act)) continue;
      const id = el.dataset.id ?? null, key = act + '|' + (id ?? ''); if (seen.has(key)) continue; seen.add(key);
      const en = el.dataset.label || act; out.push({ act, id, label: CF_T(en), en }); }
    return out; };
  const labels = () => { if (html.classList.contains('nolabels')) return [];
    const m = new Map();
    for (const g of document.querySelectorAll('#fig .tag[data-t]')){ const n = +g.dataset.n;
      if (!m.has(n)) m.set(n, { n, text: g.dataset.t, en: g.dataset.en ?? g.dataset.t, on: g.classList.contains('on') }); }
    return [...m.values()].sort((a, b) => a.n - b.n); };
  const buttons = () => [...document.querySelectorAll('#btns .act[data-id]')]
    .map(b => ({ id: b.dataset.id, label: labelOf(b), en: enOf(b), picker: !!b.querySelector('.car') }));
  const switches = () => [...document.querySelectorAll('.vset .act[data-id]')]
    .map(b => ({ id: b.dataset.id, label: labelOf(b), on: b.getAttribute('aria-pressed') === 'true' }));

  const sendReady = () => plain ? send('ready', { ...plain(), lang: CF_LANG, embedded: true }) : send('ready', {
    fig: cfg.fig ?? null, title: CF_T(cfg.title), en: cfg.title, lang: CF_LANG,
    buttons: buttons(), switches: switches(), acts: Object.keys(cfg.acts || {}), parts: parts(),
    pals: Object.keys(PALS), pal: ui.st.pal, view: { yaw: YAW, pitch: PITCH },
    state: report(), readout: readout(), embedded: true });

  // after renders: state, readout and parts at most ~30 times a second, labels whenever they change
  let last = { state: undefined, readout: undefined, parts: undefined, labels: undefined }, flushT = 0, sentAt = 0;
  const flush = () => { flushT = 0; sentAt = performance.now();
    const st = report(), sj = JSON.stringify(st), ro = readout(), pj = JSON.stringify(parts()), lb = labels(), lj = JSON.stringify(lb);
    if (sj !== last.state || ro !== last.readout || pj !== last.parts){
      const prev = last.state ? JSON.parse(last.state) : null, changed = [];
      if (st && typeof st === 'object') for (const k of Object.keys(st)) if (!prev || JSON.stringify(prev[k]) !== JSON.stringify(st[k])) changed.push(k);
      last.state = sj; last.readout = ro; last.parts = pj;
      send('state', { state: st, changed, readout: ro, parts: JSON.parse(pj) }); }
    if (lj !== last.labels){ last.labels = lj; send('labels', { items: lb }); } };
  const schedule = () => { if (!flushT) flushT = setTimeout(flush, Math.max(0, 33 - (performance.now() - sentAt))); };

  const click = el => { byHost = true; try { el.click(); } finally { byHost = false; } };
  const press = (id, choice) => {
    const b = [...document.querySelectorAll('.act[data-id]')].find(e => e.dataset.id === String(id));
    if (!b) return err(`no button "${id}"`);
    const wrap = b.closest('.stepwrap');
    if (choice == null || !(wrap && wrap.classList.contains('open'))) click(b);
    if (choice == null) return;
    const c = wrap && [...wrap.querySelectorAll('.chip')].find(e => e.dataset.id === String(choice));
    if (!c) return err(`no choice "${choice}" in "${id}"`);
    click(c);
  };
  const runAct = (name, data) => {
    if (typeof name !== 'string' || !own(cfg.acts, name)) return err(`no act "${name}"`);
    const d = {}; if (data && typeof data === 'object') for (const [k, v] of Object.entries(data)) d[k] = String(v);
    const el = [...document.querySelectorAll('#art [data-act]')].find(e => e.dataset.act === name && Object.entries(d).every(([k, v]) => e.dataset[k] === v))
      || { dataset: { act: name, ...d }, getAttribute: k => (k.startsWith('data-') ? d[k.slice(5)] : null) ?? null, closest: () => null };
    send('part', { act: name, id: el.dataset.id ?? null, data: { ...el.dataset }, by: 'host' });
    cfg.acts[name](ui.st, el, ui); ui.render();
  };
  const setState = patch => {
    const accept = cfg.embed && cfg.embed.accept;
    if (typeof accept !== 'function') return err('set: this figure takes no state');
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return err('set: state must be an object');
    let r; try { r = accept(ui.st, patch, ui); } catch (e) { return err('set: ' + e.message); }
    if (r === false || typeof r === 'string') err('set rejected' + (typeof r === 'string' ? ': ' + r : ''));
    ui.render();
  };
  const num = (v, lo, hi, dflt) => { const x = +v; return v != null && Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : dflt; };

  const H = {
    hello: () => sendReady(),
    press: m => press(m.id, m.choice),
    act: m => runAct(m.name, m.data),
    set: m => setState(m.state),
    view: m => { const y = num(m.yaw, -720, 720, null); if (y == null) return err('view: yaw must be a number');
      ui.camTo(y, num(m.pitch, -90, 90, PITCH), num(m.ms, 1, 5000, 700)); },
    xr: m => { const b = document.getElementById('xrb'); if (!b) return err('xr: this figure has no see-through');
      if (!!ui.st.xrT !== !!m.on) click(b); },
    labels: m => { const b = document.getElementById('lblb') || document.getElementById('lbl');
      if (!html.classList.contains('nolabels') !== !!m.on && b) click(b); schedule(); },
    pal: m => { if (typeof m.key !== 'string' || !own(PALS, m.key)) return err(`pal: no palette "${m.key}"`);
      ui.st.pal = m.key; for (const s of document.querySelectorAll('#pals .sw')) s.setAttribute('aria-pressed', s.title === m.key); ui.render(); },
    locale: m => { CF_SETLOCALE(typeof m.lang === 'string' ? m.lang : 'en', m.strings); unwait(); if (cfg) schedule(); },
    theme: m => CF_THEME(m.mode),
    flash: m => { if (m.text == null) return err('flash: text missing'); ui.flash(String(m.text), num(m.ms, 300, 15000, 1600)); },
    query: () => { const st = report(), ro = readout(), ps = parts();
      send('state', { state: st, changed: [], readout: ro, parts: ps }); send('labels', { items: labels() }); },
  };
  const handle = m => { const h = own(H, m.type) && (cfg || m.type === 'hello' || m.type === 'locale' || m.type === 'theme') ? H[m.type]
      : own(custom, m.type) ? custom[m.type] : null;
    if (!h) return err(`unknown message "${m.type}"`);
    try { h(m); } catch (e) { err(`${m.type}: ${e.message}`); } };

  // for engines and pages: extra events (e.g. sfx), extra commands, and pages that never call mountFigure
  window.CF_BRIDGE = Object.freeze({
    embedded: !!host,
    send: (type, data) => { if (typeof type !== 'string' || !type || type === 'ready') return err(`CF_BRIDGE.send: "${type}" is reserved or invalid`); send(type, data); },
    on: (type, fn) => { if (typeof type !== 'string' || own(H, type) || typeof fn !== 'function') return err(`CF_BRIDGE.on: "${type}" is reserved or invalid`); custom[type] = fn; },
    // a page without mountFigure (the flight range): info() returns its ready payload; queued commands then run
    plain: info => { if (cfg || plain || typeof info !== 'function') return; plain = info; live = true; unwait(); sendReady();
      for (const m of queue.splice(0)) if (m.type !== 'hello') handle(m); },
  });

  CF_MOUNT_HOOKS.push((c, u) => {
    cfg = c; ui = u;
    const fig = document.getElementById('fig');
    fig.setAttribute('tabindex', '0');
    // parts: report the press before the figure acts on it, so 'part' arrives ahead of the 'state' it causes
    fig.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest && e.target.closest('[data-act]');
      if (a && own(cfg.acts, a.dataset.act)) send('part', { act: a.dataset.act, id: a.dataset.id ?? null, data: { ...a.dataset }, by: 'user' }); }, true);
    // buttons, chips and switches, whoever pressed them, reported before their handlers run (so ahead of the
    // flash and state they cause); a switch reports the position it is turning to
    document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('.act[data-id], .chip[data-id]'); if (!el) return;
      const by = byHost ? 'host' : 'user';
      if (el.classList.contains('chip')){ const p = el.closest('.stepwrap'), b = p && p.querySelector('.act[data-id]');
        send('button', { id: b ? b.dataset.id : null, choice: el.dataset.id, by }); }
      else send('button', { id: el.dataset.id, by, ...(el.closest('.vset') ? { on: el.getAttribute('aria-pressed') !== 'true' } : {}) }); }, true);
    addEventListener('focus', () => send('focus', { on: true }));
    addEventListener('blur', () => send('focus', { on: false }));
    const f0 = ui.flash; ui.flash = (text, ms) => { f0(text, ms); send('flash', { text: CF_T(text), en: String(text) }); };
    const r0 = ui.render; ui.render = () => { r0(); schedule(); };
    const go = () => { if (live) return; live = true; sendReady(); flush();
      for (const m of queue.splice(0)) if (m.type !== 'hello') handle(m); };
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', go, { once: true }); else queueMicrotask(go);
  });
})();

</script>

<script>/* figures/engine/drone.js */
/* SimLab drone figure engine (engine:drone): registry, state, build flow, safety tests, scene and the bridge.
   Data format: docs/FIGURES-DRONE.md. Helpers live in drone-geo.js, layouts in drone-frames.js, piece drawings in
   drone-pieces.js and the wiring sheet in drone-sheet.js. Built on the Colorfigures core (MIT). */
window.SL = window.SL || {};
(() => {
  const SD = SL.drone = SL.drone || {};
  SD.kinds = SD.kinds || {};
  SD.layouts = SD.layouts || {};
  const T = (s, v) => CF_T(s, v);

  // every message the engine says or logs (English keys for src/i18n/figures/<lang>.json)
  const MSG = SD.MSG = {
    live: 'Unplug the battery first: never work on a live quad',
    exploded: 'Close the exploded view first',
    busy: 'Wait for the test to finish',
    already: '{short} is already on',
    after: '{short} goes on after {need}',
    propsLast: 'Props go on LAST: run the smoke stopper test and the motor direction check first',
    notOn: '{short} is not on',
    takeOff: 'Take the {dep} off first',
    off: '{short} is off',
    built: 'Already built',
    box: 'Already a box of parts',
    buildDone: 'Built: every part on, smoke test, motor check and calibration done',
    plugNeeds: 'Mount the battery and its power lead first',
    pop: 'POP: the capacitor was in backwards and vented. A smoke stopper would have caught it. Unplug, replace it',
    powered: 'Beep beep beep: ESCs armed-ready, FC and VTX on',
    unplugged: 'Battery unplugged',
    faultFix: 'Fix the fault first (unplug, replace the capacitor)',
    smokeNeeds: 'Solder the power lead and the ESC first',
    smokeShort: 'The smoke stopper lamp lit up: something is shorted. The cap is in backwards: flip it before you plug in for real',
    smokeOk: 'No short: the lamp only blinked. Safe to plug in',
    noMotors: 'Nothing to spin on this craft',
    motorNeeds: 'Wire the motors and mount the flight controller first',
    propsOff: 'PROPS OFF! Never spin motors on the bench with props on',
    needBatt: 'Plug in a battery (USB alone can’t spin motors)',
    motorWrong: '{m} spun the wrong way: reversed it in the ESC configurator. They all spin right now',
    motorsOk: 'Every motor spins the right way',
    calNeeds: 'Mount the flight controller first',
    calBack: 'Calibrated level. Note: the arrow on the FC points backwards, so it will flip on take-off',
    calOk: 'Accelerometer calibrated on a flat surface',
    explodeOn: 'Exploded view: every part lifted on its own layer',
  };
  const LOG = SD.LOG = {
    head: '-- {log} --',
    plugged: 'battery plugged: {v} V',
    unplugged: 'battery unplugged',
    pop: 'POP: input capacitor vented (fitted backwards)',
    smoke: '$ smoke stopper between battery and quad...',
    smokeShort: 'smoke stopper: SHORT detected',
    smokeOk: 'smoke stopper: no short, current ok',
    motors: '$ motors tab: spin {list} one at a time',
    reversed: '{m} direction reversed in ESC config',
    calBack: 'acc calibrated (but board_align is wrong!)',
    calOk: '$ calibrate accelerometer: done, level = 0.0 / 0.0',
    auto: '$ build it for me: smoke stopper, motor check and calibration done',
    capNew: 'new capacitor fitted',
  };
  const ENGINE_IDS = ['FRAME', 'MOTORS', 'ESC', 'WIRES', 'FC', 'XT60', 'CAM', 'RX', 'VTX', 'TOP', 'BATT', 'PROPS'];
  SD.ENGINE_IDS = ENGINE_IDS;

  const note = m => CF_NOTE('drone: ' + m);
  let craft = null, ui = null, looping = false;
  SD.craft = () => craft;
  SD.ui = () => ui;

  /* ---------- validation ---------- */
  const isHex = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
  function validate(c){
    for (const k of ['id', 'fig', 'title', 'palette', 'frame', 'design', 'parts', 'tests', 'wiring']) if (c[k] == null) note(`field "${k}" missing`);
    if (c.palette && !PALS[c.palette]) note(`palette "${c.palette}" is not a PALS key`);
    if (c.frame){
      const F = c.frame, layouts = ['quad-x', 'stretch-x', 'whoop', 'hex-x', 'octo-x', 'tri-y', 'vtol-tri', 'cf2', 'wing', 'vtol'];
      const winged = F.layout === 'wing' || F.layout === 'vtol', listed = Array.isArray(F.motors) && F.motors.length > 0;
      if (!layouts.includes(F.layout)) note(`frame.layout "${F.layout}" is not one of ${layouts.join(', ')}`);
      if (winged && !F.wing) note(`frame.wing missing for layout ${F.layout}`);
      if (winged && !listed) note(`frame.motors needed for layout ${F.layout}`);
      if (!winged && !(F.wheelbase > 0) && !listed) note('frame.wheelbase missing');
      if (!winged && (!F.arm || !F.plate)) note('frame.arm and frame.plate needed');
    }
    const ids = new Set();
    for (const p of c.parts || []){
      if (!/^[A-Z][A-Z0-9_]*$/.test(p.id || '')) note(`part id "${p.id}" must be upper case`);
      if (ids.has(p.id)) note(`part "${p.id}" listed twice`);
      ids.add(p.id);
      if (!p.short) note(`part ${p.id}: short missing`);
      if (p.polar && !(Array.isArray(p.polar) && p.polar.length === 2)) note(`part ${p.id}: polar must be [ok, mistake]`);
      for (const pc of [].concat(p.piece || [])) if (!SD.kinds[pc.kind]) note(`part ${p.id}: unknown piece kind "${pc.kind}"`);
      if (!p.piece) note(`part ${p.id}: piece missing`);
    }
    for (const p of c.parts || []) for (const a of p.after || []) if (!ids.has(a)) note(`part ${p.id}: after "${a}" is not a part`);
    const d = c.design || {};
    for (const t of ['batts', 'motors', 'props']) if (!d[t] || !Object.keys(d[t]).length) note(`design.${t} missing`);
    if (d.default) for (const [t, k] of [['batts', 'batt'], ['motors', 'motor'], ['props', 'prop']]) if (d[t] && !d[t][d.default[k]]) note(`design.default.${k} "${d.default[k]}" not in design.${t}`);
    for (const [k, b] of Object.entries(d.batts || {})) { if (!(b.cells > 0) || !Array.isArray(b.size)) note(`batt ${k}: cells and size needed`); if (b.color && !isHex(b.color)) note(`batt ${k}: color must be #rrggbb`); }
    for (const [k, m] of Object.entries(d.motors || {})) if (!Array.isArray(m.stator) || !Array.isArray(m.bell)) note(`motor ${k}: stator and bell needed`);
    for (const [k, pr] of Object.entries(d.props || {})) if (!(pr.d > 0) || !(pr.blades >= 2)) note(`prop ${k}: d and blades needed`);
    for (const id of Object.keys((c.wiring || {}).nodes || {})) if (!ids.has(id)) note(`wiring node "${id}" is not a part`);
    for (const e of (c.wiring || {}).edges || []) for (const end of [e.from, e.to]) if (!((c.wiring.nodes || {})[end])) note(`wiring edge end "${end}" is not a node`);
  }

  /* ---------- state helpers ---------- */
  const byId = id => craft.byId[id];
  const isOn = (st, id) => { const p = st.placed[id]; return !!p && !p.leave && p.t >= 1; };
  const inPl = (st, id) => { const p = st.placed[id]; return !!p && !p.leave; };
  const orient = (st, id) => inPl(st, id) ? st.placed[id].orient : 0;
  const has = id => !!craft.byId[id];
  const motorsList = () => craft.motors;
  const shortOf = id => T(byId(id).short);
  const low = s => s.toLocaleLowerCase(CF_LANG === 'zh' ? 'zh-Hans' : CF_LANG);
  SD.isOn = isOn; SD.inPl = inPl; SD.orient = orient;

  function resolved(st){
    const d = craft.design;
    return { batt: d.batts[st.design.batt], motor: d.motors[st.design.motor], prop: d.props[st.design.prop], keys: st.design };
  }
  SD.resolved = resolved;
  const powered = st => !!st.plugged && !st.fault && (!has('FC') || isOn(st, 'FC'));
  SD.powered = powered;

  function sfx(st, name){ st.sfx = { n: (st.sfx ? st.sfx.n : 0) + 1, name }; }
  function log(st, key, vars){
    const text = T(key, vars);
    st.log.lines.push(text); if (st.log.lines.length > 10) st.log.lines.shift();
    st.log.n++;
  }
  function say(st, key, vars, ms, sound){
    if (sound) sfx(st, sound);
    const text = T(key, vars);
    st.msg = text;
    if (ui) ui.flash(text, ms || 2200);
  }

  /* ---------- actions (the only way the build state changes) ---------- */
  function busy(st){ return !!st.test || st.queue.length > 0; }
  function kick(){
    if (looping || !ui) return;
    looping = true;
    ui.animate(dt => { const more = step(ui.st, dt); if (!more) looping = false; return more; });
  }
  SD.kick = kick;

  function wrongIndex(st){ const n = motorsList().length; return n ? (2 + 3 * st.wireJobs) % n : null; }

  function place(st, id, o, auto){
    st.placed[id] = { t: 0, orient: o, leave: false, delay: 0 };
    st.sel = id;
    if (!auto) sfx(st, 'whoosh');
    if (id === 'XT60'){ if (st.fault) { st.fault = null; st.smoke = []; log(st, LOG.capNew); } if (!auto) st.smokeOk = false; }
    if (id === 'WIRES'){ if (!auto) { st.motorOk = false; st.wrong = wrongIndex(st); } st.wireJobs++; }
    if (id === 'FC' && !auto) st.accOk = false;
  }

  const A = SD.actions = {
    add(st, id, o = 0){
      const part = byId(id);
      if (!part) return 'unknown part ' + id;
      o = part.polar && o === 1 ? 1 : 0;
      if (st.plugged && id !== 'BATT') return say(st, MSG.live, null, 2400, 'buzz');
      if (st.exT || st.ex > 0.01) return say(st, MSG.exploded, null, 2000, 'buzz');
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      const p = st.placed[id];
      if (p && !p.leave){
        if (!part.polar || p.orient === o) return say(st, MSG.already, { short: shortOf(id) }, 1600, 'tick');
        p.orient = o; p.t = 0; st.sel = id; sfx(st, 'whoosh');
        if (id === 'XT60'){ st.smokeOk = false; if (st.fault) { st.fault = null; st.smoke = []; log(st, LOG.capNew); } }
        if (id === 'FC') st.accOk = false;
        return kick();
      }
      const miss = (part.after || []).find(a => !inPl(st, a));
      if (miss) return say(st, MSG.after, { short: shortOf(id), need: low(shortOf(miss)) }, 2400, 'buzz');
      if (id === 'PROPS' && ((craft.tests.smoke && !st.smokeOk) || (craft.tests.motors && motorsList().length && !st.motorOk)))
        return say(st, MSG.propsLast, null, 3200, 'buzz');
      place(st, id, o);
      kick();
    },
    remove(st, id){
      const part = byId(id);
      if (!part) return 'unknown part ' + id;
      if (st.plugged) return say(st, MSG.live, null, 2400, 'buzz');
      if (st.exT || st.ex > 0.01) return say(st, MSG.exploded, null, 2000, 'buzz');
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      if (!inPl(st, id)) return say(st, MSG.notOn, { short: shortOf(id) }, 1600, 'tick');
      const dep = craft.parts.find(q => inPl(st, q.id) && (q.after || []).includes(id));
      if (dep) return say(st, MSG.takeOff, { dep: low(shortOf(dep.id)) }, 2400, 'buzz');
      st.placed[id].leave = true; st.placed[id].t = Math.min(1, st.placed[id].t);
      if (st.sel === id) st.sel = null;
      if (id === 'XT60') { st.smokeOk = false; st.fault = null; st.smoke = []; }
      if (id === 'WIRES') st.motorOk = false;
      if (id === 'FC') st.accOk = false;
      sfx(st, 'whoosh');
      say(st, MSG.off, { short: shortOf(id) }, 1400);
      kick();
    },
    build(st){
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      A.unplug(st, true); st.exT = 0;
      let changed = false;
      for (const p of craft.parts){ const pl = st.placed[p.id]; if (pl && !pl.leave && pl.orient === 1){ pl.orient = 0; pl.t = 0; changed = true; } }
      if (st.fault) { st.fault = null; st.smoke = []; log(st, LOG.capNew); changed = true; }
      const missing = craft.parts.filter(p => !inPl(st, p.id)).map(p => p.id);
      const props = missing.indexOf('PROPS');
      if (props >= 0) { missing.splice(props, 1); missing.push('PROPS'); }
      const checks = (!craft.tests.smoke || st.smokeOk) && (!craft.tests.motors || !motorsList().length || st.motorOk) && (!craft.tests.calibrate || !has('FC') || st.accOk);
      if (!missing.length && !changed && checks) return say(st, MSG.built, null, 1600, 'tick');
      st.queue = missing; st.queueT = 0;
      st.smokeOk = true; st.motorOk = true; st.accOk = true; st.wrong = null;
      log(st, LOG.auto);
      sfx(st, 'whoosh');
      if (!missing.length) say(st, MSG.buildDone, null, 2600, 'ding');
      kick();
    },
    strip(st){
      if (busy(st) && !st.queue.length) return say(st, MSG.busy, null, 1600, 'tick');
      const fitted = craft.parts.filter(p => inPl(st, p.id));
      if (!fitted.length) return say(st, MSG.box, null, 1600, 'tick');
      A.unplug(st, true); st.exT = 0; st.queue = []; st.sel = null; st.fault = null; st.smoke = [];
      fitted.sort((a, b) => (b.z || 0) - (a.z || 0)).forEach((p, i) => { const pl = st.placed[p.id]; pl.leave = true; pl.t = Math.min(1, pl.t); pl.delay = i * 0.05; });
      st.smokeOk = st.motorOk = st.accOk = false;
      sfx(st, 'whoosh');
      kick();
    },
    explode(st, on){
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      A.unplug(st, true);
      st.exT = on == null ? (st.exT ? 0 : 1) : (on ? 1 : 0);
      st.exploded = !!st.exT;
      sfx(st, 'click');
      kick();
    },
    plug(st){ return st.plugged ? A.unplug(st) : A.plugIn(st); },
    plugIn(st){
      if (st.plugged) return;
      if (busy(st) && !(st.test && st.test.kind === 'motors')) return say(st, MSG.busy, null, 1600, 'tick');
      const needs = (craft.tests.plug && craft.tests.plug.needs) || ['BATT', 'XT60'];
      if (!needs.every(id => !has(id) || isOn(st, id))) return say(st, MSG.plugNeeds, null, 2400, 'buzz');
      if (st.fault) return say(st, MSG.faultFix, null, 2600, 'buzz');
      st.exT = 0; st.exploded = false;
      st.plugged = true;
      const b = resolved(st).batt, full = b.chem === 'lihv' ? 4.35 : 4.2;
      log(st, LOG.plugged, { v: +(b.cells * full).toFixed(2) });
      if (has('XT60') && orient(st, 'XT60') === 1 && !st.smokeOk){
        st.fault = 'XT60'; st.popT = 0; st.later.push({ t: 0.12, sfx: 'sizzle' });
        log(st, LOG.pop);
        say(st, MSG.pop, null, 4200, 'pop');
      } else {
        say(st, craft.messages && craft.messages.powered || MSG.powered, null, 2200, 'power');
      }
      kick();
    },
    unplug(st, silent){
      if (!st.plugged) return;
      st.plugged = false;
      if (!silent) { sfx(st, 'unplug'); log(st, LOG.unplugged); say(st, MSG.unplugged, null, 1400); }
      kick();
    },
    smoke(st){
      if (!craft.tests.smoke) return say(st, MSG.noMotors, null, 1600, 'tick');
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      if (!craft.tests.smoke.needs.every(id => isOn(st, id))) return say(st, MSG.smokeNeeds, null, 2400, 'buzz');
      if (st.fault) return say(st, MSG.faultFix, null, 2600, 'buzz');
      A.unplug(st, true); st.exT = 0; st.exploded = false;
      sfx(st, 'click'); log(st, LOG.smoke);
      st.test = { kind: 'smoke', t: 0, dur: 2.2, short: has('XT60') && orient(st, 'XT60') === 1 };
      kick();
    },
    motors(st){
      const ms = motorsList();
      if (!craft.tests.motors || !ms.length) return say(st, MSG.noMotors, null, 1600, 'tick');
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      if (!craft.tests.motors.needs.every(id => isOn(st, id))) return say(st, MSG.motorNeeds, null, 2400, 'buzz');
      if (has('PROPS') && inPl(st, 'PROPS')) return say(st, MSG.propsOff, null, 2800, 'buzz');
      st.exT = 0; st.exploded = false;
      if (!st.plugged){
        if (has('BATT') && !isOn(st, 'BATT')) return say(st, MSG.needBatt, null, 2400, 'buzz');
        A.plugIn(st);
        if (!st.plugged || st.fault) return;
      }
      log(st, LOG.motors, { list: ms.map(m => m.id).join(', ') });
      st.test = { kind: 'motors', t: 0, dur: 1.2 * ms.length, wrong: st.motorOk ? null : st.wrong, cur: -1 };
      sfx(st, 'spin');
      kick();
    },
    calibrate(st){
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      const needs = (craft.tests.calibrate && craft.tests.calibrate.needs) || ['FC'];
      if (!needs.every(id => isOn(st, id))) return say(st, MSG.calNeeds, null, 2200, 'buzz');
      st.exT = 0; st.exploded = false;
      st.test = { kind: 'calibrate', t: 0, dur: 0.9 };
      sfx(st, 'click');
      kick();
    },
    select(st, id){
      if (id != null && !byId(id)) return 'unknown part ' + id;
      st.sel = st.sel === id ? null : id;
      sfx(st, 'tick');
    },
    step(st, n){
      if (busy(st)) return say(st, MSG.busy, null, 1600, 'tick');
      A.unplug(st, true); st.exT = 0; st.exploded = false;
      craft.parts.forEach((p, i) => {
        const pl = st.placed[p.id], want = i < n;
        if (want && (!pl || pl.leave)) place(st, p.id, 0);
        else if (want && pl.orient === 1) { pl.orient = 0; pl.t = 0; if (p.id === 'XT60') st.smokeOk = false; if (p.id === 'FC') st.accOk = false; }
        else if (!want && pl && !pl.leave) { pl.leave = true; if (p.id === 'XT60') st.smokeOk = false; if (p.id === 'WIRES') st.motorOk = false; if (p.id === 'FC') st.accOk = false; }
      });
      if (n === 0) { st.fault = null; st.smoke = []; }
      st.sel = n > 0 ? craft.parts[n - 1].id : null;
      kick();
    },
  };

  /* ---------- the loop ---------- */
  function finishTest(st, t){
    if (t.kind === 'smoke'){
      if (t.short) { log(st, LOG.smokeShort); say(st, MSG.smokeShort, null, 3800, 'buzz'); }
      else { st.smokeOk = true; log(st, LOG.smokeOk); say(st, MSG.smokeOk, null, 2400, 'ding'); }
    } else if (t.kind === 'motors'){
      if (t.wrong != null) {
        const m = motorsList()[t.wrong].id;
        st.motorOk = true; st.wrongMotor = m; st.wrong = null;
        log(st, LOG.reversed, { m }); say(st, MSG.motorWrong, { m }, 3200, 'ding');
      } else { st.motorOk = true; say(st, MSG.motorsOk, null, 2200, 'ding'); }
      st.rpm = st.rpm.map(() => 0);
    } else if (t.kind === 'calibrate'){
      st.accOk = true;
      if (orient(st, 'FC') === 1) { log(st, LOG.calBack); say(st, MSG.calBack, null, 3000, 'tick'); }
      else { log(st, LOG.calOk); say(st, MSG.calOk, null, 2200, 'ding'); }
    }
  }

  function step(st, dt){
    let more = false;
    st.t += dt;
    for (const p of craft.parts){
      const pl = st.placed[p.id];
      if (!pl) continue;
      if (pl.leave){
        if (pl.delay > 0) { pl.delay -= dt; more = true; continue; }
        pl.t -= 2.6 * dt;
        if (pl.t <= 0) delete st.placed[p.id]; else more = true;
      } else if (pl.t < 1){
        pl.t = Math.min(1, pl.t + 2.2 * dt);
        if (pl.t >= 1) sfx(st, 'place'); else more = true;
      }
    }
    if (Math.abs(st.ex - st.exT) > 1e-3){ st.ex += Math.sign(st.exT - st.ex) * Math.min(Math.abs(st.exT - st.ex), 1.5 * dt); more = true; }
    else st.ex = st.exT;
    if (st.queue.length){
      st.queueT -= dt; more = true;
      if (st.queueT <= 0){ const id = st.queue.shift(); place(st, id, 0, true); sfx(st, 'whoosh'); st.queueT = 0.35;
        if (!st.queue.length) st.later.push({ t: 0.5, say: MSG.buildDone, sfx: 'ding' }); }
    }
    if (st.later.length){
      more = true;
      for (const l of st.later) l.t -= dt;
      for (const l of st.later.filter(l => l.t <= 0)) { if (l.say) say(st, l.say, null, 2600, l.sfx); else if (l.sfx) sfx(st, l.sfx); }
      st.later = st.later.filter(l => l.t > 0);
    }
    const t = st.test;
    if (t){
      more = true;
      t.t += dt;
      if (t.kind === 'motors'){
        const ms = motorsList(), i = Math.min(ms.length - 1, Math.floor(t.t / 1.2));
        if (i !== t.cur) { t.cur = i; sfx(st, 'spin'); }
        st.rpm = ms.map((m, j) => j === i ? Math.min(1, (t.t - 1.2 * i) * 4) : Math.max(0, st.rpm[j] - dt * 3));
        const wrong = t.wrong === i, dir = (ms[i].dir === 'CW' ? -1 : 1) * (wrong ? -1 : 1);
        st.spin[i] += dir * 20 * dt * st.rpm[i];
      }
      if (t.t >= t.dur) { st.test = null; finishTest(st, t); }
    }
    if (st.fault){
      st.popT += dt;
      if (st.popT < 5){ more = true; st.smokeAcc = (st.smokeAcc || 0) + dt * 8;
        while (st.smokeAcc >= 1){ st.smokeAcc -= 1; st.smoke.push({ age: 0, dx: (Math.sin(st.t * 37) * 3), dy: (Math.cos(st.t * 23) * 3) }); } }
    }
    if (st.smoke.length){ more = true; for (const s of st.smoke) s.age += dt; st.smoke = st.smoke.filter(s => s.age < 1.1); }
    if ((st.xr || 0) > 0.05 && (powered(st) || (st.test && st.test.kind === 'motors'))) more = true;
    if (st.test && st.test.kind === 'smoke') more = true;
    return more;
  }

  /* ---------- report and accept (the bridge contract, docs/FIGURES-DRONE.md §10) ---------- */
  function report(st){
    const placed = {};
    for (const p of craft.parts) if (isOn(st, p.id)) placed[p.id] = st.placed[p.id].orient;
    const fitted = Object.keys(placed).length, total = craft.parts.length;
    const next = (craft.parts.find(p => !inPl(st, p.id)) || {}).id || null;
    const mistakes = craft.parts.filter(p => p.polar && placed[p.id] === 1).map(p => p.mistake || ({ FC: 'fc-reversed', XT60: 'cap-reversed', PROPS: 'props-swapped' })[p.id] || (p.id.toLowerCase() + '-reversed'));
    const smokeTested = !craft.tests.smoke || st.smokeOk;
    const motorChecked = !craft.tests.motors || !motorsList().length || st.motorOk;
    const accCal = !has('FC') || st.accOk;
    const built = fitted === total;
    return {
      craft: craft.id, fitted, total, placed, next, built,
      plugged: !!st.plugged, powered: !!powered(st), fault: st.fault || null,
      smokeOk: !!st.smokeOk, motorOk: !!st.motorOk, accOk: !!st.accOk,
      test: st.test ? st.test.kind : null, wrongMotor: st.wrongMotor || null,
      exploded: !!st.exT, sheet: st.sheet || null, sel: st.sel || null,
      design: { batt: st.design.batt, motor: st.design.motor, prop: st.design.prop },
      flight: { ready: built && !st.fault && smokeTested && motorChecked && accCal, fcReversed: placed.FC === 1,
        propsSwapped: placed.PROPS === 1, motorChecked, accCal, capFault: st.fault === 'XT60', smokeTested, mistakes },
      log: { n: st.log.n, lines: st.log.lines.slice() },
      sfx: st.sfx ? { n: st.sfx.n, name: st.sfx.name } : { n: 0, name: null },
    };
  }

  function accept(st, patch){
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return 'patch must be an object';
    const known = ['design', 'calc', 'sel', 'step', 'add', 'remove', 'run', 'exploded', 'sheet'];
    const bad = Object.keys(patch).filter(k => !known.includes(k));
    if (bad.length) return 'unknown field ' + bad.join(', ');
    let ok = true;
    if (patch.design != null){
      const d = patch.design;
      if (typeof d !== 'object') return 'design must be an object';
      for (const [k, t] of [['batt', 'batts'], ['motor', 'motors'], ['prop', 'props']]) {
        if (d[k] == null) continue;
        if (typeof d[k] !== 'string' || !craft.design[t][d[k]]) { ok = `unknown ${k} "${d[k]}"`; continue; }
        st.design[k] = d[k];
      }
    }
    if (patch.calc != null){
      const c = patch.calc, out = {};
      for (const k of ['V', 'maxA', 'hoverA']) if (typeof c[k] === 'number' && isFinite(c[k]) && c[k] >= 0 && c[k] < 1e5) out[k] = c[k];
      st.calc = out;
    }
    if ('sel' in patch){ if (patch.sel === null || byId(patch.sel)) st.sel = patch.sel; else ok = 'unknown part ' + patch.sel; }
    if (patch.sheet !== undefined){ if (patch.sheet === null || patch.sheet === 'wiring') st.sheet = patch.sheet; else ok = 'sheet must be "wiring" or null'; }
    if (patch.exploded != null){ if (typeof patch.exploded === 'boolean') A.explode(st, patch.exploded); else ok = 'exploded must be boolean'; }
    if (patch.step != null){ const n = patch.step; if (Number.isInteger(n) && n >= 0 && n <= craft.parts.length) A.step(st, n); else ok = 'step out of range'; }
    if (patch.add != null){ const a = patch.add; if (a && typeof a === 'object' && byId(a.id)) { const r = A.add(st, a.id, a.orient === 1 ? 1 : 0); if (typeof r === 'string') ok = r; } else ok = 'add needs a part id'; }
    if (patch.remove != null){ if (byId(patch.remove)) A.remove(st, patch.remove); else ok = 'unknown part ' + patch.remove; }
    if (patch.run != null){
      const runs = { build: A.build, strip: A.strip, explode: s => A.explode(s), plug: A.plugIn, unplug: s => A.unplug(s), smoke: A.smoke, motors: A.motors, calibrate: A.calibrate };
      if (runs[patch.run]) runs[patch.run](st); else ok = 'unknown run ' + patch.run;
    }
    kick();
    return ok;
  }

  /* ---------- drawing order ----------
     core byDepth sorts with a pairwise comparator that is not transitive, which scrambles a few hundred overlapping
     items. Here every pair whose screen boxes overlap gets an edge from the separating axis (z first: the camera
     always looks down), or from centre depth when the boxes interpenetrate, then a topological sort draws far to near. */
  SD.sortDraw = items => {
    const n = items.length, V = CAM_V, info = new Array(n);
    for (let i = 0; i < n; i++){
      const b = items[i].box, xs = [], ys = [];
      for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]) { const q = P(x, y, z); xs.push(q[0]); ys.push(q[1]); }
      const c = items[i].at || [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2, (b[0][2] + b[1][2]) / 2];
      info[i] = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), d: c[0] * V[0] + c[1] * V[1] + c[2] * V[2] };
    }
    const succ = Array.from({ length: n }, () => []), indeg = new Array(n).fill(0);
    for (let i = 0; i < n; i++){
      const a = info[i], bi = items[i].box;
      for (let j = i + 1; j < n; j++){
        const c = info[j];
        if (a.x1 <= c.x0 || c.x1 <= a.x0 || a.y1 <= c.y0 || c.y1 <= a.y0) continue;
        const bj = items[j].box;
        let ord = 0;
        for (const k of [2, 0, 1]){
          if (bi[1][k] <= bj[0][k] + 1e-6) { ord = V[k] >= 0 ? -1 : 1; break; }
          if (bj[1][k] <= bi[0][k] + 1e-6) { ord = V[k] >= 0 ? 1 : -1; break; }
        }
        if (!ord) ord = a.d <= c.d ? -1 : 1;
        if (ord < 0) { succ[i].push(j); indeg[j]++; } else { succ[j].push(i); indeg[i]++; }
      }
    }
    const done = new Uint8Array(n), out = [];
    let ready = [];
    for (let i = 0; i < n; i++) if (!indeg[i]) ready.push(i);
    for (let left = n; left > 0; left--){
      let pick = -1;
      if (ready.length){ let bi = 0; for (let r = 1; r < ready.length; r++) if (info[ready[r]].d < info[ready[bi]].d) bi = r; pick = ready[bi]; ready.splice(bi, 1); }
      else { for (let i = 0; i < n; i++) if (!done[i] && (pick < 0 || info[i].d < info[pick].d)) pick = i; }
      done[pick] = 1; out.push(items[pick].svg);
      for (const j of succ[pick]) if (!done[j] && --indeg[j] === 0) ready.push(j);
    }
    return out.join('');
  };

  /* ---------- scene ---------- */
  SD.dims = () => ({ M: craft.mat, MT: 4 });
  function lift(st, part){
    const pl = st.placed[part.id], u = craft.mat / 280;
    const drop = (1 - ease(Math.max(0, Math.min(1, pl.t)))) * 70 * u;
    return drop + ease(st.ex) * (part.z || 0) * craft.explode;
  }

  function scene(st){
    if (st.sheet && SD.sheet) return SD.sheet(st);
    const M = craft.mat, MT = 4, G = SD.G, k = ease(st.xr || 0);
    G.ox = M / 2; G.oy = M / 2; G.oz = MT; G.dz = 0;
    const ctx = { st, craft, design: resolved(st), t: st.t, k, powered: powered(st), spin: st.spin, rpm: st.rpm, mat: M,
      flows: [], shadows: [], tags: [], callouts: [], testing: st.test ? st.test.kind : null };
    const items = [];
    for (const part of craft.parts){
      const pl = st.placed[part.id];
      if (!pl) continue;
      G.dz = lift(st, part);
      ctx.part = part; ctx.orient = pl.orient; ctx.lift = G.dz;
      const before = ctx.shadows.length;
      let its = [];
      for (const pc of [].concat(part.piece)) { const fn = SD.kinds[pc.kind]; if (fn) its = its.concat(fn(pc, ctx) || []); }
      its = its.filter(Boolean);
      if (G.dz > 0.5) ctx.shadows.length = before;       // lifted parts drop their shadow
      let op = pl.leave ? Math.max(0, pl.t) : 1;
      if (part.cover && k > 0) op *= 1 - 0.72 * k;
      const lbl = CF_ESC(T(part.name || part.short));
      its.forEach((it, j) => {
        // one tab stop per part, on its first item; Enter or Space presses it (see define)
        const a11y = j === 0 ? ` tabindex="0" role="button" aria-label="${lbl}" aria-pressed="${st.sel === part.id}"` : '';
        let svg = act('part', it.svg, `data-id="${part.id}" data-label="${lbl}"${a11y}`);
        if (op < 0.999) svg = `<g opacity="${op.toFixed(3)}">${svg}</g>`;
        items.push({ box: it.box, at: it.at, svg });
      });
      if (pl.t >= 1 && !pl.leave){
        const anchor = part.tag && part.tag.at ? SD.W(...part.tag.at) : its.length ? topOf(its[0].box) : null;
        if (anchor) ctx.tags.push({ id: part.id, at: anchor, dx: part.tag ? part.tag.dx || 0 : 0, dy: part.tag ? part.tag.dy || -26 : -26, text: part.short });
        for (const c of part.xr || []) ctx.callouts.push({ at: SD.W(...c.at), text: c.text, on: st.sel === part.id });
      }
    }
    G.dz = 0;
    for (const c of craft.inside || []) if (!c.part || isOn(st, c.part)) ctx.callouts.push({ at: SD.W(...c.at), text: c.text, on: c.part && st.sel === c.part });
    if (st.test && st.test.kind === 'smoke' && SD.kinds._stopper) items.push(...SD.kinds._stopper(ctx));
    let out = SD.matSvg ? SD.matSvg(ctx) : '';
    for (const pts of ctx.shadows) out += castShadow(pts, MT, boardTop(0, 0, M, M, MT, 8));
    out += SD.sortDraw(items);
    if (SD.overlays) out += SD.overlays(ctx);
    // labels: surface pills, or see-through callouts
    const B = craft.bounds;
    if (k > 0.6 && ctx.callouts.length) out += xrCallouts(ctx.callouts.map(c => ({ at: c.at, text: c.text, on: c.on })), [B[0] + M / 2, B[1] + M / 2, B[2] + M / 2, B[3] + M / 2, B[4] + MT, B[5] + MT]);
    else if (!st.test || st.test.kind !== 'motors') for (const tg of ctx.tags) out += selTag(tg, st.sel === tg.id);
    return out;
  }
  const topOf = b => [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2, b[1][2]];
  function selTag(tg, on){
    const s = tag(tg.at, tg.dx, tg.dy, tg.text, on);
    return on ? s.replace('class="tag on"', 'class="tag on dsel"') : s;
  }

  /* ---------- buttons ---------- */
  function buttons(){
    const bs = [];
    bs.push({ id: 'add', label: 'Add next part', choices: st => {
      const out = [];
      for (const p of craft.parts){
        const miss = (p.after || []).find(a => !inPl(st, a));
        const why = miss ? T(MSG.after, { short: shortOf(p.id), need: low(shortOf(miss)) }) : undefined;
        const opts = p.polar ? [0, 1] : [0];
        for (const o of opts){
          const pl = st.placed[p.id], cur = !!pl && !pl.leave && pl.orient === o;
          out.push({ id: o ? p.id + '-wrong' : p.id, label: p.polar ? `${T(p.short)}: ${T(p.polar[o])}` : T(p.short),
            current: cur, disabled: !cur && !!miss, why, onClick: s => A.add(s, p.id, o) });
        }
      }
      return out;
    } });
    bs.push({ id: 'remove', label: 'Remove a part', choices: st => {
      const fittedParts = craft.parts.filter(p => inPl(st, p.id));
      if (!fittedParts.length) return [{ id: 'none', label: T('Nothing is fitted'), disabled: true, why: T('Nothing is fitted') }];
      return fittedParts.map(p => {
        const dep = craft.parts.find(q => inPl(st, q.id) && (q.after || []).includes(p.id));
        return { id: p.id, label: T(p.short), disabled: !!dep, why: dep ? T(MSG.takeOff, { dep: low(shortOf(dep.id)) }) : undefined,
          onClick: s => A.remove(s, p.id) };
      });
    } });
    bs.push({ id: 'build', label: 'Build it for me', onClick: st => A.build(st) });
    bs.push({ id: 'strip', label: 'Take it apart', onClick: st => A.strip(st) });
    bs.push({ id: 'explode', label: 'Exploded view', onClick: st => A.explode(st) });
    bs.push({ id: 'plug', label: 'Plug / unplug battery', onClick: st => A.plug(st) });
    if (craft.tests.smoke) bs.push({ id: 'smoke', label: 'Smoke stopper test', onClick: st => A.smoke(st) });
    if (craft.tests.motors && craft.motors.length) bs.push({ id: 'motors', label: 'Check motor direction', onClick: st => A.motors(st) });
    if (has('FC')) bs.push({ id: 'calibrate', label: craft.calLabel || 'Calibrate accelerometer', onClick: st => A.calibrate(st) });
    bs.push({ id: 'wiring', label: 'Wiring sheet', onClick: st => { st.sheet = st.sheet ? null : 'wiring'; sfx(st, 'click'); } });
    for (const b of craft.buttons || []) bs.push({ id: b.id, label: b.label, onClick: () => { b.onClick(SD.api); kick(); } });
    return bs;
  }

  SD.api = {
    say: (text, ms, sound) => ui && say(ui.st, text, null, ms, sound),
    log: line => ui && log(ui.st, line),
    sfx: name => ui && sfx(ui.st, name),
    isOn: id => ui ? isOn(ui.st, id) : false,
    orient: id => ui ? orient(ui.st, id) : 0,
    get st(){ return ui ? ui.st : null; },
    render: () => ui && ui.render(),
  };

  /* ---------- define + mount ---------- */
  SD.define = function define(def){
    if (craft) return note('one craft per page: ' + def.id + ' ignored');
    validate(def);
    craft = Object.assign({ mat: 280, height: 120, log: 'betaflight', inside: [], buttons: [] }, def);
    craft.explode = def.explode || 16 * craft.mat / 280;
    craft.byId = {};
    for (const p of craft.parts) craft.byId[p.id] = p;
    craft.motors = SD.motorsOf ? SD.motorsOf(craft.frame) : [];
    const R = craft.mat / 2;
    craft.bounds = def.bounds || [-R * 0.8, R * 0.8, -R * 0.8, R * 0.8, 0, craft.height * 0.7];
    const d = craft.design, def0 = d.default || {};
    const first = t => Object.keys(d[t] || {})[0];
    const st = {
      design: { batt: def0.batt || first('batts'), motor: def0.motor || first('motors'), prop: def0.prop || first('props') },
      placed: {}, ex: 0, exT: 0, exploded: false, sel: null, smokeOk: true, motorOk: true, accOk: true,
      plugged: false, fault: null, popT: 0, smoke: [], wireJobs: 0, wrong: null, wrongMotor: null,
      test: null, queue: [], queueT: 0, later: [], t: 0, sheet: null, calc: {},
      spin: craft.motors.map((m, i) => i * 0.7), rpm: craft.motors.map(() => 0),
      log: { n: 0, lines: [] }, sfx: { n: 0, name: null }, msg: '',
    };
    for (const p of craft.parts) st.placed[p.id] = { t: 1, orient: 0, leave: false, delay: 0 };
    log(st, LOG.head, { log: craft.log });
    const style = document.createElement('style');
    style.textContent = 'html.nolabels #fig .tag.dsel{display:inline} #fig [data-act=part]:focus{outline:none}'
      + ' #fig [data-act=part]:focus-visible{outline:2px dashed var(--accent,#f4b829);outline-offset:2px}';
    document.head.appendChild(style);
    ui = mountFigure({
      fig: craft.fig, title: craft.title, turn: 'full', palette: craft.palette,
      size: [craft.mat, craft.mat, craft.height], state: st, credit: true,
      scene: s => scene(s),
      buttons: buttons(),
      stats: s => {
        const r = report(s), checks = [craft.tests.smoke && s.smokeOk, craft.tests.motors && craft.motors.length && s.motorOk, has('FC') && s.accOk].filter(Boolean).length;
        const nChecks = [craft.tests.smoke, craft.tests.motors && craft.motors.length, has('FC')].filter(Boolean).length;
        return [{ label: T('Parts'), value: `${r.fitted}/${r.total}` }, { label: T('Checks'), value: `${checks}/${nChecks}` },
          { label: T('Battery'), value: s.fault ? T('FAULT') : s.plugged ? T('ON') : T('OFF'), small: true }];
      },
      acts: { part: (s, el) => { const id = el.dataset.id; if (id && byId(id)) A.select(s, id); } },
      params: (s, q) => {
        const n = q.get('step');
        if (n != null && /^\d+$/.test(n)) {
          const k = Math.min(+n, craft.parts.length);
          craft.parts.forEach((p, i) => { if (i >= k) delete s.placed[p.id]; });
          if (!s.placed.XT60) s.smokeOk = false;
          if (!s.placed.WIRES) { s.motorOk = false; s.wrong = 2 % Math.max(1, craft.motors.length); }
          if (!s.placed.FC) s.accOk = false;
        }
        for (const id of (q.get('flip') || '').split(',').filter(Boolean)) if (s.placed[id] && byId(id).polar) { s.placed[id].orient = 1; if (id === 'XT60') s.smokeOk = false; if (id === 'FC') s.accOk = false; }
        if (q.get('fresh') === '1') { s.smokeOk = s.motorOk = s.accOk = false; s.wrong = 2 % Math.max(1, craft.motors.length); }
        for (const [k, t] of [['batt', 'batts'], ['motor', 'motors'], ['prop', 'props']]) if (d[t][q.get(k)]) s.design[k] = q.get(k);
        if (q.get('exploded') === '1') { s.ex = s.exT = 1; s.exploded = true; }
        if (q.get('sheet') === 'wiring') s.sheet = 'wiring';
        if (byId(q.get('sel'))) s.sel = q.get('sel');
        if (q.get('plug') === '1' && s.placed.BATT && s.placed.XT60){
          s.plugged = true;
          if (s.placed.XT60.orient === 1 && !s.smokeOk) s.fault = 'XT60';
        }
      },
      embed: { accept: (s, patch) => accept(s, patch), report: s => report(s) },
    });
    xrMount(() => ui, () => T(craft.xrCaption || 'See-through: the covers fade so the insides, the power path and the signals show.'));
    const fig = document.getElementById('fig');
    if (fig) fig.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target.closest && e.target.closest('[data-act="part"][tabindex]');
      if (!el) return;
      e.preventDefault();
      // the same path as a click, so the bridge reports the part too
      const id = el.dataset.id;
      el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerType: 'keyboard' }));
      const again = fig.querySelector(`[data-act="part"][tabindex][data-id="${id}"]`);
      if (again) again.focus();
    });
    kick();
    return ui;
  };
})();

</script>
<script>/* figures/engine/drone-geo.js */
/* SimLab drone engine: craft-local geometry helpers (SL.drone.g) and materials. Craft-local millimetres,
   x forward, y left, z up, z = 0 on the bench mat (docs/FIGURES-DRONE.md §2). Every helper returns one depth-sorted
   item { box, svg } or an array of them, in bench coordinates. */
(() => {
  const SD = SL.drone;
  const G = SD.G = { ox: 0, oy: 0, oz: 4, dz: 0, pal: 'tomato' };
  const W = SD.W = (x, y, z) => [x + G.ox, y + G.oy, z + G.oz + G.dz];
  SD.Pb = (x, y, z) => P(...W(x, y, z));

  const NAMED = SD.NAMED = {
    carbon: { l: '#6e6a65', m: '#4c4844', d: '#2d2a28' },
    metal: METAL, dark: DARK, clear: CLEAR, ceramic: CERAMIC,
    pcb: matOf('#3f8a55'), pcbBlue: matOf('#3f6fb5'), pcbBlack: matOf('#3d3b39'),
    copper: matOf('#c98a4b'), foam: matOf('#ece6d6'), white: matOf('#f4f1e8'),
    red: matOf('#d8473a'), black: matOf('#2c2926'), yellow: matOf('#f2c230'), alu: matOf('#b9c3cc'),
  };
  const mat = SD.mat = c => {
    if (c && typeof c === 'object' && c.l) return c;
    if (c === 'pal') return PALS[G.pal] || PALS.tomato;
    if (typeof c === 'string' && PALS[c]) return PALS[c];
    if (typeof c === 'string' && NAMED[c]) return NAMED[c];
    return CF_MAT(c);
  };
  const colOf = SD.colOf = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c) ? c : mat(c).l;

  const bbox = SD.bbox = (pts, pad = 0) => {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const p of pts) for (let i = 0; i < 3; i++) { if (p[i] < mn[i]) mn[i] = p[i]; if (p[i] > mx[i]) mx[i] = p[i]; }
    return [mn.map(v => v - pad), mx.map(v => v + pad)];
  };
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const len3 = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);

  const g = SD.g = {
    box(x0, y0, z0, x1, y1, z1, c, w = .9){
      const a = W(Math.min(x0, x1), Math.min(y0, y1), Math.min(z0, z1)), b = W(Math.max(x0, x1), Math.max(y0, y1), Math.max(z0, z1));
      return { box: [a, b], svg: box(a[0], a[1], a[2], b[0], b[1], b[2], mat(c), tone, w) };
    },
    cyl(x, y, z0, z1, r, c, n = 18, w = 1){
      const a = W(x, y, z0), b = W(x, y, z1);
