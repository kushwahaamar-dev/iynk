      + `<text x="${f(X)}" y="${f(Y + fs * .36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${fg}">${CF_ESC(text)}</text></g>`;
  }
  SD.overlays = ctx => {
    let s = '';
    const st = ctx.st, c = ctx.craft, t = st.test, G = SD.G;
    G.dz = 0;
    if (t && t.kind === 'motors' && t.cur >= 0){
      const mo = c.motors[t.cur], wrong = t.wrong === t.cur, dirShown = wrong ? (mo.dir === 'CW' ? 'CCW' : 'CW') : mo.dir;
      const Mf = motorFrame(mo, frameTop(c)), hz = motorH(ctx.design) + (c.arrowZ || 14), R = 22 * c.mat / 280, sgn = dirShown === 'CW' ? -1 : 1;
      const a0 = (st.spin[t.cur] || 0) * .15, pts = Array.from({ length: 33 }, (_, i) => { const a = a0 + sgn * i / 32 * (288 / 360) * Math.PI * 2; return W(...Mf(R * Math.cos(a), R * Math.sin(a), hz)); });
      const col = wrong ? '#e2483d' : '#2f7d4f';
      s += `<path d="${pd(pts, false)}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
      const e = P(...pts[32]), e2 = P(...pts[29]), ang = Math.atan2(e[1] - e2[1], e[0] - e2[0]), hs = 6 * INK_K;
      s += `<path d="M${f(e[0] + Math.cos(ang) * hs)} ${f(e[1] + Math.sin(ang) * hs)}L${f(e[0] + Math.cos(ang + 2.4) * hs)} ${f(e[1] + Math.sin(ang + 2.4) * hs)}L${f(e[0] + Math.cos(ang - 2.4) * hs)} ${f(e[1] + Math.sin(ang - 2.4) * hs)}Z" fill="${col}" stroke="${INK}" stroke-width=".6"/>`;
      const [X, Y] = P(...W(...Mf(0, 0, hz + 10)));
      s += pill(X, Y - 14 * INK_K, `${mo.id} ${dirShown}${wrong ? ' ' + CF_T('WRONG') : ''}`, wrong ? '#e2483d' : '#fff4d6', wrong ? '#ffffff' : INK);
    }
    if (t && t.kind === 'calibrate' && ctx.fcAt){
      const [X, Y] = P(...ctx.fcAt), r = (6 + 18 * (t.t / t.dur)) * INK_K;
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="none" stroke="#2f7d4f" stroke-width="1.4" opacity="${(1 - t.t / t.dur).toFixed(2)}"/>`;
      s += pill(X, Y - 26 * INK_K, CF_T('LEVEL 0.0 / 0.0'), '#fff4d6');
    }
    if (st.smoke.length && ctx.capAt){
      for (const p of st.smoke){
        const q = [ctx.capAt[0] + p.dx, ctx.capAt[1] + p.dy, ctx.capAt[2] + 30 * p.age];
        const [X, Y] = P(...q);
        s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(3 + 9 * p.age)}" fill="#8f8a84" opacity="${Math.max(0, .6 - .55 * p.age).toFixed(2)}"/>`;
      }
    }
    const k = ctx.k;
    if (k > .05){
      const live0 = ctx.powered, spinning = t && t.kind === 'motors' ? t.cur : -1;
      for (const fl of ctx.flows){
        const live = fl.kind === 'power' ? live0 : fl.kind === 'phase' ? fl.motor === spinning : live0;
        if (!live) continue;
        const col = { power: '#e2483d', phase: '#f08a2b', signal: '#43a35a', video: '#f2c230' }[fl.kind] || '#43a35a';
        const speed = fl.kind === 'phase' ? 60 : 34, gap = 7;
        const segs = [];
        let total = 0;
        for (let i = 0; i < fl.pts.length - 1; i++){ const L = SD.len3(fl.pts[i], fl.pts[i + 1]); segs.push([fl.pts[i], fl.pts[i + 1], total, L]); total += L; }
        for (let d = (st.t * speed) % gap; d < total; d += gap){
          const sg = segs.find(q => d >= q[2] && d <= q[2] + q[3]);
          if (!sg) continue;
          const [X, Y] = P(...SD.lerp3(sg[0], sg[1], (d - sg[2]) / (sg[3] || 1)));
          s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.5 * INK_K)}" fill="${col}" stroke="${INK}" stroke-width=".4" opacity="${k.toFixed(2)}"/>`;
        }
      }
    }
    return s;
  };
})();

</script>
<script>/* figures/engine/drone-sheet.js */
/* SimLab drone engine: the wiring sheet, a flat hand-inked sheet drawn from craft.wiring (docs/FIGURES-DRONE.md §9).
   Canvas 760 x 340 units, blocks 150 x 56. Block ids are part ids, so a click selects the same part as the 3D view. */
(() => {
  const SD = SL.drone;
  const KIND = {
    power: { col: '#e2483d', dash: null, name: 'power' },
    ground: { col: '#231e16', dash: null, name: 'ground' },
    phase: { col: '#f08a2b', dash: null, name: 'motor phases' },
    signal: { col: '#43a35a', dash: [6, 4], name: 'data / signal' },
    video: { col: '#f2c230', dash: null, name: 'video' },
    rf: { col: '#5a82c6', dash: [3, 3], name: 'RF / antenna' },
  };
  SD.WIRE_KINDS = KIND;
  const BW = 150, BH = 56;

  // an elbow from the side centre of block A to that of block B; pa / pb (an edge's own `a` / `b`) replace the ends, so
  // a block with many ports gives each its own point along the side
  function route(A, B, pa, pb){
    const ac = [A.at[0] + BW / 2, A.at[1] + BH / 2], bc = [B.at[0] + BW / 2, B.at[1] + BH / 2];
    const dx = bc[0] - ac[0], dy = bc[1] - ac[1];
    if (Math.abs(dx) >= BW * .9){
      const s = Math.sign(dx), a = pa || [ac[0] + s * BW / 2, ac[1]], b = pb || [bc[0] - s * BW / 2, bc[1]], mx = (a[0] + b[0]) / 2;
      return Math.abs(a[1] - b[1]) < 1 ? [a, b] : [a, [mx, a[1]], [mx, b[1]], b];
    }
    const s = Math.sign(dy) || 1, a = pa || [ac[0], ac[1] + s * BH / 2], b = pb || [bc[0], bc[1] - s * BH / 2], my = (a[1] + b[1]) / 2;
    return Math.abs(a[0] - b[0]) < 1 ? [a, b] : [a, [a[0], my], [b[0], my], b];
  }
  const offsetPath = (pts, o) => pts.map((p, i) => {
    const q = pts[Math.min(i + 1, pts.length - 1)], r = pts[Math.max(i - 1, 0)], dx = q[0] - r[0], dy = q[1] - r[1], L = Math.hypot(dx, dy) || 1;
    return [p[0] - dy / L * o, p[1] + dx / L * o];
  });

  SD.sheet = st => {
    const c = SD.craft(), Wr = c.wiring, svgEl = document.getElementById('fig'), vb = svgEl && svgEl.viewBox && svgEl.viewBox.baseVal;
    const vw = vb && vb.width ? vb.width : 585, vh = vb && vb.height ? vb.height : 440;
    // leave the figure's own button column free when it is shown (standalone or embedded without bare=1): a quarter of
    // the frame, or up to its widest button when that reaches further ("Calibrate accelerometer" on the delivery quad)
    const btns = document.getElementById('btns'), html = document.documentElement, frameBox = svgEl && svgEl.getBoundingClientRect();
    const btnsShown = btns && !html.classList.contains('cf-bare') && getComputedStyle(btns).display !== 'none' && innerWidth > 560;
    const btnRight = btnsShown && frameBox && frameBox.width ? Math.max(0, ...[...btns.children].map(el => el.getBoundingClientRect().right)) : 0;
    const left = btnsShown ? Math.max(vw * .24, btnRight ? (btnRight - frameBox.left) * vw / frameBox.width + 6 : 0) : 0;
    // and the stats panel (parts, checks, battery) on the right
    const stE = document.getElementById('stats');
    const right = stE && frameBox && frameBox.width && getComputedStyle(stE).display !== 'none' && innerWidth > 560
      ? Math.max(0, frameBox.right - stE.getBoundingClientRect().left) * vw / frameBox.width : 0;
    const room = vw - left - right, sc = Math.min(room * .95 / 780, vh * .9 / 380), ox = left + (room - 760 * sc) / 2, oy = (vh - 360 * sc) / 2;
    const X = x => f(ox + x * sc), Y = y => f(oy + y * sc), sw = w => (w * sc / INK_K).toFixed(2), fs = v => f(v * sc);
    const d = SD.resolved(st), V = st.calc && st.calc.V ? st.calc.V : d.batt.cells * 3.7, on = SD.powered(st);
    const t = st.test, spinning = t && t.kind === 'motors' ? t.cur : -1;
    let s = `<rect x="${X(-12)}" y="${Y(-26)}" width="${f(784 * sc)}" height="${f(392 * sc)}" rx="${fs(8)}" fill="#fbf8f0" stroke="${INK}" stroke-width="${sw(1.4)}"/>`;
    s += `<text x="${X(0)}" y="${Y(-8)}" font-size="${fs(11)}" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${INK}">${CF_ESC(CF_T('WIRING'))} · ${CF_ESC(CF_T(c.title))}</text>`;
    s += `<text x="${X(748)}" y="${Y(-8)}" font-size="${fs(9.5)}" text-anchor="end" font-family="ui-monospace,Menlo,monospace" fill="#857d6e">${CF_ESC(CF_T('click a block'))}</text>`;
    const used = new Set();
    for (const e of Wr.edges){
      const A = Wr.nodes[e.from], B = Wr.nodes[e.to], k = KIND[e.kind] || KIND.signal;
      used.add(e.kind in KIND ? e.kind : 'signal');
      const base = e.via ? [e.a || route(A, { at: [e.via[0][0] - BW / 2, e.via[0][1] - BH / 2] })[0], ...e.via, e.b || route(B, { at: [e.via[e.via.length - 1][0] - BW / 2, e.via[e.via.length - 1][1] - BH / 2] })[0]] : route(A, B, e.a, e.b);
      const n = e.n || 1, fitted = SD.isOn(st, e.from) && SD.isOn(st, e.to);
      for (let i = 0; i < n; i++){
        const pts = offsetPath(base, (i - (n - 1) / 2) * 3.4), dd = 'M' + pts.map(p => `${X(p[0])} ${Y(p[1])}`).join('L');
        const col = e.kind === 'power' && n === 2 && i === 1 ? INK : k.col;
        s += `<path d="${dd}" fill="none" stroke="${INK}" stroke-width="${sw(3.4)}" stroke-linejoin="round" opacity="${fitted ? 1 : .35}"${k.dash ? ` stroke-dasharray="${f(k.dash[0] * sc)} ${f(k.dash[1] * sc)}"` : ''}/>`;
        s += `<path d="${dd}" fill="none" stroke="${col}" stroke-width="${sw(2)}" stroke-linejoin="round" opacity="${fitted ? 1 : .35}"${k.dash ? ` stroke-dasharray="${f(k.dash[0] * sc)} ${f(k.dash[1] * sc)}"` : ''}/>`;
        const live = fitted && (e.kind === 'phase' ? spinning >= 0 : e.kind !== 'ground' && on);
        if (live && i === 0){
          let total = 0; const segs = [];
          for (let j = 0; j < pts.length - 1; j++){ const L = Math.hypot(pts[j + 1][0] - pts[j][0], pts[j + 1][1] - pts[j][1]); segs.push([pts[j], pts[j + 1], total, L]); total += L; }
          for (let q = (st.t * 40) % 18; q < total; q += 18){
            const sg = segs.find(z => q >= z[2] && q <= z[2] + z[3]); if (!sg) continue;
            const u = (q - sg[2]) / (sg[3] || 1);
            s += `<circle cx="${X(sg[0][0] + (sg[1][0] - sg[0][0]) * u)}" cy="${Y(sg[0][1] + (sg[1][1] - sg[0][1]) * u)}" r="${fs(2.6)}" fill="#fff4d6" stroke="${INK}" stroke-width="${sw(.8)}"/>`;
          }
        }
      }
      if (e.label){
        const txt = e.label === 'V' ? CF_T('{v} V', { v: V.toFixed(1) }) : CF_T(e.label);
        const mid = base.length === 2 ? [(base[0][0] + base[1][0]) / 2, (base[0][1] + base[1][1]) / 2] : [(base[1][0] + base[2][0]) / 2, (base[1][1] + base[2][1]) / 2];
        const lx = mid[0] + (e.labelAt ? e.labelAt[0] : 0), ly = mid[1] + (e.labelAt ? e.labelAt[1] : -6);
        s += `<text x="${X(lx)}" y="${Y(ly)}" font-size="${fs(9.5)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" fill="#5c564b" paint-order="stroke" stroke="#fbf8f0" stroke-width="${sw(3)}">${CF_ESC(txt)}</text>`;
      }
    }
    for (const [id, nd] of Object.entries(Wr.nodes)){
      const sel = st.sel === id, fitted = SD.isOn(st, id), [x, y] = nd.at;
      const bar = nd.color ? SD.colOf(nd.color) : KIND.power.col;
      const subText = nd.sub === 'batt' ? d.batt.label : nd.sub === 'motor' ? d.motor.label : nd.sub === 'prop' ? (d.prop.label || st.design.prop) : CF_T(nd.sub || '');
      let b = `<rect x="${X(x)}" y="${Y(y)}" width="${fs(BW)}" height="${fs(BH)}" rx="${fs(10)}" fill="${sel ? 'var(--accent,#f4b829)' : '#fbf8f0'}" stroke="${INK}" stroke-width="${sw(1.6)}"${fitted ? '' : ` stroke-dasharray="${f(5 * sc)} ${f(3 * sc)}"`}/>`;
      b += `<path d="M${X(x + 10)} ${Y(y + .8)}L${X(x + 8)} ${Y(y + .8)}Q${X(x + .8)} ${Y(y + .8)} ${X(x + .8)} ${Y(y + 10)}L${X(x + .8)} ${Y(y + BH - 10)}Q${X(x + .8)} ${Y(y + BH - .8)} ${X(x + 8)} ${Y(y + BH - .8)}L${X(x + 10)} ${Y(y + BH - .8)}Z" fill="${bar}"/>`;
      b += `<text x="${X(x + 18)}" y="${Y(y + 23)}" font-size="${fs(12.5)}" font-weight="800" font-family="ui-monospace,Menlo,monospace" fill="${INK}">${CF_ESC(CF_T(nd.title))}</text>`;
      b += `<text x="${X(x + 18)}" y="${Y(y + 41)}" font-size="${fs(10.5)}" font-family="ui-monospace,Menlo,monospace" fill="#5c564b">${CF_ESC(subText)}</text>`;
      if (!fitted) b += `<text x="${X(x + BW - 8)}" y="${Y(y + 13)}" font-size="${fs(8)}" text-anchor="end" font-family="ui-monospace,Menlo,monospace" fill="#857d6e">${CF_ESC(CF_T('not fitted'))}</text>`;
      if (fitted && on && nd.led) b += `<circle cx="${X(x + BW - 12)}" cy="${Y(y + 12)}" r="${fs(4)}" fill="${SD.colOf(nd.led)}" stroke="${INK}" stroke-width="${sw(.8)}"/>`;
      const part = c.byId[id];
      const lbl = CF_ESC(CF_T(part.name || part.short));
      s += act('part', `<g opacity="${fitted ? 1 : .6}">${b}</g>`, `data-id="${id}" data-label="${lbl}" tabindex="0" role="button" aria-label="${lbl}" aria-pressed="${sel}"`);
    }
    const legend = Wr.legend || ['power', 'signal', 'video', 'phase', ...['rf', 'ground'].filter(k => used.has(k))];
    legend.forEach((k, i) => {
      const kk = KIND[k] || KIND.signal, lx = 4 + i * 150, ly = 342;
      s += `<path d="M${X(lx)} ${Y(ly)}L${X(lx + 22)} ${Y(ly)}" stroke="${kk.col}" stroke-width="${sw(4)}"${kk.dash ? ` stroke-dasharray="${f(kk.dash[0] * sc)} ${f(kk.dash[1] * sc)}"` : ''}/>`;
      s += `<text x="${X(lx + 28)}" y="${Y(ly + 3.5)}" font-size="${fs(10)}" font-family="ui-monospace,Menlo,monospace" fill="#5c564b">${CF_ESC(CF_T(kk.name))}</text>`;
    });
    return s;
  };
})();

</script>
<script>/* figures/drones/whoop.js */
// @cf title Tiny Whoop 65 mm
// @cf use engine/drone.js
// @cf use engine/drone-geo.js
// @cf use engine/drone-frames.js
// @cf use engine/drone-pieces.js
// @cf use engine/drone-sheet.js
/* Fig. 02, the 65 mm 1S brushless Tiny Whoop on Betaflight. Geometry from docs/facts/whoop.md: 65 mm motor-to-motor
   (motors at +-22.98 mm), one-piece PP frame with 34.9 mm x 14.5 mm ducts (Air65 frame), 0702 motors on mounts at the
   duct floor, a 29 x 29 mm 5-in-1 AIO on rubber grommets over the duct rims (26 x 26 mm holes), 31 mm props, a 14 mm
   nano camera at 25 deg in the canopy nose, and a 1S BT2.0 pack in the holder under the frame with its plug at the
   rear. Craft-local mm: x forward, y left, z up, z = 0 on the mat. The AIO's battery lead is a BT2.0 pigtail and has
   the engine id XT60, so the smoke stopper and the reverse-polarity fault work on it (there is no capacitor). */
(() => {
  const D = SL.drone, g = D.g;
  const TAU = Math.PI * 2;
  const FZ = 7;                     // frame underside: the pack rides in the holder below it
  const FT = 1.2;                   // floor, braces and motor mounts
  const MZ = FZ + FT;               // motor mount face
  const DUCT = { r: 17.45, t: 1, h: 14.5 };
  const RIM = FZ + DUCT.h;          // duct rim, 21.5 mm
  const BOARD = RIM + 1.5;          // AIO underside on its grommets
  const TOPB = BOARD + 1;           // AIO top (1.0 mm board)
  const HOLE = 13;                  // 26 x 26 mm mounting pattern
  const BASE_H = 1.6;               // 0702 base flange
  const SOCK = [12, 6.2];           // JST1.25 motor sockets on the AIO, one per quadrant
  const PAD_X = -12.6;              // BT2.0 pigtail pads at the rear edge (+ on the left, - on the right)
  const CAM = { at: [14, 0, 33], tilt: 25 };
  const holes = [[HOLE, HOLE], [HOLE, -HOLE], [-HOLE, HOLE], [-HOLE, -HOLE]];
  const sgn = v => (v < 0 ? -1 : 1);
  const bar = (x0, y0, x1, y1, w) => {
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy / len * w / 2, ny = dx / len * w / 2;
    return [[x0 - nx, y0 - ny], [x1 - nx, y1 - ny], [x1 + nx, y1 + ny], [x0 + nx, y0 + ny]];
  };
  const shift = (pts, dx) => pts.map(([x, y]) => [x + dx, y]);

  // the parts of the moulded frame the engine's frame kind does not draw: the outer motor-mount braces, the
  // battery holder rails and the four grommet posts that stand over the duct rims
  const frameExtras = ctx => {
    const out = [], bw = ctx.design.batt.size[1];
    for (const mo of ctx.craft.motors){
      for (const da of [60, -60]){
        const a = mo.ang + da * Math.PI / 180;
        out.push(g.plate(bar(mo.x, mo.y, mo.x + Math.cos(a) * (DUCT.r + .4), mo.y + Math.sin(a) * (DUCT.r + .4), 2.2), FZ, FT, 'pal'));
      }
    }
    const ry = bw / 2 + .45;
    for (const s of [-1, 1]) out.push(g.box(-11, s > 0 ? ry : -ry - .9, 0, 11, s > 0 ? ry + .9 : -ry, FZ, 'pal', .8));
    for (const [x, y] of holes){
      out.push(...g.rod([x * .79, y * .79, RIM - 1.2], [x, y, RIM - 1.2], .9, 'pal', 6, 6));
      out.push(g.cyl(x, y, RIM - 2.2, RIM + .3, 1.5, 'pal', 10, .7));
    }
    return out;
  };

  // 0702 motors drawn at their real size (docs/requests/item-whoop.md 1): flange, bell, the copper stator in
  // see-through, three spokes that turn with the rotor, and the 1 mm shaft while the props are off
  const motorsDraw = ctx => {
    const out = [], mt = ctx.design.motor, R = mt.bell[0] / 2, hb = mt.bell[1], k = ctx.k;
    const propsOn = !!ctx.st.placed.PROPS && !ctx.st.placed.PROPS.leave;
    ctx.craft.motors.forEach((mo, i) => {
      const z1 = MZ + BASE_H, z2 = z1 + hb;
      const base = g.cyl(mo.x, mo.y, MZ, z1, R * .93, 'dark', 16, .8);
      for (let j = 0; j < 3; j++){ const a = j * TAU / 3 + .5; base.svg += g.disc(mo.x + 3.3 * Math.cos(a), mo.y + 3.3 * Math.sin(a), z1 + .01, .45, 'metal', 6, .3); }
      out.push(base);
      if (k > 0){
        const sz = z1 + (hb - mt.stator[1]) / 2;
        out.push(g.cyl(mo.x, mo.y, sz, sz + mt.stator[1], mt.stator[0] / 2, 'copper', 14, .6));
      }
      const bell = g.cyl(mo.x, mo.y, z1, z2, R, 'metal', 20, 1);
      if (k > 0) bell.svg = `<g opacity="${(1 - .62 * k).toFixed(3)}">${bell.svg}</g>`;
      const a0 = ctx.spin[i] || 0;
      for (let j = 0; j < 3; j++){
        const a = a0 + j * TAU / 3;
        const p0 = D.W(mo.x + 1.1 * Math.cos(a), mo.y + 1.1 * Math.sin(a), z2 + .02), p1 = D.W(mo.x + (R - .9) * Math.cos(a), mo.y + (R - .9) * Math.sin(a), z2 + .02);
        bell.svg += `<path d="${pd([p0, p1], false)}" stroke="${INK}" stroke-width="1" stroke-linecap="round" fill="none"/>`;
      }
      out.push(bell);
      if (!propsOn) out.push(g.cyl(mo.x, mo.y, z2, z2 + 3.4, .5, 'metal', 8, .5));
      ctx.shadows.push(D.circ(mo.x, mo.y, R, 10).map(([x, y]) => D.W(x, y, z2)));
    });
    return out;
  };

  // 31 mm press-fit props: blades with the leading edge raised (mirrored when PROPS is fitted swapped), a
  // translucent disc while spinning, a small hub on the 1 mm shaft
  const propsDraw = ctx => {
    const out = [], pr = ctx.design.prop, R = pr.d * 25.4 / 2, col = D.colOf(pr.color), swapped = ctx.orient === 1;
    const zh = MZ + BASE_H + ctx.design.motor.bell[1] + .25, zb = zh + 1.3;
    ctx.craft.motors.forEach((mo, i) => {
      const rpm = ctx.rpm[i] || 0, a0 = ctx.spin[i] || 0;
      if (rpm > .12){
        const ring = Array.from({ length: 24 }, (_, j) => { const a = j / 24 * TAU; return D.W(mo.x + R * Math.cos(a), mo.y + R * Math.sin(a), zb); });
        out.push({ box: D.bbox(ring, .5), svg: `<path d="${pd(ring)}" fill="${col}" opacity="${(.2 + .22 * rpm).toFixed(3)}" stroke="${INK}" stroke-width=".5"/>` });
      } else {
        const lead = (mo.dir === 'CW' ? -1 : 1) * (swapped ? -1 : 1), r0 = 1.7, n = 6;
        for (let b = 0; b < pr.blades; b++){
          const th = a0 + b * TAU / pr.blades, ux = Math.cos(th), uy = Math.sin(th), tx = -uy, ty = ux;
          const edge = side => Array.from({ length: n + 1 }, (_, j) => {
            const u = j / n, r = r0 + (R - r0) * u;
            const ch = R * .2 * (.55 + .6 * Math.sin(Math.PI * Math.min(1, u * 1.2))) * (1 - .45 * u) + .7;
            const off = side * ch * (side * lead > 0 ? .62 : .38), z = zb + side * lead * (.9 - .6 * u);
            return [mo.x + ux * r + tx * off, mo.y + uy * r + ty * off, z];
          });
          const pts = [...edge(1), ...edge(-1).reverse()].map(p => D.W(...p));
          out.push({ box: D.bbox(pts, .2), svg: `<path d="${pd(pts)}" fill="${col}" stroke="${INK}" stroke-width=".7" stroke-linejoin="round"/>`
            + `<path d="${pd(edge(lead > 0 ? 1 : -1).map(p => D.W(...p)), false)}" fill="none" stroke="${mix(col, '#ffffff', .55)}" stroke-width=".45"/>` });
        }
      }
      out.push(g.cyl(mo.x, mo.y, zh, zh + 2.6, 1.9, col, 12, .7));
    });
    return out;
  };

  // the AIO's own sockets and silkscreen (separate from the board piece so its arrow stays on the board)
  const aioExtras = ctx => {
    const out = [];
    for (const [sx, sy, m] of [[-1, -1, 'M1'], [1, -1, 'M2'], [-1, 1, 'M3'], [1, 1, 'M4']]){
      const x = sx * SOCK[0], y = sy * SOCK[1];
      const it = g.box(x - 1.6, y - 2.7, TOPB, x + 1.6, y + 2.7, TOPB + 2.6, 'white', .6);
      it.svg += g.text(x - sx * 3.1, y, TOPB + .03, m, 1.7, '#d9d3c6');
      out.push(it);
    }
    const silk = g.box(PAD_X - .7, -4.2, TOPB, PAD_X + .7, 4.2, TOPB + .05, 'pcbBlack', .2);
    silk.svg = g.text(PAD_X + 2.4, 2, TOPB + .06, '+', 2.2, '#f2efe7') + g.text(PAD_X + 2.4, -2, TOPB + .06, '-', 2.2, '#f2efe7');
    out.push(silk);
    return out;

  // three motor wires per motor, from the motor base through the duct-floor notch, up the frame centre and into
  // the AIO socket of the same quadrant; the plugs sit in the sockets
  const motorWires = ctx => {
    const out = [], R = ctx.design.motor.bell[0] / 2;
    ctx.craft.motors.forEach((mo, i) => {
      const ux = Math.cos(mo.ang), uy = Math.sin(mo.ang), px = -uy, py = ux, sx = sgn(mo.x), sy = sgn(mo.y);

  // where the pigtail's female BT2.0 housing hangs: mated to the pack's plug, on the smoke stopper's lead, or loose
  const packRear = ctx => -ctx.design.batt.size[0] / 2;
  const plugAt = ctx => {
    const battOn = D.isOn(ctx.st, 'BATT');
    if (ctx.testing === 'smoke') return [-44, 0, 3.4];

    return [Math.min(-38, packRear(ctx) - 10), 0, 7.5];

  // the BT2.0 pigtail: red and black 26 AWG from the AIO's pads down the back to its female plug. Fitted the wrong
  // way round (orient 1) the red lead lands on the minus pad: reverse polarity on the first plug-in
  const pigtail = ctx => {
    const out = [], rev = ctx.orient === 1, [hx, , hz] = plugAt(ctx);
    for (const [col, pad, lane] of [['#d8473a', rev ? -2 : 2, .9], ['#2c2926', rev ? 2 : -2, -.9]]){
      const pts = [[PAD_X, pad, TOPB + .3], [PAD_X - 2.6, pad, TOPB + .3], [-16.6, lane, TOPB - 2.6], [-22, lane, 13], [-29, lane, 9.2], [hx + 2.6, lane * .9, hz + .6], [hx, lane * .9, hz]];
      out.push(...g.wire(pts, col, .8, 4));
      if (col === '#d8473a') ctx.flows.push({ kind: 'power', pts: pts.slice().reverse().map(p => D.W(...p)) });
    }
    const housing = g.box(hx - 4.6, -2.5, hz - 2, hx, 2.5, hz + 2, 'white', .7);

    if (ctx.st.fault === 'XT60') ctx.capAt = D.W(PAD_X, 0, TOPB + 1);
    return out;
  };

  // the pack's own short lead and male BT2.0 plug at its rear end
  const packLead = ctx => {
    const out = [], x0 = packRear(ctx), plugged = ctx.st.plugged;
    for (const [col, y] of [['#d8473a', .9], ['#2c2926', -.9]]) out.push(...g.wire([[x0, y, 3.2], [x0 - 2.2, y, 3.2]], col, .8, 3));
    const it = g.box(x0 - 6.6, -2.2, 1.4, x0 - 2.2, 2.2, 5, 'white', .7);

    out.push(it);
    return out;
  };

  // the camera's 5 V, ground and video wires to the AIO's front pads
  const camWires = ctx => {
    const out = [];
    [['#d8473a', 1.2], ['#2c2926', 0], ['#f2c230', -1.2]].forEach(([col, y]) => {
      const pts = [[9.4, y, 27.6], [10.2, y, 26.2], [12.6, y, TOPB + .4]];
      out.push(...g.wire(pts, col, .5, 3));

    const layers = [[0, 2, 25, 23, 7.5, -3.5], [2, 4, 23.5, 21.5, 7, -3.8], [4, 6, 21.5, 19.5, 6.5, -4.1],
      [6, 7.6, 19, 17, 6, -4.5], [7.6, 9, 15.5, 14, 5, -5], [9, 10, 11, 10, 3.8, -5.5]];
    for (const [z0, z1, l, w, r, x0] of layers) out.push(g.plate(shift(D.rrect(l, w, r, 3), x0), TOPB + z0, z1 - z0, 'white'));
    for (const s of [-1, 1]) out.push(g.oblock(at(-.5, s * 7.95, 0), u, v, n, 5.2, .45, 7.2, 'white', .8));
    out.push(g.oblock(at(-.5, 0, 7.6), u, v, n, 5.2, 8.4, .45, 'white', .8));
    return out;
  };

  const passes = (api, id) => { if (typeof api.pass === 'function') api.pass(id); };

        '0702-23000': { stator: [7, 2], bell: [9.5, 4.6], kv: 23000, label: '0702 23000KV' },

        '31mm-2': { d: 1.22, pitch: 1, blades: 2, color: '#c9a6e0', label: '31 mm 2-blade' },

    },
    parts: [
      { id: 'FRAME', short: 'DUCTS', name: '65 mm one-piece ducted frame (PP)', z: 1,
        piece: [{ kind: 'frame' }, { kind: 'custom', draw: frameExtras }],
        tag: { at: [-23, 40.4, RIM], dx: -40, dy: 26 } },
      { id: 'MOTORS', short: 'MOTORS', name: '4 brushless 0702 motors', after: ['FRAME'], z: 1.8,
        piece: { kind: 'custom', draw: motorsDraw }, tag: { at: [23, 23, 15], dx: 58, dy: -30 },
        xr: [{ at: [23, -23, 12], text: '7 MM STATOR 9N12P' }] },
      { id: 'FC', short: 'AIO BOARD', name: '5-in-1 AIO: FC, 4 ESCs, ELRS RX, VTX, OSD', after: ['FRAME'], z: 3.2,
        polar: ['arrow forward', 'arrow backward'],
        piece: [
          { kind: 'standoffs', at: holes, z0: RIM + .3, z1: BOARD, r: 1.5, color: '#2c2926' },

        passes(api, 'rxtest');
      } },
      { id: 'failsafe', label: 'Failsafe test', onClick: api => {
        const st = api.st;
        if (!api.isOn('RX')) return api.say('Fit the ELRS antenna first', 2000, 'buzz');
        if (api.isOn('PROPS')) return api.say('PROPS OFF! Never spin motors on the bench with props on', 2800, 'buzz');
        if (!st || !st.plugged || st.fault) return api.say('Plug in a battery: the receiver runs on the AIO', 2200, 'buzz');
        api.log('$ radio off: RXLOSS, failsafe stage 2: DROP');
        api.say('Radio off: the OSD shows RXLOSS and the motors stop (DROP). Right for a 25 g indoor whoop', 3200, 'ding');
        passes(api, 'failsafe');
      } },
    ],
    wiring: {
      nodes: {
        BATT: { at: [20, 20], title: 'BATTERY', sub: 'batt', color: 'tomato' },

      },
      edges: [
        { from: 'BATT', to: 'XT60', kind: 'power', n: 2, label: 'V' },
        { from: 'XT60', to: 'FC', kind: 'power', n: 2, label: 'VBAT pads' },
        { from: 'FC', to: 'WIRES', kind: 'phase', n: 3, label: 'ESC M1-M4' },

})();
