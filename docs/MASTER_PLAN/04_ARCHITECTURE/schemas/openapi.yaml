x-iynk-rate-limit-buckets:
  note: Defaults. Operator-tunable. In-memory, one process (F-003). The 'existing' column is the limit in src/app/api today (SECURITY_BASELINE
    section 3, VERIFIED); every other number is a PROPOSAL.
  buckets:
    public.read: 120/min/IP
    auth.challenge: 20/min/IP
    auth.token: 20/min/IP, 5 failures/min/identity
    identity.register: 5/min/IP
    pairing.create: 20/h/identity
    pairing.guess: 10/min/IP, 100/h/IP, plus 5 wrong secrets per typed code
    read: 300/min/identity
    write: 120/min/identity
    project.write: 60/min/identity
    asset.write: 60/min/identity, 512 MiB/h/identity
    share.read: 120/min/IP
    room.write: 30/min/identity
    room.create: 6/min and 30/h per identity, 6/min/IP (REALTIME 5.2)
    room.invite.redeem: 5 failures/h/identity (REALTIME 5.4)
    room.read: 60/min/identity
    export: 6/h/identity
    ai.relay: '20/min/identity (existing chat: 20/min/IP)'
    search.web: 15/min/identity (existing 15)
    search.offers: 20/min/identity (existing 20)
    search.other: 30/min/identity (existing 30)
    tools: 60/min/identity (existing 60 on tools, 120 on mcp)
    compile: 10/min/identity

