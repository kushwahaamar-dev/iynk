          - room
          - fork
          - import
          - restore
        sizeBytes:
          type: integer
      additionalProperties: false
      required:
      - revision
      - stateHash
      - savedAt
      - savedBy
      - source
      - sizeBytes
    ProjectGrant:
      type: object
