      - F-201
      x-iynk-rate-limit: asset.write
      x-iynk-idempotent: content hash
    get:
      tags:
      - Assets
      operationId: getAsset
      summary: Download an asset
      description: 'Needs read access to a room whose document lists this hash, or a share token that lists it (the server stores no projects, RC-24). Served with `Cache-Control: private, max-age=31536000, immutable`, `X-Content-Type-Options:
