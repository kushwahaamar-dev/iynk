      description: 'Server import reads only the two native formats: `application/vnd.iynk.project+json` (the `.iynk` file envelope) and `application/vnd.iynk.container+zip`
        (`.iynkz`). Every other format (.ino, KiCad, SPICE, Wokwi) is converted in the browser by the converters of ADR-0109 and arrives as a
        project document; the server never parses third-party formats. Zip rules: PROJECT_DATA_MODEL 12.1 (1,000 entries, 16 MiB per entry, 128
        MiB total, ratio 100 to 1, no path escape). A hash mismatch inside the file is a warning, not a refusal (R-037).'
