            $ref: project.schema.json#/$defs/Sha256
          description: Assets the document lists that the server does not hold yet. Upload them with `PUT /assets/{sha256}`.
        missingDefinitions:
          type: array
          items:
            type: object
            properties:
              ref:
                type: string
              version:
                type: string
              digest:
                $ref: project.schema.json#/$defs/Digest
            additionalProperties: false
            required:
            - ref
            - version
            - digest
          description: Embedded or library part definitions pinned by the document and not stored yet. Upload them with `PUT /parts/{ref}/{version}`.
      additionalProperties: false
      required:
      - project
      - warnings
      - missingAssets
      - missingDefinitions
    RevisionRecord:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        stateHash:
          $ref: project.schema.json#/$defs/Sha256
        savedAt:
          $ref: project.schema.json#/$defs/Timestamp
        savedBy:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        source:
          enum:
