      required:
      - id
      - title
      - kind
      - revision
      - stateHash
      - schemaVersion
      - owners
      - role
      - visibility
      - sizeBytes
      - createdAt
      - updatedAt
      description: Server-side index row. Every field except `role`, `trashedAt`, `roomId` and `visibility` is derived from the stored document.
    ProjectDocument:
      $ref: project.schema.json
      description: 'A project document exactly as `project.schema.json` defines it. The server validates passes V2 to V5 (PROJECT_DATA_MODEL 9.1)
        and never rewrites a valid document, with one exception: `access` (see API_CONTRACTS 6.3).'
    ProjectCreate:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/ProjectDocument'
        keepId:
          type: boolean
          default: false
          description: 'Keep `document.id`. Allowed when no project has that id on this server (a first upload of a local project). Otherwise
            the server answers `already_exists`; use `forks` or send `keepId: false` to get a new id.'
      additionalProperties: false
      required:
      - document
    DocumentSaved:
      type: object
      properties:
        project:
