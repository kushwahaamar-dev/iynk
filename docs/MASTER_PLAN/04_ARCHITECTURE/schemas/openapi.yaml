x-iynk-rate-limit-buckets:
  note: Defaults. Operator-tunable. In-memory, one process (F-003). The 'existing' column is the limit in src/app/api today (SECURITY_BASELINE
    section 3, VERIFIED); every other number is a PROPOSAL.
  buckets:
    public.read: 120/min/IP
    auth.challenge: 20/min/IP
    auth.token: 20/min/IP, 5 failures/min/identity
    identity.register: 5/min/IP
    pairing.create: 20/h/identity
    pairing.guess: 10/min/IP, 100/h/IP, plus 5 wrong secrets per typed code
    read: 300/min/identity
    write: 120/min/identity
    asset.write: 60/min/identity, 512 MiB/h/identity
    share.read: 120/min/IP
    room.write: 30/min/identity
    room.create: 6/min and 30/h per identity, 6/min/IP (REALTIME 5.2)
    room.invite.redeem: 5 failures/h/identity (REALTIME 5.4)
    room.read: 60/min/identity
    ai.relay: '20/min/identity (existing chat: 20/min/IP)'
    search.web: 15/min/identity (existing 15)
    search.offers: 20/min/identity (existing 20)
    search.other: 30/min/identity (existing 30)
    tools: 60/min/identity (existing 60 on tools, 120 on mcp)
    compile: 10/min/identity

# ## Review fixes (2026-10-27)
#
# 1. [high] putPart accepted forged core parts. Applied. The description now says: validate with `provenance.origin` forced to `imported-pack` (so the
#    full conditional rules of component.schema.json run, including the text/html and visual.breadboard rejections); refuse ids in namespace `core`
#    and any descriptor with `provenance.origin: core` with 422 `invalid_document`, details code `S-15`; refuse any `visual.assets[].media_type` of
#    `text/html` with `figure_not_allowed`; same id and version with other bytes is 409. `identity.id` corrected to `id` (component.schema.json has `id`).
#    Evidence: COMPONENT_SCHEMA.md S-15 is "loader only" and the HTML rule applies only to local-user and imported-pack (component.schema.json line 79).
#    Follow-up for the schema owner: the 422 details code S-15 is raised by the server, not by the JSON Schema; no change to component.schema.json made here.
# 2. [medium] Challenge `challenge_used` removed. Applied. Text now: "A second use returns 401 unauthorized (same body as any other credential failure)."
#    Evidence: BACKEND_ARCHITECTURE 5.x and R-077 require one indistinguishable 401; `challenge_used` is not in the error registry.
# 3. [high] Server surface. Applied.
#    - servers[0].url is now `{origin}/v1`. Other mentions of `/api/v1` in this file and in API_CONTRACTS.md changed to `/v1`.
#    - All seven /admin/* operations (adminOverview, adminSetSwitches, createEnrollmentCode, listEnrollmentCodes, revokeEnrollmentCode,
#      adminListIdentities, adminDeleteIdentity), the Admin tag, the serverToken scheme, the EnrollmentCodeId parameter, the schemas AdminOverview,
#      AdminSwitches, AdminSwitchesResult, EnrollmentCodeCreate, EnrollmentCode, EnrollmentCodeCreated, AdminIdentity and the `admin` rate bucket
#      were deleted. Operator actions stay CLI (`iynk-server enrol`, `revoke`), per ADR-0007 and SYSTEM_ARCHITECTURE 10.3. registerIdentity text updated.
#    - /health renamed /healthz (operationId getHealth kept); /readyz added (getReadiness). `/server` stays as the capability probe
#      (getServerInfo). BACKEND_ARCHITECTURE and SYSTEM_ARCHITECTURE now call it `GET /v1/server` (formerly `/v1/capabilities`); FRONTEND_ARCHITECTURE
#      section 5.1 and ADR-0002 updated to match, as the same name was used there.
#    - /compile/jobs kept. ADR-0427 and BACKEND_ARCHITECTURE (route table, section 12) changed from `POST /v1/compile` to `POST /v1/compile/jobs`.
#    - API_CONTRACTS.md: Admin table, `X-Iynk-Server-Token`, `IYNK_SERVER_TOKEN`, the server-token secret row, the `admin` bucket and the admin
#      note removed or rewritten; counts updated to 64 paths, 84 operations, 77 schemas.
#      B0 interim gate is outside this contract (BACKEND 13.1).
#    - RC-24 (build-plan reconcile): /projects*, /parts/*, /me/exports*, /usage and forkShare removed; shares are POST /shares and /shares/{shareRef}.
#      Counts now 46 paths, 60 operations, 62 schemas (checked by script).
#    - headAsset row: NOT applied because it was already present (API_CONTRACTS section 7, Assets table). The table had 90 rows and the old yaml 90
