    RoomCreate:
      type: object
      properties:
        projectId:
          type: string
          pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
          description: A project already stored on this server. Send this or `project`.
        project:
          $ref: '#/components/schemas/ProjectDocument'
          description: A document at revision r, history may be omitted. The server stores it as checkpoint 0 and as a new project owned by the
