        allowFork:
          type: boolean
          default: true
        label:
          type: string
          maxLength: 60
      additionalProperties: false
      description: 'Always an immutable snapshot of the current revision, read-only: viewers can run it and fork it, not edit it (R-095). Live
        and commenter shares are not in v1; adding them later is additive.'
    Share:
      type: object
      properties:
        id:
          type: string
          pattern: ^shr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        projectId:
          type: string
          pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        audience:
          enum:
          - link
          - buddies
        revision:
          type: integer
          description: The frozen revision.
        stateHash:
          $ref: project.schema.json#/$defs/Sha256
        allowFork:
          type: boolean
        label:
          type: string
        createdAt:
          $ref: project.schema.json#/$defs/Timestamp
        expiresAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
        lastOpenedAt:
