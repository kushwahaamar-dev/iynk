          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        removeOwner:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
      additionalProperties: false
      description: 'Owner only. PENDING Objection O-1: the op vocabulary has `access.grant` and `access.revoke` but no op that sets `visibility`
        or owners, so this endpoint cannot be mirrored into the document until `access.set` exists.'
      minProperties: 1
      x-iynk-status: pending-schema-change
