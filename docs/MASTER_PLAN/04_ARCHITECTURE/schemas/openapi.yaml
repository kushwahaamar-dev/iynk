      operationId: putDocument
      summary: Save a whole document
      description: 'Optimistic concurrency: `If-Match` must carry the state hash the client last read; a first upload to an existing id is a create.
        A hash mismatch is 412 `stale_document`: the client downloads, decides (keep theirs as a new project with `POST /projects`, or take the
