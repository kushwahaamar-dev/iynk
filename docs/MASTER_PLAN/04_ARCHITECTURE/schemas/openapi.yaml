          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
        closedAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - projectId
      - title
      - hostId
      - status
      - epoch
      - seq
      - opSchema
      - settings
      - members
      - createdAt
    RoomInviteCreate:
