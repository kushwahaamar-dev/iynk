        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRelayRequest'
      responses:
        '200':
          description: The provider's own response body, streamed. Content type is the provider's (`text/event-stream` or `application/json`).
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/FeatureDisabled'
        '502':
          $ref: '#/components/responses/UpstreamFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-193
      - F-003
      x-iynk-rate-limit: ai.relay
      x-iynk-phase: B0 (relay ships with F-193)
