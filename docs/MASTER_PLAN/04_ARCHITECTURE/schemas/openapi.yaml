      operationId: putAsset
      summary: Upload an asset
      description: 'Content-addressed. The server hashes the bytes and refuses a mismatch (`hash_mismatch`). Same bytes again: 200, nothing stored
        twice. Allowed `Content-Type`: the media type list of the data model (PROJECT_DATA_MODEL 5.10); the sniffed type must agree. Up to 16,777,216
        bytes. An upload that no document references is deleted after 24 hours. `image/svg+xml` is stored as is and always served with `Content-Security-Policy:
        sandbox; default-src ''none''`. Quota: `storageBytesPerIdentity`.'
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/Sha256'
