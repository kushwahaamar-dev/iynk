        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-157
      x-iynk-rate-limit: search.other
      x-iynk-phase: EXPORT
  /search/offers:
    post:
      tags:
      - Search
      operationId: searchOffers
      summary: Prices for a parts list
      description: Up to 25 parts; each part spends up to three searches, so the daily cap counts searches, not calls. `partial` says why some
        prices are missing. Replaces GET and POST `/api/search/offers`.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/ProviderKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOffersRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOffersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/FeatureDisabled'
        '502':
          $ref: '#/components/responses/UpstreamFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-154
      - F-194
      x-iynk-rate-limit: search.offers
      x-iynk-phase: EXPORT
  /mcp:
    post:
      tags:
      - Tools
      operationId: mcpPost
      summary: Model Context Protocol endpoint
      description: Streamable HTTP transport, stateless, JSON answers (as `handleMcpPost` does today). Needs an access token or a personal API
        token. The tools it lists are `GET /tools`. CORS is closed to the configured origins; MCP clients are not browsers and do not need it.
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: tools
      x-iynk-phase: AI
  /tools:
    get:
      tags:
      - Tools
      operationId: listTools
      summary: Tools my scopes allow
      description: '`search_catalog`, `get_item`, `drone_calc` and `price_parts` (which needs a search key). v1 tokens are read-only, so `create_room`
        stays out until a write scope exists (Objection O-9). `plan_build_night` and `get_passport` are removed with F-195.'
      security:
      - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: tools
      x-iynk-phase: AI
  /tools/{name}:
    post:
      tags:
      - Tools
      operationId: callTool
      summary: Call one tool over REST
      description: 'Same tool, same validation as MCP `tools/call`. A tool failure is 200 with `isError: true`; a bad argument is 400.'
      security:
      - accessToken: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,47}$
      - $ref: '#/components/parameters/ProviderKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCall'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: tools
      x-iynk-phase: AI
  /compile/jobs:
    post:
      tags:
      - Compile
      operationId: createCompileJob
      summary: Compile a sketch (PENDING RS-04 and RS-05)
      description: 'Options: (A) arduino-cli in a locked container on the operator''s own machine; (B) avr-gcc as WASM in the browser, no server
        call at all. Decision rule from TECHNICAL_RESEARCH section 6: pass when p95 click-to-running is under 3 s warm and 8 s cold on a 4G phone
        with no licence blocker; fail when either path is over 15 s cold or a licence blocks it. Until RS-04 has a Verdict this endpoint exists
        only in the contract and `features.compile` is false. The job is keyed by the SHA-256 of the canonical input, so the same sources return
        the same job (cache).'
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '501':
          $ref: '#/components/responses/FeatureDisabled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-049
      x-iynk-rate-limit: compile
      x-iynk-idempotent: Idempotency-Key
      x-iynk-phase: SIM, PENDING RS-04
      x-iynk-status: pending RS-04
  /compile/jobs/{jobId}:
    get:
      tags:
      - Compile
      operationId: getCompileJob
      summary: Compile job status
      description: 'Poll no faster than once a second; `Retry-After` says when. The artifact is an asset: fetch it with `getAsset`.'
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-049
      x-iynk-rate-limit: read
      x-iynk-phase: SIM, PENDING RS-04
      x-iynk-status: pending RS-04
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: iynk_at_ or iynk_pat_
      description: 'Short-lived access token from `createAccessToken`, or a personal API token. Absent the header, every operation except those
        marked `security: []` answers 401.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'A random string of 16 to 64 characters from `[A-Za-z0-9_-]`. The server stores the response for 24 hours per (identity, key).
        Same key and same request: the stored response comes back with `Idempotent-Replay: true`. Same key, different method, path or body hash:
        422 `idempotency_key_reuse`. First call still running: 409 `idempotency_in_progress` with `Retry-After: 1`. Only 2xx and 4xx results are
        stored; a 5xx is not, so a retry runs again.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,64}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'The state hash last read, in quotes: `"3f5a..."`. Missing: 428 `precondition_required`. Different from the stored one: 412
        `stale_document`.'
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque value from the previous page's `nextCursor`. A cursor made for another endpoint or after a sort change is 400 `bad_cursor`.
      schema:
        type: string
        maxLength: 256
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        pattern: ^rm_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    RoomInviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        pattern: ^rinv_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    PairingId:
      name: pairingId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pair_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ses_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pat_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        pattern: ^shr_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{22}$
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        pattern: ^exp_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^cmp_[a-z0-9][a-z0-9_-]{0,63}$
        maxLength: 72
    Sha256:
      name: sha256
      in: path
      required: true
      schema:
        $ref: project.schema.json#/$defs/Sha256
    PartRef:
      name: ref
      in: path
      required: true
      schema:
        $ref: project.schema.json#/$defs/DefRefName
    PartVersion:
      name: version
      in: path
      required: true
      schema:
        $ref: project.schema.json#/$defs/SemVer
    ScoreKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
    ProviderKey:
      name: X-Iynk-Provider-Key
      in: header
      required: false
      description: 'The caller''s own provider key, used for this one call. Never stored, never logged, never echoed; the server redacts the header
        in its own logs. Do not send it over plain HTTP: the client refuses to when the server URL is not `https` or loopback.'
      schema:
        type: string
        maxLength: 512
  headers:
    RequestId:
      description: Echo of the request's `X-Request-Id` if it matched `^[A-Za-z0-9_-]{8,64}$`, else a server-made id.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds.
      schema:
        type: integer
        minimum: 1
    ETag:
      description: The state hash in quotes.
      schema:
        type: string
    RateLimitLimit:
      description: Requests allowed in the window of the bucket that answered.
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window frees a slot.
      schema:
        type: integer
  responses:
    BadRequest:
      description: '`bad_request`, `bad_json`, `bad_cursor`, `bad_form`. The body or a parameter is not valid. `details` names the field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Unauthorized:
      description: '`unauthorized` and nothing more. A missing, expired, forged, revoked or wrongly signed credential all look the same (R-007,
        R-077). A client signs a new challenge once and retries; if that fails it shows "sign in again".'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          schema:
            type: string
          description: '`Bearer realm="iynk", error="invalid_token"`'
    Forbidden:
      description: '`forbidden`, `permission`, `forbidden_origin`, `fork_not_allowed`. Signed in, but not allowed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    NotFound:
      description: '`not_found`. Also used when the caller may not know the thing exists (a project, share or buddy they have no access to).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Conflict:
      description: '`already_exists`, `already_paired`, `room_open`, `last_owner`, `idempotency_in_progress`, `not_ready`, `score_key_mismatch`,
        `quota`, `room_state`, `revision_regression`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Gone:
      description: '`gone`, `revision_unavailable`, `room_closed`, `export_expired`. The thing existed and will not come back.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    PreconditionFailed:
      description: '`stale_document`. `If-Match` does not equal the stored state hash.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
    PreconditionRequired:
      description: '`precondition_required`. Send `If-Match`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    PayloadTooLarge:
      description: '`too_large`. The body is above the limit of this endpoint. Checked on `Content-Length` and again while streaming, as `readCapped`
        does today.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    UnsupportedMedia:
      description: '`unsupported_media_type`. JSON endpoints accept only `application/json`; that also stops a cross-site form post.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Unprocessable:
      description: '`invalid_document` (V2 to V5 diagnostics), `schema_too_new`, `schema_mismatch`, `not_a_buddy`, `provider_key_missing`, `relay_target_refused`,
        `hash_mismatch`, `figure_not_allowed`, `idempotency_key_reuse`. The JSON is well formed and the request makes no sense.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    UpgradeRequired:
      description: '`upgrade_required`. The `Iynk-Client` header names a version below `ServerInfo.minClient`, or a document `schemaVersion` the
        server cannot take. Update the app. Every operation except `getServerInfo`, `getHealth` and `getReadiness` can answer it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Iynk-Api-Version:
          schema:
            type: string
    FeatureDisabled:
      description: '`feature_disabled`. The operator turned this off, or the server has no key for it. `details[0].path` names the feature flag.
        Not worth retrying.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    UpstreamFailed:
      description: '`upstream_failed`, `upstream_busy`, `upstream_timeout` (504). A provider failed. Raw upstream text never reaches the client.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Unavailable:
      description: '`store_unavailable`, `shutting_down`. Retry with backoff.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    TooManyRequests:
      description: '`rate_limited`, `quota_exhausted`. Wait `Retry-After` seconds.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Unexpected:
      description: '`internal` (500). A bug on the server; quote `requestId`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
  schemas:
    Diagnostic:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
          description: A V-rule or op reject code, for example `V3-N1`, `duplicate_id`, `quota`.
        severity:
          enum:
          - info
          - warning
          - error
        path:
          type: string
          maxLength: 300
          description: JSON Pointer into the request body or document, or the name of a query or header parameter.
        message:
          type: string
          maxLength: 500
        hint:
          type: string
          maxLength: 300
      additionalProperties: false
      required:
      - code
      - message
      description: Same shape as the validation diagnostic in PROJECT_DATA_MODEL section 9.1, so one renderer serves both.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[a-z][a-z0-9_]{1,47}$
              description: 'Stable machine code. The UI picks its translated text by this code. Registry: API_CONTRACTS section 4.2.'
            message:
              type: string
              maxLength: 500
              description: Short English hint for developers. Never shown as UI text, never contains a secret or a stack trace.
            requestId:
              type: string
              description: Equal to the `X-Request-Id` response header. Quote it in a bug report; the server log carries the same id.
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Present on 429 and on 503 when the server knows. Equal to the `Retry-After` header.
            details:
              type: array
              items:
                $ref: '#/components/schemas/Diagnostic'
              maxItems: 50
              description: At most 50 entries; extra ones are dropped and `truncated` is set.
            truncated:
              type: boolean
          additionalProperties: false
          required:
          - code
          - message
          - requestId
      additionalProperties: false
      required:
      - error
      description: 'The one error body of every non-2xx JSON response. It is a superset of today''s `{ error: { code, message } }` (src/lib/server/http.ts:13),
        so existing clients keep working.'
      examples:
      - error:
          code: invalid_document
          message: The document failed validation.
          requestId: req_01k8y3m9w2
          details:
          - code: V3-N1
            severity: error
            path: /nets/4/members/2
            message: Pin brd_uno1.D13 is a member of two nets.
    ServerInfo:
      type: object
      properties:
        audience:
          type: string
          description: The server's public host name from `IYNK_PUBLIC_URL`. It is the `aud` in every signed challenge, so a signature made for
            one server is useless on another (REALTIME_ARCHITECTURE 4.3).
        name:
          type: string
          maxLength: 60
          description: Set by the operator.
        software:
          type: object
          properties:
            name:
              const: iynk-server
            version:
              type: string
              pattern: ^\d+\.\d+\.\d+
            commit:
              type: string
              maxLength: 40
          additionalProperties: false
          required:
          - name
          - version
        apiVersions:
          type: array
          items:
            type: integer
          description: Major versions served, for example [1].
        apiVersion:
          type: string
          pattern: ^1\.\d+$
          description: Latest minor of v1, also sent as the `Iynk-Api-Version` header.
        schemas:
          type: object
          properties:
            project:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: Project `schemaVersion` values the server accepts (PROJECT_DATA_MODEL 10.1).
            component:
              type: array
              items:
                type: integer
            opSchema:
              type: string
              pattern: ^\d+\.\d+$
              description: Op vocabulary a room speaks. Must equal the document MAJOR.MINOR.
          additionalProperties: false
          required:
          - project
          - opSchema
        minClient:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          description: Oldest `Iynk-Client` version the server serves. A client below it gets 426 `upgrade_required` (R-079).
        enrollment:
          enum:
          - code
          - invite
          - open
          description: 'Who may register an identity. `code` (default): a one-time enrollment code from the operator. `invite`: also a pairing
            invite from an existing buddy. `open`: anyone who can reach the server (private networks only). Mirrors `IYNK_ENROLLMENT` (REALTIME_ARCHITECTURE
            5.3).'
        features:
          type: object
          properties:
            identities:
              type: boolean
            buddies:
              type: boolean
            projects:
              type: boolean
              description: Server copy and sync of projects.
            shares:
              type: boolean
            rooms:
              type: boolean
            assets:
              type: boolean
            aiRelay:
              type: boolean
              description: '`POST /ai/relay` (ADR-0612). Off unless the operator turns it on.'
            searchProxy:
              type: boolean
            compile:
              type: boolean
            tools:
              type: boolean
              description: MCP and REST tools (F-167).
          additionalProperties: false
          required:
          - identities
          - buddies
          - projects
          - shares
          - rooms
          - assets
          - aiRelay
          - searchProxy
          - compile
          - tools
          description: What this server has switched on (F-012). The app hides a feature whose flag is false. Replaces `/api/status` (src/app/api/status/route.ts).
        limits:
          type: object
          properties:
            documentBytes:
              type: integer
              description: Canonical project document, default 5242880.
            assetBytes:
              type: integer
              description: One asset, default 16777216.
            assetsPerProject:
              type: integer
            storageBytesPerIdentity:
              type: integer
            buddiesPerIdentity:
              type: integer
            peersPerRoom:
              type: integer
              description: Default 8, as `PROTOCOL.maxPeers` today.
            sharesPerProject:
              type: integer
            opEnvelopeBytes:
              type: integer
              description: Default 65536 (`maxFrameBytes`).
          additionalProperties: false
          required:
          - documentBytes
          - assetBytes
          - peersPerRoom
        ai:
          type: object
          properties:
            relayHosts:
              type: array
              items:
                type: string
              description: 'Hosts the relay may call: the presets plus any the operator added. Empty when the relay is off.'
            relayAllowPrivate:
              type: boolean
              description: True when `IYNK_AI_RELAY_ALLOW_PRIVATE=1`, so a local model server on the operator's machine is reachable.
            serverKey:
              type: array
              items:
                type: string
              description: Families for which the operator set a key that buddies may use within their daily cap. Default empty.
          additionalProperties: false
        wsUrl:
          type: string
          format: uri
          description: The socket endpoint, for example `wss://iynk.example/ws`. Its protocol is REALTIME_ARCHITECTURE section 7; this API only
            creates the rooms it serves.
      additionalProperties: false
      required:
      - audience
      - software
      - apiVersions
      - apiVersion
      - schemas
      - enrollment
      - features
      - limits
    Health:
      type: object
      properties:
        status:
          enum:
          - ok
          - degraded
        version:
          type: string
        uptimeSeconds:
          type: integer
          minimum: 0
        store:
          enum:
          - ok
          - unavailable
        diskFreeBytes:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - status
      - version
      - store
      description: For an uptime probe (F-016). Never lists identities, projects or counts.
    ChallengeRequest:
      oneOf:
      - type: object
        properties:
          purpose:
            const: login
          identityId:
            type: string
            pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
            maxLength: 72
        additionalProperties: false
        required:
        - purpose
        - identityId
      - type: object
        properties:
          purpose:
            const: register
          keyThumbprint:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
            description: Base64url SHA-256 of the SPKI DER of the public key. Equal to `actors[].keyThumbprint` in a project document (REALTIME_ARCHITECTURE
              4.2).
        additionalProperties: false
        required:
        - purpose
        - keyThumbprint
    Challenge:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^chl_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        purpose:
          enum:
          - login
          - register
        nonce:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32 random bytes, base64url.
        audience:
          type: string
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
        signingInput:
          type: string
          description: 'The exact UTF-8 string to sign: `iynk.auth.v1\n{purpose}\n{audience}\n{challengeId}\n{nonce}\n{keyThumbprint}`, joined
            with LF. Returned so a client cannot build it wrongly; the client SHOULD rebuild it itself and compare before signing.'
      additionalProperties: false
      required:
      - challengeId
      - purpose
      - nonce
      - audience
      - expiresAt
      - signingInput
      description: Valid for 60 seconds, once. A second use returns 401 unauthorized (same body as any other credential failure).
    Signature:
      type: string
      pattern: ^[A-Za-z0-9_-]{86}$
      description: ECDSA P-256 with SHA-256, IEEE P1363 (r || s, 64 bytes) as WebCrypto `subtle.sign` returns it, base64url without padding.
    TokenRequest:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^chl_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        signature:
          $ref: '#/components/schemas/Signature'
      additionalProperties: false
      required:
      - challengeId
      - signature
    AccessToken:
      type: object
      properties:
        token:
          type: string
          pattern: ^iynk_at_[A-Za-z0-9_-]{43}$
          description: Opaque 256-bit bearer. Keep it in memory, not in storage; sign a new challenge after a reload.
        tokenType:
          const: Bearer
        identityId:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        sessionId:
          type: string
          pattern: ^ses_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
      additionalProperties: false
      required:
      - token
      - tokenType
      - identityId
      - sessionId
      - expiresAt
    Session:
      type: object
      properties:
        id:
          type: string
          pattern: ^ses_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        createdAt:
          $ref: project.schema.json#/$defs/Timestamp
        lastUsedAt:
          $ref: project.schema.json#/$defs/Timestamp
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
        client:
          type: string
          maxLength: 120
          description: '`Iynk-Client` header at creation, truncated.'
        current:
          type: boolean
      additionalProperties: false
      required:
      - id
      - createdAt
      - lastUsedAt
      - expiresAt
      - current
    ApiTokenCreate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        scopes:
          type: array
          items:
            enum:
            - catalog:read
            - projects:read
            - price:read
          minItems: 1
          uniqueItems: true
          description: v1 has no write scope. A write scope needs the AI operation proposals path (F-110) and an ADR.
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
      additionalProperties: false
      required:
      - label
      - scopes
      description: A personal token for the user's own AI tools and scripts (F-167, R-163). Read-only by default.
    ApiToken:
      type: object
      properties:
        id:
          type: string
          pattern: ^pat_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          $ref: project.schema.json#/$defs/Timestamp
        lastUsedAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
        expiresAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - label
      - scopes
      - createdAt
    ApiTokenCreated:
      allOf:
      - $ref: '#/components/schemas/ApiToken'
      - type: object
        properties:
          token:
            type: string
            pattern: ^iynk_pat_[A-Za-z0-9_-]{43}$
            description: Shown once; only its SHA-256 is stored.
        additionalProperties: false
        required:
        - token
    Identity:
      type: object
      properties:
        id:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
          description: 'The actor id: `usr_` plus the first 10 bytes of SHA-256(SPKI) in lower-case base32 (16 characters). Anyone can recompute
            it from `keyThumbprint`''s key; it is the value in `actors[].id` and `access.grants[].actor` of projects on this server (REALTIME_ARCHITECTURE
            4.2).'
        deviceId:
          type: string
          pattern: ^dev_[a-z2-7]{26}$
          description: '`dev_` plus the first 16 bytes of SHA-256(SPKI) in lower-case base32. Self-certifying: it cannot be claimed without the
            key. The socket handshake signs for this id (REALTIME_ARCHITECTURE 4.2).'
        displayName:
          type: string
          minLength: 1
          maxLength: 24
          description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
            are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: Cursor colour, chosen by the person. There is no avatar and no bio (R-080).
        locale:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
          maxLength: 35
          description: BCP 47 tag.
        keyThumbprint:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Base64url SHA-256 of the SPKI DER of the public key. Equal to `actors[].keyThumbprint` in a project document (REALTIME_ARCHITECTURE
            4.2).
        showOnline:
          type: boolean
          default: true
          description: Buddies see that this person is online.
        showActivity:
          type: boolean
          default: false
          description: Buddies see which room this person is in, with its title (REALTIME_ARCHITECTURE 5.5).
        createdAt:
          $ref: project.schema.json#/$defs/Timestamp
        deletion:
          oneOf:
          - $ref: '#/components/schemas/DeletionStatus'
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - deviceId
      - displayName
      - locale
      - keyThumbprint
      - showOnline
      - showActivity
      - createdAt
    IdentityRegister:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^chl_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        signature:
          $ref: '#/components/schemas/Signature'
        publicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]{122}$
          description: 'An ECDSA P-256 public key as SubjectPublicKeyInfo DER (91 bytes), base64url without padding: what WebCrypto `exportKey("spki")`
            returns. The server checks that it parses and that the point is on the curve. A private key is never sent; there is no field for one.'
        displayName:
          type: string
          minLength: 1
          maxLength: 24
          description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
            are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
        locale:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
          maxLength: 35
          description: BCP 47 tag.
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        enrollmentCode:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}$
          description: Required when `enrollment` is `code`. One use, valid 24 hours. A wrong, used or expired code is a plain 401 `unauthorized`.
      additionalProperties: false
      required:
      - challengeId
      - signature
      - publicKey
      - displayName
      description: The challenge must have purpose `register` and the thumbprint of `publicKey`.
    IdentityRegistered:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        accessToken:
          $ref: '#/components/schemas/AccessToken'
      additionalProperties: false
      required:
      - identity
      - accessToken
    IdentityPatch:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 24
          description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
            are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        locale:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
          maxLength: 35
          description: BCP 47 tag.
        showOnline:
          type: boolean
        showActivity:
          type: boolean
      additionalProperties: false
      description: Send at least one field. The key cannot be changed (rotation is out of scope for v1; see API_CONTRACTS 5.6).
      minProperties: 1
    DeletionRequest:
      type: object
      properties:
        confirm:
          type: string
          description: Must equal `delete {displayName}` exactly, so a stray call cannot delete an identity.
        projects:
          enum:
          - delete
          - transfer
          description: What happens to projects this identity owns. Projects with another owner are never deleted; this identity is just removed
            from them.
        transferTo:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
          description: 'Required with `transfer`: a buddy who holds an editor grant. All owned projects move to this identity.'
      additionalProperties: false
      required:
      - confirm
      - projects
    DeletionStatus:
      type: object
      properties:
        status:
          enum:
          - scheduled
        requestedAt:
          $ref: project.schema.json#/$defs/Timestamp
        effectiveAt:
          $ref: project.schema.json#/$defs/Timestamp
      additionalProperties: false
      required:
      - status
      - requestedAt
      - effectiveAt
      description: While scheduled the identity is hidden from buddies and cannot create anything. The owner can still sign in and cancel.
    PairingCreate:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
          description: A note for the creator, such as the friend's name. Never shown to the redeemer.
        ttlSeconds:
          type: integer
          minimum: 300
          maximum: 604800
          default: 86400
          description: 'Lifetime of the link (R-076: 24 hours by default). The typed code lives for 600 seconds or this value, whichever is shorter.'
        grant:
          type: object
          properties:
            projectId:
              type: string
              pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
              maxLength: 72
            role:
              enum:
              - editor
              - commenter
              - viewer
          additionalProperties: false
          required:
          - projectId
          - role
          description: Optional. On redemption the new buddy is also granted this role on the project. The creator must own the project. `owner`
            cannot be granted by a pairing.
      additionalProperties: false
      description: Pairing makes two people buddies (R-080). A room needs its own invite (`createRoomInvite`).
    Pairing:
      type: object
      properties:
        id:
          type: string
          pattern: ^pair_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        label:
          type: string
        from:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        status:
          enum:
          - open
          - redeemed
          - revoked
          - expired
        createdAt:
          $ref: project.schema.json#/$defs/Timestamp
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
        codeExpiresAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
        redeemedAt:
          oneOf:
          - $ref: project.schema.json#/$defs/Timestamp
          - type: 'null'
        redeemedBy:
          oneOf:
          - type: string
            pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
            maxLength: 72
          - type: 'null'
        grant:
          oneOf:
          - type: object
            properties:
              projectId:
                type: string
                pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
                maxLength: 72
              role:
                enum:
                - editor
                - commenter
                - viewer
            additionalProperties: false
            required:
            - projectId
            - role
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - from
      - status
      - createdAt
      - expiresAt
    PairingCreated:
      allOf:
      - $ref: '#/components/schemas/Pairing'
      - type: object
        properties:
          token:
            type: string
            pattern: ^[A-Za-z0-9_-]{22}$
            description: Link token, 128 random bits, base64url.
          url:
            type: string
            format: uri
            description: '`{origin}/#/pair/{token}`. The token is in the URL fragment, so it never reaches a server log or a Referer header.'
          code:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{6}$
            description: 'Typed pairing code: a 4-character public channel plus a 6-character secret, Crockford base32, case-insensitive, shown
              as `XXXX-XXXXXX`.'
        additionalProperties: false
        required:
        - token
        - url
        - code
        description: Shown once; only SHA-256 hashes are stored.
    PairingRef:
      oneOf:
      - type: object
        properties:
          token:
            type: string
            pattern: ^[A-Za-z0-9_-]{22}$
            description: Link token, 128 random bits, base64url.
        additionalProperties: false
        required:
        - token
      - type: object
        properties:
          code:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{6}$
            description: 'Typed pairing code: a 4-character public channel plus a 6-character secret, Crockford base32, case-insensitive, shown
              as `XXXX-XXXXXX`.'
        additionalProperties: false
        required:
        - code
      description: 'How a person names a pairing: the link token, or the typed code.'
    PairingPeek:
      type: object
      properties:
        from:
          type: object
          properties:
            displayName:
              type: string
              minLength: 1
              maxLength: 24
              description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
                are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
            color:
              type: string
          additionalProperties: false
          required:
          - displayName
        expiresAt:
          $ref: project.schema.json#/$defs/Timestamp
        hasProjectGrant:
          type: boolean
        projectTitle:
          type: string
          maxLength: 120
        enrollmentOpen:
          type: boolean
          description: True when a caller with no identity could register by redeeming (`enrollment` is `invite` or `open`).
      additionalProperties: false
      required:
      - from
      - expiresAt
      - hasProjectGrant
      - enrollmentOpen
      description: What the person sees before accepting. Reveals no id and no key.
    PairingRedeem:
      type: object
      properties:
        pairing:
          $ref: '#/components/schemas/PairingRef'
        registration:
          $ref: '#/components/schemas/IdentityRegister'
      additionalProperties: false
      required:
      - pairing
      description: '`registration` is sent only by a caller who has no identity yet, and only when `enrollment` is `invite` or `open`. It registers
        and pairs in one call (then `enrollmentCode` inside it is not needed).'
    PairingRedeemed:
      type: object
      properties:
        buddy:
          $ref: '#/components/schemas/Buddy'
        identity:
          $ref: '#/components/schemas/Identity'
        accessToken:
          $ref: '#/components/schemas/AccessToken'
        grant:
          oneOf:
          - $ref: '#/components/schemas/ProjectGrant'
          - type: 'null'
      additionalProperties: false
      required:
      - buddy
      description: '`identity` and `accessToken` are present only when the call registered a new identity.'
    Buddy:
      type: object
      properties:
        identityId:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        deviceId:
          type: string
          pattern: ^dev_[a-z2-7]{26}$
          description: '`dev_` plus the first 16 bytes of SHA-256(SPKI) in lower-case base32. Self-certifying: it cannot be claimed without the
            key. The socket handshake signs for this id (REALTIME_ARCHITECTURE 4.2).'
        displayName:
          type: string
          minLength: 1
          maxLength: 24
          description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
            are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
        color:
          type: string
        keyThumbprint:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Base64url SHA-256 of the SPKI DER of the public key. Equal to `actors[].keyThumbprint` in a project document (REALTIME_ARCHITECTURE
            4.2).
        alias:
          type: string
          maxLength: 60
          description: Your own name for them. Never shown to them.
        pairedAt:
          $ref: project.schema.json#/$defs/Timestamp
        online:
          type:
          - boolean
          - 'null'
          description: Null when the buddy set `showOnline` to false. Live changes arrive on the lobby socket; this is the polled copy.
        activity:
          oneOf:
          - type: object
            properties:
              roomId:
                type: string
                pattern: ^rm_[a-z0-9][a-z0-9_-]{0,63}$
                maxLength: 72
              title:
                type: string
                maxLength: 120
            additionalProperties: false
            required:
            - roomId
            - title
          - type: 'null'
          description: Only when the buddy turned on `showActivity` and the room has admitted the caller.
      additionalProperties: false
      required:
      - identityId
      - deviceId
      - displayName
      - keyThumbprint
      - pairedAt
    BuddyPatch:
      type: object
      properties:
        alias:
          type: string
          maxLength: 60
      additionalProperties: false
      minProperties: 1
    ScoreSubmit:
      type: object
      properties:
        value:
          type: number
        unit:
          enum:
          - ms
          - s
          - points
          - count
        better:
          enum:
          - lower
          - higher
          description: Fixed by the first submission to a key; a later disagreement is `score_key_mismatch`.
        projectId:
          type: string
          pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        replayAssetSha256:
          $ref: project.schema.json#/$defs/Sha256
        note:
          type: string
          maxLength: 140
      additionalProperties: false
      required:
      - value
      - unit
      - better
      description: Keeps the caller's best value. Times are client-claimed (flight defect 2 in TECHNICAL_DEBT); that is accepted among friends.
    LeaderboardRow:
      type: object
      properties:
        rank:
          type: integer
          minimum: 1
        identityId:
          type: string
          pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        displayName:
          type: string
          minLength: 1
          maxLength: 24
          description: Display name, 1 to 24 grapheme clusters (R-080; the relay's `MAX_NAME`). Control, zero-width and bidi-override characters
            are stripped as `server/realtime/src/protocol.js` NAME_JUNK does today.
        value:
          type: number
        unit:
          enum:
          - ms
          - s
          - points
          - count
        submittedAt:
          $ref: project.schema.json#/$defs/Timestamp
        verification:
          enum:
          - claimed
          - replay-verified
          description: '`replay-verified` is reserved for F-075 (server re-run) and is never sent in v1.'
        note:
          type: string
      additionalProperties: false
      required:
      - rank
      - identityId
      - displayName
      - value
      - unit
      - submittedAt
      - verification
    Leaderboard:
      type: object
      properties:
        key:
          type: string
        better:
          enum:
          - lower
          - higher
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRow'
          maxItems: 65
      additionalProperties: false
      required:
      - key
      - better
      - rows
      description: 'Only the caller and the caller''s buddies appear. At most 65 rows: a buddy list is capped at 64.'
    ProjectRecord:
      type: object
      properties:
        id:
          type: string
          pattern: ^prj_[a-z0-9][a-z0-9_-]{0,63}$
          maxLength: 72
        title:
          type: string
          maxLength: 120
        kind:
          enum:
          - project
          - template
          - lesson
          - challenge
          - bench
          - craft
        revision:
          type: integer
          minimum: 0
        stateHash:
          $ref: project.schema.json#/$defs/Sha256
