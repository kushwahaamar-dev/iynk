          type: integer
          minimum: 0
        opSchema:
          type: string
          pattern: ^\d+\.\d+$
        settings:
          $ref: '#/components/schemas/RoomSettings'
        members:
          type: array
          items:
            type: object
            properties:
              identityId:
                type: string
                pattern: ^usr_[a-z0-9][a-z0-9_-]{0,63}$
                maxLength: 72
              displayName:
                type: string
                minLength: 1
                maxLength: 24
