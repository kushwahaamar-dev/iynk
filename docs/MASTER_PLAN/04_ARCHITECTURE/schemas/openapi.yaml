openapi: 3.1.0
info:
  title: iynk self-hosted server API
  version: 1.0.0-draft.1
  summary: Optional server for buddies, pairing, rooms, share links, assets, a thin AI relay and a search proxy.
  description: |-
    Specification written 2026-10-27 for D-013 to D-017. Companion: `API_CONTRACTS.md`, which holds the rules this file cannot say (auth flow, error registry, rate-limit table, retries, route migration, acceptance tests).

    The app works with no server at all (D-015). Everything here is optional and every endpoint sits behind a feature flag reported by `GET /v1/server`.

    Conventions for every operation: JSON bodies are `application/json` unless stated; ids are `{prefix}_{token}` strings; timestamps are UTC with milliseconds and `Z`; every non-2xx JSON response is the `Error` envelope; clients send `Iynk-Client: iynk-web/{semver}`; every response carries `X-Request-Id`, `Iynk-Api-Version` and, when a bucket applies, `RateLimit-*` headers; lists are cursor-paged; POSTs that create things accept `Idempotency-Key`.

    Status: DRAFT. Nothing here is implemented. Items marked `x-iynk-status: pending ...` wait on a spike or on a sibling document.
  license:
    name: Licence pending (D-017)
    identifier: LicenseRef-iynk-pending
servers:
- url: '{origin}/v1'
  description: The operator's own server
  variables:
    origin:
      default: https://iynk.example
      description: Scheme and host of the self-hosted server.
tags:
- name: Server
  description: Capabilities, liveness, readiness and the OpenAPI document. Public. Operator actions are CLI commands on the host (SYSTEM_ARCHITECTURE 10.3); there is no admin HTTP API.
- name: Auth
  description: Challenge and signature sign-in, sessions and personal API tokens (F-004, F-005, F-206).
- name: Identities
  description: 'A person on this server: a public key and a display name. No email, no password (F-206).'
- name: Pairings
  description: Links and typed codes that make two people buddies (F-206, F-138, F-122).
- name: Buddies
  description: The paired list. Live presence is on the lobby socket, not here (F-138).
- name: Leaderboards
  description: Scores shown only among buddies (F-140, D-016).
- name: Shares
  description: Share links (F-089).
- name: Assets
  description: Content-addressed binary files (F-201).
- name: Rooms
  description: Create, list, close and invite to rooms. The socket, host commands and ops are in REALTIME_ARCHITECTURE (F-116, F-119, F-120, F-121,
    F-122).
- name: AI
  description: Optional relay for providers that block browser calls (F-193, ADR-0612).
- name: Search
  description: Optional search proxy (F-194, F-154, F-157, F-158).
- name: Tools
  description: MCP and REST tools for the user's own AI tools (F-167).
- name: Compile
  description: 'Opt-in sketch compile service (F-049, `IYNK_COMPILE_ENABLE`, default 0). Answers 501 `feature_disabled` until the Fidelity phase builds it.'
security:
- accessToken: []
paths:
  /server:
    get:
      tags:
      - Server
      operationId: getServerInfo
      summary: What this server offers
      description: Public and cheap. The app calls it once at start to learn which features to show (F-012) and which `audience` to sign for.
        Cacheable for 60 seconds. Replaces `GET /api/status`.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=60`'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-012
      - F-199
      x-iynk-rate-limit: public.read
  /healthz:
    get:
      tags:
      - Server
      operationId: getHealth
      summary: Liveness for an uptime probe
      description: 'No auth, no counts. Process is up. Answers 503 while draining on SIGTERM (`status: degraded`).'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-016
      x-iynk-rate-limit: public.read
  /readyz:
    get:
      tags:
      - Server
      operationId: getReadiness
      summary: Readiness, the store answers and migrations are current
      description: 'No auth, no counts. The store answers `SELECT 1` and the migrations are current. Answers 503 with `store: unavailable` otherwise.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-016
      x-iynk-rate-limit: public.read
  /openapi.json:
    get:
      tags:
      - Server
      operationId: getOpenApi
      summary: This contract as JSON
      description: Generated from `openapi.yaml` at build time. Replaces `GET /api/openapi.json`, which today documents the MCP tools only (src/lib/server/mcp/openapi.ts).
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: public.read
  /auth/challenges:
    post:
      tags:
      - Auth
      operationId: createChallenge
      summary: Ask for a nonce to sign
      description: 'Step one of sign-in (`purpose: login`) and of registration (`purpose: register`). Nothing is stored until a signature arrives,
        apart from a 60-second challenge row. Unknown `identityId` gets a normal-looking challenge, so the call does not reveal which ids exist.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '201':
          description: Challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      - F-206
      x-iynk-rate-limit: auth.challenge
  /auth/tokens:
    post:
      tags:
      - Auth
      operationId: createAccessToken
      summary: Sign a challenge and get an access token
      description: Verifies the ECDSA signature over `signingInput` with the stored public key. The token lasts 12 hours by default (operator
        setting, 1 hour to 30 days) and can be revoked. A wrong signature, an unknown identity and a used challenge all answer 401 `unauthorized`
        after the same work, so timing does not tell them apart.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '201':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      - F-206
      x-iynk-rate-limit: auth.token
  /auth/tokens/current:
    delete:
      tags:
      - Auth
      operationId: revokeCurrentToken
      summary: Sign out
      description: 'Revokes the token used for this call. Idempotent: a second call with the same token is a 401.'
      security:
      - accessToken: []
      responses:
        '204':
          description: Revoked
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      x-iynk-rate-limit: write
  /auth/sessions:
    get:
      tags:
      - Auth
      operationId: listSessions
      summary: List my sessions
      description: Every live access token of the caller, newest first.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque. Null on the last page. Pass it as `cursor` to get the next page.
                    maxLength: 256
                additionalProperties: false
                required:
                - items
                - nextCursor
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      x-iynk-rate-limit: read
  /auth/sessions/{sessionId}:
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Revoke one session
      description: Use it to sign out a device. Revoking the current session works too.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      x-iynk-rate-limit: write
  /auth/api-tokens:
    get:
      tags:
      - Auth
      operationId: listApiTokens
      summary: List my personal API tokens
      description: Never returns the token value.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque. Null on the last page. Pass it as `cursor` to get the next page.
                    maxLength: 256
                additionalProperties: false
                required:
                - items
                - nextCursor
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: read
    post:
      tags:
      - Auth
      operationId: createApiToken
      summary: Create a personal API token
      description: For MCP clients and scripts that cannot sign a challenge. Scoped, read-only in v1, shown once. At most 10 live tokens per identity.
        The token authenticates as the identity but only to endpoints that name its scope.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: write
      x-iynk-idempotent: Idempotency-Key
  /auth/api-tokens/{tokenId}:
    delete:
      tags:
      - Auth
      operationId: revokeApiToken
      summary: Revoke a personal API token
      description: Idempotent.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-167
      x-iynk-rate-limit: write
  /identities:
    post:
      tags:
      - Identities
      operationId: registerIdentity
      summary: Register this browser's key
      description: 'Enrolment. With `enrollment: code` (default) the body needs an `enrollmentCode` the operator made with `iynk-server enrol`
        on the host: one use, 24 hours. With `enrollment: closed` no new device can register. A pairing never enrols (RC-14). The challenge proves the caller holds the private
        key. A new identity gets an access token at once. A wrong, used or expired code is a plain 401 `unauthorized`. This is the gate R-077
        lacks (Objection O-2): a stranger who finds the URL cannot register.'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRegister'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityRegistered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-005
      - F-206
      x-iynk-rate-limit: identity.register
      x-iynk-idempotent: Idempotency-Key
  /identities/me:
    get:
      tags:
      - Identities
      operationId: getMyIdentity
      summary: My identity
      description: ''
      security:
      - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      x-iynk-rate-limit: read
    patch:
      tags:
      - Identities
      operationId: updateMyIdentity
      summary: Change my name, colour, locale or presence
      description: A name change reaches buddies' lists on their next event. Document `actors[].name` copies are not rewritten; the next op on
        a project updates its own actor entry.
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      x-iynk-rate-limit: write
  /identities/me/deletion:
    post:
      tags:
      - Identities
      operationId: requestDeletion
      summary: Delete my identity and its data
      description: 'Schedules deletion after the operator''s grace period (default 24 hours, 0 means now). What goes: the identity, sessions,
        API tokens, pairings, scores, share links and invites. Server copies only: the person''s local projects
        are untouched.'
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
      responses:
        '202':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-168
      x-iynk-rate-limit: write
      x-iynk-idempotent: Idempotency-Key
    delete:
      tags:
      - Identities
      operationId: cancelDeletion
      summary: Cancel a scheduled deletion
      description: Idempotent.
      security:
      - accessToken: []
      responses:
        '204':
          description: Cancelled, or nothing was scheduled
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-168
      x-iynk-rate-limit: write
  /pairings:
    post:
      tags:
      - Pairings
      operationId: createPairing
      summary: Make a pairing link and code
      description: Returns a link token (128 bits, 24 hours by default) and a typed code (10 minutes at most, deleted after 5 wrong secrets, R-076).
        Token and code are shown once. At most 20 open pairings per
        identity.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      - F-138
      - F-122
      x-iynk-rate-limit: pairing.create
      x-iynk-idempotent: Idempotency-Key
    get:
      tags:
      - Pairings
      operationId: listPairings
      summary: Pairings I made
      description: Open ones and those closed in the last 30 days, newest first.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pairing'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque. Null on the last page. Pass it as `cursor` to get the next page.
                    maxLength: 256
                additionalProperties: false
                required:
                - items
                - nextCursor
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      x-iynk-rate-limit: read
  /pairings/{pairingId}:
    delete:
      tags:
      - Pairings
      operationId: revokePairing
      summary: Revoke an open pairing
      description: A redeemed pairing cannot be revoked; remove the buddy instead. Idempotent.
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/PairingId'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      x-iynk-rate-limit: write
  /pairings/peek:
    post:
      tags:
      - Pairings
      operationId: peekPairing
      summary: See who is asking
      description: Public, so a person without an identity can see the inviter's display name before accepting. A POST so the token or code stays
        out of URLs and logs. Every failure (unknown, expired, used, revoked, wrong secret, a code deleted after 5 wrong secrets) answers the
        same 404 `not_found` (R-076). Counts against the `pairing.guess` limit whether or not the pairing exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRef'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingPeek'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        default:
          $ref: '#/components/responses/Unexpected'
      x-iynk-features:
      - F-206
      x-iynk-rate-limit: pairing.guess
  /pairings/redeem:
    post:
      tags:
      - Pairings
      operationId: redeemPairing
      summary: Accept a link or typed code
      description: 'Pairs the caller (an enrolled identity) with the creator. A pairing never enrols a new
        device (RC-14); register first with `registerIdentity`. Both sides'' lobby sockets get a `buddy` frame. Pairing with
        oneself, or twice, is 409 `already_paired`. Atomic: nothing is created if any step fails. A typed code with
        the right channel and a wrong secret counts toward that code''s 5 attempts.'
      security:
      - accessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRedeem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingRedeemed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
