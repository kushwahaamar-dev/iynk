      tags:
      - AI
      operationId: aiRelay
      summary: Forward one provider call
      description: 'ADR-0612. For providers that block browser calls and local servers the browser cannot reach. Stateless: no prompts, no tool
        loop, no cache. Key rule, in order: (1) `X-Iynk-Provider-Key` is used for this call only, never stored, never logged, never echoed; (2)
        else the operator''s server key for the family, within the caller''s daily cap kept in the store (the client shows "using the host''s
        key"); (3) else 422 `provider_key_missing`. Target: `profile.baseUrl` host must be on the allowlist; private, loopback and link-local
        addresses are refused unless the operator allows them, checked after DNS; no redirects. Request at most 1 MiB; response streamed as the
        provider sends it (SSE or JSON); 120 seconds overall. Logs: route, status, byte counts, duration and target host only. `IYNK_AI_ENABLE` off (default 0)
        answers 501 `feature_disabled`. Replaces the server chat loop at `POST /api/ai/chat`.'
      security:
      - accessToken: []
      parameters:
