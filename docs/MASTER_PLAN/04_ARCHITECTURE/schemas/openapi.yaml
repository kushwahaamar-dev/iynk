        in: query
        required: false
        description: A room id. When given, the caller must be an editor of that room, the asset counts against the room's project, and an `asset.add`
          op may then name it (REALTIME_ARCHITECTURE 8.1 step 8). This is the unified form of the room-scoped upload sketched there.
