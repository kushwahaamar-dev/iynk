        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRecord'
        '200':
          description: Already stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRecord'
