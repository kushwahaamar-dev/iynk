# iynk realtime relay behind Caddy (automatic HTTPS). copy this folder and server/realtime to the VM,
# write .env next to this file and run `docker compose up -d --build`.
name: iynk-realtime

services:
  relay:
    build:
      context: ../../server/realtime
      dockerfile: ../../deploy/realtime/Dockerfile
    image: iynk-realtime:local
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?set REALTIME_ALLOWED_ORIGINS in deploy/realtime/.env}
    expose:
      - "8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      REALTIME_DOMAIN: ${REALTIME_DOMAIN:?set REALTIME_DOMAIN in deploy/realtime/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
