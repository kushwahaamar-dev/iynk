# iynk behind Caddy (automatic HTTPS): the web app, the collaboration server and one origin in front of both.
# Copy deploy/.env.example to deploy/.env, set IYNK_DOMAIN, then run
#   docker compose -f deploy/compose.yaml up -d --build
# The engines volume arrives with the compile service in B9.
name: iynk

services:
  web:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: iynk-web:local
    environment:
      IYNK_SERVER_URL: https://${IYNK_DOMAIN:?set IYNK_DOMAIN in deploy/.env}
    expose:
      - "3000"
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  server:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: iynk-server:local
    environment:
      IYNK_DATA_DIR: /data
      IYNK_ALLOWED_ORIGINS: https://${IYNK_DOMAIN:?set IYNK_DOMAIN in deploy/.env}
      IYNK_PUBLIC_URL: https://${IYNK_DOMAIN:?set IYNK_DOMAIN in deploy/.env}
      IYNK_HOST: 0.0.0.0
      IYNK_TRUST_PROXY: "1"
      IYNK_ENROL: ${IYNK_ENROL:-code}
      IYNK_LOG_LEVEL: ${IYNK_LOG_LEVEL:-info}
    expose:
      - "8787"
    volumes:
      - iynk-data:/data
    tmpfs:
      - /tmp
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  caddy:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    image: caddy:2.11.7-alpine
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      IYNK_DOMAIN: ${IYNK_DOMAIN:?set IYNK_DOMAIN in deploy/.env}
    ports:
      - "${IYNK_HTTP_PORT:-80}:80"
      - "${IYNK_HTTPS_PORT:-443}:443"
      - "${IYNK_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp

volumes:
  iynk-data:
  caddy_data:
  caddy_config:
