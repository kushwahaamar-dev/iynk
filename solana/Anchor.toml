[toolchain]
anchor_version = "0.31.1"
solana_version = "4.2.2"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
simlab_passport = "BYFLDTLNi946Z8jT4JnxgE8Cpzkr9ud7tSrnThFTv31w"

[programs.devnet]
simlab_passport = "BYFLDTLNi946Z8jT4JnxgE8Cpzkr9ud7tSrnThFTv31w"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/simlab/deployer.json"

# Run the suite with `npm test` (anchor test --provider.cluster localnet).
# A bare `anchor test` would deploy to devnet, and the suite refuses to run there.
[scripts]
test = "node scripts/export-idl.mjs && node --test --test-concurrency=1 tests/simlab_passport.test.ts"

[test]
upgradeable = true
startup_wait = 20000

# A second, upgradeable copy at another address. Its ProgramData has the same
# upgrade authority, so the suite can prove initialize checks the seeds too.
[[test.genesis]]
address = "4pmj4wWv8sYtMht4bwXG9YVCyRDxQy7om4FkksE68bDR"
program = "target/deploy/simlab_passport.so"
upgradeable = true

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 43711
faucet_port = 43714
gossip_port = 43716
dynamic_port_range = "43720-43850"
